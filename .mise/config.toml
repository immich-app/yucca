[tools]
node = "25.4.0"
pnpm = "10.28.1"
restic = "0.18.0"

gh = "2.25.0"
"github:git-town/git-town" = "22.4.0"

[tasks.dev]
description = "Start all services in development mode"
depends = ["install:deps", "common:build", "docker:start"]
run = [{ task = "*:dev" }]

[tasks.build]
description = "Build all packages"
depends = ["*:build"]

[tasks."common:build"]
description = "Build all common packages"
depends = ["common:*:build"]

[tasks.test]
description = "Run all unit tests"
depends = ["*:test"]

[tasks."test:e2e"]
description = "Run all e2e tests"
run = [{ task = "*:test:e2e" }, { task = "e2e" }]

[tasks.check]
description = "Task group for CI checks"
run = [
    { task = "install:frozen" },
    { task = "build" },
    { tasks = [
        "lint",
        "*:check",
    ] },
    { task = "format" },
    { tasks = [
        "docker:start",
        "web:test:install-deps",
    ] },
    { tasks = [
        "test",
        "test:e2e",
    ] },
]

[env]
# default environment variables for development
YUCCA_API_PORT = 3000
RESTIC_API_PORT = 3010
S3_ACCESS_KEY_ID = "minio"
S3_SECRET_ACCESS_KEY = "miniominio"
