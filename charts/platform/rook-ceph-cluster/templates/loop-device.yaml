{{- if .Values.loopDevice.enabled }}
# DEV ONLY. Rook OSDs need raw block storage and k3d has none (local-path is
# filesystem-only): privileged DaemonSet creates a sparse image and losetup-attaches it
# to the FIXED device the CephCluster names; the container stays alive so the attachment persists.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.clusterName }}-loop-device
  labels:
    app.kubernetes.io/name: rook-ceph-loop-device
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rook-ceph-loop-device
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rook-ceph-loop-device
    spec:
      hostPID: true
      containers:
        - name: loop-device
          image: {{ .Values.loopDevice.image }}
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache util-linux >/dev/null 2>&1 || true
              IMG="{{ .Values.loopDevice.path }}"
              DEV="{{ .Values.loopDevice.device }}"
              mkdir -p "$(dirname "$IMG")"
              [ -f "$IMG" ] || truncate -s {{ .Values.loopDevice.sizeGiB }}G "$IMG"
              # Loop attachments live in the HOST kernel (shared by all k3d nodes) and
              # survive cluster re-creation: after k3d:reset DEV is typically bound to the
              # previous cluster's deleted image (stale bluestore signature — Rook skips
              # it). Clean stale state before attaching:
              if losetup "$DEV" >/dev/null 2>&1; then
                back="$(losetup --noheadings --output BACK-FILE "$DEV" 2>/dev/null | xargs || true)"
                # detach unless it's a live attachment of exactly our image
                [ "$back" = "$IMG" ] || losetup -d "$DEV" || true
              fi
              # our image attached on some other device = corruption hazard
              for d in $(losetup -j "$IMG" | cut -d: -f1); do
                [ "$d" = "$DEV" ] || losetup -d "$d" || true
              done
              if ! losetup "$DEV" >/dev/null 2>&1; then
                [ -e "$DEV" ] || mknod "$DEV" b 7 "${DEV#/dev/loop}"
                losetup "$DEV" "$IMG"
              fi
              echo "loop device for Rook OSD: $(losetup -j "$IMG" | cut -d: -f1) ($IMG)"
              # keep the container (and thus the loop attachment) alive
              while true; do sleep 3600; done
          volumeMounts:
            - name: dev
              mountPath: /dev
              mountPropagation: Bidirectional
            - name: rook-data
              mountPath: {{ dir .Values.loopDevice.path }}
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: rook-data
          hostPath:
            path: {{ dir .Values.loopDevice.path }}
            type: DirectoryOrCreate
{{- end }}
