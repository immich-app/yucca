apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: {{ .Values.objectStore.name }}
spec:
  metadataPool:
    failureDomain: osd
    replicated:
      size: 1
      requireSafeReplicaSize: false
  dataPool:
    failureDomain: osd
    replicated:
      size: 1
      requireSafeReplicaSize: false
  preservePoolsOnDelete: false
  # Same reasoning as the daemon probes in cephcluster.yaml — the RGW is the
  # last link in the bootstrap chain and the one the S3 suites wait on.
  healthCheck:
    startupProbe:
      probe:
{{ toYaml .Values.probes.rgw.startup | indent 8 }}
    readinessProbe:
      probe:
{{ toYaml .Values.probes.rgw.readiness | indent 8 }}
  gateway:
    port: {{ .Values.objectStore.gateway.port }}
    instances: {{ .Values.objectStore.gateway.instances }}
  # Allow CephObjectStoreUser CRs in the app namespace (so the user's S3 secret
  # is written there for michael to consume). See charts/ceph-objectuser.
  allowUsersInNamespaces:
    {{- range .Values.objectStore.allowUsersInNamespaces }}
    - {{ . }}
    {{- end }}
