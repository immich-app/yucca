apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: {{ .Values.clusterName }}
spec:
  dataDirHostPath: {{ .Values.dataDirHostPath }}
  cephVersion:
    image: {{ .Values.cephImage }}
    # single-node, single-replica dev cluster is not a supported topology
    allowUnsupported: true
  mon:
    count: {{ .Values.mon.count }}
    allowMultiplePerNode: true
  mgr:
    count: {{ .Values.mgr.count }}
    allowMultiplePerNode: true
  dashboard:
    enabled: {{ .Values.dashboard.enabled }}
  # Trim the footprint for a laptop-sized dev cluster.
  crashCollector:
    disable: true
  cephConfig:
    global:
      # no redundancy on a single OSD
      osd_pool_default_size: "1"
      osd_pool_default_min_size: "1"
      mon_warn_on_pool_no_redundancy: "false"
      mon_allow_pool_size_one: "true"
      # Single-OSD dev fix: the PG autoscaler starts pools at pg_num=1, but Rook
      # sets pg_num_min=8 on the RGW system pools (e.g. .rgw.root) -> EINVAL
      # "pg_num_min 8 > pg_num 1". Disable autoscaling and default new pools to
      # 8 PGs so the object store's pools are created at pg_num=8.
      osd_pool_default_pg_autoscale_mode: "off"
      osd_pool_default_pg_num: "8"
      osd_pool_default_pgp_num: "8"
  storage:
    useAllNodes: true
    useAllDevices: false
    # Loop devices must be named explicitly (see values.yaml). Requires
    # allowLoopDevices=true on the operator.
    devices:
      - name: {{ .Values.storage.device }}
  healthCheck:
    daemonHealth:
      mon:
        interval: 45s
      # Bootstrap is a serial chain — mon, then mgr, then OSD, then the object
      # store — and the operator only advances it when a status check observes
      # the previous daemon up. At the 60s default that polling dominates.
      status:
        interval: {{ .Values.probes.statusInterval }}
    # These daemons come up in a couple of seconds, but Rook's default probe
    # waits 10s and then polls every 10s, so each one rounds up to ~20s of
    # nothing. Finer granularity, same total budget — see values.yaml.
    startupProbe:
{{- range $daemon, $probe := .Values.probes.startup }}
      {{ $daemon }}:
        probe:
{{ toYaml $probe | indent 10 }}
{{- end }}
