# Single replica ON PURPOSE: two replicas would double-count usage.
replicas: 1

# No CPU limit on purpose (CFS throttling hurts tail latency).
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { memory: 4Gi }

# Stable in-cluster name, independent of the Helm release name (dev == prod).
fullnameOverride: yucca-metrics-worker

image:
  repository: k3d-registry.localhost:5000/yucca-metrics-worker
  tag: dev
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 3040

postgresClusterName: yucca-db

# Fallback AccessKey/SecretKey of a dedicated RGW user with admin read caps for per-bucket
# stats (michael's plain S3 user lacks them). Per-cluster overrides:
# RADOS_ACCESS_KEY_ID_<CODE>/RADOS_SECRET_ACCESS_KEY_<CODE> in the same Secret (envFrom).
radosSecretName: rook-ceph-object-user-yucca-metrics

volumes:
  - name: topology
    configMap:
      name: yucca-topology
volumeMounts:
  - name: topology
    mountPath: /etc/yucca
    readOnly: true

# Dev fixtures; overridden via the yucca-dev-env extraEnvFrom layer (dev) / ExternalSecret (prod).
secretData:
  POLAR_ACCESS_TOKEN: "polar access token"
  POLAR_WEBHOOK_SECRET: "polar webhook secret"
  POLAR_PRODUCT_ID: "polar product ID"
  POLAR_APPLY_DISCOUNT_ID: "polar apply discount ID"

extraEnvFrom: []

env:
  - name: NODE_ENV
    value: development
  - name: LEGACY_SITE_CODE
    value: local
  - name: LEGACY_STORAGE_CLUSTER_CODE
    value: local-dev
  - name: YUCCA_METRICS_WORKER_PORT
    value: "3040"
  - name: LOG_LEVEL
    value: debug
  - name: OTEL_METRICS
    value: http://victoria-metrics:8428/opentelemetry/v1/metrics
  - name: OTEL_LOGGING
    value: http://victoria-logs:9428/insert/opentelemetry/v1/logs

# Probes keep `tilt ci`/Flux honest: without them a crash-looping dev process
# still counts as Ready. The startupProbe budgets for the dev watcher's first
# boot; no livenessProbe so dev never restart-loops.
startupProbe:
  tcpSocket: { port: http }
  periodSeconds: 5
  failureThreshold: 60
readinessProbe:
  tcpSocket: { port: http }
  periodSeconds: 10
