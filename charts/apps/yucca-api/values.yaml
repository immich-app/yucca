replicas: 2

# No CPU limit on purpose (CFS throttling hurts tail latency more than contention).
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 4Gi }

# Stable in-cluster DNS regardless of release name — identical under Tilt (dev) and Flux (prod).
fullnameOverride: yucca-api

image:
  repository: k3d-registry.localhost:5000/yucca-api
  tag: dev
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 3020

service:
  type: ClusterIP

# Hot-reloaded. Rendered by kubernetes/apps/base/topology (dev/k3d: literal copy
# under apps/dev/local/yucca/topology).
volumes:
  - name: topology
    configMap:
      name: yucca-topology
volumeMounts:
  - name: topology
    mountPath: /etc/yucca
    readOnly: true

postgresClusterName: yucca-db

oidcIssuer: http://yucca-mock-oidc:8092
oidcRedirectUri: http://localhost:5173/api/auth/oidc/callback
oidcLogoutRedirectUri: http://localhost:5173

# Dev fixtures, not secrets; prod replaces the whole block via ExternalSecrets.
secretData:
  OIDC_CLIENT_ID: "client ID"
  OIDC_CLIENT_SECRET: "client secret"

# Local-dev ES256 keypair (.mise/tasks/*/env; michael holds the public half). Default
# false so an overlay missing a real key crashes instead of signing with a public fixture.
useDevKeypair: false
devJwtPrivateKey: |
  -----BEGIN PRIVATE KEY-----
  MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgCla79+Sip4o2hZ1K
  nQJYp2xU/nsCJmRoZmvXjeX6cW+hRANCAASkubBRIE7Sns/VS8ZF5XEVO8CwJ+AZ
  Ls1C0ncCcmRhqKA7UxLknn0ji5FcKaku1zBOhxQYcxFVmsYtAxZ1ljgN
  -----END PRIVATE KEY-----

# Appended AFTER the chart's own secret — last envFrom source wins, so this is the
# override hook (Tilt: yucca-dev-env Secret from gitignored .env; prod: ExternalSecret).
# NB: explicit `env` entries below always beat envFrom — override those via Helm values.
extraEnvFrom: []

env:
  - name: NODE_ENV
    value: development
  - name: YUCCA_API_PORT
    value: "3020"
  - name: LOG_LEVEL
    value: debug
  - name: OIDC_ALLOW_INSECURE
    value: "true"
  - name: OIDC_DEVICE_ISSUER
    value: http://yucca-mock-oidc:8092
  - name: OIDC_DEVICE_CLIENT_ID
    value: "device client ID"
  - name: OIDC_DEVICE_ALLOW_INSECURE
    value: "true"
  - name: TOPOLOGY_FILE
    value: /etc/yucca/topology.json
  - name: LEGACY_SITE_CODE
    value: local
  - name: LEGACY_STORAGE_CLUSTER_CODE
    value: local-dev
  # mock-oidc issues <sub>@example.test for any sub, so dev logins pass the
  # beta email allowlist.
  - name: ALLOWED_EMAIL_DOMAINS
    value: example.test
  - name: OTEL_METRICS
    value: http://victoria-metrics:8428/opentelemetry/v1/metrics
  - name: OTEL_LOGGING
    value: http://victoria-logs:9428/insert/opentelemetry/v1/logs

# Probes keep `tilt ci`/Flux honest: without them a crash-looping dev process
# still counts as Ready (this masked two real bugs). The startupProbe budgets
# for the dev watcher's first boot; no livenessProbe so dev never restart-loops.
startupProbe:
  tcpSocket: { port: http }
  periodSeconds: 5
  failureThreshold: 60
readinessProbe:
  tcpSocket: { port: http }
  periodSeconds: 10

migration:
  enabled: false
