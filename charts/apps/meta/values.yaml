# Discovery pointer: static nginx serving /.well-known/yucca.json (the one hard-codable
# URL; it names the API root, yucca-api /meta serves the rest). Deliberately separate from
# yucca-api so the stable vendor host (meta.futo.cloud) outlives the API's domain.

# 2 replicas + a PDB (templates/pdb.yaml): the pointer is the first thing every
# client touches, and it costs ~nothing to run two.
replicas: 2

# Limit looks oversized because `worker_processes auto` forks per HOST cpu (~48 on
# father, ~0.6MiB each); the image's autotune entrypoint bails on read-only rootfs
# (rewrites nginx.conf). Headroom is cheaper than a custom nginx.conf.
resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 256Mi }

# Stable in-cluster name, independent of the Helm release name (dev == prod).
fullnameOverride: yucca-meta

# Unprivileged nginx: 8080 as uid 101, runtime paths under /tmp → works with read-only
# rootfs. Pinned to the 1.29 minor; patch releases roll in on pull.
image:
  repository: docker.io/nginxinc/nginx-unprivileged
  tag: 1.29-alpine
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 8080

service:
  type: ClusterIP

# WHOLESALE override of the library chart's uid/gid 1000 default: this image's
# user is 101, and kubelet can't verify runAsNonRoot against a named user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Serialized as JSON into the /.well-known/yucca.json ConfigMap. Real clusters override
# meta_url from the HelmRelease (https://${APP_DOMAIN}/api/meta); default = dev port-forward.
wellKnown:
  meta_url: http://localhost:3020/api/meta

volumes:
  # Mounted as a DIRECTORY (not subPath) so a ConfigMap edit propagates into
  # the running pod — nginx reopens the file per request, no restart needed.
  - name: well-known
    configMap:
      name: yucca-meta
  # Image still creates /var/cache/nginx on the read-only rootfs; tmpfs keeps startup quiet.
  - name: cache
    emptyDir: {}

volumeMounts:
  - name: well-known
    mountPath: /usr/share/nginx/html/.well-known
    readOnly: true
  - name: cache
    mountPath: /var/cache/nginx

# Probe the real artifact, not the port: a missing/unreadable ConfigMap mount
# would otherwise leave a pod Ready while serving 404 to every client.
startupProbe:
  httpGet: { path: /.well-known/yucca.json, port: http }
  periodSeconds: 2
  failureThreshold: 30
readinessProbe:
  httpGet: { path: /.well-known/yucca.json, port: http }
  periodSeconds: 10
