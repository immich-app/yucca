replicas: 1

# Generous requests, deliberately huge memory limits (never CPU-limit).
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { memory: 4Gi }

# Stable in-cluster name, independent of the Helm release name (dev == prod).
fullnameOverride: yucca-admin-api

image:
  repository: k3d-registry.localhost:5000/yucca-admin-api
  tag: dev
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 3030

service:
  type: ClusterIP

# The GitOps-owned topology document (sites + storage clusters), validated and
# hot-reloaded on access. Same ConfigMap and mount as yucca-api.
volumes:
  - name: topology
    configMap:
      name: yucca-topology
volumeMounts:
  - name: topology
    mountPath: /etc/yucca
    readOnly: true

# RGW user with users+buckets admin caps: the API creates one S3 user per
# repository with it, so michael never needs a cluster-wide credential. In dev
# Rook writes the keys here as rook-ceph-object-user-<store>-<user>; prod points
# this at the TF-provisioned yucca-provisioner-rgw Secret. Per-cluster overrides
# ride in the same Secret as RADOS_ACCESS_KEY_ID_<CODE>/RADOS_SECRET_ACCESS_KEY_<CODE>.
radosSecretName: rook-ceph-object-user-yucca-provisioner

# CNPG-managed postgres Cluster name (shares yucca-api's database)
postgresClusterName: yucca-db

# OIDC provider in-cluster service (must match the issuer mock-oidc advertises)
oidcIssuer: http://yucca-mock-oidc:8092
oidcRedirectUri: http://localhost:3030/api/auth/oidc/callback
oidcLogoutRedirectUri: http://localhost:3030

# Static dev secrets (overridden in prod via ExternalSecret)
secretData:
  OIDC_ADMIN_CLIENT_ID: "client ID"
  OIDC_ADMIN_CLIENT_SECRET: "client secret"

# OPT-IN dev signing key for CLI session JWTs. The project's well-known
# local-dev ES256 keypair (the same one committed in .mise/tasks/*/env and the
# yucca-api chart) renders into the Secret ONLY when useDevKeypair is true —
# set by the dev/local overlay. Default false: an overlay that forgets to
# provide a real key gets a loud missing-JWT_PRIVATE_KEY crash instead of
# silently signing admin tokens with a public fixture.
useDevKeypair: false
# The dev storage-credential keys, under the same opt-in. The seal half is
# shared with michael (charts/apps/michael/values.yaml); the at-rest half never
# leaves the APIs.
devStorageCredentialKey: eXVjY2EtZGV2LXN0b3JhZ2UtY3JlZGVudGlhbC1rZXk=
devStorageSealKey: eXVjY2EtZGV2LW1pY2hhZWwtc2VhbC1rZXktMDAwMDA=
devJwtPrivateKey: |
  -----BEGIN PRIVATE KEY-----
  MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgCla79+Sip4o2hZ1K
  nQJYp2xU/nsCJmRoZmvXjeX6cW+hRANCAASkubBRIE7Sns/VS8ZF5XEVO8CwJ+AZ
  Ls1C0ncCcmRhqKA7UxLknn0ji5FcKaku1zBOhxQYcxFVmsYtAxZ1ljgN
  -----END PRIVATE KEY-----

env:
  - name: NODE_ENV
    value: development
  - name: YUCCA_ADMIN_API_PORT
    value: "3030"
  - name: LOG_LEVEL
    value: debug
  - name: OIDC_ADMIN_ALLOW_INSECURE
    value: "true"
  # Fleet topology — replaces the old single RESTIC_ENDPOINT: the restic
  # gateway is now a per-site field in this file (rest_url), not one global URL.
  - name: TOPOLOGY_FILE
    value: /etc/yucca/topology.json
  - name: LEGACY_SITE_CODE
    value: local
  - name: LEGACY_STORAGE_CLUSTER_CODE
    value: local-dev
  - name: OTEL_METRICS
    value: http://victoria-metrics:8428/opentelemetry/v1/metrics
  - name: OTEL_LOGGING
    value: http://victoria-logs:9428/insert/opentelemetry/v1/logs

# Probes keep `tilt ci`/Flux honest: without them a crash-looping dev process
# still counts as Ready (this masked two real bugs). The startupProbe budgets
# for the dev watcher's first boot; no livenessProbe so dev never restart-loops.
startupProbe:
  tcpSocket: { port: http }
  periodSeconds: 5
  failureThreshold: 60
readinessProbe:
  tcpSocket: { port: http }
  periodSeconds: 10
