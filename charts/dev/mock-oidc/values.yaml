replicas: 1

# Stable in-cluster name, independent of the Helm release name (dev == prod).
fullnameOverride: yucca-mock-oidc

image:
  repository: k3d-registry.localhost:5000/mock-oidc-provider
  tag: dev
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 80
    servicePort: 8092

service:
  type: ClusterIP

env:
  - name: PORT
    value: "80"
  # Must match yucca-api's OIDC_ISSUER or issued tokens fail validation in-cluster.
  - name: ISSUER
    value: http://yucca-mock-oidc:8092
  - name: CLIENT_ID
    value: "client ID"
  - name: CLIENT_SECRET
    value: "client secret"
  - name: DEVICE_CLIENT_ID
    value: "device client ID"
  - name: REDIRECT_URI
    value: http://localhost:5173/api/auth/oidc/callback
  - name: POST_LOGOUT_REDIRECT_URI
    value: http://localhost:5173
  - name: ADMIN_REDIRECT_URI
    value: http://localhost:3030/api/auth/oidc/callback
  - name: ADMIN_POST_LOGOUT_REDIRECT_URI
    value: http://localhost:3030

startupProbe:
  httpGet: { path: /.well-known/openid-configuration, port: http }
  periodSeconds: 2
  failureThreshold: 60
readinessProbe:
  httpGet: { path: /.well-known/openid-configuration, port: http }
  periodSeconds: 10
