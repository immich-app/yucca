# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Observability agents (vmagent + victoria-logs-collector) — the shared
# components/observability slice via the per-cluster overlay (which repoints
# the remote-write egress: father at o11y's mesh vmauth, staging at the authed
# public futostatus path).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/${CLUSTER_PATH}/observability
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  # The nested vmagent/victoria-logs-collector Kustomizations are applied by
  # THIS Kustomization, not cluster-apps, so its substituteFrom patch doesn't
  # reach them — re-apply it here or their ${vars} ship unsubstituted (the
  # 17h victoria-logs-collector crash loop on father).
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings-generated
              - kind: ConfigMap
                name: cluster-settings
              - kind: ConfigMap
                name: image-versions
