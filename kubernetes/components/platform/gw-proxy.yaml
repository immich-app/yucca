# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Dedicated michael (restic) Gateway — apps/base/gw-proxy via the per-cluster
# overlay: father adds the internal listener + BGP VIPs; staging folds the
# fleet into the app gateway's single NAT'd VIP (mergeGateways).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gw-proxy
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: cert-manager-issuer
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/${CLUSTER_PATH}/gw-proxy
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: envoy-system
