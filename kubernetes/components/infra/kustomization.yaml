---
# Role-INDEPENDENT operator/CRD layer, shared by every real cluster's ./infra
# overlay and applied by the cluster-infra Flux Kustomization (wait: true +
# per-piece healthChecks ⇒ operators Ready ⇒ CRDs registered before
# cluster-apps dry-runs any custom resource — a flat tree deadlocks on a fresh
# cluster; 2026-07 father rebuild).
#
# Namespaces are deliberately NOT here: their ownership differs per cluster
# (TF bootstraps some, prune protection differs), so each cluster's infra
# overlay declares its own. Cluster topology tweaks (father's CP-pinned
# webhook and META_HOST SAN, staging's mergeGateways) are injected there as
# spec.patches on these Kustomizations.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./cert-manager.yaml
  - ./cert-manager-issuer.yaml
  - ./envoy-gateway.yaml
  - ./envoy-proxy.yaml
  - ./cnpg.yaml
  - ./cnpg-plugin-barman.yaml
  - ./openebs.yaml
  - ./spegel.yaml
