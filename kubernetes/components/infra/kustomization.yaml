# Role-INDEPENDENT per-cluster infrastructure, pulled in by every overlay (primary or
# secondary) via `components: [../../../components/infra, ...]`: CNPG operator, OpenEBS
# LocalPV, network/ingress (cert-manager, cilium-lb, envoy, httproutes, netbird-operator),
# observability agents. Each entry is a kustomize Kustomization of Flux Kustomizations
# over apps/base/<x>; the Component just accumulates them.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./cnpg-system
  - ./network
  - ./observability
  - ./storage
