---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./cert-manager.yaml
  - ./cert-manager-issuer.yaml
  # LB IP pools + announcement are CLUSTER TOPOLOGY, not shared infra: staging's L2 pool
  # lives in its overlay (cilium-lb.yaml), father's BGP pools in cilium-bgp.yaml — a
  # shared pool would CIDR-overlap father's lb-internal /24 (overlapping pools → Conflicting).
  - ./envoy-gateway.yaml
  - ./envoy-proxy.yaml
  - ./httproutes.yaml
  - ./netbird-operator.yaml
