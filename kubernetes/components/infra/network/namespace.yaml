---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  annotations:
    # Never prune namespaces on restructure (openebs incident, 2026-07-06).
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
# NB: the `netbird` ns is NOT declared here — the staging/talos TF stack (secrets.tf)
# creates it and bootstraps the netbird-mgmt-api-key Secret before Flux reconciles;
# declaring it here too would race TF for ownership and 409. TF is the sole creator.
