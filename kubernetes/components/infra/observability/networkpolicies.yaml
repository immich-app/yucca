---
# Ingress-only. victoria-logs-collector tails node-side and only pushes outward, so it
# needs no ingress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: observability
spec:
  # Operator↔vmagent and any future k8s-stack components stay inside the ns.
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-ingest
  namespace: observability
spec:
  # The CR is named `yucca` via fullnameOverride.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: yucca
      ports:
        - { port: 8429, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vm-operator-webhook
  namespace: observability
spec:
  # The apiserver must reach the VM-operator admission webhook or every VM CR write
  # starts failing admission — and it is NOT a pod (hcloud CPs / host network), so it
  # can't be namespace-selected.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-operator
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { port: 9443, protocol: TCP }
