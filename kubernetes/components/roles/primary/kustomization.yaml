# PRIMARY region app set — the FULL stack: control-plane services (api, admin-api, web)
# + database live ONLY here (product invariant), alongside the storage-region-local
# michael/metrics-worker. Selected compile-time by an overlay via
#   components: [../../../components/infra, ../../../components/roles/primary]
# in lockstep with runtime CLUSTER_ROLE=primary (a validate check enforces the pairing).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../../apps/namespace.yaml
  - ../../apps/networkpolicies.yaml
  - ../../apps/topology.yaml
  - ../../apps/yucca-database.yaml
  - ../../apps/yucca-api.yaml
  - ../../apps/yucca-admin-api.yaml
  - ../../apps/web.yaml
  - ../../apps/meta.yaml
  - ../../apps/michael.yaml
  - ../../apps/yucca-metrics-worker.yaml
