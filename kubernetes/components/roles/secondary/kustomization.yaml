# SECONDARY region app set: only storage-region-local services (michael +
# metrics-worker); NO api/admin/db/web — those stay in the primary region (product
# invariant). Selected compile-time by an overlay via
#   components: [../../../components/infra, ../../../components/roles/secondary]
# in lockstep with runtime CLUSTER_ROLE=secondary (generated cluster-settings).
# No overlay selects this yet (no partition spans two regions; built ahead of need,
# plan §2.2). Region-local ceph-objectusers join once per-region in-cluster Rook lands;
# today both real clusters reach EXTERNAL Ceph (sietch) over S3 — no CephObjectStoreUser
# CR under apps/base yet.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../../apps/namespace.yaml
  - ../../apps/topology.yaml
  # Policies referencing apps a secondary doesn't run are inert (selectors
  # match nothing); the default-deny + michael/db rules are what matter here.
  - ../../apps/networkpolicies.yaml
  - ../../apps/michael.yaml
  # NOT yucca-metrics-worker: it dependsOn yucca-database (never deployed on secondary →
  # permanent "dependency not found") and hard-wires POSTGRES_* from the absent
  # yucca-db-app Secret. Re-add once region-local metering without the primary DB exists.
