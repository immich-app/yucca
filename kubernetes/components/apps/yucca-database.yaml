# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: yucca-database
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-operator
    - name: cnpg-plugin-barman
    - name: openebs
  # Gate dependents on the database SERVING, not on Helm succeeding. CNPG holds
  # the Cluster's Ready condition False while any instance is short (e.g. a lost
  # node strands an instance on its node-local PV), which times out the Helm
  # release and — through dependsOn — freezes the image rollout of every app
  # behind it, even though the primary is up and taking queries. readyInstances
  # is the field that tracks "someone can serve"; the Ready condition is not.
  # The threshold is 2, not 1: one stranded instance must not freeze the fleet,
  # but a cluster down to a lone primary has no standby to fail over to, and
  # rolling new images onto it is how a bad deploy becomes an outage.
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: yucca-db
      namespace: yucca
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.readyInstances >= 2
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/yucca-database
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: yucca
