---
# Ingress-only. Egress deliberately unrestricted for now — external RGW/OIDC/Polar would
# need FQDN rules (CiliumNetworkPolicy follow-up). yucca-api→michael hairpins via the
# ingress VIP so it ARRIVES as envoy traffic, hence no pod-to-pod allow. admin-api and
# metrics-worker get NO inbound rule: default-deny is their whole policy (father
# additionally opens admin-api to its netops gateway, NetBird-only). Nothing scrapes this
# ns, logs are collected node-side, and kubelet probes are NetworkPolicy-exempt.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: yucca
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-yucca-api
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: yucca-api
  policyTypes: [Ingress]
  ingress:
    - from:
        # The app gateway's proxy pods land here in GatewayNamespace mode.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
        # web's server-side rendering.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - { port: 3020, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-web
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - { port: 5173, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-meta
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: meta
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-michael
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: michael
  policyTypes: [Ingress]
  ingress:
    - from:
        # Both public restic clients and yucca-api's hairpinned traffic arrive via the gateway.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - { port: 3010, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-database
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: yucca-db
  policyTypes: [Ingress]
  ingress:
    # The app set + instance↔instance streaming replication.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [yucca-api, yucca-admin-api, yucca-metrics-worker]
        - podSelector:
            matchLabels:
              cnpg.io/cluster: yucca-db
      ports:
        - { port: 5432, protocol: TCP }
    # Instance-manager REST (status/reload).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - { port: 8000, protocol: TCP }
