---
# Ingress-only policies for the yucca ns (pods hold the JWT signing key, S3 creds, DB).
# Egress deliberately unrestricted for now (external RGW/OIDC/Polar needs FQDN rules —
# CiliumNetworkPolicy follow-up). Flows: envoy (envoy-system) → yucca-api:3020, web:5173,
# michael:3010, meta:8080; yucca-api→michael hairpins via the ingress VIP so it ARRIVES
# as envoy traffic (no pod-to-pod allow); web SSR → yucca-api:3020; api/admin-api/worker
# + CNPG replication → CNPG :5432; cnpg-system operator → CNPG :8000.
# admin-api / metrics-worker: NO inbound here — default-deny is their whole policy
# (father additionally opens admin-api to its netops gateway, apps/prod/htz-fsn1/netops/
# httproutes.yaml, NetBird-only). Nothing scrapes this ns; logs are collected node-side;
# kubelet probes are NetworkPolicy-exempt.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: yucca
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-yucca-api
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: yucca-api
  policyTypes: [Ingress]
  ingress:
    - from:
        # The app gateway's proxy pods (GatewayNamespace mode → envoy-system).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
        # web's server-side rendering (YUCCA_API_URL=http://yucca-api:3020).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - { port: 3020, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-web
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - { port: 5173, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-meta
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: meta
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-michael
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: michael
  policyTypes: [Ingress]
  ingress:
    - from:
        # Both public restic clients (${GW_HOST}) and yucca-api's hairpined
        # RESTIC_ENDPOINT traffic arrive via the gateway.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - { port: 3010, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-database
  namespace: yucca
spec:
  # CNPG instance pods (primary + streaming replicas).
  podSelector:
    matchLabels:
      cnpg.io/cluster: yucca-db
  policyTypes: [Ingress]
  ingress:
    # Postgres: the app set + instance↔instance streaming replication.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [yucca-api, yucca-admin-api, yucca-metrics-worker]
        - podSelector:
            matchLabels:
              cnpg.io/cluster: yucca-db
      ports:
        - { port: 5432, protocol: TCP }
    # Instance-manager REST (status/reload) from the CNPG operator.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - { port: 8000, protocol: TCP }
