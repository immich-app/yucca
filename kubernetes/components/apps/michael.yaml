# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: michael
  namespace: flux-system
spec:
  # michael load-balances across the RGW daemons itself now (no HAProxy hop).
  dependsOn:
    # Mounted at /etc/yucca — it must exist before the pods boot.
    - name: yucca-topology
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: michael
      namespace: yucca
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/michael
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: yucca
