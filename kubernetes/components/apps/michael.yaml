# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: michael
  namespace: flux-system
spec:
  # michael load-balances across the RGW daemons itself now (no HAProxy hop).
  dependsOn:
    - name: yucca-topology
      # A merely Ready dependency may still be on the previous Git revision.
      # Michael loads topology only at boot, so its Helm render (and checksum)
      # must happen after the matching topology revision has been applied.
      readyExpr: >-
        dep.metadata.generation == dep.status.observedGeneration &&
        dep.status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True') &&
        dep.status.lastAppliedRevision == self.status.lastAttemptedRevision
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: michael
      namespace: yucca
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/michael
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: yucca
