# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: futo-backups-bot
  namespace: flux-system
spec:
  # No storage/DB of its own — everything goes through yucca-api's internal
  # endpoints, so the API should exist before the bot starts polling it.
  dependsOn:
    - name: yucca-api
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: futo-backups-bot
      namespace: yucca
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/futo-backups-bot
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: yucca
