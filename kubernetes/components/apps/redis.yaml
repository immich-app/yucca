# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redis
  namespace: flux-system
spec:
  # Shared platform valkey — generic ephemeral cache, deliberately without
  # persistence (tenants must tolerate a flush). Current tenants: michael's
  # token verdict cache (+ the apis' revoke-time invalidation); future michael
  # rate limiting. Keys namespaced yucca:<service>:<purpose>:*. Primary-role
  # only until a secondary-region consumer shows up.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: redis
      namespace: yucca
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/redis
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: yucca
