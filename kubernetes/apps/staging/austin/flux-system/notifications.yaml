---
# notification-controller posts each Kustomization/HelmRelease reconcile result as a
# GitHub commit status on the deployed commit. `github-app` Secret carries the shared
# push-o-matic App creds (TF, op://shared_tf/GITHUB_APP_IMMICH_PUSH_O_MATIC) until a
# least-privilege `yucca-flux` app exists — then swap the 1P refs in tf/.env; nothing
# here changes (same secret name + keys).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github
  namespace: flux-system
spec:
  type: github
  address: https://github.com/immich-app/yucca
  # Env-prefixed context so staging and prod-htz-fsn1 (posting to the same commits)
  # show as DISTINCT statuses instead of overwriting one another; the default context
  # (kind/name/<provider-uid>) is opaque and collides.
  commitStatusExpr: "('staging/' + event.involvedObject.kind + '/' + event.involvedObject.name).lowerAscii()"
  secretRef:
    name: github-app
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-status
  namespace: flux-system
spec:
  providerRef:
    name: github
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
    # HelmReleases live OUTSIDE flux-system; an eventSource without an explicit
    # namespace only matches the Alert's own namespace, so each HR namespace
    # needs its own entry or HR failures never post a ❌ status.
    - { kind: HelmRelease, name: "*", namespace: yucca }
    - { kind: HelmRelease, name: "*", namespace: cert-manager }
    - { kind: HelmRelease, name: "*", namespace: envoy-system }
    - { kind: HelmRelease, name: "*", namespace: openebs-system }
    - { kind: HelmRelease, name: "*", namespace: cnpg-system }
    - { kind: HelmRelease, name: "*", namespace: netbird }
    - { kind: HelmRelease, name: "*", namespace: observability }
