---
# Pull-based image delivery (flux-operator): provider watches GHCR for CI monorepo tags
# (0.0.<run_number>); ResourceSet templates `image-versions` from the latest; cluster-apps
# postBuild feeds ${YUCCA_IMAGE_TAG} into every app HR. No CI cluster access, no
# per-deploy git commit — CI only builds+pushes.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: yucca-image
  namespace: flux-system
  annotations:
    # Poll GHCR every minute (flux-operator reconcile interval; default 10m).
    fluxcd.controlplane.io/reconcileEvery: "1m"
spec:
  type: OCIArtifactTag
  # Any app repo works as the version oracle — all 5 ship at the same monorepo
  # tag (release-please linked-versions).
  url: oci://ghcr.io/immich-app/yucca/yucca-api
  filter:
    # CI build track 0.0.<run_number> (monotonic); the upper bound keeps release-please
    # tags (>= 0.1.0) off — staging follows CI builds, not published releases.
    semver: ">=0.0.0 <0.1.0"
  # No secretRef: the app images are public, so the provider reads tags
  # from GHCR unauthenticated.
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: yucca-image-tag
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: yucca-image
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: image-versions
        namespace: flux-system
      data:
        YUCCA_IMAGE_TAG: << inputs.tag | quote >>
