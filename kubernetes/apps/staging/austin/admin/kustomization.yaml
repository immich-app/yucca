---
# staging's admin-api exposure — NetBird-only, like father's netops gateway
# (apps/prod/htz-fsn1/netops/), scaled down to the one admin host: a dedicated
# Gateway on the internal .17 VIP (cilium-lb.yaml) that the public NAT does NOT
# forward to, reached via the admin.luke NetBird record
# (tf/deployment/prod/htz-fsn1/netbird/dns.tf).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./certificate.yaml
  - ./gateway.yaml
  - ./httproute.yaml
