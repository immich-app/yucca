---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
  namespace: yucca
spec:
  parentRefs:
    - name: admin
      namespace: envoy-system
      sectionName: https
  hostnames:
    - admin.luke.aus.int.yucca.futo.network
  rules:
    - backendRefs:
        - name: yucca-admin-api
          port: 3030
---
# The yucca namespace is default-deny (components/apps/networkpolicies.yaml);
# open admin-api to the gateway envoy pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-admin-api
  namespace: yucca
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: yucca-admin-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: admin
      ports:
        - { port: 3030, protocol: TCP }
