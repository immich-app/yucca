---
# staging@austin overlay — cluster-apps (clusters/staging/austin, flux-instance sync)
# points here. Composes two Components: `infra` (role-independent platform) +
# `roles/primary` (full app set; austin is the staging partition's primary region).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./flux-system
  - ./cilium-lb.yaml # L2/ARP ingress pool (cluster-specific LB topology)
  - ./openebs # per-spare-NVMe StorageClasses (cluster-specific disk layout)
components:
  - ../../../components/infra
  - ../../../components/roles/primary
