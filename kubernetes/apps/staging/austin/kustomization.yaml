---
# austin is the staging partition's primary region, hence `roles/primary`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./flux-system
  - ./cilium-lb.yaml # L2/ARP ingress pool (cluster-specific LB topology)
  - ./openebs # per-spare-NVMe StorageClasses (cluster-specific disk layout)
components:
  - ../../../components/infra
  - ../../../components/roles/primary
