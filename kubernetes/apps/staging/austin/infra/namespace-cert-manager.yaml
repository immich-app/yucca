---
# TF also creates this namespace (talos secrets.tf bootstraps Secrets into
# it); Flux keeps declaring it for the PSS/prune annotations, as before the
# infra-layer split.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  annotations:
    # Never prune namespaces on restructure (openebs incident, 2026-07-06).
    kustomize.toolkit.fluxcd.io/prune: disabled
