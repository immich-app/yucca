---
# Staging LB topology (moved from apps/base/cilium-lb: pool layout is per-cluster —
# a shared base pool would CIDR-overlap father's lb-internal /24 → Conflicting pools).
# No postBuild substitution on raw overlay resources, so the VIP is LITERAL — keep in
# sync with INGRESS_VIP in clusters/staging/austin/cluster-settings.yaml.
# Single-address pool; the envoy Service requests it via lbipam.cilium.io/ips (envoyproxy.yaml).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: ingress
spec:
  blocks:
    - cidr: 10.10.10.16/32
---
# Announce LoadBalancer IPs via L2 (ARP) on the node bond so the VIP is
# reachable on the LAN. Requires l2announcements enabled in the Cilium config
# (tf .../cilium-values.yaml.tftpl).
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: ingress
spec:
  loadBalancerIPs: true
  interfaces:
    - ^bond0$
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
