---
# Internal (on-net) access to michael via ${GW_INT_HOST} → ${GW_INT_VIP}.
# The public gw VIP rides the transit aggregate and is NOT routable from inside
# Hetzner (mgmt hosts); this twin listener/VIP serves the same michael backend
# over the fabric. DNS lives in the NetBird zone (netbird stack dns.tf `gw`).
#
# Cert: same DNS-01 pipeline as netops-wildcard; the Secret must live beside
# the Gateway (envoy-system).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gw-internal
  namespace: envoy-system
spec:
  secretName: gw-internal-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "${GW_INT_HOST}"
---
# Route the internal hostname to michael — mirror of apps/base/httproutes/gw.yaml
# (which stays ${GW_HOST}-only; this listener is prod-specific).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw-internal
  namespace: yucca
spec:
  parentRefs:
    - name: gw
      namespace: envoy-system
      sectionName: https-internal
  hostnames:
    - "${GW_INT_HOST}"
  rules:
    - backendRefs:
        - name: yucca-michael
          port: 3010
---
# Upstream buffer tuning for envoy→michael (both directions ride these: a backup
# streams the request body through to michael, a restore streams the response
# back); lives here rather than gw-proxy/ because that tree is
# targetNamespace-forced to envoy-system and this policy must sit beside its
# HTTPRoute in yucca.
#
# Deliberately NOT raised alongside the downstream buffers in
# gw-proxy/policies.yaml: this hop is HTTP/1.1 over the sub-millisecond fabric,
# so 4Mi is already orders of magnitude past its BDP, and this is the term that
# multiplies by concurrent stream count.
#
# gw-internal added to targetRefs 2026-08-12. EG builds one cluster per HTTPRoute
# destination, so that route was running on the 32KiB default — 128x smaller than
# the public path, and it is the path yuctl bench measures over the internal VIP.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gw-buffers
  namespace: yucca
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gw-internal
  connection:
    bufferLimit: 4Mi
