# VIP traffic arrives via the fabric, but workers default-route out public eth0, where
# Hetzner Robot drops VIP-sourced (69.48.224.0/24) replies as spoofed. Source-route them
# back via the spine IRB (10.40.10.1), where the range is a valid source; general egress
# stays on eth0. A DaemonSet because Talos has no policy-routing knob in machineconfig.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lb-return-route
  namespace: kube-system
  labels:
    app: lb-return-route
spec:
  selector:
    matchLabels:
      app: lb-return-route
  template:
    metadata:
      labels:
        app: lb-return-route
    spec:
      hostNetwork: true
      # Workers only — the CPs are on the kube-cp VLAN, not the kube VLAN.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      containers:
        - name: route
          image: alpine:3.20
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                ip rule show | grep -q "from 69.48.224.0/24 lookup 200" || \
                  ip rule add from 69.48.224.0/24 lookup 200 priority 100
                ip route replace default via 10.40.10.1 table 200
                sleep 30
              done
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 32Mi }
