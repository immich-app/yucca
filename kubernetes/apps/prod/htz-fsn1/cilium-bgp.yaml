# Cilium BGP (north-south LB VIPs). Workers iBGP-peer the spine kube-VLAN IRB
# (10.40.10.1, AS 402421), advertise LB /32s (covered by the transit 69.48.224.0/24);
# spine ECMPs per-flow across all advertising workers (fabric side: tf/.../core-fabric/bgp-nodes.tf).
# DSR (loadBalancer.mode hybrid, talos cilium values) + externalTrafficPolicy: Cluster on gw:
# backend node replies direct from the VIP — no SNAT, client IP preserved, ECMP width
# independent of pod placement.
# NOTE: applied to father directly for now; adopt into the Flux tree once GitOps is bootstrapped on prod.
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lb-public-a
spec:
  # Skip the network/broadcast addresses — .0 is dropped by upstream routers.
  allowFirstLastIPs: "No"
  # Default public pool: everything except lb=internal (must never draw a public IP)
  # or lb=public-b. Selectors must stay disjoint — identical selectors make Cilium
  # pick between pools arbitrarily.
  serviceSelector:
    matchExpressions:
      - { key: lb, operator: NotIn, values: ["internal", "public-b"] }
  blocks:
    - cidr: 69.48.224.0/26
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lb-public-b
spec:
  allowFirstLastIPs: "No"
  # Opt-in only: label a Service lb=public-b to draw from this range.
  serviceSelector:
    matchLabels:
      lb: public-b
  blocks:
    - cidr: 69.48.224.64/26
---
# Internal (NetBird-only) VIPs — 10.40.12.0/24 (fabric-addressing lb_internal). Advertised
# over the same iBGP (CILIUM-NODES-IN accepts it) but not in the transit advert, so
# internet-unreachable; NetBird peers use the mgmt route (netbird stack lb_internal).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lb-internal
spec:
  allowFirstLastIPs: "No"
  serviceSelector:
    matchLabels:
      lb: internal
  # Ranges, not the full /24: .17 is carved out for lb-gw-internal below
  # (overlapping pools would mark each other conflicting and disable).
  blocks:
    - start: 10.40.12.1
      stop: 10.40.12.16
    - start: 10.40.12.18
      stop: 10.40.12.254
---
# Dedicated internal VIP for the gw (michael) envoy Service: it already draws
# its public IP from pool-a (lb: public), so a second, label-disjoint pool
# grants the internal twin (${GW_INT_VIP}) requested via lbipam.cilium.io/ips.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lb-gw-internal
spec:
  serviceSelector:
    matchLabels:
      lb-internal-vip: gw
  blocks:
    - start: 10.40.12.17
      stop: 10.40.12.17
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: loadbalancer-ips
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      # Match every service (opt a service out with the label bgp=disabled).
      selector:
        matchExpressions:
          - { key: bgp, operator: NotIn, values: ["disabled"] }
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: core-spine
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: father
spec:
  # Workers only — the CPs live on the kube-cp VLAN; the spine's iBGP group peers
  # from the kube VLAN (10.40.10.0/24) only.
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  bgpInstances:
    - name: instance-402421
      localASN: 402421
      peers:
        - name: core-spine
          peerASN: 402421
          peerAddress: 10.40.10.1
          peerConfigRef:
            name: core-spine
