# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
# Shares the `envoy` GatewayClass but attaches its own EnvoyProxy via
# infrastructure.parametersRef — one proxy fleet per Gateway. No :80 listener:
# restic speaks HTTPS only.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-gw
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "${GW_HOST}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-public-tls
    # Internal twin: same envoy fleet, own DNS-01 cert (gw-internal.yaml at the overlay root).
    - name: https-internal
      protocol: HTTPS
      port: 443
      hostname: "${GW_INT_HOST}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gw-internal-tls
