# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
# The michael (restic) Gateway: HTTPS-only, scoped to ${GW_HOST}. Shares the
# `envoy` GatewayClass but attaches its own EnvoyProxy via
# infrastructure.parametersRef (Envoy Gateway creates one proxy fleet per
# Gateway). TLS terminates with the shared wildcard cert (*.APP_DOMAIN covers
# gw.); no :80 listener — restic clients speak HTTPS only.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-gw
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "${GW_HOST}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: staging-backups-tls
