# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
# Data-plane config for the DEDICATED michael (restic) gateway — sized for the
# backup data plane (60+ Gbps target), separate from the 2-replica app gateway.
# One replica per worker; the LB Service draws its VIP from the public pool-a
# (lb: public matches its NotIn selector) and runs externalTrafficPolicy: Local,
# so the spine ECMPs the /32 across every worker with a local envoy and traffic
# stays on the landing node (no second SNAT hop).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gw
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: ${GW_PROXY_REPLICAS}
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  gateway.envoyproxy.io/owning-gateway-name: gw
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        patch:
          type: StrategicMerge
          value:
            metadata:
              labels:
                lb: public
              annotations:
                lbipam.cilium.io/ips: "${GW_VIP}"
  telemetry:
    metrics:
      prometheus: {}
