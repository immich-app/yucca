# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
# DEDICATED michael (restic) gateway data plane — sized for the 60+ Gbps backup path,
# separate from the 2-replica app gateway. One replica per worker; VIP from public
# pool-a (lb: public). externalTrafficPolicy: Cluster + Cilium DSR (loadBalancer.mode
# hybrid, talos cilium values): every worker advertises the /32 (spine ECMPs regardless
# of pod placement), landing node geneve-dispatches, backend node replies direct —
# no SNAT hop, client IPs preserved.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gw
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: ${GW_PROXY_REPLICAS}
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  gateway.envoyproxy.io/owning-gateway-name: gw
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            metadata:
              labels:
                lb: public
                # Second, internal VIP (lb-gw-internal pool) for on-net clients.
                lb-internal-vip: gw
              annotations:
                lbipam.cilium.io/ips: "${GW_VIP},${GW_INT_VIP}"
  telemetry:
    metrics:
      prometheus: {}
