# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# HTTPRoutes (web/api on the app gateway, gw on the dedicated michael gateway —
# GW_PARENT_GATEWAY selects the parent). CHERRY-PICKED from
# components/infra/network/httproutes.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: httproutes
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-proxy
    - name: gw-proxy
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/base/httproutes
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: yucca
