# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Dedicated michael (restic) gateway — see ../gw-proxy/. Separate from the app
# gateway so the backup data plane (60+ Gbps target) scales independently.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gw-proxy
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: cert-manager-issuer
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/prod/htz-fsn1/gw-proxy
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: envoy-system
