# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# Observability agents (vmagent + victoria-logs-collector) — the shared
# components/infra/observability slice (namespace, netpols, the two nested
# Kustomizations), reused as a plain kustomize path. The vmagent-remote-write
# Secret is TF-provisioned (talos stack secrets.tf).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/components/infra/observability
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
