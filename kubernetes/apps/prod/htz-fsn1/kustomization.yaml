---
# prod@htz-fsn1 cluster overlay — father: the APP layer (custom resources +
# workloads). The CRD/operator providers live in ./infra, applied by the
# `cluster-infra` Flux Kustomization that this layer dependsOn — see
# infra/kustomization.yaml for why (fresh-cluster dry-run deadlock).
#
# SCOPE: cluster baseline (coredns, Cilium BGP LB config, netops, OpenEBS
# pools) + the shared platform slice (components/platform: gw-proxy,
# httproutes, observability — specialized in ./gw-proxy and ./observability)
# + the yucca app set (components/roles/primary).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./flux-system
  - ./coredns.yaml
  - ./cilium-bgp.yaml
  - ./gw-internal.yaml
  - ./lb-return-route.yaml
  - ./diskpools.yaml
  - ./netops
components:
  - ../../../components/platform
  - ../../../components/roles/primary
