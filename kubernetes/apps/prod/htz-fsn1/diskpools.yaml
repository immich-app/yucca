# Mayastor DiskPools — one per worker on the r-mayastor RAW partition (50/50 split of the
# data NVMe; other half = u-localpv xfs for CNPG — talos.tf worker_volumes_patch).
# by-partlabel is immune to nvme0/nvme1 renumbering (observed swapping across boots).
# Backs the `openebs-replicated` SC (repl=2). OpenEBS installed by Helm (kustomization.yaml
# here); prereqs (hugepages, nvme_tcp, engine label) are Talos machine config
# (talos.tf worker_mayastor_patch).
apiVersion: openebs.io/v1beta3
kind: DiskPool
metadata:
  name: pool-jeanne
  namespace: openebs
spec:
  node: yucca-htz-fsn-father-k8s-jeanne
  disks: ["aio:///dev/disk/by-partlabel/r-mayastor"]
---
apiVersion: openebs.io/v1beta3
kind: DiskPool
metadata:
  name: pool-sheron
  namespace: openebs
spec:
  node: yucca-htz-fsn-father-k8s-sheron
  disks: ["aio:///dev/disk/by-partlabel/r-mayastor"]
---
apiVersion: openebs.io/v1beta3
kind: DiskPool
metadata:
  name: pool-dianna
  namespace: openebs
spec:
  node: yucca-htz-fsn-father-k8s-dianna
  disks: ["aio:///dev/disk/by-partlabel/r-mayastor"]
---
# Replicated volumes (2 copies on distinct workers, NVMe-oF/TCP) for VictoriaMetrics and
# anything that must survive node loss. CNPG uses LOCAL openebs-hostpath instead —
# replication at the Postgres layer, not block.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-replicated
provisioner: io.openebs.csi-mayastor
allowVolumeExpansion: true
parameters:
  protocol: nvmf
  repl: "2"
  ioTimeout: "60"
