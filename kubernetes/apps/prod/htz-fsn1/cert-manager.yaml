---
# cert-manager on father — CHERRY-PICKED from components/infra/network (the full
# infra component stays off until the yucca platform launches; certs are needed
# now for the netops UIs). REMOVE this file when components/infra is enabled in
# kustomization.yaml, or the duplicate Kustomization names will collide.
# The cloudflare-api-token Secret is TF-provisioned (talos stack secrets.tf).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/cert-manager
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuer
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/base/cert-manager-issuer
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
