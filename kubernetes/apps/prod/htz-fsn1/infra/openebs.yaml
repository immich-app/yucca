# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# OpenEBS on father — the SHARED apps/base/openebs, specialized via OPENEBS_*
# cluster-settings: Mayastor ON (openebs-replicated SC + DiskPools on r-mayastor),
# LocalPV on the u-localpv xfs partition (CNPG node-local; Postgres-layer replication,
# deliberately not block). targetNamespace `openebs`: father predates the shared base's
# openebs-system and the helm release + Mayastor state live there — renaming would churn
# storage. Talos prereqs (hugepages, nvme_tcp, /var/mnt rbind, firewall, volumes) live in the talos stack.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs
  namespace: flux-system
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openebs
      namespace: openebs
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  path: ./kubernetes/apps/base/openebs
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: openebs
