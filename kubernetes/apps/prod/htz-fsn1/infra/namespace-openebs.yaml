---
# openebs ns — owned HERE (cluster-apps), not by the openebs Kustomization targeting it:
# the 2026-07-06 restructure pruned it out of a since-removed manifest and took the whole
# storage control plane down. privileged: hostPath + hugepages + /dev for the Mayastor io-engine.
apiVersion: v1
kind: Namespace
metadata:
  name: openebs
  labels:
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    # Never prune this namespace — see the 2026-07-06 incident above.
    kustomize.toolkit.fluxcd.io/prune: disabled
