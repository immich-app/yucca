# Spegel P2P image mirror on father — CHERRY-PICKED from
# components/infra/spegel-system (the full infra component stays off; see
# kustomization.yaml). Node-level DaemonSet, so it rides the cluster-infra layer.
# Talos prereqs (containerd discard_unpacked_layers=false + the registry hostPort
# firewall rule) live in the talos stack.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spegel
  namespace: flux-system
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: spegel
      namespace: spegel-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/spegel
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: spegel-system
