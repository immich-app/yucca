# Barman Cloud CNPG-I plugin on father — CHERRY-PICKED from
# components/infra/cnpg-system for the same reason as cnpg.yaml (the full infra
# component stays off). WAL archiving + object-store backups for yucca-database;
# gRPC TLS certificates come from cert-manager, hence the extra dependency.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-plugin-barman
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-operator
    - name: cert-manager
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg-plugin-barman
      namespace: cnpg-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/cnpg-plugin-barman
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: cnpg-system
