# Envoy Gateway on father — cherry-picked from components/infra/network (as with
# cert-manager.yaml: REMOVE this file when components/infra is enabled, else Kustomization
# names collide). Operator + APP gateway (VIP ${INGRESS_VIP}, cert for ${APP_DOMAIN});
# NETOPS gateway lives in netops/gateway.yaml.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway
      namespace: envoy-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/envoy-gateway
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: envoy-system

# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-proxy
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: cert-manager-issuer
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/envoy-proxy
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: envoy-system
  # PROD-ONLY: ${META_HOST} = meta.futo.cloud is outside the *.${APP_DOMAIN} wildcard
  # (staging's META_HOST sits under its app domain — needs none of this).
  # Extra SAN on the EXISTING cert, NOT a second certificateRef: an unresolvable ref makes
  # the listener Programmed=False, taking the whole https listener (web + api) down until
  # cert-manager issues; editing dnsNames just reissues while the old Secret keeps serving.
  # NB: kustomize patches THEN postBuild substitutes — that's why ${VAR} resolves here.
  # Coupling accepted: a meta.futo.cloud DNS-01 failure now blocks app-cert renewal too,
  # but both names share the same Cloudflare zone/token and fail together anyway.
  patches:
    - target:
        group: cert-manager.io
        kind: Certificate
        name: app-domain
      patch: |-
        - op: add
          path: /spec/dnsNames/-
          value: ${META_HOST}
