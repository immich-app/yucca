---
# prod@htz-fsn1 INFRA layer — CRD/operator providers + namespaces, applied by the
# `cluster-infra` Kustomization (clusters/prod/htz-fsn1/apps.yaml) that `cluster-apps`
# dependsOn: everything here must be READY (healthChecks → operators → CRDs registered)
# before the app layer's CRs are even dry-run — the flat single-layer tree deadlocked
# on exactly that during the 2026-07 rebuild.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace-envoy-system.yaml
  - ./namespace-openebs.yaml
  - ./namespace-cnpg-system.yaml
  - ./cert-manager.yaml
  - ./envoy.yaml
  - ./openebs.yaml
  - ./cnpg.yaml
