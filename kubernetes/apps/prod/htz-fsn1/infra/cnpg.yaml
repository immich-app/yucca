# CNPG operator on father — cherry-picked from components/infra/cnpg-system (full
# component off: storage layer collides with prod-owned openebs, see kustomization.yaml).
# CRD provider for the yucca-database Cluster CR → lives in the cluster-infra layer.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cnpg-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  path: ./kubernetes/apps/base/cloudnative-pg
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: ${MANIFEST_SOURCE:=flux-system}
    namespace: flux-system
  targetNamespace: cnpg-system
