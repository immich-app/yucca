# The SHORT-TERM tier (30d @ 10s): the fast local buffer, with o11y the long-term tier
# via vmagent's second -remoteWrite.url. Storage is a repl=2 Mayastor volume so it
# survives node loss. Image digest matches the compose pin.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics-data
  namespace: netops
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-replicated
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: netops
spec:
  replicas: 1
  strategy: { type: Recreate } # hostPath: never two writers
  selector:
    matchLabels: { app: victoria-metrics }
  template:
    metadata:
      labels: { app: victoria-metrics }
    spec:
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:latest@sha256:dc030542eb0cd262287c9ec32e5867f8dcccc0efd5906c10f7fc8176c53d34d7
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=30d
            - -dedup.minScrapeInterval=10s
            - -httpListenAddr=:8428
          ports:
            - containerPort: 8428
          volumeMounts:
            - { name: storage, mountPath: /storage }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 4Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 5
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: victoria-metrics-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: netops
spec:
  selector: { app: victoria-metrics }
  ports:
    - { name: http, port: 8428, targetPort: 8428 }
