# devices.yaml is a Secret, NOT here: it embeds the netops password (netmiko can't
# key-auth through hyperglass config). The talos stack renders it from
# op://yucca_tf_prod/NETOPS_FABRIC_PASSWORD (netops-secrets.tf).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperglass-config
  namespace: netops
data:
  config.yaml: |
    org_name: yucca netops
    site_title: father looking glass
    plugins: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperglass
  namespace: netops
spec:
  replicas: 1
  selector:
    matchLabels: { app: hyperglass }
  template:
    metadata:
      labels: { app: hyperglass }
    spec:
      containers:
        - name: hyperglass
          image: ghcr.io/thatmattlove/hyperglass:latest@sha256:7e7515bf6e27d0980f82516b62b4d0fcebdddb81140e17ee1be2f29f8cc929ab
          # Without --workers it forks one per CPU — 192 on the EPYC workers — and OOMs.
          command: ["hyperglass", "start", "--workers", "4"]
          env:
            - { name: HYPERGLASS_APP_PATH, value: /etc/hyperglass }
            - { name: HYPERGLASS_HOST, value: 0.0.0.0 }
            - { name: HYPERGLASS_PORT, value: "8001" }
          ports:
            - containerPort: 8001
          volumeMounts:
            - { name: config, mountPath: /etc/hyperglass/config.yaml, subPath: config.yaml }
            - { name: devices, mountPath: /etc/hyperglass/devices.yaml, subPath: devices.yaml }
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            # Sized for the one-shot startup UI build, which keys its worker count off the
            # node's 192 threads; steady-state is <1Gi.
            limits: { memory: 16Gi }
      volumes:
        - name: config
          configMap: { name: hyperglass-config }
        - name: devices
          secret: { secretName: hyperglass-devices }
---
apiVersion: v1
kind: Service
metadata:
  name: hyperglass
  namespace: netops
spec:
  selector: { app: hyperglass }
  ports:
    - { name: http, port: 80, targetPort: 8001 }
---
# hyperglass dials `redis:6379` by default — hence the name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: netops
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"] # pure cache, no persistence
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: netops
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
