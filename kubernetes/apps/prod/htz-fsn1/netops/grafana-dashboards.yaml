# Provisioned Grafana dashboards (netops). GENERATED-then-committed — edit the
# dashboard in Grafana, export JSON, and paste back here (or regenerate).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: netops
data:
  fabric-overview.json: |
    {
     "uid": "father-fabric",
     "title": "father \u2014 fabric & cluster overview",
     "timezone": "browser",
     "refresh": "5s",
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "panels": [
      {
       "type": "timeseries",
       "title": "Fabric throughput \u2014 sFlow 5s \u2014 INTO switch port (bits/s)",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "bps",
         "custom": {
          "fillOpacity": 12,
          "showPoints": "never",
          "stacking": {
           "mode": "none"
          }
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max",
          "lastNotNull"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       },
       "targets": [
        {
         "expr": "sflow_ifinoctets{port!=\"\"}*8",
         "legendFormat": "{{port}}",
         "refId": "A"
        }
       ],
       "id": 1
      },
      {
       "type": "timeseries",
       "title": "Fabric throughput \u2014 sFlow 5s \u2014 OUT of switch port (bits/s)",
