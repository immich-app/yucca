---
# Split-horizon: only the ACME TXT records are public, the A records live in the
# NetBird zone.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netops-wildcard
  namespace: netops
spec:
  secretName: netops-wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.father.fsn.htz.yucca.futo.network"
