---
# Ingress-only policies for netops. Stack is self-contained (own gateway/envoy, vmagent,
# VictoriaMetrics), so one intra-namespace allow covers internal flows; the only
# cross-boundary ingress is the gateway VIP (10.40.12.16) and the spine's sFlow stream
# (10.40.12.14). These pods mount fabric credentials — nothing else may talk to them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: netops
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: netops
spec:
  # gateway→backends (grafana/sflow-rt/smokeping/oxidized/hyperglass/redis),
  # vmagent scrapes, grafana→victoria-metrics — all stay inside netops.
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-gateway
  namespace: netops
spec:
  # NetBird peers hit the internal VIP, DNAT'd to the envoy data-plane ports
  # (envoy-gateway maps listener 443 to a 10xxx containerPort — no port pin).
  # 0.0.0.0/0 is safe: lb-internal VIP, excluded from transit, NetBird mgmt route only.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-sflow-collector
  namespace: netops
spec:
  # Spine streams sFlow to 10.40.12.14 (see sflow-rt.yaml). DELIBERATELY wide: with
  # externalTrafficPolicy Cluster the stream can arrive SNAT'd to a node IP, and the feed
  # was silently lost once (2026-07-06) — a source filter risks repeating that for zero
  # gain (the VIP is internal-only).
  podSelector:
    matchLabels:
      app: sflow-rt
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { port: 6343, protocol: UDP }
