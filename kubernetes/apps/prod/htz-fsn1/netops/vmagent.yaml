# Single scrape, fanned out to the in-cluster VM (30d buffer) AND o11y's mesh vmauth
# (long-term, NetBird, unauth). Also scrapes spice over the fabric.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: netops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netops-vmagent
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netops-vmagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netops-vmagent
subjects:
  - { kind: ServiceAccount, name: vmagent, namespace: netops }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: netops
data:
  scrape.yml: |
    global:
      scrape_interval: 10s
      # No `cluster` here: vmagent applies external_labels OVER target labels (unlike
      # Prometheus — it relabeled all 48 spice targets to cluster=netops), so each job
      # stamps its own.
      external_labels:
        site: htz-fsn1
        env: prod
    scrape_configs:
      # The exporter burns ~20s/device in its SSH layer (raw RPC ~2s — known quirk),
      # hence the 60s interval + long timeout; sFlow covers seconds-granularity needs.
      - job_name: junos
        scrape_interval: 60s
        scrape_timeout: 55s
        static_configs:
          - labels: { cluster: netops }
            targets: ["junos-exporter.netops.svc:9326"]
      # Served PRE-RATED: sflow_* are per-second gauges, no rate(). The datasource is
      # SNMP ifIndex (persistent on Junos) — regenerate the port relabels from
      # `show snmp mib walk ifDescr` after channelization changes.
      - job_name: sflow
        scrape_interval: 5s
        metrics_path: /prometheus/metrics/ALL/ifinoctets,ifoutoctets,ifinutilization,ifoututilization,ifinerrors,ifouterrors,ifindiscards,ifoutdiscards,ifinpkts,ifoutpkts/txt
        static_configs:
          - labels: { cluster: netops }
            targets: ["sflow-rt.netops.svc:80"] # the Service maps 80 -> 8008
        metric_relabel_configs:
          - {source_labels: [datasource], regex: "545", target_label: port, replacement: "et-0/0/27"}
          - {source_labels: [datasource], regex: "548", target_label: port, replacement: "et-0/0/30"}
          - {source_labels: [datasource], regex: "549", target_label: port, replacement: "et-0/0/31"}
          - {source_labels: [datasource], regex: "589", target_label: port, replacement: "et-1/0/30"}
          - {source_labels: [datasource], regex: "590", target_label: port, replacement: "et-1/0/31"}
          - {source_labels: [datasource], regex: "597", target_label: port, replacement: "ae0"}
          - {source_labels: [datasource], regex: "601", target_label: port, replacement: "et-0/0/2:0"}
          - {source_labels: [datasource], regex: "602", target_label: port, replacement: "et-0/0/2:1"}
          - {source_labels: [datasource], regex: "603", target_label: port, replacement: "et-0/0/2:2"}
          - {source_labels: [datasource], regex: "604", target_label: port, replacement: "et-0/0/2:3"}
          - {source_labels: [datasource], regex: "620", target_label: port, replacement: "et-1/0/2:0"}
          - {source_labels: [datasource], regex: "622", target_label: port, replacement: "et-1/0/2:1"}
          - {source_labels: [datasource], regex: "623", target_label: port, replacement: "et-1/0/2:2"}
          - {source_labels: [datasource], regex: "624", target_label: port, replacement: "et-1/0/2:3"}
          - {source_labels: [datasource], regex: "625", target_label: port, replacement: "et-1/0/3:0"}
          - {source_labels: [datasource], regex: "648", target_label: port, replacement: "et-0/0/3:0"}
          - {source_labels: [datasource], regex: "666", target_label: port, replacement: "et-1/0/27"}
          - {source_labels: [datasource], regex: "669", target_label: port, replacement: "ae3"}
          - {source_labels: [datasource], regex: "671", target_label: port, replacement: "ae2"}
          - {source_labels: [datasource], regex: "675", target_label: port, replacement: "ae1"}
      - job_name: victoria-metrics
        static_configs:
          - labels: { cluster: netops }
            targets: ["victoria-metrics.netops.svc:8428"]
      - job_name: vmagent
        static_configs:
          - labels: { cluster: netops }
            targets: ["localhost:8429"]
      - job_name: coredns
        static_configs:
          - labels: { cluster: netops }
            targets: ["kube-dns.kube-system.svc:9153"] # :9153 = coredns metrics, not DNS
      # Scraped direct off each kubelet, not through the apiserver proxy.
      - job_name: kubelet
        scheme: https
        tls_config: { insecure_skip_verify: true }
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - { target_label: cluster, replacement: netops }
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config: { insecure_skip_verify: true }
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - { target_label: cluster, replacement: netops }
      # All 48 spice nodes' fabric VLAN-120 IPs (host_index 4-51; roster
      # tf/.../ceph/spice-hosts.yaml), via the spine-routed kube↔cls1-public path.
      # 30s, not 10s: the shorter interval would 3x sample volume.
      - job_name: ceph-node-exporter
        scrape_interval: 30s
        static_configs:
          - labels: { cluster: spice }
            targets: [
              "10.40.20.4:9100", "10.40.20.5:9100", "10.40.20.6:9100", "10.40.20.7:9100", "10.40.20.8:9100", "10.40.20.9:9100",
              "10.40.20.10:9100", "10.40.20.11:9100", "10.40.20.12:9100", "10.40.20.13:9100", "10.40.20.14:9100", "10.40.20.15:9100",
              "10.40.20.16:9100", "10.40.20.17:9100", "10.40.20.18:9100", "10.40.20.19:9100", "10.40.20.20:9100", "10.40.20.21:9100",
              "10.40.20.22:9100", "10.40.20.23:9100", "10.40.20.24:9100", "10.40.20.25:9100", "10.40.20.26:9100", "10.40.20.27:9100",
              "10.40.20.28:9100", "10.40.20.29:9100", "10.40.20.30:9100", "10.40.20.31:9100", "10.40.20.32:9100", "10.40.20.33:9100",
              "10.40.20.34:9100", "10.40.20.35:9100", "10.40.20.36:9100", "10.40.20.37:9100", "10.40.20.38:9100", "10.40.20.39:9100",
              "10.40.20.40:9100", "10.40.20.41:9100", "10.40.20.42:9100", "10.40.20.43:9100", "10.40.20.44:9100", "10.40.20.45:9100",
              "10.40.20.46:9100", "10.40.20.47:9100", "10.40.20.48:9100", "10.40.20.49:9100", "10.40.20.50:9100", "10.40.20.51:9100"
            ]
      - job_name: ceph-exporter
        scrape_interval: 30s
        static_configs:
          - labels: { cluster: spice }
            targets: [
              "10.40.20.4:9926", "10.40.20.5:9926", "10.40.20.6:9926", "10.40.20.7:9926", "10.40.20.8:9926", "10.40.20.9:9926",
              "10.40.20.10:9926", "10.40.20.11:9926", "10.40.20.12:9926", "10.40.20.13:9926", "10.40.20.14:9926", "10.40.20.15:9926",
              "10.40.20.16:9926", "10.40.20.17:9926", "10.40.20.18:9926", "10.40.20.19:9926", "10.40.20.20:9926", "10.40.20.21:9926",
              "10.40.20.22:9926", "10.40.20.23:9926", "10.40.20.24:9926", "10.40.20.25:9926", "10.40.20.26:9926", "10.40.20.27:9926",
              "10.40.20.28:9926", "10.40.20.29:9926", "10.40.20.30:9926", "10.40.20.31:9926", "10.40.20.32:9926", "10.40.20.33:9926",
              "10.40.20.34:9926", "10.40.20.35:9926", "10.40.20.36:9926", "10.40.20.37:9926", "10.40.20.38:9926", "10.40.20.39:9926",
              "10.40.20.40:9926", "10.40.20.41:9926", "10.40.20.42:9926", "10.40.20.43:9926", "10.40.20.44:9926", "10.40.20.45:9926",
              "10.40.20.46:9926", "10.40.20.47:9926", "10.40.20.48:9926", "10.40.20.49:9926", "10.40.20.50:9926", "10.40.20.51:9926"
            ]
      # mgr placement moves on redeploy, so scrape :9283 everywhere: only mgr hosts answer
      # (active=full, standby=tiny), the rest RST; up{job="ceph-mgr"} tracks where they live.
      - job_name: ceph-mgr
        scrape_interval: 30s
        static_configs:
          - labels: { cluster: spice }
            targets: [
              "10.40.20.4:9283", "10.40.20.5:9283", "10.40.20.6:9283", "10.40.20.7:9283", "10.40.20.8:9283", "10.40.20.9:9283",
              "10.40.20.10:9283", "10.40.20.11:9283", "10.40.20.12:9283", "10.40.20.13:9283", "10.40.20.14:9283", "10.40.20.15:9283",
              "10.40.20.16:9283", "10.40.20.17:9283", "10.40.20.18:9283", "10.40.20.19:9283", "10.40.20.20:9283", "10.40.20.21:9283",
              "10.40.20.22:9283", "10.40.20.23:9283", "10.40.20.24:9283", "10.40.20.25:9283", "10.40.20.26:9283", "10.40.20.27:9283",
              "10.40.20.28:9283", "10.40.20.29:9283", "10.40.20.30:9283", "10.40.20.31:9283", "10.40.20.32:9283", "10.40.20.33:9283",
              "10.40.20.34:9283", "10.40.20.35:9283", "10.40.20.36:9283", "10.40.20.37:9283", "10.40.20.38:9283", "10.40.20.39:9283",
              "10.40.20.40:9283", "10.40.20.41:9283", "10.40.20.42:9283", "10.40.20.43:9283", "10.40.20.44:9283", "10.40.20.45:9283",
              "10.40.20.46:9283", "10.40.20.47:9283", "10.40.20.48:9283", "10.40.20.49:9283", "10.40.20.50:9283", "10.40.20.51:9283"
            ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: netops
spec:
  replicas: 1
  selector:
    matchLabels: { app: vmagent }
  template:
    metadata:
      labels: { app: vmagent }
    spec:
      serviceAccountName: vmagent
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:latest@sha256:4f2d79253c1ce04296e4624724a815e53ea5ebadd465a1d0291153afb9893a30
          args:
            - -promscrape.config=/config/scrape.yml
            - -promscrape.configCheckInterval=1m
            - -remoteWrite.url=http://victoria-metrics.netops.svc:8428/api/v1/write
            # Unauth over NetBird: the NetBird ACL is the only gate.
            - -remoteWrite.url=https://vmauth.o11y.futo.network/insert/0/prometheus/api/v1/write
            # Bound each URL's spill so two queues fit the 2Gi buffer emptyDir.
            - -remoteWrite.maxDiskUsagePerURL=900MB
            - -remoteWrite.tmpDataPath=/buffer
            - -httpListenAddr=:8429
          ports:
            - containerPort: 8429
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: buffer, mountPath: /buffer }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            # 512Mi OOM-looped ~8min with all targets scraping (269 restarts / 6 days).
            limits: { memory: 4Gi }
      volumes:
        - name: config
          configMap: { name: vmagent-config }
        - name: buffer
          emptyDir: { sizeLimit: 2Gi }
