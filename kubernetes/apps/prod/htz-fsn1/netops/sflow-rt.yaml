# sflow-rt — real-time sFlow analytics for the fabric. The spine streams hardware
# counter samples (5s) + 1:2048 packet samples to the VIP (UDP 6343); sflow-rt's
# prometheus app exposes per-port rates that vmagent scrapes every 5s — the
# seconds-granularity bandwidth source (junos_exporter stays for device health).
# UI (top talkers, flow browser): http://sflow.father.fsn.htz.yucca.internal
# Image: sflow/prometheus = sflow-rt with the prometheus + browse-metrics apps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sflow-rt
  namespace: netops
spec:
  replicas: 1
  selector:
    matchLabels: { app: sflow-rt }
  template:
    metadata:
      labels: { app: sflow-rt }
    spec:
      containers:
        - name: sflow-rt
          image: sflow/prometheus:latest
          ports:
            - { containerPort: 6343, protocol: UDP }
            - { containerPort: 8008 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1.5Gi }
          readinessProbe:
            httpGet: { path: /version, port: 8008 }
            initialDelaySeconds: 5
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: sflow-rt
  namespace: netops
  labels:
    lb: internal
  annotations:
    io.cilium/lb-ipam-ips: 10.40.12.14 # = sflow.father...yucca.internal (dns.tf)
spec:
  type: LoadBalancer
  selector: { app: sflow-rt }
  ports:
    - { name: sflow, port: 6343, targetPort: 6343, protocol: UDP }
    - { name: http, port: 80, targetPort: 8008, protocol: TCP }
