---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-web
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/apps/web
      # Repackage on every git revision — the in-repo charts keep a static
      # version, so the default ChartVersion strategy never ships template edits.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: ${CHART_SOURCE:=flux-system}
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/immich-app/yucca/web
      # Substituted from the image-versions ConfigMap — PER-APP key so prod
      # rollback can be surgical. Staging's ConfigMap is rewritten in-cluster
      # to the latest CI build (flux-operator ResourceSet); prod's comes from
      # the CI-written deploy/prod pin branch. If unset, the empty default
      # lets the chart fall back to v<appVersion> (bootstrap safety).
      tag: ${WEB_IMAGE_TAG:=}
    env:
      - name: NODE_ENV
        value: production
      # Prod server (adapter-node) defaults to :3000; pin to the chart's port.
      - name: PORT
        value: "5173"
      # Browser-facing API base (served at the staging ingress domain).
      # TODO(ingress): finalize once envoy-gateway + DNS land.
      - name: PUBLIC_API_URL
        value: https://${APP_DOMAIN}
      # Server-side (SSR) calls stay in-cluster.
      - name: YUCCA_API_URL
        value: http://yucca-api:3020/
