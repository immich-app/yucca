---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: michael
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/michael
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/immich-app/yucca/michael
      tag: ${YUCCA_IMAGE_TAG}
    # secretData nulled: the chart's dev JWT_PUBLIC_KEY fixture is replaced by
    # the TF-provisioned `yucca-michael` Secret (JWT_PUBLIC_KEY + S3 creds),
    # which the chart's `envFrom: secretRef: yucca-michael` picks up unchanged.
    secretData: null
    # Full replacement of the chart's dev env: no Rook secretKeyRefs (S3 creds
    # arrive via envFrom from the TF Secret), real RGW endpoint, OTLP to the
    # in-cluster agents (vmagent metrics, Vector logs).
    #
    # michael now load-balances directly across the bare-metal Ceph (sietch) RGW
    # daemons instead of going through HAProxy. It resolves the RGW hostname to
    # its A records (S3_BACKEND_SOURCE=dns) and, with S3_BACKEND_PIN_HOST, dials
    # each gateway IP while still signing/Host-ing as s3.dev.austin.int.futo.cloud
    # (the name in RGW's zonegroup list, so signatures validate). S3_TLS_SKIP_VERIFY
    # handles the self-signed wildcard cert that HAProxy used to terminate.
    #
    # PREREQUISITE: s3.dev.austin.int.futo.cloud must resolve, from inside the
    # cluster, to the three RGW daemon IPs (10.10.10.90/91/92). If it does not,
    # michael fails to find backends at startup and crash-loops.
    env:
      - name: RESTIC_API_PORT
        value: "3010"
      - name: LOG_LEVEL
        value: info
      - name: S3_ENDPOINT
        value: https://s3.dev.austin.int.futo.cloud
      - name: S3_REGION
        value: us-east-1
      - name: S3_FORCE_PATH_STYLE
        value: "true"
      # --- built-in RGW load balancing (replaces rgw-haproxy) ---
      - name: S3_BACKEND_SOURCE
        value: dns
      - name: S3_BACKEND_DNS_HOST
        value: s3.dev.austin.int.futo.cloud
      - name: S3_BACKEND_SCHEME
        value: https
      - name: S3_BACKEND_PORT
        value: "443"
      - name: S3_BACKEND_PIN_HOST
        value: "true"
      - name: S3_TLS_SKIP_VERIFY
        value: "true"
      - name: S3_PROBE_BUCKET
        value: michael-rgw-healthcheck
      - name: OTLP_METRICS_ENDPOINT
        value: ${VMAGENT_OTLP}
      - name: OTLP_METRICS_URL_PATH
        value: /opentelemetry/v1/metrics
      - name: OTLP_LOGS_ENDPOINT
        value: ${VLAGENT_OTLP}
      - name: OTLP_LOGS_URL_PATH
        value: /insert/opentelemetry/v1/logs
