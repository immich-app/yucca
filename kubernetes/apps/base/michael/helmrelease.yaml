---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: michael
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/apps/michael
      # In-repo charts keep a static version; Revision repackages every git rev (ChartVersion would never ship template edits).
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: ${CHART_SOURCE:=flux-system}
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicas: ${MICHAEL_REPLICAS}
    image:
      repository: ghcr.io/immich-app/yucca/michael
      # From the image-versions ConfigMap (staging: rewritten in-cluster by the flux-operator
      # ResourceSet to latest CI build; prod: release-please-stamped in git). Empty default →
      # chart falls back to v<appVersion>, the matching release image.
      tag: ${YUCCA_IMAGE_TAG:=}
    # Real values come from the TF-provisioned `yucca-michael` Secret (envFrom).
    secretData: null
    env:
      - name: RESTIC_API_PORT
        value: "3010"
      - name: LOG_LEVEL
        value: info
      # Must match the cluster's STORAGE_CLUSTER_CODE (topology ConfigMap):
      # yucca-api mints restic tokens with a storageCluster claim, and michael
      # fails closed on cluster codes it does not front.
      - name: S3_DEFAULT_CLUSTER
        value: ${STORAGE_CLUSTER_CODE}
      - name: SITE_CODE
        value: ${SITE_CODE}
      - name: S3_TOPOLOGY_FILE
        value: /etc/yucca/topology.json
      - name: S3_ENDPOINT
        value: ${S3_ENDPOINT}
      - name: S3_REGION
        value: us-east-1
      - name: S3_FORCE_PATH_STYLE
        value: "true"
      - name: S3_BACKEND_SOURCE
        value: dns
      - name: S3_BACKEND_DNS_HOST
        value: ${S3_HOST}
      # S3_BACKEND_SCHEME/PORT are intentionally omitted: michael derives them
      # from S3_ENDPOINT (https -> 443), so a DNS source only needs the host.
      - name: S3_BACKEND_PIN_HOST
        value: "true"
      - name: S3_TLS_SKIP_VERIFY
        value: "true"
      - name: S3_PROBE_BUCKET
        value: michael-rgw-healthcheck
      # Eject a gateway after N consecutive transport failures; re-resolve DNS + probe
      # every interval (which is also the reinstatement speed).
      - name: S3_EJECT_THRESHOLD
        value: "3"
      - name: S3_RECONCILE_INTERVAL_MS
        value: "5000"
      - name: OTLP_METRICS_ENDPOINT
        value: ${VMAGENT_OTLP}
      - name: OTLP_METRICS_URL_PATH
        value: /opentelemetry/v1/metrics
