---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: michael
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/michael
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/immich-app/yucca/michael
      tag: ${YUCCA_IMAGE_TAG}
    # secretData nulled: the chart's dev JWT_PUBLIC_KEY fixture is replaced by
    # the TF-provisioned `yucca-michael` Secret (JWT_PUBLIC_KEY + S3 creds),
    # which the chart's `envFrom: secretRef: yucca-michael` picks up unchanged.
    secretData: null
    env:
      - name: RESTIC_API_PORT
        value: "3010"
      - name: LOG_LEVEL
        value: info
      - name: S3_ENDPOINT
        value: https://s3.staging.austin.int.futo.cloud
      - name: S3_REGION
        value: us-east-1
      - name: S3_FORCE_PATH_STYLE
        value: "true"
      # --- built-in RGW load balancing (replaces rgw-haproxy) ---
      - name: S3_BACKEND_SOURCE
        value: dns
      - name: S3_BACKEND_DNS_HOST
        value: s3.staging.austin.int.futo.cloud
      # S3_BACKEND_SCHEME/PORT are intentionally omitted: michael derives them
      # from S3_ENDPOINT (https -> 443), so a DNS source only needs the host.
      - name: S3_BACKEND_PIN_HOST
        value: "true"
      - name: S3_TLS_SKIP_VERIFY
        value: "true"
      - name: S3_PROBE_BUCKET
        value: michael-rgw-healthcheck
      # Ejection / health tuning (these are michael's defaults, surfaced here so
      # they're tunable per-env): eject a gateway after this many consecutive
      # transport failures, and re-resolve DNS + probe every interval (also how
      # fast an ejected gateway is reinstated).
      - name: S3_EJECT_THRESHOLD
        value: "3"
      - name: S3_RECONCILE_INTERVAL_MS
        value: "5000"
      - name: OTLP_METRICS_ENDPOINT
        value: ${VMAGENT_OTLP}
      - name: OTLP_METRICS_URL_PATH
        value: /opentelemetry/v1/metrics
