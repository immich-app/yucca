---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rgw-haproxy
  labels:
    app.kubernetes.io/name: rgw-haproxy
spec:
  # Two replicas so a node drain doesn't sever michael's object storage.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rgw-haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rgw-haproxy
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rgw-haproxy
      containers:
        - name: haproxy
          image: haproxy:3.0-alpine
          ports:
            - name: s3
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: rgw-haproxy
