---
# HAProxy fronting the bare-metal Ceph (sietch) RGW S3 endpoint for michael.
#
# Why a proxy at all: the RGW nodes serve HTTPS only, behind a self-signed
# wildcard cert, and michael's S3 client (AWS SDK Go, default transport) can
# neither skip TLS verification nor load a custom CA. HAProxy TLS-terminates
# here (verify-none to the backends) and exposes plain HTTP in-cluster, so
# michael speaks http and never sees the self-signed cert.
#
# Why the Host header is preserved: RGW validates the S3 signature against the
# request Host and rejects any host not in its zonegroup hostnames list. michael
# signs with `s3.staging.austin.int.futo.cloud` (which IS in that list) and reaches
# this proxy via a hostAlias (see the michael HelmRelease), so the original Host
# flows through unchanged and signatures validate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rgw-haproxy
data:
  haproxy.cfg: |
    global
      log stdout format raw local0 info
      maxconn 4096

    defaults
      log     global
      mode    http
      option  httplog
      option  forwardfor
      # restic objects can be large; keep generous data timeouts.
      timeout connect 10s
      timeout client  10m
      timeout server  10m

    frontend s3_in
      bind :8080
      default_backend rgw

    backend rgw
      balance roundrobin
      # The three sietch RGW daemons (one per node, management VLAN). HTTPS with
      # the self-signed wildcard cert -> `ssl verify none`. `check` does a TCP
      # health check so a dead node is taken out of rotation.
      server rgw1 10.10.10.90:443 ssl verify none check
      server rgw2 10.10.10.91:443 ssl verify none check
      server rgw3 10.10.10.92:443 ssl verify none check
