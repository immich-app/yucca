---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-database
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/platform/cnpg-cluster
      # In-repo charts keep a static version; Revision repackages every git rev (ChartVersion would never ship template edits).
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: ${CHART_SOURCE:=flux-system}
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # HA across the 3 control-planes: primary + 2 streaming replicas, one-per-node via
  # CNPG's default anti-affinity. Real clusters only — local dev uses the dev-mirror
  # tree (chart's 1-instance default).
  # TODO: point backups at object storage; consider synchronous replication.
  values:
    instances: 3
    storage: 10Gi
    # Generous requests, huge memory limit (no CPU limit — CFS throttling hurts
    # postgres tail latency more than contention does).
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 8Gi }
    # Node-local NVMe — CNPG is the HA layer; each instance binds a local PV
    # (WaitForFirstConsumer). Per-cluster class via cluster-settings: staging =
    # openebs-spare-disk (overlay SC), prod = openebs-hostpath (chart localpv class).
    storageClass: ${DB_STORAGE_CLASS}
