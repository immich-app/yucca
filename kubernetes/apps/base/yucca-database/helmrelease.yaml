---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-database
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/platform/cnpg-cluster
      # Repackage on every git revision — the in-repo charts keep a static
      # version, so the default ChartVersion strategy never ships template edits.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: ${CHART_SOURCE:=flux-system}
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    instances: 3
    storage: 10Gi
    imageName: ghcr.io/cloudnative-pg/postgresql:17.2
    # One instance per node, enforced: with "preferred" (the CNPG default) a
    # cordoned/full node lets two instances co-schedule, and the local PVs
    # (WaitForFirstConsumer) then pin that co-location permanently.
    affinity:
      podAntiAffinityType: required
    # Quorum commit, so a lost primary can't take recent commits with it and
    # leave the DB and the object store diverged. "preferred", not "required":
    # instances sit on node-local PVs, so a dead node strands one until a human
    # replaces it, and "required" would make that a write outage.
    synchronous:
      method: any
      number: 1
      failoverQuorum: true
      dataDurability: preferred
    # Generous requests, huge memory limit (no CPU limit — CFS throttling hurts
    # postgres tail latency more than contention does).
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 8Gi }
    # Node-local NVMe (no replicated block storage). CNPG provides HA at the app
    # layer: primary + 2 streaming replicas, each binding a local PV on its node
    # (WaitForFirstConsumer). Per-cluster class: staging = openebs-spare-disk
    # (overlay SC), prod = openebs-hostpath (chart localpv class) — set in each
    # cluster-settings.
    storageClass: ${DB_STORAGE_CLASS}
    # PITR to the region's Ceph RGW via the Barman Cloud plugin: continuous WAL
    # archiving + a daily base backup, 30d retention (chart default). Barman
    # does NOT create the bucket — WAL archiving fails with NoSuchBucket until
    # it exists. Create it once per cluster with the backup user's own creds
    # (any S3 client; --max-buckets=1 permits exactly this one — see
    # ansible/ceph/docs/s3-integration.md). The secret is TF-provisioned (talos
    # stack) with the RGW user's keys and the self-signed RGW cert as CA_CERT.
    # TODO: second copy on OVH S3.
    backup:
      enabled: true
      bucket: yucca-db-backups
      endpointURL: ${S3_ENDPOINT}
      secretName: yucca-db-backup-s3
