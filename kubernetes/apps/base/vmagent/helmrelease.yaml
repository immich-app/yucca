---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmagent
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  install:
    crds: CreateReplace
  interval: 1h
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 2
  values:
    # `vmagent-<name>` Service => vmagent-yucca (matches VMAGENT_OTLP). k8s-stack bundles
    # the VM operator (CRDs + operator + VMAgent in one release). METRICS REMOTE CLUSTER:
    # only the agent runs here; storage/query/alerting live at o11y.
    fullnameOverride: yucca
    global:
      clusterLabel: cluster
    # Server-side components are disabled — they run in the o11y cluster.
    vmcluster:
      enabled: false
    vmsingle:
      enabled: false
    vmalert:
      enabled: false
    alertmanager:
      enabled: false
    vmauth:
      enabled: false
    grafana:
      enabled: false
    defaultDashboards:
      enabled: false
    defaultRules:
      create: false
    prometheus-node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: false
    vmagent:
      enabled: true
      spec:
        # Stamp cluster/site/env on EVERY series. Relabel, not externalLabels:
        # externalLabels only tags scraped data, leaving OTLP-pushed app metrics
        # untagged; relabel covers scraped + ingested before remote-write.
        inlineRelabelConfig:
          - target_label: cluster
            replacement: ${METRICS_CLUSTER_LABEL}
          - target_label: site
            replacement: ${METRICS_SITE_LABEL}
          - target_label: env
            replacement: ${METRICS_ENV_LABEL}
        # Ship to o11y's vmauth (the `remote-clusters` VMUser proxies
        # /insert/0/.* -> vminsert), authenticating with the shared bearer token
        # (TF-provisioned `vmagent-remote-write` Secret from o11y_tf_staging).
        remoteWrite:
          - url: https://vmauth.staging.futostatus.com/insert/0/prometheus/api/v1/write
            bearerTokenSecret:
              name: vmagent-remote-write
              key: token
