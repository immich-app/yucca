---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmagent
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  install:
    crds: CreateReplace
  interval: 1h
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 2
  values:
    # `vmagent-<name>` Service => vmagent-yucca (matches VMAGENT_OTLP). The
    # k8s-stack chart bundles the VM operator, so this one release gives us the
    # CRDs + operator + a VMAgent. yucca_staging is a METRICS REMOTE CLUSTER:
    # only the agent runs here; storage/query/alerting live at o11y.
    fullnameOverride: yucca
    global:
      clusterLabel: cluster
    # Server-side components are disabled — they run in the o11y cluster.
    vmcluster:
      enabled: false
    vmsingle:
      enabled: false
    vmalert:
      enabled: false
    alertmanager:
      enabled: false
    vmauth:
      enabled: false
    grafana:
      enabled: false
    defaultDashboards:
      enabled: false
    # `enabled`, not kube-prometheus-stack's `create` — the chart ignores the
    # latter and was quietly shipping all 38 VMRules.
    defaultRules:
      enabled: false
    prometheus-node-exporter:
      enabled: true
      # Host-network OS metrics from every node, control-planes included (the
      # Talos ingress firewall opens :9100 to cluster subnets).
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    kube-state-metrics:
      enabled: true
      # Modern Flux exposes no ready-state metric of its own; gotk_resource_info
      # is generated here via customResourceState (config from
      # fluxcd/flux2-monitoring-example, minus its collectors/extraArgs — those
      # are for a dedicated CRS-only instance, and would silently disable every
      # standard kube_* collector on this shared one). The o11y flux dashboard
      # and the FluxResourceNotReady alert are dead without this.
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
              - image.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - buckets
              - helmrepositories
              - helmcharts
              - ocirepositories
              - kustomizations
              - helmreleases
              - alerts
              - providers
              - receivers
              - imagerepositories
              - imagepolicies
              - imageupdateautomations
            verbs: [ "list", "watch" ]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, lastAppliedRevision ]
                      source_name: [ spec, sourceRef, name ]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, history, "0", chartVersion ]
                      chart_name: [ status, history, "0", chartName ]
                      chart_app_version: [ status, history, "0", appVersion ]
                      chart_ref_name: [ spec, chartRef, name ]
                      chart_source_name: [ spec, chart, spec, sourceRef, name ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Bucket resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      endpoint: [ spec, endpoint ]
                      bucket_name: [ spec, bucketName ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      chart_name: [ spec, chart ]
                      chart_version: [ spec, version ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Alert
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Alert resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      suspended: [ spec, suspend ]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Provider
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Provider resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      suspended: [ spec, suspend ]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1
                  kind: Receiver
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Receiver resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      webhook_path: [ status, webhookPath ]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImageRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      image: [ spec, image ]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImagePolicy
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImagePolicy resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      source_name: [ spec, imageRepositoryRef, name ]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImageUpdateAutomation
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageUpdateAutomation resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      source_name: [ spec, sourceRef, name ]
    # Talos runs the control-plane as host-network static pods labelled
    # k8s-app (not kubeadm's `component`), serving self-signed certs; null the
    # chart's selector key so the merged map doesn't keep both labels and
    # match nothing. Reachability (bind-address 0.0.0.0 + host firewall) comes
    # from the talos machine configs (tf).
    kubeControllerManager:
      service:
        selector:
          component: null
          k8s-app: kube-controller-manager
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    kubeScheduler:
      service:
        selector:
          component: null
          k8s-app: kube-scheduler
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    # Talos etcd is a host service (no pods to select) — static CP IPs from
    # cluster-settings, hitting the plain-HTTP metrics listener the machine
    # config opens on :2381 (client port 2379 needs etcd client certs).
    kubeEtcd:
      endpoints: ${METRICS_ETCD_ENDPOINTS:=[]}
      service:
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          endpoints:
            - port: http-metrics
              scheme: http
    kubeApiServer:
      vmScrape:
        spec:
          jobLabel: component
          namespaceSelector:
            matchNames:
              - default
          selector:
            matchLabels:
              component: apiserver
              provider: kubernetes
          endpoints:
            - port: https
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              # The apiserver's per-verb/resource histograms dwarf the rest of
              # its exposition; drop the buckets (sums/counts survive, so mean
              # latencies remain) before remote-write to o11y.
              metricRelabelConfigs:
                - action: drop
                  source_labels: [__name__]
                  regex: (apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_watch_events_sizes_bucket|apiserver_storage_list_duration_seconds_bucket|etcd_request_duration_seconds_bucket)
    vmagent:
      enabled: true
      spec:
        # Stamp the remote-cluster identity on EVERY series: cluster (short
        # cluster name), env, project, provider, region — the identity set from
        # o11y's shipping guide. Relabel (not externalLabels):
        # externalLabels only tags scraped data, leaving OTLP-pushed app
        # metrics untagged. This applies to all data (scraped + ingested)
        # before remote-write.
        inlineRelabelConfig:
          - target_label: cluster
            replacement: ${METRICS_CLUSTER_LABEL}
          - target_label: provider
            replacement: ${METRICS_PROVIDER_LABEL}
          - target_label: region
            replacement: ${METRICS_REGION_LABEL}
          - target_label: env
            replacement: ${METRICS_ENV_LABEL}
          - target_label: project
            replacement: yucca
        # Ship to o11y's vmauth (the `remote-clusters` VMUser proxies
        # /insert/0/.* -> vminsert), authenticating with the shared bearer token
        # (TF-provisioned `vmagent-remote-write` Secret from o11y_tf_staging).
        remoteWrite:
          - url: https://vmauth.staging.futostatus.com/insert/0/prometheus/api/v1/write
            bearerTokenSecret:
              name: vmagent-remote-write
              key: token
