---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-meta
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/apps/meta
      # In-repo charts keep a static version; Revision repackages every git rev (ChartVersion would never ship template edits).
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: ${CHART_SOURCE:=flux-system}
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Stock upstream nginx — no ${YUCCA_IMAGE_TAG} override; the chart pins the tag.
    # The pod's whole point: hand clients the API root for everything else, rendered
    # into the chart's ConfigMap and served at /.well-known/yucca.json.
    wellKnown:
      meta_url: https://${APP_DOMAIN}/api/meta
