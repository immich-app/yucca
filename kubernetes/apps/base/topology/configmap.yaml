---
# Fleet topology, GitOps-owned: sites, the restic gateway fronting each, and the Ceph
# clusters behind. yucca-api/admin-api/metrics-worker/michael mount it at /etc/yucca,
# validate at boot, and roll on change via the charts' topology checksum annotation.
# Single-site per cluster today: a second Ceph cluster = second `clusters` entry
# (active: false until it takes writes); a second REGION = second `sites` entry — a
# cross-cluster edit that doesn't fit per-cluster substitution (expect a real template then).
# NB: ${VAR} tokens are Flux postBuild substitutions; the JSON braces pass through untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yucca-topology
data:
  topology.json: |
    {
      "schema_version": 1,
      "default_site": "${SITE_CODE}",
      "sites": [
        {
          "code": "${SITE_CODE}",
          "display_name": "${SITE_DISPLAY_NAME}",
          "description": "${SITE_DESCRIPTION}",
          "rest_url": "https://${GW_HOST}",
          "default_cluster": "${STORAGE_CLUSTER_CODE}",
          "clusters": [
            {
              "code": "${STORAGE_CLUSTER_CODE}",
              "display_name": "${STORAGE_CLUSTER_DISPLAY_NAME}",
              "active": true,
              "rgw_admin_endpoint": "${S3_ENDPOINT}",
              "s3": {
                "endpoint": "${S3_ENDPOINT}",
                "region": "us-east-1",
                "force_path_style": true,
                "access_key_env": "S3_ACCESS_KEY_ID",
                "secret_key_env": "S3_SECRET_ACCESS_KEY",
                "backend_source": "dns",
                "backend_dns_host": "${S3_HOST}",
                "pin_host": true,
                "tls_skip_verify": true,
                "probe_bucket": "michael-rgw-healthcheck",
                "eject_threshold": 3,
                "reconcile_interval_ms": 5000
              }
            }
          ]
        }
      ]
    }
