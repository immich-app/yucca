---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-system
      sectionName: https
  hostnames:
    - "${APP_DOMAIN}"
  rules:
    # Longest-prefix match wins: /api/internal never reaches yucca-api from the
    # internet — the internal-404 filter answers instead. Pod-to-pod callers
    # (futo-backups-bot) bypass the gateway entirely.
    - matches:
        - path:
            type: PathPrefix
            value: /api/internal
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: internal-404
      backendRefs:
        - name: yucca-api
          port: 3020
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: yucca-api
          port: 3020
    # Freshdesk automation webhooks (docs/discord-support.md). Capability URL:
    # the path segment is a TF-generated secret arriving via the optional
    # cluster-secrets Secret (never in git or CI; the default keeps secret-less
    # renders working, and dev). The rewrite pins the bot's fixed mount, so the
    # secret never reaches the pod; the x-freshdesk-secret header is the second
    # wall, and the payload is an untrusted hint either way.
    - matches:
        - path:
            type: PathPrefix
            value: /hooks/${FRESHDESK_WEBHOOK_PATH:=freshdesk}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /hooks/freshdesk
      backendRefs:
        - name: futo-backups-bot
          port: 3050
    - backendRefs:
        - name: yucca-web
          port: 5173
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: internal-404
spec:
  directResponse:
    statusCode: 404
