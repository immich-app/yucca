---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-system
      sectionName: https
  hostnames:
    - "${APP_DOMAIN}"
  rules:
    # Longest-prefix match wins: /api/internal never reaches yucca-api from the
    # internet — the internal-404 filter answers instead. Pod-to-pod callers
    # (futo-backups-bot) bypass the gateway entirely.
    - matches:
        - path:
            type: PathPrefix
            value: /api/internal
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: internal-404
      backendRefs:
        - name: yucca-api
          port: 3020
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: yucca-api
          port: 3020
    - backendRefs:
        - name: yucca-web
          port: 5173
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: internal-404
spec:
  directResponse:
    statusCode: 404
