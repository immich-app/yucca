---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-system
      sectionName: https
  hostnames:
    - "${APP_DOMAIN}"
  rules:
    # /api/internal/* is service-to-service only (michael's token introspection,
    # pod-to-pod). Longest-prefix matching shadows the /api rule below, so the
    # public gateway answers a bare 404 (internal-404.yaml) without ever
    # touching yucca-api.
    - matches:
        - path:
            type: PathPrefix
            value: /api/internal
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: internal-404
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: yucca-api
          port: 3020
    - backendRefs:
        - name: yucca-web
          port: 5173
