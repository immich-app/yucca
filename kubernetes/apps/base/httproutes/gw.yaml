---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# michael — the restic gateway. Exposed at gw.<domain>.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gw
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-system
      sectionName: https
  hostnames:
    - "${GW_HOST}"
  rules:
    - backendRefs:
        - name: yucca-michael
          port: 3010
