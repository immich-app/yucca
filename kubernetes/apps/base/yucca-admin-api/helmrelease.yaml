---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-admin-api
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/apps/yucca-admin-api
      # Repackage on every git revision — the in-repo charts keep a static
      # version, so the default ChartVersion strategy never ships template edits.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: ${CHART_SOURCE:=flux-system}
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/immich-app/yucca/yucca-admin-api
      tag: ${YUCCA_IMAGE_TAG}
    # secretData nulled: replaced by the TF-provisioned `yucca-admin-api` Secret
    # (OIDC_ADMIN_CLIENT_ID/SECRET) via the chart's envFrom: secretRef.
    secretData: null
    # Not publicly routed — exposed via Tailscale later; set redirect URIs then.
    oidcIssuer: ${OIDC_ISSUER}
    oidcRedirectUri: https://CHANGEME/api/auth/oidc/callback
    oidcLogoutRedirectUri: https://CHANGEME
    env:
      - name: NODE_ENV
        value: production
      - name: YUCCA_ADMIN_API_PORT
        value: "3030"
      - name: LOG_LEVEL
        value: info
      - name: OTEL_METRICS
        value: http://${VMAGENT_OTLP}/opentelemetry/v1/metrics
