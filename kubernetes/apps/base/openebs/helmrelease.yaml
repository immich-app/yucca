---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chartRef:
    kind: OCIRepository
    name: openebs
  install:
    crds: CreateReplace
    remediation:
      retries: 3 # first-install failures self-retry instead of wedging until manual intervention
  interval: 1h
  rollback:
    cleanupOnFail: true
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    strategy:
      name: RemediateOnFailure
    remediation:
      remediateLastFailure: true
      retries: 2
  # LocalPV hostpath + optional Mayastor; shared per-cluster via cluster-settings:
  #   OPENEBS_MAYASTOR_ENABLED       default false (staging: PG replicates app-side;
  #                                  father true — VictoriaMetrics on repl=2 DiskPools)
  #   OPENEBS_LOCALPV_BASEPATH       default /var/mnt/hostpath (a UserVolume)
  #   OPENEBS_HOSTPATH_CLASS_ENABLED default false (staging: per-disk SCs in overlay)
  #   OPENEBS_MAYASTOR_ETCD_BASEPATH mayastor's etcd (localpv), read only when enabled
  # lvm/zfs/loki/alloy/minio stay off everywhere.
  values:
    preUpgradeHook:
      enabled: false
    localpv-provisioner:
      analytics:
        enabled: false
      localpv:
        image:
          registry: quay.io/
        # Fallback for the chart's default class (disabled below → unused; PVs land on
        # the NVMe StorageClasses, storageclass-spare-disk*.yaml, with their own BasePath).
        # Kept on a UserVolume mount to avoid drift onto EPHEMERAL.
        basePath: ${OPENEBS_LOCALPV_BASEPATH:=/var/mnt/hostpath}
      # Disabled so PVs never land on the small 240GB DELLBOSS install disk (unlike
      # o11y's large system disks); storage lives on the two 1.6TB NVMes via
      # openebs-spare-disk / -2 (one is the cluster-default class).
      hostpathClass:
        enabled: ${OPENEBS_HOSTPATH_CLASS_ENABLED:=false}
      helperPod:
        image:
          registry: quay.io/
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
          keep: false
    zfs-localpv:
      enabled: false
    lvm-localpv:
      enabled: false
    mayastor:
      enabled: ${OPENEBS_MAYASTOR_ENABLED:=false}
      etcd:
        localpvScConfig:
          basePath: ${OPENEBS_MAYASTOR_ETCD_BASEPATH:=/var/mnt/hostpath/mayastor-etcd}
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: ${OPENEBS_MAYASTOR_ENABLED:=false}
    loki:
      enabled: false
    alloy:
      enabled: false
    minio:
      enabled: false
