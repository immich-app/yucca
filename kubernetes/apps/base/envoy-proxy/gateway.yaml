---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
# HTTPS on 443 (wildcard cert covers apex + every subdomain) plus a bare :80 listener
# that exists ONLY for the 301 redirect (redirect.yaml) — without it plain-http hits
# connection-refused. Per-host routing lives in the HTTPRoutes (beside the app
# services); routes may attach from any namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: app-domain-tls
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
