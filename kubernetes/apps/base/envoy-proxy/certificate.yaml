---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
# Prod's restic host is two labels down — outside this wildcard; it has its own gw-public cert.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-domain
spec:
  dnsNames:
    - "${APP_DOMAIN}"
    - "*.${APP_DOMAIN}"
  duration: 2160h # 90d; cert-manager renews at 2/3 lifetime
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  secretName: app-domain-tls
