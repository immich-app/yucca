---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  interval: 1h
  install:
    remediation:
      retries: 3 # first-install failures self-retry instead of wedging until manual intervention
  rollback:
    cleanupOnFail: true
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
  values:
    fullnameOverride: victoria-logs-collector

    # o11y's vmauth (native VictoriaLogs ingest -> vlinsert); bearer token from the
    # TF-provisioned `vmagent-remote-write` Secret.
    remoteWrite:
      - url: ${VLOGS_REMOTE_URL}
        maxDiskUsagePerURL: 10GB
    extraArgs:
      remoteWrite.bearerTokenFile: /secrets/token
    extraVolumes:
      - name: token
        secret:
          secretName: vmagent-remote-write
          items:
            - key: token
              path: token
    extraVolumeMounts:
      - name: token
        mountPath: /secrets
        readOnly: true

    collector:
      streamFields:
        - kubernetes.pod_name
        - kubernetes.pod_namespace
        - kubernetes.container_name
        - kubernetes.pod_labels.app.kubernetes.io/name
      # Same tags as the metrics pipeline.
      extraFields: '{"cluster":"${METRICS_CLUSTER_LABEL}","site":"${METRICS_SITE_LABEL}","env":"${METRICS_ENV_LABEL}"}'

    # All staging nodes are control-plane.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
