---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-metrics-worker
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/apps/yucca-metrics-worker
      # In-repo charts keep a static version; Revision repackages every git rev (ChartVersion would never ship template edits).
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: ${CHART_SOURCE:=flux-system}
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/immich-app/yucca/yucca-metrics-worker
      # From the image-versions ConfigMap (staging: rewritten in-cluster by the flux-operator
      # ResourceSet to latest CI build; prod: release-please-stamped in git). Empty default →
      # chart falls back to v<appVersion>, the matching release image.
      tag: ${YUCCA_IMAGE_TAG:=}
    # Shares yucca-api's CNPG database; the chart reads creds from the
    # <cluster>-app Secret (yucca-db-app), which CNPG manages.
    postgresClusterName: yucca-db
    # Per-bucket usage from each storage cluster's RGW admin API (topology
    # rgw_admin_endpoint). Self-signed HTTPS → NODE_TLS_REJECT_UNAUTHORIZED below
    # (mirrors michael's S3_TLS_SKIP_VERIFY). Fallback admin creds TF-provisioned into
    # the yucca-metrics-rgw Secret (tf .../secrets.tf); extra clusters get RADOS_*_<CODE> pairs.
    radosSecretName: yucca-metrics-rgw
    # Drop the dev-fixture POLAR_* placeholders (same pattern as the other HRs); real
    # billing creds arrive via ExternalSecret when Polar lands — placeholders in a prod
    # Secret invite silently-broken billing.
    secretData: null
    # Full replacement of the chart's dev env. Logs are collected node-side by
    # victoria-logs-collector (stdout) — no OTEL_LOGGING push. RADOS_*/POSTGRES_* are
    # appended by the chart from the Secrets above.
    env:
      - name: NODE_ENV
        value: production
      # Pinned origin of meter rows created before placement columns existed.
      - name: LEGACY_SITE_CODE
        value: ${LEGACY_SITE_CODE}
      - name: LEGACY_STORAGE_CLUSTER_CODE
        value: ${LEGACY_STORAGE_CLUSTER_CODE}
      - name: YUCCA_METRICS_WORKER_PORT
        value: "3040"
      - name: LOG_LEVEL
        value: info
      - name: OTEL_METRICS
        value: http://${VMAGENT_OTLP}/opentelemetry/v1/metrics
      # sietch RGW uses a self-signed wildcard cert; the worker is Node.
      - name: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
