---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-metrics-worker
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/apps/yucca-metrics-worker
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/immich-app/yucca/yucca-metrics-worker
      # Substituted by Flux postBuild from the image-versions ConfigMap (CI-bumped).
      tag: ${YUCCA_IMAGE_TAG}
    # Shares yucca-api's CNPG database; the chart reads creds from the
    # <cluster>-app Secret (yucca-db-app), which CNPG manages.
    postgresClusterName: yucca-db
    # Per-bucket usage comes from the bare-metal RGW admin API — the same gateway
    # michael targets, so the endpoint is env-specific (staging → sietch/dev Ceph;
    # prod → its own separate Ceph) and comes from cluster-settings via Flux
    # postBuild, NOT hardcoded here. It serves HTTPS behind a self-signed cert, so
    # the worker skips TLS verification (NODE_TLS_REJECT_UNAUTHORIZED below),
    # mirroring michael's S3_TLS_SKIP_VERIFY. The admin credentials
    # (AccessKey/SecretKey) are TF-provisioned into the yucca-metrics-rgw Secret
    # (tf .../secrets.tf), like yucca-michael — not managed in this repo.
    radosEndpoint: ${S3_ENDPOINT}
    radosSecretName: yucca-metrics-rgw
    # Full replacement of the chart's dev env: production mode, OTLP metrics to
    # the in-cluster vmagent. Logs are collected node-side by
    # victoria-logs-collector (pod stdout), so no OTEL_LOGGING push here.
    # RADOS_* and POSTGRES_* are appended by the chart from the Secrets above.
    env:
      - name: NODE_ENV
        value: production
      - name: YUCCA_METRICS_WORKER_PORT
        value: "3040"
      - name: LOG_LEVEL
        value: info
      - name: OTEL_METRICS
        value: http://${VMAGENT_OTLP}/opentelemetry/v1/metrics
      # sietch RGW uses a self-signed wildcard cert; the worker is Node.
      - name: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
