---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: yucca
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/immich-app/yucca
  ref:
    branch: main
  # The repo is private: bootstrap creates this secret (a GitHub deploy key or
  # fine-grained PAT) BEFORE applying this tree — see kubernetes/bootstrap/.
  secretRef:
    name: yucca-repo-auth
  ignore: |
    /*
    !/kubernetes
    !/charts
