---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-metrics-object-user
  namespace: yucca
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/platform/ceph-objectuser
      sourceRef:
        kind: GitRepository
        name: yucca
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # michael's plain S3 user has no admin caps, so it can't read per-bucket stats.
    userName: metrics
    capabilities:
      bucket: read
      usage: read
      metadata: read
