---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-database
  namespace: yucca
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/platform/cnpg-cluster
      sourceRef:
        kind: GitRepository
        name: yucca
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # TODO(prod): a prod overlay raises instances/storage.
  values: {}
