---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: yucca-metrics-worker
  namespace: flux-system
spec:
  targetNamespace: yucca
  commonMetadata:
    labels:
      app.kubernetes.io/name: yucca-metrics-worker
  path: ./kubernetes/apps/dev/local/yucca/metrics-worker/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: yucca
  dependsOn:
    - name: yucca-database
    - name: yucca-object-user
    # ConfigMap mounted at /etc/yucca and parsed at boot.
    - name: yucca-topology
