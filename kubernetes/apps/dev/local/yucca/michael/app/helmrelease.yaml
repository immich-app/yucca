---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-michael
  namespace: yucca
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/apps/michael
      sourceRef:
        kind: GitRepository
        name: yucca
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Tilt live_update / air rebuilds need a writable rootfs (chart default is read-only).
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop: [ALL]
    # Chart default is false so real overlays fail loudly instead.
    useDevKeypair: true
    image:
      repository: ghcr.io/immich-app/yucca/michael # TODO: confirm prod registry
      tag: 0.0.1
    # TODO(prod): source JWT_SECRET / S3 creds from an ExternalSecret, not values
