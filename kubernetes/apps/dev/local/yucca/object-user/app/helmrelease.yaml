---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-object-user
  namespace: yucca
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/platform/ceph-objectuser
      sourceRef:
        kind: GitRepository
        name: yucca
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values: {}
