---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: yucca-api
  namespace: flux-system
spec:
  targetNamespace: yucca
  commonMetadata:
    labels:
      app.kubernetes.io/name: yucca-api
  path: ./kubernetes/apps/dev/local/yucca/yucca-api/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: yucca
  dependsOn:
    - name: yucca-database
    - name: yucca-mock-oidc
    - name: yucca-michael
