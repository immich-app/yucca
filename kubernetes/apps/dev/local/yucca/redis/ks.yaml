---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: yucca-redis
  namespace: flux-system
spec:
  targetNamespace: yucca
  commonMetadata:
    labels:
      app.kubernetes.io/name: yucca-redis
  path: ./kubernetes/apps/dev/local/yucca/redis/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: yucca
