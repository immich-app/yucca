---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-redis
  namespace: yucca
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/apps/redis
      sourceRef:
        kind: GitRepository
        name: yucca
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # Chart defaults are dev-ready (ephemeral, no auth).
  values: {}
