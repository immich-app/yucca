---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-meta
  namespace: yucca
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/apps/meta
      sourceRef:
        kind: GitRepository
        name: yucca
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # Nothing Tilt builds here, so none of the dev rootfs relaxations the other releases need.
