---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-operator
  namespace: flux-system
spec:
  targetNamespace: rook-ceph
  path: ./kubernetes/apps/dev/local/rook-ceph/rook-ceph-operator/app
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: yucca
