---
# Production environment settings. Authored now; activates when the prod
# cluster is built and its flux-instance syncs kubernetes/clusters/production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  CLUSTER_NAME: yucca_production
  # TODO: real production ingress domain.
  APP_DOMAIN: yucca.futo.cloud
  # Bare-metal RGW (Ceph S3) gateway for yucca-metrics-worker / michael. Prod
  # uses a COMPLETELY SEPARATE Ceph from staging's sietch cluster. S3_HOST is the
  # same gateway without the scheme (michael's S3_BACKEND_DNS_HOST).
  # TODO: real production RGW endpoint.
  S3_ENDPOINT: https://s3.prod.futo.cloud
  S3_HOST: s3.prod.futo.cloud
