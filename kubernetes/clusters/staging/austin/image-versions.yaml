---
# CI-MANAGED. The deploy workflow rewrites YUCCA_IMAGE_TAG to the newly-built
# short git SHA on merge to main (staging auto-promotes the highest tag); prod
# promotes this same validated artifact behind an approval — see prod's copy.
# Kept DISJOINT from cluster-settings (human) + cluster-settings.generated (TF):
# apps.yaml postBuild-substitutes YUCCA_IMAGE_TAG from this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-versions
  namespace: flux-system
data:
  YUCCA_IMAGE_TAG: main
