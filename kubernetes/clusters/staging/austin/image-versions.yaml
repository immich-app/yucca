---
# BOOTSTRAP-ONLY: gives cluster-apps' postBuild a source on a fresh cluster; after
# bootstrap the flux-operator ResourceSet (apps/staging/austin/flux-system/
# image-automation.yaml) owns YUCCA_IMAGE_TAG (latest 0.0.<run> GHCR tag). The ssa
# annotation makes git sync create-but-never-update — without it kustomize-controller
# reapplies `main` every minute and fights the ResourceSet. DISJOINT from
# cluster-settings (human) + generated (TF).
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-versions
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  YUCCA_IMAGE_TAG: main
