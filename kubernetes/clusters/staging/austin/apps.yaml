# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# cluster-apps entry point (the flux-instance sync from the TF helm module points here).
# One Kustomization over kubernetes/apps/staging/austin + a patch giving EVERY child
# Kustomization postBuild.substituteFrom over the three settings ConfigMaps. Precedence
# (last wins): cluster-settings-generated (TF) → cluster-settings (human) →
# image-versions (CI); keys are disjoint by design.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m # fresh-bootstrap CRD races retry in minutes, not 1h
  path: ./kubernetes/apps/staging/austin
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  # Nested Kustomization CRs carry ${MANIFEST_SOURCE:=flux-system}; staging keeps the
  # default, but the substitution pass must run for the default to resolve.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings-generated
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: image-versions
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings-generated
              - kind: ConfigMap
                name: cluster-settings
              - kind: ConfigMap
                name: image-versions
