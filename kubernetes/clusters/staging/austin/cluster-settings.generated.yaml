---
# TF-RENDERED — do not hand-edit. The staging/austin talos stack renders this
# file (templatefile + local_file) from the derived partition/region topology
# and commits it, so the tree is always kustomize-buildable even though prod has
# no flux stack yet. Hand-authored here to a valid value that matches what TF
# will regenerate (CLUSTER_NAME=yucca_<partition>_<region>, etc.). These keys are
# DISJOINT from the human cluster-settings + CI image-versions ConfigMaps; the
# cluster-apps postBuild merges all three.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings-generated
  namespace: flux-system
data:
  # Cluster identity (derived: yucca_<partition>_<region>).
  CLUSTER_NAME: yucca_staging_austin
  # Role of this region within its partition (authoritative in TF discovery.role;
  # mirrored compile-time by the components/roles/<role> the overlay composes).
  CLUSTER_ROLE: primary
  # Telemetry identity tags stamped on everything the agents ship (cluster =
  # short cluster name; env; provider and region = 3-letter codes from
  # region.hcl).
  METRICS_CLUSTER_LABEL: luke
  METRICS_PROVIDER_LABEL: int
  METRICS_REGION_LABEL: aus
  METRICS_ENV_LABEL: staging
  # CP node IPs (clusters.auto.tfvars) — the vmagent's kubeEtcd static targets,
  # hitting the plain-HTTP etcd metrics listener the machine config opens
  # on :2381. Substituted as a YAML flow list.
  METRICS_ETCD_ENDPOINTS: '["10.10.10.47", "10.10.10.242", "10.10.10.117"]'

  # Per-service ingress hostnames (routed by the ingress layer to in-cluster
  # services; resolve to INGRESS_PUBLIC_IP publicly / INGRESS_INTERNAL_IP on-LAN).
  APP_DOMAIN: staging.backups.futo.cloud  # web (apex; /api routes to yucca-api)
  GW_HOST: gw.staging.backups.futo.cloud  # michael (restic gateway)

  # Bare-metal RGW (Ceph S3) gateway for the staging/austin region; self-signed
  # cert, so consumers skip TLS verify. Consumed by yucca-metrics-worker
  # (radosEndpoint) and michael (S3_ENDPOINT). S3_HOST is the same gateway
  # without the scheme, for michael's DNS-based backend LB (S3_BACKEND_DNS_HOST).
  S3_ENDPOINT: https://s3.staging.austin.int.futo.cloud
  S3_HOST: s3.staging.austin.int.futo.cloud

  # Observability egress (apps -> agents -> o11y vmauth). In-cluster OTLP
  # receiver for metrics (host:port, no scheme). Logs go to o11y staging's MESH
  # vmauth over NetBird, unauthenticated (the talos-to-o11y-gateway ACL is the
  # gate; the overlay strips the bearer and pins the mesh name pod-side — see
  # apps/staging/austin/observability). Metrics still ride the authed public
  # futostatus path.
  VMAGENT_OTLP: vmagent-yucca.observability.svc:8429
  VLOGS_REMOTE_URL: https://vmauth.staging.o11y.futo.network/insert/native
