---
# TF-RENDERED — do not hand-edit (hand-maintained until the talos stack renders
# it; values match what TF would derive). Keys are DISJOINT from the human
# cluster-settings + CI image-versions ConfigMaps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings-generated
  namespace: flux-system
data:
  # Cluster identity (derived: yucca_<partition>_<region>).
  CLUSTER_NAME: yucca_prod_htz_fsn1
  CLUSTER_ROLE: primary
  METRICS_CLUSTER_LABEL: yucca_prod_htz_fsn1

  # Per-service ingress hostnames. web (apex; /api routes to yucca-api) on the
  # app gateway; gw. (michael, restic) on the dedicated gw-proxy gateway.
  APP_DOMAIN: backups.futo.cloud
  GW_HOST: gw.backups.futo.cloud

  # Spice RGW (Ceph S3): round-robin DNS across all 48 nodes' fabric VLAN-120
  # IPs (prod/global/dns), reached over the FABRIC — the spine routes
  # kube↔cls1-public (fabric stack public_routing). Self-signed cert, so
  # consumers skip TLS verify. S3_HOST is the schemeless form for michael's
  # DNS-based backend LB (S3_BACKEND_DNS_HOST).
  S3_ENDPOINT: https://s3.prod.fsn1.htz.futo.cloud
  S3_HOST: s3.prod.fsn1.htz.futo.cloud

  # Observability egress (apps -> agents -> o11y's MESH vmauth over NetBird,
  # unauthenticated; see apps/prod/htz-fsn1/observability).
  VMAGENT_OTLP: vmagent-yucca.observability.svc:8429
  VLOGS_REMOTE_URL: https://vmauth.o11y.futo.network/insert/native
