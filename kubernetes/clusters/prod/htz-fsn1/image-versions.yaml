---
# BOOTSTRAP-ONLY. The live image pins are owned by the prod-pin Kustomization
# (see prod-pin.yaml), which applies this ConfigMap from the CI-written
# deploy/prod branch — one key per app, so rollback can be surgical. This git
# copy exists so a fresh cluster has substitution sources before its first
# deploy; the ssa annotation makes the root sync create-but-never-update it.
# Kept DISJOINT from cluster-settings (human) + generated (TF).
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-versions
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  YUCCA_API_IMAGE_TAG: v0.16.0
  YUCCA_ADMIN_API_IMAGE_TAG: v0.16.0
  YUCCA_METRICS_WORKER_IMAGE_TAG: v0.16.0
  WEB_IMAGE_TAG: v0.16.0
  MICHAEL_IMAGE_TAG: v0.16.0
