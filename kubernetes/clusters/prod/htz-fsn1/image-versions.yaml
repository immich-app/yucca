---
# RELEASE-STAMPED image pin — second half of the prod pin (first: the flux-release tag,
# see flux-release.yaml). Both lines are release-please-stamped in the release PR
# (extra-files in release-please-config.json) so they can't diverge; merging promotes
# manifests+charts+images together. Roll back by reverting both stamped lines. DISJOINT
# from cluster-settings (human) + generated (TF); unlike staging's copy this is
# git-owned (no ssa annotation, no in-cluster automation rewrites it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-versions
  namespace: flux-system
data:
  YUCCA_IMAGE_TAG: v0.27.0 # x-release-please-version
