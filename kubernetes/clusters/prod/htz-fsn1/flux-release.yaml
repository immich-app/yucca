# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
---
# RELEASE-PINNED source for prod's app tree + charts — one half of the prod pin (the
# other: the image tag in image-versions.yaml). Root flux-system stays on main and syncs
# only the cluster entrypoint; cluster-infra/cluster-apps + charts build from THIS repo
# at the tag below. Both pin lines are release-please-stamped in the release PR itself
# (extra-files in release-please-config.json): merging it IS the prod promotion and the
# halves can't diverge. Roll back by reverting both stamped lines (old images persist in GHCR).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-release
  namespace: flux-system
spec:
  interval: 1m
  ref:
    tag: v0.27.0 # x-release-please-version
  url: https://github.com/immich-app/yucca.git
