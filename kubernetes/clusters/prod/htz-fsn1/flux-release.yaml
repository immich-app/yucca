# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
---
# BOOTSTRAP-ONLY. The live flux-release pin is owned by the prod-pin
# Kustomization (see prod-pin.yaml), which applies it from the CI-written
# deploy/prod branch at an exact v1.0.<n> tag. This git copy exists so a
# fresh cluster has a source before its first deploy; the ssa annotation makes
# the root sync create-but-never-update it, so it can't fight the pin.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-release
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  interval: 1m
  ref:
    tag: v0.16.0
  url: https://github.com/immich-app/yucca.git
