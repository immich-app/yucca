# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# prod@htz-fsn1 entry points — TWO layers so a fresh cluster can't deadlock: the 2026-07
# rebuild proved a flat tree wedges (kustomize-controller server-side dry-runs every
# object; any CR with a missing CRD blocks the WHOLE apply, including the HelmReleases
# that would install those CRDs). cluster-infra = operators/CRD providers (wait: true ⇒
# Ready ⇒ CRDs registered); cluster-apps = everything else, dependsOn cluster-infra.
# Substitution precedence (last wins): cluster-settings-generated (TF) → cluster-settings
# (human) → image-versions (release-please-stamped prod pin); keys disjoint by design.
# Injected into the NESTED Kustomizations via the patches block.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infra
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/prod/htz-fsn1/infra
  prune: true
  sourceRef:
    kind: GitRepository
    # Release-pinned (see flux-release.yaml); root flux-system stays on main.
    name: flux-release
    namespace: flux-system
  # The health gate cluster-apps depends on: every nested Kustomization here
  # carries healthChecks on its HelmRelease, so wait covers operator readiness.
  wait: true
  timeout: 10m
  # The nested Kustomization CRs carry ${MANIFEST_SOURCE} refs, so this layer
  # substitutes them itself; the patches block below covers the NESTED layers.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings-generated
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: image-versions
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings-generated
              - kind: ConfigMap
                name: cluster-settings
              - kind: ConfigMap
                name: image-versions
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 1h
  # CRD registration can trail infra Ready (mayastor diskpool CRD is created at
  # startup); without retryInterval a dry-run failure waits the full 1h interval.
  retryInterval: 2m
  dependsOn:
    - name: cluster-infra
  path: ./kubernetes/apps/prod/htz-fsn1
  prune: true
  sourceRef:
    kind: GitRepository
    # Release-pinned (see flux-release.yaml); root flux-system stays on main.
    name: flux-release
    namespace: flux-system
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings-generated
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: image-versions
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings-generated
              - kind: ConfigMap
                name: cluster-settings
              - kind: ConfigMap
                name: image-versions
