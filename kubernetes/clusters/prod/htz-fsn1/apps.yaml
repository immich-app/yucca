# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
# cluster-apps entry point for prod@htz-fsn1. Authored ahead of the cluster (the
# prod Talos/flux stack isn't built yet); activates once that stack provisions
# flux and it syncs kubernetes/clusters/prod/htz-fsn1. Precedence (last wins):
# cluster-settings-generated (TF) -> cluster-settings (human) -> image-versions
# (the committed, CI-promoted prod tag); keys are disjoint by design.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 1h
  # Fast retry: this Kustomization applies CRs (Certificates, Gateways,
  # DiskPools) whose CRDs its own children install — on fresh bootstrap the
  # first apply races them, and without retryInterval a failure waits the
  # full 1h interval.
  retryInterval: 2m
  path: ./kubernetes/apps/prod/htz-fsn1
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings-generated
              - kind: ConfigMap
                name: cluster-settings
              - kind: ConfigMap
                name: image-versions
