---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/dev/local
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: yucca
  dependsOn:
    - name: cluster-repos
