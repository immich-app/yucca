# Canonical SX295 roster for the spice ceph cluster (FSN1-DC24). Source of truth
# for the reprovision driver (rescue/reset/installimage, keyed by server_number)
# and the later networkd fabric config (host_index -> VLAN IPs). Keyed by the
# node's hostname_short (spice-ceph-<name>); mirrors mgmt-hosts.yaml.
#
#   host_index - offset in every cluster VLAN (gateway .1 on the leaf IRB):
#                public 10.40.20.<idx> (VLAN 120), private 10.40.22.<idx> (VLAN 122).
#                mgmt-1/2 hold .2/.3; ceph nodes start at .4.
#   mon        - true on the 5 quorum nodes (roles include "mon").
site_id: 40
cluster_id: 1

