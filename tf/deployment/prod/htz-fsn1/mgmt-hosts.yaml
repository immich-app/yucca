# Canonical mgmt-host roster for htz-fsn1 — the single source of truth consumed by
# BOTH the reprovision stack (mgmt.tf, uses server_number) and the ansible
# inventory render (tf/render/ansible-mgmt, uses everything else).
#
#   site_id        — drives addressing (must match the stack's var.site_id).
#   cluster_id     — the cluster whose public/private VLANs these hosts sit on.
#   host_index     — host's offset within each VLAN /23 (gateway is .1 on the leaf);
#                    .2/.3 here -> 10.40.20.2/.3 (public), 10.40.22.2/.3 (private).
#   fabric_nic     — 25G NIC carrying the tagged VLAN sub-interfaces (verify after
#                    reprovision; predictable name may differ on fresh Debian 13).
#   subnet_router  — advertises the mgmt /24 over Tailscale (exactly one host).
site_id: 40
cluster_id: 1

hosts:
  htz-fsn-mgmt-1:
    server_number: 3008208
    public_ip: 178.63.124.40
    host_index: 2
    fabric_nic: enp33s0f0np0
    subnet_router: true
  htz-fsn-mgmt-2:
    server_number: 3008209
    public_ip: 178.63.124.41
    host_index: 3
    fabric_nic: enp33s0f0np0
    subnet_router: false
