name: yucca-devenv

services:
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server --console-address ":9001" /data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-miniominio}
      _MINIO_DRIVE_ACTIVE_MONITORING: off

  database:
    image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: yucca
    ports:
      - 15432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d yucca']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s

  mock-oidc-provider:
    build:
      context: .
      dockerfile: packages/mock-oidc-provider/Dockerfile
    ports:
      - 8092:80
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/.well-known/openid-configuration > /dev/null']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    ports:
      - 8025:8025

  mock-postmark-provider:
    build:
      context: .
      dockerfile: packages/mock-postmark-provider/Dockerfile
    environment:
      MAILPIT_URL: http://mailpit:8025
    ports:
      - 8093:80
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/health > /dev/null']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest@sha256:6d164540a04f49ba4e696cbdb70f9fee78be1e94b8f2a1292743a0b1ab8275bd
    ports:
      - 8428:8428

  victoria-logs:
    image: docker.io/victoriametrics/victoria-logs:v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e
    ports:
      - 9428:9428
    command: -storageDataPath=victoria-logs-data

  victoria-traces:
    image: docker.io/victoriametrics/victoria-traces:latest@sha256:d42615c458b5698737c33411359012a1136c3f579e4c2516687db2ea7ed08362
    ports:
      - 10428:10428
