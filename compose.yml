name: yucca-devenv

services:
  minio:
    image: quay.io/minio/minio
    volumes:
      - .dev/data/minio:/data
    command: server --console-address ":9001" /data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-miniominio}
      _MINIO_DRIVE_ACTIVE_MONITORING: off

  database:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: yucca
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d yucca']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - 8428:8428

  victoria-logs:
    image: docker.io/victoriametrics/victoria-logs:v1.43.1
    ports:
      - 9428:9428
    command: -storageDataPath=victoria-logs-data

  victoria-traces:
    image: docker.io/victoriametrics/victoria-traces:latest
    ports:
      - 10428:10428
