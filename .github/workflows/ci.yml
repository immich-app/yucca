name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@cd24790a7f5f6439ac32cc94f5523cb2de8bfa8c # use-mise-action-v1.1.0
        env:
          # Token avoids GitHub API rate limits on mise tool downloads (4 parallel jobs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise prepare

      - name: Run checks
        run: mise check

  k8s-validate:
    name: Validate Kubernetes Surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@cd24790a7f5f6439ac32cc94f5523cb2de8bfa8c # use-mise-action-v1.1.0
        env:
          # Token avoids GitHub API rate limits on mise tool downloads (4 parallel jobs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One retry: flux-local fetches third-party charts; a transient network
      # reset shouldn't fail the build.
      - name: Validate charts + Flux tree
        run: mise run k8s:validate || { echo "::warning::k8s:validate failed once (transient chart fetch?); retrying"; mise run k8s:validate; }

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@cd24790a7f5f6439ac32cc94f5523cb2de8bfa8c # use-mise-action-v1.1.0
        env:
          # Token avoids GitHub API rate limits on mise tool downloads (4 parallel jobs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise prepare

      # Stock runner has ~14GB free.
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      # Apps boot on the runner; only infra comes from the cluster.
      - name: Stand up k3d infra
        run: |
          mise k3d:up
          mise tilt:ci-infra

      - name: Run integration tests against the cluster
        run: mise test:integration:k3d

  e2e:
    name: End-to-end Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@cd24790a7f5f6439ac32cc94f5523cb2de8bfa8c # use-mise-action-v1.1.0
        env:
          # Token avoids GitHub API rate limits on mise tool downloads (4 parallel jobs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise prepare

      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      # orchestration-api runs as a separate host process by design.
      - name: Stand up the full k3d stack
        run: |
          mise k3d:up
          mise tilt:ci

      - name: Run end-to-end tests against the cluster
        run: mise test:e2e:k3d
