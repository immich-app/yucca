name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/immich-app/yucca
  # Monotonic monorepo build tag (every app ships together). The staging
  # ResourceSetInputProvider picks the highest 0.0.<n> from GHCR and deploys it
  # in-cluster: pull-based, so CI never needs cluster/Tailscale access.
  BUILD_TAG: 0.0.${{ github.run_number }}

jobs:
  # A migration that sorts before one already executed makes every yucca-api /
  # yucca-admin-api pod crashloop at boot (Kysely refuses the whole set), and
  # the stale-branch case escapes PR CI: checks don't re-run when main moves
  # (incident: #492 merged after #510's re-date). Gate the build on HEAD^ so a
  # bad merge stops here instead of rolling out.
  migration-order:
    name: Migration ordering gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Delivery is main-only: a workflow_dispatch on any other ref would build
    # and tag images (including healed v-tags) from an unmerged tree. Every
    # later job needs this one, so the gate cascades.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: .mise/tasks/yucca-api/check-migration-order HEAD^

  # == Build + push every app image (the ONLY delivery action CI performs) ==
  # Release commits build like any other: they're the stamped tree the release
  # tag points at, and they additionally push v<version> image tags (below).
  build:
    name: Build ${{ matrix.app.name }}
    needs: migration-order
    runs-on: ubuntu-latest
    # The default 360m would hold the workflow concurrency slot long enough to
    # coalesce away a queued release run (see the release-tag step).
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: yucca-api, dockerfile: packages/yucca-api/Dockerfile }
          - { name: yucca-admin-api, dockerfile: packages/yucca-admin-api/Dockerfile }
          - { name: yucca-metrics-worker, dockerfile: packages/yucca-metrics-worker/Dockerfile }
          - { name: futo-backups-bot, dockerfile: packages/futo-backups-bot/Dockerfile }
          - { name: web, dockerfile: packages/web/Dockerfile }
          - { name: michael, dockerfile: packages/michael/Dockerfile }
          - { name: columbo, dockerfile: packages/columbo/Dockerfile }
          - { name: monk, dockerfile: packages/monk/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release commit is the one that moves the stamped root version
      # forward (release-please bumps package.json on the release PR merge
      # alone), so compare against HEAD^ rather than trusting a coalescible
      # head commit message; a bare != would also fire on a revert of the
      # release merge and repush the old release's v-tag from a tree carrying
      # every post-release commit, so a version that did not increase, or a
      # v-tag already on origin pointing at another commit, mints nothing.
      # v<version> is the tag release-please pins into prod's pin files;
      # heal-release below backfills if this run never pushes it, and prod's
      # rollout stalls harmlessly (old pods keep serving) until then.
      - name: Compute release image tag
        id: release
        env:
          APP: ${{ matrix.app.name }}
        run: |
          NEW="$(jq -r .version package.json)"
          OLD="$(git show HEAD^:package.json | jq -r .version)"
          TAG=''
          if [ "$NEW" != "$OLD" ] && [ "$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -n1)" = "$NEW" ]; then
            existing="$(git ls-remote --tags origin "v${NEW}" "v${NEW}^{}")"
            if [ -z "$existing" ] || printf '%s\n' "$existing" | grep -q "^${GITHUB_SHA}"; then
              TAG="${IMAGE_PREFIX}/${APP}:v${NEW}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          # steps.release emits an empty tag when the run is not the release
          # commit; the empty line is filtered out.
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:${{ env.BUILD_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:main
            ${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  # The v-tag push above happens only on the release commit's own run, which
  # queue coalescing can cancel. Backfill from the tagged tree itself: a later
  # main HEAD may already carry post-release commits, so it is never a valid
  # source for v-tag images.
  heal-release:
    name: Heal release image tags
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Find the release tag
        id: tag
        run: |
          V="v$(jq -r .version package.json)"
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null || rc=$?
          case "$rc" in
            0) echo "name=$V" >> "$GITHUB_OUTPUT" ;;
            2) echo "refs/tags/$V is not on origin yet; nothing to heal" ;;
            *) exit "$rc" ;;
          esac

      - name: Checkout release tree
        if: steps.tag.outputs.name
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          path: release-tree
          persist-credentials: false

      - name: Set up Buildx
        if: steps.tag.outputs.name
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: steps.tag.outputs.name
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner injects ACTIONS_RUNTIME_TOKEN/ACTIONS_RESULTS_URL into
      # action steps only, and buildx invoked from run: silently drops
      # type=gha cache without them.
      - name: Expose GitHub runtime for buildx gha cache
        if: steps.tag.outputs.name
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Only a probe that distinguishes absent from broken may trigger a
      # build; any other registry failure must not republish anything. The
      # roster is the build matrix read from this workflow file, so the two
      # cannot drift; an app newer than the release tag has no Dockerfile in
      # the release tree and nothing to heal.
      #
      # Current version only, by design: older releases' images already exist
      # in GHCR and nothing prunes them, so rollback pins stay valid. If a
      # registry cleanup policy ever lands, it must exempt v-tags or this
      # heal grows a version roster.
      - name: Build missing release images from the release tree
        if: steps.tag.outputs.name
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          apps="$(yq '.jobs.build.strategy.matrix.app[].name' .github/workflows/deploy.yml)"
          [ -n "$apps" ] || { echo "::error::no apps parsed from the build matrix"; exit 1; }
          for app in $apps; do
            if [ ! -f "release-tree/packages/${app}/Dockerfile" ]; then
              echo "$app has no Dockerfile in refs/tags/$TAG; skipping"
              continue
            fi
            ref="${IMAGE_PREFIX}/${app}:${TAG}"
            if err=$(docker manifest inspect "$ref" 2>&1 >/dev/null); then
              echo "$ref present"
              continue
            fi
            case "$err" in
              *"manifest unknown"* | *"no such manifest"* | *"not found"*) ;;
              *)
                echo "::error::probe for $ref failed: $err"
                exit 1
                ;;
            esac
            echo "$ref missing; building from refs/tags/$TAG"
            docker buildx build --push \
              --file "release-tree/packages/${app}/Dockerfile" \
              --tag "$ref" \
              --cache-from "type=gha,scope=${app}" \
              --cache-to "type=gha,mode=max,scope=${app}" \
              release-tree
          done

  # Staging deploys automatically: the flux-operator ResourceSetInputProvider in
  # kubernetes/apps/staging/flux-system/ detects the new ${BUILD_TAG} in GHCR and
  # rolls it out in-cluster. Outcome is visible as a GitHub commit status
  # (notification-controller Provider), not as a job here. No GHA step needed.

  # Production promotion is the release-please PR itself: it stamps the new
  # tag into both prod pins (kubernetes/clusters/prod/htz-fsn1/
  # {flux-release,image-versions}.yaml, extra-files), so merging it commits
  # the promotion through normal review: no promote workflow, no bot push to
  # main. Prod Flux pulls the pins from main and the app tree + charts from
  # the tag; images are the v<version> tags pushed by the build job above on
  # that same release commit. Rollback = revert the two stamped lines in a
  # normal PR.
