name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/immich-app/yucca
  # Monotonic monorepo tag (all 5 apps ship together); staging's
  # ResourceSetInputProvider deploys the highest 0.0.<n> from GHCR — pull-based,
  # CI never needs cluster access.
  BUILD_TAG: 0.0.${{ github.run_number }}

jobs:
  # ── Build + push every app image (the ONLY delivery action CI performs) ──
  # Release commits build like any other, plus v<version> image tags (below).
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: yucca-api, dockerfile: packages/yucca-api/Dockerfile }
          - { name: yucca-admin-api, dockerfile: packages/yucca-admin-api/Dockerfile }
          - { name: yucca-metrics-worker, dockerfile: packages/yucca-metrics-worker/Dockerfile }
          - { name: web, dockerfile: packages/web/Dockerfile }
          - { name: michael, dockerfile: packages/michael/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release commits also get v<version> (stamped root package.json) — the tag
      # release-please pins into prod in that very commit. Prod's rollout stalls
      # harmlessly (old pods keep serving) until this pushes; no retag/promote.
      - name: Compute release image tag
        id: release
        if: "startsWith(github.event.head_commit.message, 'chore(main): release')"
        env:
          APP: ${{ matrix.app.name }}
        run: echo "tag=${IMAGE_PREFIX}/${APP}:v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          # The empty line when steps.release is skipped is filtered out.
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:${{ env.BUILD_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:main
            ${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  # Staging deploys itself: the ResourceSetInputProvider in
  # kubernetes/apps/staging/flux-system/ detects the new ${BUILD_TAG} in GHCR and
  # rolls it out; outcome shows as a GitHub commit status (notification-controller
  # Provider), not a job here.

  # Prod promotion = the release-please PR: it stamps the tag into both prod pins
  # (kubernetes/clusters/prod/htz-fsn1/{flux-release,image-versions}.yaml,
  # extra-files) — merging IS the promotion, through normal review. Prod Flux
  # pulls pins from main, app tree + charts from the tag; images are the
  # v<version> tags from the build job on that same release commit. Rollback =
  # revert the two stamped lines in a normal PR.
