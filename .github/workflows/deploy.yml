name: Deploy

on:
  push:
    branches: [main]
    # The gated prod promotion commits the pin back to main; ignore that path
    # so it can't retrigger the workflow (it's also marked [skip ci]).
    paths-ignore:
      - kubernetes/clusters/prod/htz-fsn1/image-versions.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/immich-app/yucca
  # Monotonic monorepo build tag (all 5 apps ship together). The staging
  # ResourceSetInputProvider picks the highest 0.0.<n> from GHCR and deploys it
  # in-cluster — pull-based, so CI never needs cluster/Tailscale access.
  BUILD_TAG: 0.0.${{ github.run_number }}

jobs:
  # ── Build + push every app image (the ONLY delivery action CI performs) ──
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: yucca-api, dockerfile: packages/yucca-api/Dockerfile }
          - { name: yucca-admin-api, dockerfile: packages/yucca-admin-api/Dockerfile }
          - { name: yucca-metrics-worker, dockerfile: packages/yucca-metrics-worker/Dockerfile }
          - { name: web, dockerfile: packages/web/Dockerfile }
          - { name: michael, dockerfile: packages/michael/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:${{ env.BUILD_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}:main
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  # Staging deploys automatically: the flux-operator ResourceSetInputProvider in
  # kubernetes/apps/staging/flux-system/ detects the new ${BUILD_TAG} in GHCR and
  # rolls it out in-cluster. Outcome is visible as a GitHub commit status
  # (notification-controller Provider), not as a job here. No GHA step needed.

  # Production promotion moved to release-promote.yml: it fires on
  # release-please `release published`, retags the validated sha images with
  # the release tag, and (behind the `production` Environment gate) pins both
  # YUCCA_IMAGE_TAG and the flux-release GitRepository tag via
  # .github/scripts/promote-prod.sh.
