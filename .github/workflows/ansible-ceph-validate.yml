name: ansible-ceph-validate

# Static gate for ansible/ceph (yamllint + ansible-lint + shellcheck +
# syntax-check; no secrets, no host connection). ci.yml validates only the k8s
# surface — without this, a broken playbook/host_var/script first executes during
# the post-merge PROD apply against real nodes. Own workflow (not a ci.yml job)
# so the on.paths filter stays workflow-scoped instead of gating all of ci.yml.

on:
  pull_request:
    paths:
      - 'ansible/ceph/**'
      - '.github/workflows/ansible-ceph-validate.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/ceph/**'
      - '.github/workflows/ansible-ceph-validate.yml'

# Read-only: no token writes, no deploy credentials, no 1Password.
permissions:
  contents: read

concurrency:
  group: ansible-ceph-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ansible/ceph (lint + syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ansible/ceph
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@cd24790a7f5f6439ac32cc94f5523cb2de8bfa8c # use-mise-action-v1.1.0
        env:
          # Token avoids GitHub API rate limits on mise tool downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trust the nested ansible/ceph/.mise.toml + its pinned Python (3.12); the
      # use-mise action only installs root tools, and the ceph config is only
      # picked up here where cwd is ansible/ceph.
      - name: Trust and install mise tools
        run: |
          mise trust --all
          mise install

      # .venv as `mise run setup` builds it: requirements.txt (ansible-core,
      # ansible-lint, yamllint) + galaxy collections (ansible.posix,
      # community.general) that lint/syntax-check need. PyPI + Galaxy only.
      - name: Install ansible tooling
        run: mise run setup

      # No live inventory or secrets needed; shellcheck ships on ubuntu-latest.
      - name: Lint (yamllint + ansible-lint + shellcheck)
        run: mise run lint

      # syntax-check needs *an* inventory but the real one is TF-generated and
      # gitignored; any valid one works (it only parses structure), so point
      # CEPH_ENV (honoured by ceph:check) at a throwaway localhost inventory.
      # Never connects to a host.
      - name: Syntax-check playbooks
        env:
          CEPH_ENV: /tmp/ci-inventory.ini
        run: |
          printf '[all]\nlocalhost ansible_connection=local\n' > /tmp/ci-inventory.ini
          mise run check

      # Byte-compile helper scripts (incl. roles/*/files/*.py, which ship to the
      # nodes via ansible.builtin.script) so syntax errors fail here, not mid-converge.
      - name: Compile Python scripts
        run: |
          mise exec -- python -m py_compile \
            $(find scripts roles -name '*.py' -not -path '*/__pycache__/*')
