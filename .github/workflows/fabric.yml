name: Fabric (Junos/NetBox)

# Manages the prod switch fabric with the vendored JTAF junos-qfx provider (built
# in CI) + the netbox provider. Fans out over every site under tf/deployment/prod/*:
#   Plan on PRs; apply on merge to main, each site behind its own
#   `prod-fabric-<site>` Environment gate (required reviewers).
# The runner joins the tailnet to reach the switch vme IPs and renders the NETCONF
# key from 1Password (the fabric:* mise tasks; FABRIC_SITE selects the stack).
#
# Prerequisites (out-of-band):
#   - Repo secrets: OP_TF_YUCCA_PROD_ENV (+ _WRITE); TS_OAUTH_CLIENT_ID/SECRET.
#   - 1P items: NET_SWITCHES_TERRAFORM_SSH_PRIVATE_KEY (yucca_tf_prod), NETBOX_API_TOKEN (yucca_tf).
#   - One GitHub Environment per site: `prod-fabric-<site>` with required reviewers.

on:
  push:
    branches: [main]
    paths: &fabric_paths
      - "tf/providers/**"
      - "tf/shared/modules/fabric-**"
      - "tf/shared/modules/core-fabric/**"
      - "tf/shared/modules/cluster-fabric/**"
      - "tf/deployment/prod/**"
      - ".github/workflows/fabric.yml"
  pull_request:
    paths: *fabric_paths
  workflow_dispatch:

# No state locking on the OVH backend — never apply concurrently.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover sites
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sites.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: sites
        name: List tf/deployment/prod/* sites
        run: |
          matrix=$(ls -d tf/deployment/prod/*/ | xargs -n1 basename | jq -R . | jq -cs '{site: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  plan:
    name: Plan ${{ matrix.site }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TF_YUCCA_PROD_ENV }}
      FABRIC_SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up mise (go + opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:project-yucca
      - name: Fabric plan
        run: mise run fabric:plan -- --non-interactive

  apply:
    name: Apply ${{ matrix.site }} (gated)
    needs: [discover, plan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Site-scoped gate: each site's prod fabric has its own required reviewers.
    environment:
      name: prod-fabric-${{ matrix.site }}
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TF_YUCCA_PROD_ENV_WRITE }}
      FABRIC_SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up mise (go + opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:project-yucca
      - name: Fabric apply
        run: mise run fabric:apply -- --non-interactive -auto-approve
