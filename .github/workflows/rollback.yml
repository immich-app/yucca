name: Rollback prod

# Surgical prod rollback: re-point any subset of apps (or the manifest tree)
# at any previously deployed v1.0.<n> tag by writing one commit to the
# deploy/prod pin branch. No rebuild, no staging pass, no waiting behind the
# Deploy queue — this workflow deliberately does NOT share Deploy's
# concurrency group so an emergency rollback runs immediately (the pin script
# retries if it races a concurrent deploy's push).
#
# Examples:
#   tag=v1.0.42 scope=all                 -> whole prod back to v1.0.42
#   tag=v1.0.42 scope=michael             -> only michael's image
#   tag=v1.0.42 scope=yucca-api,web       -> those two images
#   tag=v1.0.42 scope=manifests           -> only the manifest/chart tree
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Previously deployed prod tag to roll back to (e.g. v1.0.42)
        required: true
      scope:
        description: 'all, or csv of: yucca-api,yucca-admin-api,yucca-metrics-worker,web,michael,manifests'
        required: true
        default: all

permissions: {}

env:
  IMAGE_PREFIX: ghcr.io/immich-app/yucca
  TAG: ${{ inputs.tag }}
  SCOPE: ${{ inputs.scope }}

jobs:
  rollback:
    name: Roll prod back to ${{ inputs.tag }} (${{ inputs.scope }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create push token
        id: token
        uses: immich-app/devtools/actions/create-workflow-token@9db058b2e6eec20e07760b0e17a0505c78ec3191 # create-workflow-token-action-v2.0.1
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true

      # Fail closed before touching the pin: the git tag must exist (it is the
      # manifest pin) and every targeted app image must exist under it.
      - name: Validate rollback target
        run: |
          set -euo pipefail
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null \
            || { echo "::error::git tag ${TAG} does not exist — was it ever deployed?"; exit 1; }
          apps="yucca-api yucca-admin-api yucca-metrics-worker web michael"
          if [ "${SCOPE}" != "all" ]; then
            apps=$(echo "${SCOPE}" | tr ',' ' ' | sed 's/manifests//g')
          fi
          for app in ${apps}; do
            docker buildx imagetools inspect "${IMAGE_PREFIX}/${app}:${TAG}" >/dev/null \
              || { echo "::error::${IMAGE_PREFIX}/${app}:${TAG} not found in GHCR"; exit 1; }
            echo "ok: ${app}:${TAG}"
          done

      - name: Write the rollback pin
        run: ./.github/scripts/write-prod-pin.sh rollback "${TAG}" "${SCOPE}"

      # Commit statuses for the rolled-back sha are already green from its
      # original deploy, so status-polling can't confirm THIS reconcile.
      # TODO: assert the served version via the prod domain once the apps
      # expose their build tag; until then, watch Flux/the cluster directly.
      - name: Note
        run: echo "Pin written — prod Flux reconciles within ~1m. Verify the rollout in-cluster or via the prod-htz-fsn1 statuses."
