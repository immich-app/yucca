name: Release promote

# Production promotion, driven by release-please releases. When a release is
# published (or on manual dispatch with a tag):
#   1. retag — the release commit's already-built `sha-<sha>` app images (they
#      were built + staging-validated when the release PR merged) get the
#      release tag, so prod images carry the release-please version.
#   2. promote (GATED behind the `production` Environment) — commit the pin to
#      main: YUCCA_IMAGE_TAG + the flux-release GitRepository tag. Prod's Flux
#      pulls both; manifests, charts, and images all move together per release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote (e.g. v0.13.0)
        required: true

permissions: {}

env:
  IMAGE_PREFIX: ghcr.io/immich-app/yucca
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  retag:
    name: Retag images to ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release commit
        run: git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Retag release images
        run: |
          set -euo pipefail
          sha=$(git rev-list -n1 "refs/tags/${TAG}")
          echo "release ${TAG} -> ${sha}"
          apps=(yucca-api yucca-admin-api yucca-metrics-worker web michael)
          # The deploy workflow builds sha-<sha> on the release PR's merge
          # commit; it may still be running when the release publishes. Wait.
          for app in "${apps[@]}"; do
            src="${IMAGE_PREFIX}/${app}:sha-${sha}"
            for i in $(seq 1 60); do
              docker buildx imagetools inspect "$src" >/dev/null 2>&1 && break
              [ "$i" = 60 ] && { echo "::error::${src} never appeared (deploy build failed?)"; exit 1; }
              echo "waiting for ${src} (${i}/60)"; sleep 30
            done
            docker buildx imagetools create -t "${IMAGE_PREFIX}/${app}:${TAG}" "$src"
            echo "tagged ${app}:${TAG}"
          done

  promote:
    name: Promote production
    needs: retag
    runs-on: ubuntu-latest
    # The `production` Environment's required-reviewers rule = the approval gate.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Create push token
        id: token
        uses: immich-app/devtools/actions/create-workflow-token@9db058b2e6eec20e07760b0e17a0505c78ec3191 # create-workflow-token-action-v2.0.1
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true

      - name: Pin production to the release
        run: ./.github/scripts/promote-prod.sh "$TAG"
