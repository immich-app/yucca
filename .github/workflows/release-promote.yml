name: Release promote

# Production promotion. The gate IS the release-please PR merge: when the
# release publishes, this workflow (1) retags the already-built, already-
# staging-validated images of the release's parent commit with the release tag
# (a manifest copy — nothing is rebuilt), and (2) commits the prod pin to main
# (flux-release GitRepository tag + YUCCA_IMAGE_TAG). Prod's Flux pulls it.
#
# The release commit only touches changelog/version bookkeeping, so its app
# tree is identical to its parent — whose sha-<sha> images exist (deploy.yml
# skips building release commits). workflow_dispatch is the ROLLBACK lever:
# re-promote any older tag (its images already carry the tag; retag no-ops).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote (e.g. v0.13.0) — rollback lever
        required: true

permissions: {}

env:
  IMAGE_PREFIX: ghcr.io/immich-app/yucca
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  promote:
    name: Promote ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }} to production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create push token
        id: token
        uses: immich-app/devtools/actions/create-workflow-token@9db058b2e6eec20e07760b0e17a0505c78ec3191 # create-workflow-token-action-v2.0.1
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag release images (manifest copy, no rebuild)
        run: |
          set -euo pipefail
          git fetch --depth=2 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          # The release commit's app tree == its parent's; the parent's images
          # were built on its own main push and validated in staging.
          sha=$(git rev-parse "${TAG}^")
          echo "release ${TAG} -> images of ${sha}"
          for app in yucca-api yucca-admin-api yucca-metrics-worker web michael; do
            dst="${IMAGE_PREFIX}/${app}:${TAG}"
            if docker buildx imagetools inspect "$dst" >/dev/null 2>&1; then
              echo "${app}:${TAG} already exists (rollback re-promotion); skipping"
              continue
            fi
            src="${IMAGE_PREFIX}/${app}:sha-${sha}"
            # Tolerate a release PR merged seconds after its parent: the parent
            # build may still be finishing. Short poll, then fail closed.
            for i in $(seq 1 20); do
              docker buildx imagetools inspect "$src" >/dev/null 2>&1 && break
              [ "$i" = 20 ] && { echo "::error::${src} not found — did the parent commit's build fail?"; exit 1; }
              echo "waiting for ${src} (${i}/20)"; sleep 30
            done
            docker buildx imagetools create -t "$dst" "$src"
            echo "tagged ${app}:${TAG}"
          done

      - name: Pin production to the release
        run: ./.github/scripts/promote-prod.sh "$TAG"
