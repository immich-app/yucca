name: dashboards

# Package the Grafana dashboards (dashboards/*.json) as a single OCI artifact
# and push to GHCR. o11y's grafana-operator imports them via GrafanaDashboard
# CRs (spec.oci.reference + per-file path) — see dashboards/README.md.
on:
  push:
    branches: [main]
    paths:
      - dashboards/**
      - .github/workflows/dashboards.yml
  pull_request:
    paths:
      - dashboards/**
      - .github/workflows/dashboards.yml
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/immich-app/yucca/dashboards

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate dashboard JSON
        run: |
          set -euo pipefail
          for f in dashboards/*.json; do
            jq -e '.uid and .title and (.panels | length > 0)' "$f" >/dev/null \
              || { echo "::error file=$f::invalid dashboard (needs uid, title, panels)"; exit 1; }
            # File name must match the uid — the GrafanaDashboard CRs reference
            # <uid>.json as the in-artifact path.
            uid=$(jq -r .uid "$f")
            [ "dashboards/${uid}.json" = "$f" ] \
              || { echo "::error file=$f::file name must be <uid>.json (uid=$uid)"; exit 1; }
          done
          echo "validated: $(ls dashboards/*.json | wc -l) dashboards"

  push:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push dashboards artifact
        env:
          BUILD_TAG: 0.0.${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dashboards
          files=()
          for f in *.json; do files+=("${f}:application/json"); done
          oras push "${IMAGE}:${BUILD_TAG}" \
            --artifact-type application/vnd.grafana.dashboard+json \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${SHA}" \
            "${files[@]}"
          oras tag "${IMAGE}:${BUILD_TAG}" "sha-${SHA}" latest
