name: s3-dns-roster-validate

# Static gate: the prod S3 RGW DNS endpoint (the A-records for
# s3.prod.fsn1.htz.futo.cloud + the wildcard, in tf/deployment/prod/global/dns)
# must resolve to exactly the single health-checked Ceph ingress VIP (haproxy +
# keepalived), not a stale multi-value node roster. If a name stops resolving to
# the expected VIP (typo, leftover round-robin values, apex/wildcard disagreeing)
# the endpoint blackholes or splits. Without this gate the mismatch first surfaces
# in production, after the DNS apply.
#
# tf/scripts/check-s3-dns-roster.py asserts both S3 names resolve to exactly the
# expected VIP (EXPECTED_VIP constant = ansible ceph_rgw_ingress_vip) and fails on
# any divergence. Credential-free and stdlib-only: no remote state, no provider,
# no 1Password, no host connection.
#
# Its own workflow (not a job in infra.yml or ci.yml) so the path filter below is
# workflow-scoped: it fires only when the DNS records or the check itself change,
# mirroring ansible-ceph-validate.yml.

on:
  pull_request:
    paths: &paths
      - 'tf/deployment/prod/global/dns/records.auto.tfvars'
      - 'tf/scripts/check-s3-dns-roster.py'
      - '.github/workflows/s3-dns-roster-validate.yml'
  push:
    branches: [main]
    paths: *paths

# Read-only: checkout only. No writes through the token, no deploy credentials,
# no 1Password.
permissions:
  contents: read

concurrency:
  group: s3-dns-roster-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check S3 DNS endpoint vs ceph ingress VIP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      # Stdlib-only Python; ubuntu-latest ships python3. No mise/tool install
      # needed, so this gate stays fast and dependency-free.
      - name: Roster drift check
        run: tf/scripts/check-s3-dns-roster.py
