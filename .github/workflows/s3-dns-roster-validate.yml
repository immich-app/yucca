name: s3-dns-roster-validate

# The prod S3 DNS roster (tf/deployment/prod/global/dns) is a hand-maintained
# round-robin over in-service spice nodes' fabric IPs with no link to the ceph
# stack — a node add/replace/remove can silently blackhole the endpoint or drop
# capacity. tf/scripts/check-s3-dns-roster.py rebuilds the expected roster from the
# ceph source of truth (clusters.auto.tfvars + spice-hosts.yaml) and fails on
# divergence. Own workflow so the path filter stays workflow-scoped.

on:
  pull_request:
    paths: &paths
      - 'tf/deployment/prod/global/dns/records.auto.tfvars'
      - 'tf/deployment/prod/htz-fsn1/ceph/clusters.auto.tfvars'
      - 'tf/deployment/prod/htz-fsn1/ceph/spice-hosts.yaml'
      - 'tf/scripts/check-s3-dns-roster.py'
      - '.github/workflows/s3-dns-roster-validate.yml'
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: s3-dns-roster-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check S3 DNS roster vs ceph node roster
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      # Stdlib-only; ubuntu-latest ships python3 — no mise/tool install needed.
      - name: Roster drift check
        run: tf/scripts/check-s3-dns-roster.py
