name: Infra (Terraform)

# Applies the Terragrunt stacks from CI, path-scoped so each partition only runs
# when its own files change. Connectivity to the bare-metal/private nodes is over
# the NetBird overlay (Tailscale fully retired).
#
# Topology model: partition (prod | staging | dev) → region (htz-fsn1, austin,
# local, plus the reserved `global` pseudo-region for partition-wide stacks) →
# stack. Stacks live at tf/deployment/<partition>/<region>/<stack>/terragrunt.hcl
# (e.g. staging/austin/ceph, staging/global/{dns,netbird}, prod/htz-fsn1/{fabric,
# netbird}, prod/global). A single `discover` job scans that tree into a matrix of
# {partition, region, stack, dir, order}, so adding a stack/region needs no
# workflow edit — only its terragrunt.hcl and a matching GitHub Environment.
#
# Per-partition selection (Actions can't index secrets dynamically, hence the
# ternaries):
#   - staging: SA secrets OP_TF_YUCCA_STAGING_ENV(_WRITE), env-file tf/.env.
#   - prod:    SA secrets OP_TF_YUCCA_PROD_ENV(_WRITE), env-file tf/.env.prod.
#     The prod `fabric` stack applies with the READ SA and self-escalates to the
#     write SA in-vault via `mise run infra:apply`; the prod netbird stacks
#     (global + site) apply with the WRITE SA directly.
#   - dev is local-only (no remote state, no CI service account) → never emitted.
#
# Apply ordering (preserved via a per-entry `order` + max-parallel: 1 on a sorted
# matrix): global-region stacks first (account NetBird + DNS), then site NetBird,
# then node-touching stacks (ceph/talos/fabric). NetBird must precede the
# node-touching stacks because it mints the CI setup key into 1Password and
# advertises the node subnets the overlay-joining jobs reach; prod/global must
# precede prod/htz-fsn1/netbird (a real terragrunt dependency).
#
# The two post-apply Ansible converges are gated independently of their TF apply.
# They differ by blast radius:
#   - ceph (full baseline -> tune -> deploy -> harden against a LIVE bare-metal
#     cluster) is DELIBERATE: it runs ONLY on workflow_dispatch with
#     run_ceph_ansible=true, targeting the single cluster named by the
#     ceph_cluster input (spice = prod/htz-fsn1, sietch = staging/austin). A push
#     NEVER converges a ceph cluster, so merging a ceph change (prod- or
#     staging-scoped) can never auto-run an Ansible converge on a live cluster.
#   - mgmt (mgmt hosts on the fabric stack) still auto-runs on push when its own
#     surface changed (ansible/mgmt/** + tf/render/ansible-mgmt/** +
#     .mise/tasks/mgmt/**), and on workflow_dispatch when run_mgmt_ansible is set.
# A pure-Terraform change to either stack thus applies without reconverging the
# nodes, and the matching overlay join is skipped with it.
#
# The fabric (switch) apply is gated the same way: on push it applies only when the
# fabric surface changed (tf/deployment/prod/htz-fsn1/fabric/**, the fabric shared
# modules, tf/providers/**, .mise/tasks/{fabric,infra}/**), and on workflow_dispatch
# only when the run_fabric toggle is set (default off). So an unrelated prod change
# (or a bare dispatch) no longer re-applies the switches; its overlay join is skipped
# too unless the mgmt converge needs it.
#
# Environment gates rekey to <partition>-<region> (one per stack's region):
# staging-austin, staging-global, prod-global, prod-htz-fsn1. Each matrix apply
# entry references its own gate. GitHub does NOT hang on an unprovisioned
# Environment -- it auto-creates it on first reference with ZERO protection
# rules, so a brand-new <partition>-<region> would apply with -auto-approve and
# no required reviewer (fail OPEN). Two things close that hole:
#   1. The Environments are managed as code (tf/deployment/_meta/github, the
#      integrations/github provider: github_repository_environment + required
#      reviewers) so every gate exists WITH reviewers by construction.
#   2. The `discover` job FAILS CLOSED (see the "required reviewers" step): it
#      queries each emitted <partition>-<region> Environment and refuses to
#      proceed unless it already carries at least one required reviewer. The gate
#      never depends on the Environment merely existing.
#
# Prerequisites (provisioned out-of-band):
#   - Repo secrets: OP_TF_YUCCA_STAGING_ENV (+ _WRITE); OP_TF_YUCCA_PROD_ENV
#     (read) + OP_TF_YUCCA_PROD_ENV_WRITE (netbird apply / write escalation source).
#   - GitHub Environments with required reviewers: staging-austin, staging-global,
#     prod-global, prod-htz-fsn1.
#   - BOOTSTRAP — the netbird stacks applied ONCE out-of-band so the CI/mgmt setup
#     keys exist in 1P before anything tries to connect (CI can't mint them itself:
#     the apply that mints them is gated behind the plan that needs them). E.g.:
#       OP_SERVICE_ACCOUNT_TOKEN=<staging write SA> \
#         tf/op-run.sh terragrunt --working-dir tf/deployment/staging/global/netbird apply
#     (staging: NETBIRD_YUCCA_STAGING_CI_SETUP_KEY — partition-scoped, minted by the
#     account/global netbird; prod: NETBIRD_YUCCA_PROD_<REGION>_* — region-scoped,
#     minted by the per-site netbird). Also: NetBird routes advertising the node
#     subnets (staging 10.10.10.0/24; prod the site subnets via the mgmt peers).
#   - 1P items: NET_SWITCHES_TERRAFORM_SSH_PRIVATE_KEY (yucca_tf_prod),
#     NETBOX_API_TOKEN (yucca_tf), HETZNER_WEBSERVICE_API_USER/PASSWORD (yucca_tf_prod).

on:
  push:
    branches: [main]
    paths: &paths
      - 'tf/**'
      - 'ansible/mgmt/**'
      - 'ansible/ceph/**'
      - '.mise/tasks/**'
      - '.mise/config.toml'
      - '.github/actions/netbird-connect/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      run_ceph_ansible:
        description: 'Run the Ceph Ansible converge (full pipeline) against ceph_cluster'
        type: boolean
        default: false
      ceph_cluster:
        description: 'Ceph cluster the converge targets (only used when run_ceph_ansible is true)'
        type: choice
        options:
          - sietch
          - spice
        default: sietch
      run_mgmt_ansible:
        description: 'Run the mgmt Ansible converge after the fabric apply'
        type: boolean
        default: false
      run_fabric:
        description: 'Apply the fabric (switch) stack'
        type: boolean
        default: false

# Serialize: the OVH S3 backend has no state locking (single-operator model),
# so never let two infra runs apply concurrently. This workflow-wide concurrency
# group IS the single-operator assertion that stands in for a backend lock: at
# most one infra run holds it at a time, and cancel-in-progress:false lets a
# running apply finish rather than being interrupted mid-state-write.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Which partitions changed? Partition-keyed; `shared` forces all. ──────────
  changes:
    name: Detect changes
    # Skip on fork PRs (no access to secrets / the overlay anyway).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      staging: ${{ steps.filter.outputs.staging }}
      prod: ${{ steps.filter.outputs.prod }}
      dev: ${{ steps.filter.outputs.dev }}
      shared: ${{ steps.filter.outputs.shared }}
      # Mgmt Ansible-converge gate: isolate the mgmt Ansible surface so a
      # pure-Terraform change to the fabric stack applies without reconverging the
      # mgmt hosts. (The ceph converge is workflow_dispatch-only -- no push gate.)
      ansible_mgmt: ${{ steps.filter.outputs.ansible_mgmt }}
      # Fabric-apply gate: the fabric (switch) stack applies only when its own
      # surface changed — not on every prod change.
      fabric: ${{ steps.filter.outputs.fabric }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            staging:
              - 'tf/deployment/staging/**'
              # Only staging's own ceph inventory activates the staging matrix.
              # A prod ceph change (or a shared ceph role/play) must NEVER open
              # the staging partition -- see DEFECT 3. The ceph Ansible converge
              # itself is workflow_dispatch-only regardless (no push converge).
              - 'ansible/ceph/inventories/staging-**'
            prod:
              - 'tf/deployment/prod/**'
              - 'ansible/mgmt/**'
              - 'ansible/ceph/inventories/prod-**'
              - 'tf/render/**'
              - 'tf/providers/**'
              - '.mise/tasks/infra/**'
              - '.mise/tasks/fabric/**'
              - '.mise/tasks/mgmt/**'
            dev:
              # Local-only (k3d/Tilt): emits no CI stacks, kept for completeness so
              # a `shared` force still reasons about every partition uniformly.
              - 'tf/deployment/dev/**'
            shared:
              # Cross-partition surfaces — a hit forces every partition's matrix.
              - 'tf/shared/**'
              - 'tf/op-run.sh'
              - '.mise/config.toml'
              - '.github/actions/netbird-connect/**'
              - '.github/workflows/infra.yml'
            # -- Mgmt Ansible-converge gate (stack-step level, not partition) --
            # Does not open/close a partition's matrix; the apply job uses it to
            # decide whether to run the post-apply mgmt converge for the fabric
            # stack. (There is no ceph equivalent: the ceph converge is
            # workflow_dispatch-only, so it needs no push paths-filter.)
            ansible_mgmt:
              - 'ansible/mgmt/**'
              - 'tf/render/ansible-mgmt/**'
              - '.mise/tasks/mgmt/**'
            # ── Fabric-apply gate (stack-step level) ──
            # The fabric stack + the shared modules/providers/tasks it consumes.
            # A hit means the switch config (or its plumbing) changed → apply it.
            fabric:
              - 'tf/deployment/prod/htz-fsn1/fabric/**'
              - 'tf/shared/modules/core-fabric/**'
              - 'tf/shared/modules/cluster-fabric/**'
              - 'tf/shared/modules/fabric-login/**'
              - 'tf/shared/modules/fabric-addressing/**'
              - 'tf/shared/modules/fabric-netbox/**'
              - 'tf/shared/modules/identity/**'
              - 'tf/providers/**'
              - '.mise/tasks/fabric/**'
              - '.mise/tasks/infra/**'

  # ── Discover the stack matrix from the deployment tree ───────────────────────
  discover:
    name: Discover stacks
    needs: changes
    if: >-
      needs.changes.outputs.staging == 'true'
      || needs.changes.outputs.prod == 'true'
      || needs.changes.outputs.shared == 'true'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      has_stacks: ${{ steps.gen.outputs.has_stacks }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: gen
        name: Build {partition, region, stack} matrix for the changed partitions
        env:
          STAGING: ${{ needs.changes.outputs.staging }}
          PROD: ${{ needs.changes.outputs.prod }}
          SHARED: ${{ needs.changes.outputs.shared }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          # Dispatch scoping: a manual run only touches the partition(s) its
          # toggles actually act on, instead of forcing BOTH partitions active.
          DISPATCH_CEPH: ${{ inputs.run_ceph_ansible }}
          DISPATCH_MGMT: ${{ inputs.run_mgmt_ansible }}
          DISPATCH_FABRIC: ${{ inputs.run_fabric }}
          CEPH_CLUSTER: ${{ inputs.ceph_cluster }}
        run: |
          set -euo pipefail

          # Active partitions: own filter OR a shared force. dev is local-only and
          # never emitted (no remote state / no CI SA).
          declare -A active=()
          if [ "$DISPATCH" = "true" ]; then
            # Manual run: scope to the partition each requested action touches.
            #   - ceph converge -> the partition owning the chosen cluster
            #     (spice = prod, sietch = staging)
            #   - mgmt converge / fabric apply -> prod (htz-fsn1 only)
            # A BARE dispatch (no toggle set) is a plan-only preview: emit both
            # partitions so the operator sees every diff, but the apply job is
            # skipped entirely (see its `if:`), so nothing applies unreviewed.
            if [ "$DISPATCH_CEPH" = "true" ]; then
              case "$CEPH_CLUSTER" in
                spice)  active[prod]=1 ;;
                sietch) active[staging]=1 ;;
                *) echo "unknown ceph_cluster: '$CEPH_CLUSTER'" >&2; exit 1 ;;
              esac
            fi
            [ "$DISPATCH_MGMT" = "true" ] && active[prod]=1
            [ "$DISPATCH_FABRIC" = "true" ] && active[prod]=1
            if [ "${#active[@]}" -eq 0 ]; then
              active[staging]=1; active[prod]=1   # bare dispatch = plan-only preview
            fi
          elif [ "$SHARED" = "true" ]; then
            active[staging]=1; active[prod]=1
          else
            [ "$STAGING" = "true" ] && active[staging]=1
            [ "$PROD" = "true" ] && active[prod]=1
          fi

          entries=()
          while IFS= read -r tg; do
            rel=${tg#tf/deployment/}
            rel=${rel%/terragrunt.hcl}
            [ "$rel" = "terragrunt.hcl" ] && continue   # repo-root parent config
            IFS=/ read -r -a segs <<< "$rel"
            [ "${#segs[@]}" -ge 2 ] || continue
            partition=${segs[0]}
            region=${segs[1]}
            if [ "${#segs[@]}" -ge 3 ]; then
              stack=$(IFS=/; echo "${segs[*]:2}")       # nested sub-stacks keep working
            else
              stack=$region                              # n==2 transition guard (e.g. prod/global)
            fi
            [ -n "${active[$partition]:-}" ] || continue

            # Apply ordering: global-region stacks (account netbird/dns) first,
            # then site netbird, then node-touching stacks (ceph/talos/fabric).
            if [ "$region" = "global" ]; then order=0
            elif [ "$stack" = "netbird" ]; then order=1
            else order=2; fi

            entries+=("$(jq -nc \
              --arg p "$partition" --arg r "$region" --arg s "$stack" \
              --arg d "$rel" --argjson o "$order" \
              '{partition:$p,region:$r,stack:$s,dir:$d,order:$o}')")
          done < <(find tf/deployment -mindepth 2 -name terragrunt.hcl -type f | sort)

          if [ "${#entries[@]}" -eq 0 ]; then
            include='[]'
          else
            include=$(printf '%s\n' "${entries[@]}" | jq -s 'sort_by(.order, .dir)')
          fi
          matrix=$(jq -nc --argjson inc "$include" '{include:$inc}')
          has=$([ "$(jq 'length' <<<"$include")" -gt 0 ] && echo true || echo false)

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_stacks=$has" >> "$GITHUB_OUTPUT"
          echo "Discovered stacks:"; echo "$include" | jq -r '.[] | "  [\(.order)] \(.partition)@\(.region)/\(.stack)  (\(.dir))"'

      # -- FAIL CLOSED on the approval gate --------------------------------
      # GitHub auto-creates a referenced Environment with NO protection rules, so
      # `environment: <partition>-<region>` alone does NOT guarantee a required
      # reviewer. Assert here (before any plan/apply) that every emitted gate
      # already carries at least one required reviewer; refuse to proceed if not.
      # Any API error (missing env, unreadable, no token) is treated as UNPROTECTED
      # -> the run fails. The Environments themselves are managed as code in
      # tf/deployment/_meta/github (github_repository_environment + reviewers).
      #
      # Reading required_reviewers needs a token with repo-admin/Environments read;
      # the built-in GITHUB_TOKEN cannot see protection rules. Provide a
      # fine-grained PAT / GitHub App token as the GH_ENV_ADMIN_TOKEN secret
      # (Environments: read). Absent it, this step fails closed (blocks), which is
      # the intended safe default. See operator TODO in tf/deployment/_meta/github.
      - name: Fail closed unless every target Environment has required reviewers
        if: steps.gen.outputs.has_stacks == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_ENV_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MATRIX: ${{ steps.gen.outputs.matrix }}
        run: |
          set -euo pipefail
          envs=$(jq -r '.include[] | "\(.partition)-\(.region)"' <<<"$MATRIX" | sort -u)
          [ -n "$envs" ] || { echo "No environments to verify."; exit 0; }
          fail=0
          while IFS= read -r envname; do
            [ -n "$envname" ] || continue
            if ! resp=$(gh api "repos/$REPO/environments/$envname" 2>/dev/null); then
              echo "FAIL-CLOSED: environment '$envname' is missing or unreadable -> treated as unprotected." >&2
              fail=1; continue
            fi
            n=$(jq '[.protection_rules[]? | select(.type=="required_reviewers") | .reviewers[]?] | length' <<<"$resp")
            if [ "${n:-0}" -lt 1 ]; then
              echo "FAIL-CLOSED: environment '$envname' has no required reviewers (approval gate would fail open)." >&2
              fail=1
            else
              echo "OK: environment '$envname' has ${n} required reviewer(s)."
            fi
          done <<<"$envs"
          [ "$fail" -eq 0 ] || {
            echo "One or more target Environments lack a required reviewer; refusing to plan/apply (fail closed)." >&2
            exit 1
          }

  # ── Plan every changed stack (parallel; read-only) ───────────────────────────
  plan:
    name: Plan ${{ matrix.partition }}@${{ matrix.region }}/${{ matrix.stack }}
    needs: [changes, discover]
    if: needs.discover.outputs.has_stacks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      # Read-scoped SA + env-file by partition.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ matrix.partition == 'prod' && secrets.OP_TF_YUCCA_PROD_ENV || secrets.OP_TF_YUCCA_STAGING_ENV }}
      OP_ENV_FILE: ${{ matrix.partition == 'prod' && 'tf/.env.prod' || 'tf/.env' }}
      SITE: ${{ matrix.region }}
      REGION: ${{ matrix.region }}
      PARTITION: ${{ matrix.partition }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Filesystem-safe artifact id for this stack (stack may nest '/').
      - id: planid
        name: Compute plan artifact id
        env:
          DIR: ${{ matrix.dir }}
        run: echo "id=$(printf '%s' "$DIR" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Set up mise (go + opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

      # Guardrail: prod Flux must sync `main` once we're ON main. flux_git_ref
      # defaults to a feature branch during bring-up (deliberate, documented
      # TEMPORARY); merging that branch without flipping the default would leave
      # production reconciling a stale/deleted ref forever. Runs on every plan of
      # the prod talos stack so the failure shows up in the PR's merge queue too.
      - name: Guard prod flux_git_ref
        if: matrix.stack == 'talos' && matrix.partition == 'prod' && github.ref == 'refs/heads/main'
        env:
          STACK_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          vars="tf/deployment/$STACK_DIR/variables.tf"
          # The default lives in the flux_git_ref variable block.
          if ! awk '/variable "flux_git_ref"/,/^}/' "$vars" | grep -q 'default[[:space:]]*=[[:space:]]*"main"'; then
            echo "::error file=$vars::flux_git_ref default is not \"main\" on the main branch — prod Flux would track a dead ref. Flip the default." >&2
            exit 1
          fi

      # talos + fabric read data sources over the overlay on PLAN (talos_cluster_health;
      # the switch vme), so they must join NetBird. The cloud-API stacks (ceph/dns/
      # netbird) need no overlay. The setup key already exists in 1P (bootstrapped).
      - name: Resolve NetBird CI setup-key ref
        if: matrix.stack == 'talos' || matrix.stack == 'fabric'
        run: |
          set -euo pipefail
          if [ "$PARTITION" = "prod" ]; then
            reg=$(printf '%s' "$REGION" | tr 'a-z-' 'A-Z_')
            echo "NB_CI_KEY_REF=op://yucca_tf_prod/NETBIRD_YUCCA_PROD_${reg}_CI_SETUP_KEY/password" >> "$GITHUB_ENV"
          else
            # Staging's overlay key is partition-scoped (minted by the account/global netbird).
            echo "NB_CI_KEY_REF=op://yucca_tf_staging/NETBIRD_YUCCA_STAGING_CI_SETUP_KEY/password" >> "$GITHUB_ENV"
          fi
      - name: Connect to NetBird
        if: matrix.stack == 'talos' || matrix.stack == 'fabric'
        uses: ./.github/actions/netbird-connect
        with:
          setup-key-ref: ${{ env.NB_CI_KEY_REF }}
          hostname: gha-plan-${{ matrix.partition }}-${{ matrix.region }}-${{ matrix.stack }}-${{ github.run_id }}

      # Prod fabric goes through the mise task (builds the hetzner provider, renders
      # the NETCONF key; junos comes from the registry). Every other stack is a
      # plain registry-provider terragrunt plan.
      # Persist the diff to an ABSOLUTE path (terragrunt runs tofu inside a
      # .terragrunt-cache dir, so a relative -out would be unreachable). The gated
      # apply downloads this exact file and applies it -- the human approves the
      # DIFF, not a plan-job log. TG_PLAN threads the path into the mise task too.
      - name: Terragrunt plan (fabric)
        if: matrix.stack == 'fabric'
        env:
          TG_PLAN: ${{ github.workspace }}/tfplan.bin
        run: mise run infra:plan -- --non-interactive
      - name: Terragrunt plan
        if: matrix.stack != 'fabric'
        env:
          STACK_DIR: ${{ matrix.dir }}
          TG_PLAN: ${{ github.workspace }}/tfplan.bin
        run: >-
          tf/op-run.sh terragrunt
          --working-dir "tf/deployment/$STACK_DIR"
          --non-interactive plan -out="$TG_PLAN"

      # Hand the saved plan to the apply job. NOTE: a tofu plan file can embed
      # sensitive values in the clear, so keep retention short and rely on the
      # repo's private-artifact scoping. if-no-files-found:error makes a missing
      # plan fail loudly rather than silently fall back to a fresh apply.
      - name: Upload reviewed plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ steps.planid.outputs.id }}
          path: ${{ github.workspace }}/tfplan.bin
          if-no-files-found: error
          retention-days: 1

  # ── Apply (gated, ordered) ───────────────────────────────────────────────────
  apply:
    name: Apply ${{ matrix.partition }}@${{ matrix.region }}/${{ matrix.stack }} (gated)
    needs: [changes, discover, plan]
    # Only on merge to main (or a SCOPED manual dispatch) -- never on PRs. A bare
    # workflow_dispatch (no run_ceph_ansible / run_mgmt_ansible / run_fabric) is
    # plan-only: the apply job is skipped so a manual "just look" run can never
    # apply every emitted stack unreviewed.
    if: >-
      needs.discover.outputs.has_stacks == 'true'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch'
            && (inputs.run_ceph_ansible || inputs.run_mgmt_ansible || inputs.run_fabric))
      )
    runs-on: ubuntu-latest
    # Ceiling for a worst-case entry (TF apply + up to 90-min ceph converge).
    # Finer per-phase bounds are enforced at step level (apply 30 / converge 90).
    timeout-minutes: 120
    strategy:
      # fail-fast so a failed lower-order apply (e.g. netbird) cancels the
      # remaining ordered node-touching applies instead of running against a
      # half-provisioned overlay.
      fail-fast: true
      # Serialize so the sorted `order` is honored: account netbird -> site netbird
      # -> node-touching stacks, and prod/global before prod/htz-fsn1/netbird.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Per-region approval gate.
    environment:
      name: ${{ matrix.partition }}-${{ matrix.region }}
    env:
      # Write-capable SA by partition, EXCEPT prod/fabric which keeps the read SA
      # and self-escalates to the in-vault write SA inside `mise run infra:apply`.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ (matrix.partition == 'prod' && matrix.stack == 'fabric') && secrets.OP_TF_YUCCA_PROD_ENV || matrix.partition == 'prod' && secrets.OP_TF_YUCCA_PROD_ENV_WRITE || secrets.OP_TF_YUCCA_STAGING_ENV_WRITE }}
      OP_ENV_FILE: ${{ matrix.partition == 'prod' && 'tf/.env.prod' || 'tf/.env' }}
      SITE: ${{ matrix.region }}
      REGION: ${{ matrix.region }}
      PARTITION: ${{ matrix.partition }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Same filesystem-safe id the plan job used to name the artifact.
      - id: planid
        name: Compute plan artifact id
        env:
          DIR: ${{ matrix.dir }}
        run: echo "id=$(printf '%s' "$DIR" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Set up mise (go + opentofu + terragrunt + ansible)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

      # Pull the EXACT plan the reviewer approved, downloaded to the same absolute
      # path the plan job wrote. `terragrunt apply <planfile>` fails closed if the
      # saved plan is stale relative to current state -- so a drifted backend can
      # never silently apply a different diff than the one that was reviewed.
      - name: Download reviewed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ steps.planid.outputs.id }}
          path: ${{ github.workspace }}

      # Decide whether each post-apply Ansible converge runs.
      #   - ceph: DELIBERATE and blast-radius-guarded. Runs ONLY on
      #     workflow_dispatch with run_ceph_ansible=true, and ONLY for the ceph
      #     matrix entry whose partition/region owns the selected ceph_cluster
      #     (spice -> prod/htz-fsn1, sietch -> staging/austin). A push never sets
      #     this gate, so merging a ceph change cannot converge a live cluster.
      #   - mgmt: on push, gate on the paths-filter (did the mgmt surface change?);
      #     on manual dispatch, gate on the run_mgmt_ansible toggle (default off).
      - name: Resolve Ansible-converge gates
        id: ansible_gate
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DISPATCH_CEPH: ${{ inputs.run_ceph_ansible }}
          DISPATCH_MGMT: ${{ inputs.run_mgmt_ansible }}
          CEPH_CLUSTER: ${{ inputs.ceph_cluster }}
          PARTITION: ${{ matrix.partition }}
          REGION: ${{ matrix.region }}
          CHANGED_MGMT: ${{ needs.changes.outputs.ansible_mgmt }}
        run: |
          set -euo pipefail
          # ceph converge: dispatch-only, and pinned to the one cluster/entry.
          ceph=false
          if [ "$DISPATCH" = "true" ] && [ "$DISPATCH_CEPH" = "true" ]; then
            case "$CEPH_CLUSTER" in
              spice)  want_partition=prod;    want_region=htz-fsn1 ;;
              sietch) want_partition=staging; want_region=austin ;;
              *) echo "unknown ceph_cluster: '$CEPH_CLUSTER'" >&2; exit 1 ;;
            esac
            if [ "$PARTITION" = "$want_partition" ] && [ "$REGION" = "$want_region" ]; then
              ceph=true
            fi
          fi
          # mgmt converge: push -> paths-filter; dispatch -> toggle.
          if [ "$DISPATCH" = "true" ]; then mgmt=$DISPATCH_MGMT; else mgmt=$CHANGED_MGMT; fi
          echo "ceph=${ceph:-false}" >> "$GITHUB_OUTPUT"
          echo "mgmt=${mgmt:-false}" >> "$GITHUB_OUTPUT"
          echo "Ansible converge gates -> ceph=${ceph:-false} (cluster=${CEPH_CLUSTER:-none}) mgmt=${mgmt:-false}"

      # Decide whether the fabric (switch) apply runs. Same model as the Ansible
      # gates: on push, gate on the paths-filter (did the fabric surface change?);
      # on manual dispatch, gate on the run_fabric toggle (default off).
      - name: Resolve fabric-apply gate
        id: fabric_gate
        if: matrix.stack == 'fabric'
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DISPATCH_FABRIC: ${{ inputs.run_fabric }}
          CHANGED_FABRIC: ${{ needs.changes.outputs.fabric }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH" = "true" ]; then run=$DISPATCH_FABRIC; else run=$CHANGED_FABRIC; fi
          echo "run=${run:-false}" >> "$GITHUB_OUTPUT"
          echo "fabric apply gate → ${run:-false}"

      # Node-touching stacks join the overlay: talos (provisions over the LAN),
      # ceph (the Ansible convergence below), fabric (the switch vme + the mgmt
      # converge below). NetBird stacks themselves are pure api.netbird.io. The
      # key was minted by an earlier (lower-order) netbird apply in this same run.
      - name: Resolve NetBird CI setup-key ref
        if: matrix.stack == 'talos' || (matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true') || (matrix.stack == 'fabric' && (steps.fabric_gate.outputs.run == 'true' || steps.ansible_gate.outputs.mgmt == 'true'))
        run: |
          set -euo pipefail
          if [ "$PARTITION" = "prod" ]; then
            reg=$(printf '%s' "$REGION" | tr 'a-z-' 'A-Z_')
            echo "NB_CI_KEY_REF=op://yucca_tf_prod/NETBIRD_YUCCA_PROD_${reg}_CI_SETUP_KEY/password" >> "$GITHUB_ENV"
          else
            echo "NB_CI_KEY_REF=op://yucca_tf_staging/NETBIRD_YUCCA_STAGING_CI_SETUP_KEY/password" >> "$GITHUB_ENV"
          fi
      - name: Connect to NetBird
        if: matrix.stack == 'talos' || (matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true') || (matrix.stack == 'fabric' && (steps.fabric_gate.outputs.run == 'true' || steps.ansible_gate.outputs.mgmt == 'true'))
        uses: ./.github/actions/netbird-connect
        with:
          setup-key-ref: ${{ env.NB_CI_KEY_REF }}
          hostname: gha-apply-${{ matrix.partition }}-${{ matrix.region }}-${{ matrix.stack }}-${{ github.run_id }}

      # Prod fabric: mise task escalates to the write SA + builds providers.
      # Gated: only when the fabric surface changed (push) or run_fabric (dispatch).
      - name: Terragrunt apply (fabric)
        if: matrix.stack == 'fabric' && steps.fabric_gate.outputs.run == 'true'
        timeout-minutes: 30
        # TG_PLAN routes the reviewed plan into the mise task, which applies that
        # file (no fresh re-plan, no -auto-approve) and fails on a stale plan.
        env:
          TG_PLAN: ${{ github.workspace }}/tfplan.bin
        run: mise run infra:apply -- --non-interactive
      # Everything else: direct terragrunt apply of the reviewed plan file with
      # the partition's write SA (no -auto-approve -- the plan is pre-approved).
      - name: Terragrunt apply
        if: matrix.stack != 'fabric'
        timeout-minutes: 30
        env:
          STACK_DIR: ${{ matrix.dir }}
          TG_PLAN: ${{ github.workspace }}/tfplan.bin
        run: >-
          tf/op-run.sh terragrunt
          --working-dir "tf/deployment/$STACK_DIR"
          --non-interactive apply "$TG_PLAN"

      # -- Ceph convergence (Ansible) - ceph stack, workflow_dispatch-only --
      # The TF apply above only minted the RGW keys into 1P + the cluster Secret;
      # this converges the selected bare-metal cluster. Reuses the NetBird overlay
      # + 1Password session already established in this entry. The gate fires ONLY
      # on workflow_dispatch with run_ceph_ansible=true, and only for the entry
      # that owns the chosen ceph_cluster (spice=prod/htz-fsn1, sietch=staging/
      # austin) -- a push never converges here. Cluster + region are threaded from
      # the dispatch inputs / matrix so this is not hardcoded to sietch/austin.
      - name: Render Ansible inventory from the ceph TF state
        if: matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true'
        env:
          PARTITION: ${{ matrix.partition }}
          REGION: ${{ matrix.region }}
        run: ansible/ceph/scripts/render-inventories.sh "$PARTITION" "$REGION"
      - name: Install the ansible-iac SSH key from 1Password
        if: matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true'
        # Pulls op://yucca_tf_<partition>/<CLUSTER>_CEPH_ANSIBLE_IAC_SSH_KEY to
        # ~/.ssh/id_ed25519_<cluster> -- the path the rendered inventory references
        # (spice -> id_ed25519_spice, sietch -> id_ed25519_sietch).
        env:
          PARTITION: ${{ matrix.partition }}
          CEPH_CLUSTER: ${{ inputs.ceph_cluster }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          OP_VAULT="yucca_tf_$PARTITION" ansible/ceph/scripts/install-ssh-keys.sh "$CEPH_CLUSTER"
      - name: Provision the ceph Ansible toolchain (venv + collections)
        if: matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true'
        working-directory: ansible/ceph
        run: |
          mise trust
          mise install
          mise run setup
      - name: Deploy Ceph (full pipeline -- baseline -> tune -> deploy -> harden)
        if: matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true'
        timeout-minutes: 90
        # Run from ansible/ceph so mise loads ansible/ceph/.mise.toml (where the
        # `deploy` task + CEPH_ENV-relative inventory paths live); the root config
        # has no `deploy` task.
        working-directory: ansible/ceph
        # CI runner has no known_hosts for the bare-metal nodes; first contact is
        # over the NetBird overlay, so disable strict host-key checking for this run.
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
          CEPH_ENV: inventories/${{ matrix.partition }}-${{ matrix.region }}/${{ inputs.ceph_cluster }}/inventory.ini
        run: mise run deploy

      # ── Mgmt convergence (Ansible) — fabric stack, gated on the converge gate ─
      # Renders the mgmt inventory from TF (tf/render/ansible-mgmt) then converges
      # the mgmt hosts over the overlay. No-op for regions without an ansible/mgmt
      # inventory. Runs under the same (already-approved) gate as the fabric apply.
      # Skipped when ansible/mgmt/** (+ feeders) is unchanged on push, or when
      # run_mgmt_ansible is off on manual dispatch. The fabric apply keeps its
      # overlay join regardless (it touches the switch vme directly).
      - name: Ansible converge (mgmt hosts)
        if: matrix.stack == 'fabric' && steps.ansible_gate.outputs.mgmt == 'true'
        timeout-minutes: 30
        run: mise run mgmt:ansible
