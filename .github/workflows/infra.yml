name: Infra (Terraform)

# CI-owned Terragrunt applies; node access over NetBird. `discover` scans
# tf/deployment/<partition>/<region>/<stack>/terragrunt.hcl into one matrix per
# partition — a new stack/region needs only its terragrunt.hcl + a GitHub Environment.
#
# Secrets (ternaries: Actions can't index secrets dynamically):
#   staging: SA OP_TF_YUCCA_STAGING_ENV(_WRITE), env-file tf/.env.
#   prod: SA OP_TF_YUCCA_PROD_ENV(_WRITE), tf/.env.prod. Prod fabric applies with the
#     READ SA and self-escalates to the in-vault write SA in `mise run infra:apply`;
#     prod netbird applies with the WRITE SA directly.
#   dev: local-only (no remote state / CI SA) — never emitted.
#
# Apply order (per-entry `order` + max-parallel:1 per partition): global stacks →
# site netbird → node-touching (ceph/talos/fabric). NetBird first: mints the CI setup
# key into 1P + advertises the node subnets; prod/global precedes prod/htz-fsn1/netbird
# (real terragrunt dependency). Partitions are independent plan→apply pipelines (a
# failed staging plan never blocks a prod apply); state is per-stack, so concurrent
# partitions touch disjoint state.
#
# Post-apply converges, gated independently of the TF apply:
#   ceph: workflow_dispatch ONLY (run_ceph_ansible + ceph_cluster; spice=prod/htz-fsn1,
#     sietch=staging/austin). A push NEVER converges a ceph cluster.
#   mgmt (fabric stack): push via `ansible_mgmt` filter; dispatch via run_mgmt_ansible.
# Fabric (switch) apply gated likewise: push via `fabric` filter; dispatch via
# run_fabric (default off).
#
# Environment gates: <partition>-<region> (staging-austin, staging-global, prod-global,
# prod-htz-fsn1), one per matrix apply entry. HAZARD: GitHub auto-creates an
# unprovisioned Environment on first reference with ZERO protection rules — a brand-new
# gate applies with no reviewer (fail OPEN). PARKED two-part fix: (1) Environments as
# code (tf/deployment/_meta/github, stubbed); (2) `discover` fails closed unless every
# Environment has a reviewer (step `if: false`). Both disabled: enforcement needs a
# one-time bootstrap (GH_ENV_ADMIN_TOKEN secret + the four Environments created with
# reviewers) that would break the first push-to-main.
#
# Prereqs (out-of-band):
#   - Repo secrets: OP_TF_YUCCA_STAGING_ENV(+_WRITE); OP_TF_YUCCA_PROD_ENV (read) +
#     OP_TF_YUCCA_PROD_ENV_WRITE (netbird apply / write-escalation source).
#   - BOOTSTRAP: netbird stacks applied ONCE out-of-band — CI can't mint the setup
#     keys (the minting apply is gated behind the plan that needs them). Keys: staging
#     NETBIRD_YUCCA_STAGING_CI_SETUP_KEY (partition-scoped); prod
#     NETBIRD_YUCCA_PROD_<REGION>_* (region-scoped). Plus NetBird routes for the node
#     subnets (staging 10.10.10.0/24; prod site subnets via the mgmt peers).
#   - 1P items: NET_SWITCHES_TERRAFORM_SSH_PRIVATE_KEY (yucca_tf_prod), NETBOX_API_TOKEN
#     (yucca_tf), HETZNER_WEBSERVICE_API_USER/PASSWORD (yucca_tf_prod).

on:
  push:
    branches: [main]
    paths: &paths
      - 'tf/**'
      - 'ansible/mgmt/**'
      - 'ansible/ceph/**'
      - '.mise/tasks/**'
      - '.mise/config.toml'
      - '.github/actions/netbird-connect/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      run_ceph_ansible:
        description: 'Run the Ceph Ansible converge (full pipeline) against ceph_cluster'
        type: boolean
        default: false
      ceph_cluster:
        description: 'Ceph cluster the converge targets (only used when run_ceph_ansible is true)'
        type: choice
        options:
          - sietch
          - spice
        default: sietch
      run_mgmt_ansible:
        description: 'Run the mgmt Ansible converge after the fabric apply'
        type: boolean
        default: false
      run_fabric:
        description: 'Apply the fabric (switch) stack'
        type: boolean
        default: false

# OVH S3 backend has no state locking — this group stands in (one infra run at a
# time); cancel-in-progress:false lets a running apply finish its state write.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    # Fork PRs skipped: no access to secrets / the overlay.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      staging: ${{ steps.filter.outputs.staging }}
      prod: ${{ steps.filter.outputs.prod }}
      dev: ${{ steps.filter.outputs.dev }}
      shared: ${{ steps.filter.outputs.shared }}
      ansible_mgmt: ${{ steps.filter.outputs.ansible_mgmt }}
      fabric: ${{ steps.filter.outputs.fabric }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            staging:
              - 'tf/deployment/staging/**'
              # Only staging's own ceph inventory opens staging — a prod/shared ceph
              # change must never (DEFECT 3).
              - 'ansible/ceph/inventories/staging-**'
            prod:
              - 'tf/deployment/prod/**'
              - 'ansible/mgmt/**'
              - 'ansible/ceph/inventories/prod-**'
              - 'tf/render/**'
              - 'tf/providers/**'
              - '.mise/tasks/infra/**'
              - '.mise/tasks/fabric/**'
              - '.mise/tasks/mgmt/**'
            dev:
              - 'tf/deployment/dev/**'
            shared:
              # A hit forces every partition's matrix.
              - 'tf/shared/**'
              - 'tf/op-run.sh'
              - '.mise/config.toml'
              - '.github/actions/netbird-connect/**'
              - '.github/workflows/infra.yml'
            # Stack-step gate (not partition): the fabric entry's post-apply mgmt converge.
            ansible_mgmt:
              - 'ansible/mgmt/**'
              - 'tf/render/ansible-mgmt/**'
              - '.mise/tasks/mgmt/**'
            # Stack-step gate: the fabric apply.
            fabric:
              - 'tf/deployment/prod/htz-fsn1/fabric/**'
              - 'tf/shared/modules/core-fabric/**'
              - 'tf/shared/modules/cluster-fabric/**'
              - 'tf/shared/modules/fabric-login/**'
              - 'tf/shared/modules/fabric-addressing/**'
              - 'tf/shared/modules/fabric-netbox/**'
              - 'tf/shared/modules/identity/**'
              - 'tf/providers/**'
              - '.mise/tasks/fabric/**'
              - '.mise/tasks/infra/**'

  discover:
    name: Discover stacks
    needs: changes
    if: >-
      needs.changes.outputs.staging == 'true'
      || needs.changes.outputs.prod == 'true'
      || needs.changes.outputs.shared == 'true'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      staging_matrix: ${{ steps.gen.outputs.staging_matrix }}
      prod_matrix: ${{ steps.gen.outputs.prod_matrix }}
      has_staging: ${{ steps.gen.outputs.has_staging }}
      has_prod: ${{ steps.gen.outputs.has_prod }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: gen
        name: Build {partition, region, stack} matrix for the changed partitions
        env:
          STAGING: ${{ needs.changes.outputs.staging }}
          PROD: ${{ needs.changes.outputs.prod }}
          SHARED: ${{ needs.changes.outputs.shared }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DISPATCH_CEPH: ${{ inputs.run_ceph_ansible }}
          DISPATCH_MGMT: ${{ inputs.run_mgmt_ansible }}
          DISPATCH_FABRIC: ${{ inputs.run_fabric }}
          CEPH_CLUSTER: ${{ inputs.ceph_cluster }}
        run: |
          set -euo pipefail

          declare -A active=()
          if [ "$DISPATCH" = "true" ]; then
            if [ "$DISPATCH_CEPH" = "true" ]; then
              case "$CEPH_CLUSTER" in
                spice)  active[prod]=1 ;;
                sietch) active[staging]=1 ;;
                *) echo "unknown ceph_cluster: '$CEPH_CLUSTER'" >&2; exit 1 ;;
              esac
            fi
            [ "$DISPATCH_MGMT" = "true" ] && active[prod]=1
            [ "$DISPATCH_FABRIC" = "true" ] && active[prod]=1
            if [ "${#active[@]}" -eq 0 ]; then
              active[staging]=1; active[prod]=1   # bare dispatch = plan-only preview (apply job's `if:` skips)
            fi
          elif [ "$SHARED" = "true" ]; then
            active[staging]=1; active[prod]=1
          else
            [ "$STAGING" = "true" ] && active[staging]=1
            [ "$PROD" = "true" ] && active[prod]=1
          fi

          declare -A part_entries=()
          while IFS= read -r tg; do
            rel=${tg#tf/deployment/}
            rel=${rel%/terragrunt.hcl}
            [ "$rel" = "terragrunt.hcl" ] && continue   # repo-root parent config
            IFS=/ read -r -a segs <<< "$rel"
            [ "${#segs[@]}" -ge 2 ] || continue
            partition=${segs[0]}
            region=${segs[1]}
            if [ "${#segs[@]}" -ge 3 ]; then
              stack=$(IFS=/; echo "${segs[*]:2}")       # nested sub-stacks keep working
            else
              stack=$region                              # n==2 transition guard (e.g. prod/global)
            fi
            [ -n "${active[$partition]:-}" ] || continue

            if [ "$region" = "global" ]; then order=0
            elif [ "$stack" = "netbird" ]; then order=1
            else order=2; fi

            part_entries[$partition]+="$(jq -nc \
              --arg p "$partition" --arg r "$region" --arg s "$stack" \
              --arg d "$rel" --argjson o "$order" \
              '{partition:$p,region:$r,stack:$s,dir:$d,order:$o}')"$'\n'
          done < <(find tf/deployment -mindepth 2 -name terragrunt.hcl -type f | sort)

          for partition in staging prod; do
            include=$(printf '%s' "${part_entries[$partition]:-}" | jq -s 'sort_by(.order, .dir)')
            matrix=$(jq -nc --argjson inc "$include" '{include:$inc}')
            has=$([ "$(jq 'length' <<<"$include")" -gt 0 ] && echo true || echo false)
            echo "${partition}_matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "has_${partition}=$has" >> "$GITHUB_OUTPUT"
            echo "Discovered $partition stacks:"
            jq -r '.[] | "  [\(.order)] \(.partition)@\(.region)/\(.stack)  (\(.dir))"' <<<"$include"
          done

      # PARKED (see header). GITHUB_TOKEN can't read protection rules — needs
      # GH_ENV_ADMIN_TOKEN. See tf/deployment/_meta/github/terragrunt.hcl.disabled.
      - name: Fail closed unless every target Environment has required reviewers
        # Re-enable by restoring:
        #   (steps.gen.outputs.has_staging == 'true' || steps.gen.outputs.has_prod == 'true')
        #   && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        if: false
        env:
          GH_TOKEN: ${{ secrets.GH_ENV_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MATRIX_STAGING: ${{ steps.gen.outputs.staging_matrix }}
          MATRIX_PROD: ${{ steps.gen.outputs.prod_matrix }}
        run: |
          set -euo pipefail
          envs=$(printf '%s\n%s\n' "$MATRIX_STAGING" "$MATRIX_PROD" \
            | jq -r '.include[] | "\(.partition)-\(.region)"' | sort -u)
          [ -n "$envs" ] || { echo "No environments to verify."; exit 0; }
          fail=0
          while IFS= read -r envname; do
            [ -n "$envname" ] || continue
            if ! resp=$(gh api "repos/$REPO/environments/$envname" 2>/dev/null); then
              echo "FAIL-CLOSED: environment '$envname' is missing or unreadable -> treated as unprotected." >&2
              fail=1; continue
            fi
            n=$(jq '[.protection_rules[]? | select(.type=="required_reviewers") | .reviewers[]?] | length' <<<"$resp")
            if [ "${n:-0}" -lt 1 ]; then
              echo "FAIL-CLOSED: environment '$envname' has no required reviewers (approval gate would fail open)." >&2
              fail=1
            else
              echo "OK: environment '$envname' has ${n} required reviewer(s)."
            fi
          done <<<"$envs"
          [ "$fail" -eq 0 ] || {
            echo "One or more target Environments lack a required reviewer; refusing to plan/apply (fail closed)." >&2
            exit 1
          }

  plan-staging:
    name: Plan ${{ matrix.partition }}@${{ matrix.region }}/${{ matrix.stack }}
    needs: [changes, discover]
    if: needs.discover.outputs.has_staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.staging_matrix) }}
    env: &plan-env
      OP_SERVICE_ACCOUNT_TOKEN: ${{ matrix.partition == 'prod' && secrets.OP_TF_YUCCA_PROD_ENV || secrets.OP_TF_YUCCA_STAGING_ENV }}
      OP_ENV_FILE: ${{ matrix.partition == 'prod' && 'tf/.env.prod' || 'tf/.env' }}
      SITE: ${{ matrix.region }}
      REGION: ${{ matrix.region }}
      PARTITION: ${{ matrix.partition }}
    steps: &plan-steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: planid
        name: Compute plan artifact id
        env:
          DIR: ${{ matrix.dir }}
        run: echo "id=$(printf '%s' "$DIR" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Set up mise (go + opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0
        with:
          # Pin: 1P's "latest" version-check endpoint intermittently returns empty
          # JSON, failing all parallel jobs; a pinned version skips that call.
          version: '2.31.1'

      # flux_git_ref may default to a feature branch during bring-up; merged
      # unflipped, prod Flux reconciles a dead ref forever.
      - name: Guard prod flux_git_ref
        if: matrix.stack == 'talos' && matrix.partition == 'prod' && github.ref == 'refs/heads/main'
        env:
          STACK_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          vars="tf/deployment/$STACK_DIR/variables.tf"
          if ! awk '/variable "flux_git_ref"/,/^}/' "$vars" | grep -q 'default[[:space:]]*=[[:space:]]*"main"'; then
            echo "::error file=$vars::flux_git_ref default is not \"main\" on the main branch — prod Flux would track a dead ref. Flip the default." >&2
            exit 1
          fi

      # talos + fabric plans read data sources over the overlay (talos_cluster_health,
      # switch vme); cloud-API stacks (ceph/dns/netbird) don't.
      - name: Resolve NetBird CI setup-key ref
        if: matrix.stack == 'talos' || matrix.stack == 'fabric'
        run: |
          set -euo pipefail
          if [ "$PARTITION" = "prod" ]; then
            reg=$(printf '%s' "$REGION" | tr 'a-z-' 'A-Z_')
            echo "NB_CI_KEY_REF=op://yucca_tf_prod/NETBIRD_YUCCA_PROD_${reg}_CI_SETUP_KEY/password" >> "$GITHUB_ENV"
          else
            echo "NB_CI_KEY_REF=op://yucca_tf_staging/NETBIRD_YUCCA_STAGING_CI_SETUP_KEY/password" >> "$GITHUB_ENV"
          fi
      - name: Connect to NetBird
        if: matrix.stack == 'talos' || matrix.stack == 'fabric'
        uses: ./.github/actions/netbird-connect
        with:
          setup-key-ref: ${{ env.NB_CI_KEY_REF }}
          hostname: gha-plan-${{ matrix.partition }}-${{ matrix.region }}-${{ matrix.stack }}-${{ github.run_id }}

      # TG_PLAN must be ABSOLUTE: terragrunt runs tofu inside .terragrunt-cache, so a
      # relative -out is unreachable. The gated apply applies this exact file.
      - name: Terragrunt plan (fabric)
        if: matrix.stack == 'fabric'
        env:
          TG_PLAN: ${{ github.workspace }}/tfplan.bin
        run: mise run infra:plan -- --non-interactive
      - name: Terragrunt plan
        if: matrix.stack != 'fabric'
        env:
          STACK_DIR: ${{ matrix.dir }}
          TG_PLAN: ${{ github.workspace }}/tfplan.bin
        run: >-
          tf/op-run.sh terragrunt
          --working-dir "tf/deployment/$STACK_DIR"
          --non-interactive plan -out="$TG_PLAN"

      # A tofu plan file can embed sensitive values in the clear: retention 1 day.
      # if-no-files-found:error, or the apply silently falls back to a fresh plan.
      - name: Upload reviewed plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ steps.planid.outputs.id }}
          path: ${{ github.workspace }}/tfplan.bin
          if-no-files-found: error
          retention-days: 1

  plan-prod:
    name: Plan ${{ matrix.partition }}@${{ matrix.region }}/${{ matrix.stack }}
    needs: [changes, discover]
    if: needs.discover.outputs.has_prod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.prod_matrix) }}
    env: *plan-env
    steps: *plan-steps

  apply-staging:
    name: Apply ${{ matrix.partition }}@${{ matrix.region }}/${{ matrix.stack }} (gated)
    needs: [changes, discover, plan-staging]
    # Push to main or a SCOPED dispatch only — never PRs; a bare dispatch stays plan-only.
    if: >-
      needs.discover.outputs.has_staging == 'true'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch'
            && (inputs.run_ceph_ansible || inputs.run_mgmt_ansible || inputs.run_fabric))
      )
    runs-on: ubuntu-latest
    # 120 = apply (30) + ceph converge (90) step ceilings.
    timeout-minutes: 120
    strategy:
      # fail-fast: a failed lower-order apply (e.g. netbird) cancels the remaining
      # node-touching applies instead of running on a half-provisioned overlay.
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.staging_matrix) }}
    environment:
      name: ${{ matrix.partition }}-${{ matrix.region }}
    env: &apply-env
      # prod/fabric: read SA, escalation happens inside `mise run infra:apply`.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ (matrix.partition == 'prod' && matrix.stack == 'fabric') && secrets.OP_TF_YUCCA_PROD_ENV || matrix.partition == 'prod' && secrets.OP_TF_YUCCA_PROD_ENV_WRITE || secrets.OP_TF_YUCCA_STAGING_ENV_WRITE }}
      OP_ENV_FILE: ${{ matrix.partition == 'prod' && 'tf/.env.prod' || 'tf/.env' }}
      SITE: ${{ matrix.region }}
      REGION: ${{ matrix.region }}
      PARTITION: ${{ matrix.partition }}
    steps: &apply-steps
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: planid
        name: Compute plan artifact id
        env:
          DIR: ${{ matrix.dir }}
        run: echo "id=$(printf '%s' "$DIR" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Set up mise (go + opentofu + terragrunt + ansible)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0
        with:
          # Pin: 1P's "latest" resolution is flaky (see plan job).
          version: '2.31.1'

      # `apply <planfile>` fails closed on a stale plan — a drifted backend can never
      # silently apply a different diff than the reviewed one.
      - name: Download reviewed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ steps.planid.outputs.id }}
          path: ${{ github.workspace }}

      - name: Resolve Ansible-converge gates
        id: ansible_gate
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DISPATCH_CEPH: ${{ inputs.run_ceph_ansible }}
          DISPATCH_MGMT: ${{ inputs.run_mgmt_ansible }}
          CEPH_CLUSTER: ${{ inputs.ceph_cluster }}
          PARTITION: ${{ matrix.partition }}
          REGION: ${{ matrix.region }}
          CHANGED_MGMT: ${{ needs.changes.outputs.ansible_mgmt }}
        run: |
          set -euo pipefail
          ceph=false
          if [ "$DISPATCH" = "true" ] && [ "$DISPATCH_CEPH" = "true" ]; then
            case "$CEPH_CLUSTER" in
              spice)  want_partition=prod;    want_region=htz-fsn1 ;;
              sietch) want_partition=staging; want_region=austin ;;
              *) echo "unknown ceph_cluster: '$CEPH_CLUSTER'" >&2; exit 1 ;;
            esac
            if [ "$PARTITION" = "$want_partition" ] && [ "$REGION" = "$want_region" ]; then
              ceph=true
            fi
          fi
          if [ "$DISPATCH" = "true" ]; then mgmt=$DISPATCH_MGMT; else mgmt=$CHANGED_MGMT; fi
          echo "ceph=${ceph:-false}" >> "$GITHUB_OUTPUT"
          echo "mgmt=${mgmt:-false}" >> "$GITHUB_OUTPUT"
          echo "Ansible converge gates -> ceph=${ceph:-false} (cluster=${CEPH_CLUSTER:-none}) mgmt=${mgmt:-false}"

      - name: Resolve fabric-apply gate
        id: fabric_gate
        if: matrix.stack == 'fabric'
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DISPATCH_FABRIC: ${{ inputs.run_fabric }}
          CHANGED_FABRIC: ${{ needs.changes.outputs.fabric }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH" = "true" ]; then run=$DISPATCH_FABRIC; else run=$CHANGED_FABRIC; fi
          echo "run=${run:-false}" >> "$GITHUB_OUTPUT"
          echo "fabric apply gate → ${run:-false}"

      # Overlay joins: talos (LAN provisioning), ceph (converge), fabric (switch vme +
      # mgmt converge); the key was minted by an earlier lower-order netbird apply.
      - name: Resolve NetBird CI setup-key ref
        if: matrix.stack == 'talos' || (matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true') || (matrix.stack == 'fabric' && (steps.fabric_gate.outputs.run == 'true' || steps.ansible_gate.outputs.mgmt == 'true'))
        run: |
          set -euo pipefail
          if [ "$PARTITION" = "prod" ]; then
            reg=$(printf '%s' "$REGION" | tr 'a-z-' 'A-Z_')
            echo "NB_CI_KEY_REF=op://yucca_tf_prod/NETBIRD_YUCCA_PROD_${reg}_CI_SETUP_KEY/password" >> "$GITHUB_ENV"
          else
            echo "NB_CI_KEY_REF=op://yucca_tf_staging/NETBIRD_YUCCA_STAGING_CI_SETUP_KEY/password" >> "$GITHUB_ENV"
          fi
      - name: Connect to NetBird
        if: matrix.stack == 'talos' || (matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true') || (matrix.stack == 'fabric' && (steps.fabric_gate.outputs.run == 'true' || steps.ansible_gate.outputs.mgmt == 'true'))
        uses: ./.github/actions/netbird-connect
        with:
          setup-key-ref: ${{ env.NB_CI_KEY_REF }}
          hostname: gha-apply-${{ matrix.partition }}-${{ matrix.region }}-${{ matrix.stack }}-${{ github.run_id }}

      - name: Terragrunt apply (fabric)
        if: matrix.stack == 'fabric' && steps.fabric_gate.outputs.run == 'true'
        timeout-minutes: 30
        # infra:apply applies TG_PLAN exactly (no re-plan, no -auto-approve).
        env:
          TG_PLAN: ${{ github.workspace }}/tfplan.bin
        run: mise run infra:apply -- --non-interactive
      - name: Terragrunt apply
        if: matrix.stack != 'fabric'
        timeout-minutes: 30
        env:
          STACK_DIR: ${{ matrix.dir }}
          TG_PLAN: ${{ github.workspace }}/tfplan.bin
        run: >-
          tf/op-run.sh terragrunt
          --working-dir "tf/deployment/$STACK_DIR"
          --non-interactive apply "$TG_PLAN"

      # The TF apply only minted RGW keys into 1P + the cluster Secret; this converges
      # the live cluster, reusing this entry's overlay + 1P session.
      - name: Render Ansible inventory from the ceph TF state
        if: matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true'
        env:
          PARTITION: ${{ matrix.partition }}
          REGION: ${{ matrix.region }}
        run: ansible/ceph/scripts/render-inventories.sh "$PARTITION" "$REGION"
      - name: Install the ansible-iac SSH key from 1Password
        if: matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true'
        # op://yucca_tf_<partition>/<CLUSTER>_CEPH_ANSIBLE_IAC_SSH_KEY ->
        # ~/.ssh/id_ed25519_<cluster>, the path the rendered inventory references.
        env:
          PARTITION: ${{ matrix.partition }}
          CEPH_CLUSTER: ${{ inputs.ceph_cluster }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          OP_VAULT="yucca_tf_$PARTITION" ansible/ceph/scripts/install-ssh-keys.sh "$CEPH_CLUSTER"
      - name: Provision the ceph Ansible toolchain (venv + collections)
        if: matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true'
        working-directory: ansible/ceph
        run: |
          mise trust
          mise install
          mise run setup
      - name: Deploy Ceph (full pipeline -- baseline -> tune -> deploy -> harden)
        if: matrix.stack == 'ceph' && steps.ansible_gate.outputs.ceph == 'true'
        timeout-minutes: 90
        # The `deploy` task + CEPH_ENV-relative paths live in ansible/ceph/.mise.toml.
        working-directory: ansible/ceph
        # Runner has no known_hosts for the nodes (first contact).
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
          CEPH_ENV: inventories/${{ matrix.partition }}-${{ matrix.region }}/${{ inputs.ceph_cluster }}/inventory.ini
        run: mise run deploy

      # Renders from tf/render/ansible-mgmt; no-op for regions without an
      # ansible/mgmt inventory.
      - name: Ansible converge (mgmt hosts)
        if: matrix.stack == 'fabric' && steps.ansible_gate.outputs.mgmt == 'true'
        timeout-minutes: 30
        run: mise run mgmt:ansible

  apply-prod:
    name: Apply ${{ matrix.partition }}@${{ matrix.region }}/${{ matrix.stack }} (gated)
    needs: [changes, discover, plan-prod]
    if: >-
      needs.discover.outputs.has_prod == 'true'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch'
            && (inputs.run_ceph_ansible || inputs.run_mgmt_ansible || inputs.run_fabric))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.prod_matrix) }}
    environment:
      name: ${{ matrix.partition }}-${{ matrix.region }}
    env: *apply-env
    steps: *apply-steps
