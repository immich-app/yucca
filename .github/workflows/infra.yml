name: Infra (Terraform)

# Applies the staging Terraform stacks from CI, then converges the bare-metal
# Ceph cluster with Ansible:
#   - tf/deployment/staging/ceph   (ceph cluster 1P password items; no node contact)
#   - tf/deployment/staging/talos  (Talos config, Cilium, Flux bootstrap, secrets)
#   - tf/deployment/staging/dns    (Cloudflare records for the ingress hosts)
#   - tf/deployment/staging/netbird (NetBird Cloud groups/policies/setup keys)
#   - tf/deployment/prod/global + prod/htz-fsn1/netbird (prod NetBird, layered:
#     a global layer + per-site layers — runs as its own gated jobs at the bottom
#     of this file, on the prod 1P SA / tf/.env.prod)
#   - ansible/ceph (deploy pipeline) (cephadm convergence: OSDs, RGW realm +
#     S3/metrics-worker users, monitoring, tuning, hardening) — the TF stacks
#     only MINT the RGW keys into 1P; this step is what actually creates the
#     matching RGW users on the cluster, so the metrics worker can authenticate.
#
# Plan runs on PRs touching tf/** or ansible/ceph/**; apply runs on merge to main
# behind the `staging-infra` Environment gate (required reviewers). Both the Talos
# stack and the Ansible deploy talk to the nodes on the 10.10.10.0/24 management
# VLAN, which GitHub-hosted runners can't reach — so the runner joins the NetBird
# overlay as a `ci` peer (via the netbird-connect action + the minted CI setup
# key) and the existing staging route advertises that VLAN. (The prod fabric
# workflow still uses Tailscale; 10.40.5.0/24 isn't on NetBird yet.)
#
# Prerequisites (provisioned out-of-band):
#   - Repo secrets: OP_TF_YUCCA_STAGING_ENV (the staging-scoped 1P service-account
#     token — resolves tf/.env; dev/prod use OP_TF_YUCCA_DEV_ENV / OP_TF_YUCCA_PROD_ENV).
#   - BOOTSTRAP — the staging NetBird stack applied ONCE out-of-band, so the CI
#     setup key (op://yucca_tf_staging/NETBIRD_YUCCA_STAGING_CI_SETUP_KEY) exists
#     before any talos plan tries to connect. CI can't mint it itself: the apply
#     that mints it is gated behind the plan that needs it. Run once locally:
#       OP_SERVICE_ACCOUNT_TOKEN=<staging write SA> \
#         TF_STACK_DIR=tf/deployment/staging/netbird mise run tf:apply
#     Also: a NetBird route advertising 10.10.10.0/24 that the `ci` group may reach.
#   - GitHub Environment `staging-infra` with required reviewers (the apply gate).

on:
  push:
    branches: [main]
    paths: ["tf/**", "ansible/ceph/**"]
  pull_request:
    paths: ["tf/**", "ansible/ceph/**"]
  workflow_dispatch:

# Serialize: the OVH S3 backend has no state locking (single-operator model),
# so never let two infra runs apply concurrently.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # read-scoped SA for plan; apply overrides with the write SA
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TF_YUCCA_STAGING_ENV }}

jobs:
  plan:
    name: Plan ${{ matrix.stack }}
    # Skip on fork PRs (no access to secrets / the NetBird overlay).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [talos, dns, ceph, netbird]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise (opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

      # The talos plan reads `data.talos_cluster_health` (and the post-CNI gate),
      # which dial the cluster over the 10.10.10.0/24 overlay — so the talos plan
      # MUST join NetBird (data sources are read on plan and -refresh=false doesn't
      # skip them; the cloud-API stacks need no overlay). The CI setup key must
      # already exist in 1P: it's minted by the netbird apply, so a fresh repo is
      # bootstrapped by applying staging/netbird ONCE out-of-band (see header) —
      # after that every plan/apply just reads it, the same way the old Tailscale
      # OAuth was an out-of-band prerequisite.
      - name: Connect to NetBird
        if: matrix.stack == 'talos'
        uses: ./.github/actions/netbird-connect
        with:
          setup-key-ref: op://yucca_tf_staging/NETBIRD_YUCCA_STAGING_CI_SETUP_KEY/password
          hostname: gha-staging-plan-${{ github.run_id }}

      - name: Terragrunt plan
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/staging/${{ matrix.stack }}
          --non-interactive plan

  apply:
    name: Apply (gated)
    needs: plan
    # Only on merge to main (or manual dispatch) — never on PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The approval gate: `staging-infra` Environment with required reviewers.
    environment: staging-infra
    env:
      # write-capable SA (the onepassword provider creates the JWT item)
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TF_YUCCA_STAGING_ENV_WRITE }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise (opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

      # NetBird stack FIRST — pure api.netbird.io (no overlay needed), and it
      # mints the CI setup key into 1P that the connect step below reads. On a
      # fresh bootstrap this is what makes the key exist before anything joins.
      - name: Apply staging/netbird
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/staging/netbird
          --non-interactive apply -auto-approve

      # Join the NetBird overlay as a `ci` peer so the node-touching stacks and
      # the Ansible deploy below reach 10.10.10.0/24 (the staging route advertises
      # the LAN). Replaces the old Tailscale subnet-router path.
      - name: Connect to NetBird
        uses: ./.github/actions/netbird-connect
        with:
          setup-key-ref: op://yucca_tf_staging/NETBIRD_YUCCA_STAGING_CI_SETUP_KEY/password
          hostname: gha-staging-apply-${{ github.run_id }}

      # Ceph 1P password items (no node contact), then the Talos cluster
      # (provisions secrets/CNI/Flux), then DNS.
      - name: Apply staging/ceph
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/staging/ceph
          --non-interactive apply -auto-approve

      - name: Apply staging/talos
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/staging/talos
          --non-interactive apply -auto-approve

      - name: Apply staging/dns
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/staging/dns
          --non-interactive apply -auto-approve

      # ── Ceph convergence (Ansible) ──────────────────────────────────────
      # The TF stacks above only minted the RGW keys into 1P + the cluster
      # Secret; this is what creates the matching RGW users on the bare-metal
      # cluster. Runs after the TF apply so the inventory (rendered from the
      # ceph stack's `render` output) and the keys exist. Reuses the NetBird
      # overlay + 1Password session already established in this job.

      - name: Render Ansible inventory from the ceph TF state
        run: ansible/ceph/scripts/render-inventories.sh staging

      - name: Install the ansible-iac SSH key from 1Password
        # Pulls op://yucca_tf_staging/SIETCH_CEPH_ANSIBLE_IAC_SSH_KEY to
        # ~/.ssh/id_ed25519_sietch — the path the rendered inventory references.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          OP_VAULT=yucca_tf_staging ansible/ceph/scripts/install-ssh-keys.sh sietch

      - name: Provision the ceph Ansible toolchain (venv + collections)
        working-directory: ansible/ceph
        run: |
          mise trust
          mise install
          mise run setup

      - name: Deploy Ceph (full pipeline — baseline → tune → deploy → harden)
        working-directory: ansible/ceph
        # CI runner has no known_hosts for the bare-metal nodes; first contact is
        # over the NetBird overlay, so disable strict host-key checking for this run.
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          CEPH_ENV: inventories/sietch-ceph.staging.austin.int/inventory.ini
        run: mise run deploy

  # ── prod NetBird (global + site layers) ──────────────────────────────────────
  # Prod is its own env (separate 1P SA + env file), so it can't ride the
  # staging matrix above (that job's OP_SERVICE_ACCOUNT_TOKEN is the staging SA).
  # NetBird is pure api.netbird.io — no nodes, no tailnet — so these are the only
  # prod TF stacks CI touches today. Layered: prod/global (account-wide groups +
  # operator setup keys) then prod/<site>/netbird (site groups/keys/policies that
  # reference the global groups). Both select tf/.env.prod via OP_ENV_FILE.
  #
  # Additional prerequisites (out-of-band) beyond the staging ones above:
  #   - Repo secrets OP_TF_YUCCA_PROD_ENV (read) / OP_TF_YUCCA_PROD_ENV_WRITE
  #     (apply) — a prod-scoped 1P service account granted shared_tf (read, for
  #     NETBIRD_TF_PAT) + yucca_tf_prod (read/write, for the minted setup keys).
  #   - GitHub Environment `prod-infra` with required reviewers (the apply gate).
  netbird-prod-plan:
    name: Plan prod/netbird
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      OP_ENV_FILE: tf/.env.prod
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TF_YUCCA_PROD_ENV }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise (opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

      # Global layer first, then the site layer (which reads the global layer's
      # group_ids via a terragrunt dependency — mock_outputs cover the PR plan
      # before global is ever applied).
      - name: Terragrunt plan prod/global
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/prod/global
          --non-interactive plan

      - name: Terragrunt plan prod/htz-fsn1/netbird
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/prod/htz-fsn1/netbird
          --non-interactive plan

  netbird-prod-apply:
    name: Apply prod/netbird (gated)
    needs: netbird-prod-plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod-infra
    env:
      OP_ENV_FILE: tf/.env.prod
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TF_YUCCA_PROD_ENV_WRITE }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise (opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

      # Global layer must apply before the site layer (the site reads global's
      # group_ids output via its terragrunt dependency).
      - name: Apply prod/global
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/prod/global
          --non-interactive apply -auto-approve

      - name: Apply prod/htz-fsn1/netbird
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/prod/htz-fsn1/netbird
          --non-interactive apply -auto-approve
