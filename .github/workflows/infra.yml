name: Infra (Terraform)

# Applies the staging Terraform stacks from CI, then converges the bare-metal
# Ceph cluster with Ansible:
#   - tf/deployment/staging/ceph   (ceph cluster 1P password items; no node contact)
#   - tf/deployment/staging/talos  (Talos config, Cilium, Flux bootstrap, secrets)
#   - tf/deployment/staging/dns    (Cloudflare records for the ingress hosts)
#   - ansible/ceph (deploy pipeline) (cephadm convergence: OSDs, RGW realm +
#     S3/metrics-worker users, monitoring, tuning, hardening) — the TF stacks
#     only MINT the RGW keys into 1P; this step is what actually creates the
#     matching RGW users on the cluster, so the metrics worker can authenticate.
#
# Plan runs on PRs touching tf/** or ansible/ceph/**; apply runs on merge to main
# behind the `staging-infra` Environment gate (required reviewers). Both the Talos
# stack and the Ansible deploy talk to the nodes on the 10.10.10.0/24 management
# VLAN, which GitHub-hosted runners can't reach — so the runner joins the tailnet
# (the cluster firewall trusts the Tailscale CIDRs) and accepts the subnet route
# advertising that VLAN.
#
# Prerequisites (provisioned out-of-band):
#   - Repo secrets: OP_TF_YUCCA_STAGING_ENV (the staging-scoped 1P service-account
#     token — resolves tf/.env; dev/prod use OP_TF_YUCCA_DEV_ENV / OP_TF_YUCCA_PROD_ENV),
#     TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET (Tailscale OAuth client, tagged tag:project-yucca).
#   - A Tailscale subnet router advertising 10.10.10.0/24, and tag:project-yucca approved for
#     those routes.
#   - GitHub Environment `staging-infra` with required reviewers (the apply gate).

on:
  push:
    branches: [main]
    paths: ["tf/**", "ansible/ceph/**"]
  pull_request:
    paths: ["tf/**", "ansible/ceph/**"]
  workflow_dispatch:

# Serialize: the OVH S3 backend has no state locking (single-operator model),
# so never let two infra runs apply concurrently.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # read-scoped SA for plan; apply overrides with the write SA
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TF_YUCCA_STAGING_ENV }}

jobs:
  plan:
    name: Plan ${{ matrix.stack }}
    # Skip on fork PRs (no access to secrets / tailnet).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [talos, dns, ceph]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise (opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

      # The Talos stack refreshes state against the nodes; the DNS and ceph
      # stacks are pure Cloudflare/1Password API and need no tailnet.
      - name: Connect to Tailscale
        if: matrix.stack == 'talos'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:project-yucca
          # NB: the action already passes `--accept-routes` to `tailscale up`;
          # passing it again here errors with "flag provided multiple times".

      - name: Terragrunt plan
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/staging/${{ matrix.stack }}
          --non-interactive plan

  apply:
    name: Apply (gated)
    needs: plan
    # Only on merge to main (or manual dispatch) — never on PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The approval gate: `staging-infra` Environment with required reviewers.
    environment: staging-infra
    env:
      # write-capable SA (the onepassword provider creates the JWT item)
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TF_YUCCA_STAGING_ENV_WRITE }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up mise (opentofu + terragrunt)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@a5215d3a7f75c1629216c465ea9ab3ab399c4b71 # v4.0.0

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:project-yucca
          # NB: the action already passes `--accept-routes` to `tailscale up`;
          # passing it again here errors with "flag provided multiple times".

      # Ceph 1P password items first (no node contact), then the Talos cluster
      # (provisions secrets/CNI/Flux), then DNS.
      - name: Apply staging/ceph
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/staging/ceph
          --non-interactive apply -auto-approve

      - name: Apply staging/talos
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/staging/talos
          --non-interactive apply -auto-approve

      - name: Apply staging/dns
        run: >-
          tf/op-run.sh terragrunt
          --working-dir tf/deployment/staging/dns
          --non-interactive apply -auto-approve

      # ── Ceph convergence (Ansible) ──────────────────────────────────────
      # The TF stacks above only minted the RGW keys into 1P + the cluster
      # Secret; this is what creates the matching RGW users on the bare-metal
      # cluster. Runs after the TF apply so the inventory (rendered from the
      # ceph stack's `render` output) and the keys exist. Reuses the tailnet +
      # 1Password session already established in this job.

      - name: Render Ansible inventory from the ceph TF state
        run: ansible/ceph/scripts/render-inventories.sh staging

      - name: Install the ansible-iac SSH key from 1Password
        # Pulls op://yucca_tf_staging/SIETCH_CEPH_ANSIBLE_IAC_SSH_KEY to
        # ~/.ssh/id_ed25519_sietch — the path the rendered inventory references.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          OP_VAULT=yucca_tf_staging ansible/ceph/scripts/install-ssh-keys.sh sietch

      - name: Provision the ceph Ansible toolchain (venv + collections)
        working-directory: ansible/ceph
        run: |
          mise trust
          mise install
          mise run setup

      - name: Deploy Ceph (full pipeline — baseline → tune → deploy → harden)
        working-directory: ansible/ceph
        # CI runner has no known_hosts for the bare-metal nodes; first contact is
        # over the tailnet, so disable strict host-key checking for this run.
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          CEPH_ENV: inventories/sietch-ceph.staging.austin.int/inventory.ini
        run: mise run deploy
