name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # zizmor cache-poisoning: never restore a shared cache in a job that
          # publishes packages.
          cache: false
      - run: mise run prepare

      - name: Publish
        run: |
          pnpm -r \
            --filter @futo-org/backups-api-client \
            --filter @futo-org/backups-orchestrator-api \
            --filter @futo-org/backups-orchestrator-ui \
            publish --access public --provenance --no-git-checks

  docker:
    name: Publish standalone image
    uses: immich-app/devtools/.github/workflows/multi-runner-build.yml@50dc3a14f0606ecd8fc28d78d3a3c655115ab695 # multi-runner-build-workflow-v3.1.0
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: futo-backups-standalone
      context: .
      dockerfile: packages/standalone-app/Dockerfile

  docker-restic-proxy:
    name: Publish restic-proxy image
    uses: immich-app/devtools/.github/workflows/multi-runner-build.yml@50dc3a14f0606ecd8fc28d78d3a3c655115ab695 # multi-runner-build-workflow-v3.1.0
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: futo-backups-restic-proxy
      context: .
      dockerfile: packages/restic-proxy/Dockerfile
