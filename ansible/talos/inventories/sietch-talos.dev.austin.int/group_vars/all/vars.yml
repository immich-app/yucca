---
# Cluster-wide variables for the sietch-talos cluster.
#
# Most operators editing this file want one of:
#   - talos_version          — bump Talos release
#   - talos_vm_mac_prefix    — change MAC OUI / locally-administered prefix
#   - vlan_*_*               — tweak network details

# ─── Cluster identity ───────────────────────────────────────────────────
# Short cluster name. Also drives talos_domain_prefix below (and the
# TF-side 1P secret prefixes). A second cluster would get its own
# inventory dir with a different talos_cluster_name.
talos_cluster_name: "sietch"

# Libvirt domain prefix for Talos VMs on this cluster. talos_vms role
# reads this to compose `<prefix>-<vm-name>` (e.g. sietch-talos-cp1).
# Aligns with the monorepo FQDN scheme `<cluster>-<role>-<name>.<domain>`.
talos_domain_prefix: "{{ talos_cluster_name }}-talos"

# Cluster FQDN suffix (where the K8s API + node FQDNs land). The TF
# bootstrap uses this to seed kubeconfig endpoints and Talos cert SANs.
talos_domain: "dev.austin.int.futo.cloud"

# ─── Talos version + image (Image Factory) ──────────────────────────────
# Pinned for reproducibility. Bump deliberately; refresh all three
# checksums (image + kernel + initramfs) with the version.
talos_version: "1.13.3"

# Factory schematic — extensions baked into the boot assets:
# siderolabs/{qemu-guest-agent, util-linux-tools}. ID is sha256 of the
# schematic; regenerate at https://factory.talos.dev and refresh checksums
# if the set changes.
talos_schematic_id: "a7bcadbc1b6d03c0e687be3a5d9789ef7113362a6a1a038653dfd16283a92b6b"
talos_factory_base: "https://factory.talos.dev/image/{{ talos_schematic_id }}/v{{ talos_version }}"

# Disk image — qcow2 overlays back onto this pre-seeded raw (partitions
# present, no install step). Boots to maintenance mode until TF applies config.
talos_image_url: "{{ talos_factory_base }}/metal-amd64.raw.zst"
talos_image_sha256: "c7515f1076db75f6ec4287b4b5663ea0d490363a0d49b04e61fe96bfe71b2cc6"

# Kernel + initramfs — staged and direct-booted by libvirt (not on-disk
# GRUB) to inject a per-VM `ip=` for static first-boot addressing.
# Upgrades: re-stage assets + reboot (the disk kernel is bypassed).
talos_kernel_url: "{{ talos_factory_base }}/kernel-amd64"
talos_initramfs_url: "{{ talos_factory_base }}/initramfs-amd64.xz"
talos_kernel_sha256: "c36d4aac36d081af8016ff9874f29115bf1493d23e556b99d355316afa0e98ff"
talos_initramfs_sha256: "d613bd10a0b7742e17705e0643ec62e19150522a018fb27855535c75918eabc7"

talos_image_dir: "/var/lib/libvirt/images"

# Filenames keyed on version + short schematic hash so a schematic change at
# the same version yields new filenames and re-stages, instead of serving
# the stale cached image. default('stock') when no schematic.
talos_image_tag: "v{{ talos_version }}-{{ (talos_schematic_id | default('stock', true))[:12] }}"
talos_base_image_path: "{{ talos_image_dir }}/talos-{{ talos_image_tag }}.raw"
talos_kernel_path: "{{ talos_image_dir }}/talos-vmlinuz-{{ talos_image_tag }}"
talos_initramfs_path: "{{ talos_image_dir }}/talos-initramfs-{{ talos_image_tag }}.xz"

# ─── Static addressing (libvirt kernel `ip=`) ────────────────────────────
# Per-VM static_ip is in host_vars; gateway/mask/interface are VLAN-50
# constants. Gateway hardcoded (first usable in 10.50.0.0/16) to avoid an
# ansible.utils dependency; TF derives the same via cidrhost().
talos_vms_network_gateway: "10.50.0.1"
talos_vms_network_mask: "255.255.0.0"
talos_vms_network_interface: "enp1s0"

# ─── VM MAC prefix ──────────────────────────────────────────────────────
# SideroLabs has no registered OUI (verified against IEEE registry +
# maclookup.app; Talos prescribes no convention). Choosing 52:54:00:50:XX:XX:
#   - 52:54:00  — QEMU/KVM OUI; widely understood by network tools as
#                 virtual-machine traffic and matches libvirt defaults.
#   - 50         — fixed distinguisher; literal hex "50" mnemonically
#                 matches VLAN 50, separating Talos VMs from any other
#                 QEMU VMs that might land on these hosts later.
#   - last 2 bytes — computed in talos_vms role from a deterministic
#                 hash of vm_name so the same VM gets the same MAC
#                 across reprovisions (stable identity at the switch;
#                 workers' VLAN-51 DHCP leases stay pinned).
talos_vm_mac_prefix: "52:54:00:50"

# Secondary MAC prefix for the VLAN-51 Services NIC on worker VMs.
# Same scheme — 52:54:00 QEMU OUI, fourth octet "51" for VLAN-51
# mnemonic, last two bytes from the same per-vm-name sha1 hash as the
# primary NIC. Workers thus end up with two related but distinct MACs
# (e.g., worker3 → 52:54:00:50:5a:cd on VLAN 50, 52:54:00:51:5a:cd on
# VLAN 51), which is easy to correlate at switch / DHCP server level.
# CPs do not get a Services NIC; only used when item.role == 'worker'.
talos_vm_mac_prefix_services: "52:54:00:51"

# ─── VLANs ──────────────────────────────────────────────────────────────
# Both VLANs are tagged upstream at the switch and arrive on the host
# as tagged frames over bond0. Roles add bridge + VLAN sub-interfaces;
# they don't touch the physical bond.
vlan_compute_id: 50
vlan_compute_name: "compute"
vlan_compute_bridge: "br-vlan50"
vlan_compute_subnet: "10.50.0.0/16"
vlan_compute_dhcp_start: "10.50.0.16"
vlan_compute_dhcp_end: "10.50.4.255"

vlan_services_id: 51
vlan_services_name: "services"
vlan_services_bridge: "br-vlan51"
vlan_services_subnet: "10.51.0.0/16"

# ─── Talos cluster topology ─────────────────────────────────────────────
# Reserved (static) IPs sit OUTSIDE the DHCP range above so leases
# can't collide. VIP is the documented control-plane endpoint that
# operators put in their kubeconfig.
talos_cp_vip: "10.50.0.10"

# ─── libvirt host config ────────────────────────────────────────────────
# Storage pool that holds base image + per-VM overlays + (later)
# snapshots. Lives on the OS root by default; switch to RBD in a
# follow-up iteration.
libvirt_storage_pool_name: "talos"
libvirt_storage_pool_path: "{{ talos_image_dir }}"

# ─── Profile selector ───────────────────────────────────────────────────
# `full`  = 3 CP + 3 workers (production, the default) — one CP + one
#           worker per hypervisor, so each host is its own failure domain
#           for both the control plane and the worker pool.
# `smoke` = 1 CP + 1 worker (both on laurel) — single-host validation for
#           substrate changes; select explicitly with `-e profile=smoke`.
# Per-host VM lists are declared in host_vars and gated by this.
talos_profile: "full"
