; Example inventory for sietch-talos. The RUNTIME inventory.ini in this
; same directory is TF-rendered (tf/shared/modules/talos-cluster/
; modules/inventory-renderer/) and gitignored. This .example file is
; checked in as documentation of the expected shape.
;
; To render the runtime inventory:
;   TF_STACK_DIR=tf/deployment/dev/talos mise run tf:apply
;
; Sietch hypervisors. The 3 nodes are co-located in Austin, run Ceph
; OSDs on bare metal, and host Talos VMs as guests.
;
; ansible_host = bond0 IP (10.10.10.0/24 management/storage VLAN, the
;   existing Ceph cluster network — NOT the new Talos VLAN 50).
; If 10.10.10.0/24 isn't directly reachable from your workstation, put any
;   needed SSH bastion / ProxyJump in your ~/.ssh/config.

[hypervisors]
sietch-ceph-laurel ansible_host=10.10.10.90
sietch-ceph-lawson ansible_host=10.10.10.91
sietch-ceph-samara ansible_host=10.10.10.92

[hypervisors:vars]
ansible_user=ansible-iac
ansible_ssh_private_key_file=~/.ssh/id_ed25519_sietch
ansible_ssh_common_args='-o ControlMaster=auto -o ControlPersist=60s'
ansible_python_interpreter=/usr/bin/python3
