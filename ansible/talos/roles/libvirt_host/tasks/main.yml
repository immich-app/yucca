---
# Pre-flight refuses to proceed without KVM: qemu under TCG is too slow for Talos
# workloads, and its absence means BIOS virt extensions off, kernel module
# missing, or a container with no /dev/kvm passthrough.

- name: Pre-flight — role enabled
  ansible.builtin.assert:
    that: libvirt_host_enabled | bool
    fail_msg: >-
      libvirt_host_enabled is false; nothing to do. Set it true in
      group_vars or with -e libvirt_host_enabled=true to apply.
    success_msg: "libvirt_host enabled — proceeding."
  tags: [libvirt_host, preflight]

- name: Pre-flight — /dev/kvm exists
  ansible.builtin.stat:
    path: /dev/kvm
  register: _kvm_dev
  tags: [libvirt_host, preflight]

- name: Pre-flight — fail if /dev/kvm missing
  ansible.builtin.assert:
    that: _kvm_dev.stat.exists
    fail_msg: >-
      /dev/kvm not present on this host. Either KVM kernel modules
      aren't loaded (modprobe kvm_intel / kvm_amd) or virtualization
      extensions are disabled in BIOS/UEFI. Investigate before
      re-running.
  tags: [libvirt_host, preflight]

- name: Install libvirt + qemu packages
  ansible.builtin.apt:
    name: "{{ libvirt_host_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [libvirt_host, packages]

- name: Ensure libvirtd is enabled and running
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started
  tags: [libvirt_host]


- name: Define Talos storage pool
  community.libvirt.virt_pool:
    command: define
    name: "{{ libvirt_host_pool_name }}"
    xml: "{{ lookup('template', 'talos-pool.xml.j2') }}"
  tags: [libvirt_host, pool]

- name: Set Talos storage pool to autostart
  community.libvirt.virt_pool:
    autostart: true
    name: "{{ libvirt_host_pool_name }}"
  tags: [libvirt_host, pool]

- name: Activate Talos storage pool
  community.libvirt.virt_pool:
    state: active
    name: "{{ libvirt_host_pool_name }}"
  tags: [libvirt_host, pool]

# libvirt's default network stays defined, but autostart off so virbr0 + dnsmasq
# do not come up at every libvirtd start.
- name: Set default network autostart=no
  community.libvirt.virt_net:
    autostart: false
    name: default
  when:
    - libvirt_host_disable_default_network_autostart | bool
  failed_when: false  # default network may not exist on minimal installs
  tags: [libvirt_host, network]

- name: Verify libvirtd answers virsh queries (smoke check)
  ansible.builtin.command: virsh version
  register: _virsh_version
  changed_when: false
  tags: [libvirt_host, verify]

- name: Show virsh version (operator visibility)
  ansible.builtin.debug:
    var: _virsh_version.stdout_lines
  tags: [libvirt_host, verify]
