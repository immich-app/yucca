---
# Make Talos VM traffic on br-vlan50/51 bypass the Ceph nftables inet filter:
# br_netfilter (loaded by libvirt on first VM start) hooks bridge frames into
# the netfilter IP layer, where Ceph's default-DROP forward chain silently kills
# them. Deliberately NO nftables rules -- the sysctl bypass keeps our state
# disjoint from the Ceph-owned ruleset. Pre-conditions: br_netfilter loadable;
# Ceph HEALTH_OK (asserted by the upstream preflight.yml import).

- name: Pre-flight — role enabled
  ansible.builtin.assert:
    that: nftables_bridges_enabled | bool
    fail_msg: >-
      nftables_bridges_enabled is false; nothing to do. Set it true
      via the prepare-hypervisors role-vars or with
      -e nftables_bridges_enabled=true to apply.
    success_msg: "nftables_bridges enabled — proceeding."
  tags: [nftables_bridges, preflight]

- name: Ensure br_netfilter module is loaded (now + persistent across reboots)
  community.general.modprobe:
    name: "{{ nftables_bridges_module }}"
    state: present
    persistent: present
  tags: [nftables_bridges]

- name: Set bridge-nf-call sysctls to disabled
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ nftables_bridges_sysctl_file }}"
    state: present
    reload: true
  loop: "{{ nftables_bridges_sysctls | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  tags: [nftables_bridges]

- name: Verify sysctls are at the requested values (kernel-side)
  ansible.builtin.command:
    cmd: "sysctl -n {{ item.key }}"
  register: _sysctl_check
  changed_when: false
  failed_when: _sysctl_check.stdout.strip() != item.value
  loop: "{{ nftables_bridges_sysctls | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [nftables_bridges, verify]

- name: Show effective bridge-nf state (operator visibility)
  ansible.builtin.debug:
    msg: >-
      bridge-nf-call-iptables = {{ nftables_bridges_sysctls['net.bridge.bridge-nf-call-iptables'] }};
      bridge-nf-call-ip6tables = {{ nftables_bridges_sysctls['net.bridge.bridge-nf-call-ip6tables'] }}.
      VM traffic on bridges will bypass the inet filter table.
  tags: [nftables_bridges, verify]
