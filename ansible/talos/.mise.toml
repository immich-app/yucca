[tools]
python = "3.12"

[env]
# Project-local virtualenv for all Python tooling
VIRTUAL_ENV = "{{config_root}}/.venv"
PATH = "{{config_root}}/.venv/bin:{{env.PATH}}"
# Note: TALOS_ENV is intentionally NOT declared here. mise's [env] block
# overrides shell-exported values, which silently sends operators to the
# wrong cluster. Operators must export TALOS_ENV once per shell session:
#   export TALOS_ENV=inventories/sietch-talos.dev.austin.int/inventory.ini
# Inventory file is TF-rendered — `TF_STACK_DIR=tf/deployment/dev/talos mise run tf:apply`
# (from yucca root) if missing.

[tasks.setup]
description = "Bootstrap development environment"
run = """
#!/usr/bin/env bash
set -euo pipefail

echo "=== Creating virtualenv ==="
python -m venv .venv
source .venv/bin/activate

echo "=== Installing Python dependencies ==="
pip install -q -r requirements.txt

echo "=== Installing Ansible collections ==="
ansible-galaxy collection install -r requirements.yml

echo "=== Verifying ==="
ansible --version | head -1
ansible-lint --version | head -1
yamllint --version

echo ""
echo "Environment ready. Run 'mise trust' if prompted."
echo "Next: 'TF_STACK_DIR=tf/deployment/dev/talos mise run tf:apply' from yucca root to render inventory."
"""

[tasks.lint]
description = "Run all linters (yamllint + ansible-lint + shellcheck)"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo "=== yamllint ==="
yamllint roles/ *.yml
echo ""
echo "=== ansible-lint ==="
ansible-lint
echo ""
echo "=== shellcheck ==="
if command -v shellcheck &>/dev/null; then
  shellcheck scripts/*.sh && echo "All scripts pass"
else
  echo "shellcheck not installed — skipping (install: pacman -S shellcheck)"
fi
"""

[tasks.check]
description = "Syntax-check all playbooks (no 1P access required)"
run = """
#!/usr/bin/env bash
set -euo pipefail
# Syntax-check only parses YAML — any valid inventory works. Default to
# sietch-talos when TALOS_ENV isn't inline-prefixed; the parse is identical.
TALOS_ENV="${TALOS_ENV:-inventories/sietch-talos.dev.austin.int/inventory.ini}"
# Fall back to inventory.example.ini before tf:apply has rendered the runtime one.
if [ ! -f "$TALOS_ENV" ]; then
  EXAMPLE="$(dirname "$TALOS_ENV")/inventory.example.ini"
  if [ -f "$EXAMPLE" ]; then
    echo "(runtime inventory.ini not yet rendered; falling back to inventory.example.ini)"
    TALOS_ENV="$EXAMPLE"
  fi
fi
for pb in *.yml; do
  case "$pb" in
    requirements.yml) continue ;;
    *)
      echo "Checking $pb..."
      ansible-playbook -i "$TALOS_ENV" --syntax-check "$pb" 2>&1 | tail -1
      ;;
  esac
done
"""

[tasks.preflight]
description = "Pre-flight: cluster health + hypervisor readiness (read-only)"
run = "scripts/ansible-play.sh preflight.yml"

[tasks."prepare-hypervisors"]
description = "Idempotent infra prep (bridges + libvirt + nftables + base image)"
run = "scripts/ansible-play.sh prepare-hypervisors.yml"

[tasks.provision]
description = "Provision Talos VMs (default profile=full; pass -- -e profile=smoke for smoke)"
run = "scripts/ansible-play.sh provision-vms.yml"

[tasks."destroy-vms"]
description = "Tear down Talos VMs + overlays (lab cleanup; leaves bridges + libvirt intact)"
run = "scripts/ansible-play.sh destroy-vms.yml"

[tasks."rollback-nftables-bridges"]
description = "Revert bridge-nf-call sysctls to kernel defaults (paired with nftables_bridges role)"
run = "scripts/ansible-play.sh rollback-nftables-bridges.yml"
