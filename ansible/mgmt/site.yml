---
# Configure the FSN1 mgmt hosts after Robot auto-install of Debian 13 (trixie).
# Fresh hosts are reached over their PUBLIC IP (bootstrap); once NetBird-joined,
# later runs reconnect over the NetBird IP (first play). Canonical entrypoint:
# `mise run mgmt:ansible` (renders inventory from TF; passes the provisioning key
# + op://yucca_tf_prod/NETBIRD_YUCCA_PROD_<REGION>_MGMT_SETUP_KEY).
# networkd role (25G VLANs) gated on mgmt_networkd_enabled (default false: the
# 25G fabric link is currently unreliable).

# ── Prefer NetBird, fall back to the public IP ───────────────────────────────
# Runs entirely on the control node (no target connection), so it's safe before
# a host is reachable at all. If the host is a connected NetBird peer, switch the
# connection to its NetBird IP; otherwise keep the public IP (bootstrap).
- name: Select connection address
  hosts: mgmt
  gather_facts: false
  become: false
  tasks:
    - name: Read the NetBird overlay status from the control node
      ansible.builtin.command: netbird status --json
      delegate_to: localhost
      register: _nb_status
      changed_when: false
      failed_when: false

    - name: Reconnect over NetBird when the host is a connected peer
      vars:
        _nb_ips: >-
          {{ ((_nb_status.stdout | from_json).peers.details | default([]))
             | selectattr('fqdn', 'defined')
             | selectattr('fqdn', 'match', '^' ~ inventory_hostname ~ '([.]|$)')
             | selectattr('status', 'equalto', 'Connected')
             | map(attribute='netbirdIp') | select | list }}
      ansible.builtin.set_fact:
        ansible_host: "{{ _nb_ips[0] if (_nb_ips | length > 0) else mgmt_public_ip }}"
      when:
        # `-e mgmt_bootstrap=true` forces the public IP — use it for the first run
        # after a reinstall, when a stale OLD peer for this host may still show up.
        - not (mgmt_bootstrap | default(false) | bool)
        - _nb_status.rc == 0
        - (_nb_status.stdout | trim | length) > 0

- name: Configure management hosts
  hosts: mgmt
  become: true
  gather_facts: true

  roles:
    - baseline
    - users
    - security
    - networkd
    - netbird
