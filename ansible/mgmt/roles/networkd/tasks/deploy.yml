---
# Write systemd-networkd config for the OOB management NIC + the 25G fabric
# VLANs, and make sure networkd is running. Safe to re-run. Only the NICs matched
# below are managed; the primary public NIC is left to its own manager.

- name: Ensure systemd-networkd is enabled and running
  ansible.builtin.systemd:
    name: systemd-networkd
    enabled: true
    state: started

# ── OOB management LAN (1G; the switch vme lives here) ──────────────────────
- name: Deploy OOB management .network
  ansible.builtin.template:
    src: oob.network.j2
    dest: "{{ mgmt_networkd_config_dir }}/10-{{ mgmt_oob.nic }}.network"
    owner: root
    group: root
    mode: '0644'
  when: mgmt_oob.nic is defined
  notify: Reload systemd for networkd

# ── 25G fabric VLAN sub-interfaces ──────────────────────────────────────────
- name: Deploy fabric parent .network (declares VLANs, no L3 of its own)
  ansible.builtin.template:
    src: fabric.network.j2
    dest: "{{ mgmt_networkd_config_dir }}/20-{{ mgmt_fabric_nic }}.network"
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd for networkd

- name: Deploy VLAN .netdev files
  ansible.builtin.template:
    src: vlan.netdev.j2
    dest: "{{ mgmt_networkd_config_dir }}/30-{{ mgmt_fabric_nic }}.{{ vlan.id }}.netdev"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ mgmt_fabric_vlans }}"
  loop_control:
    loop_var: vlan
    label: "vlan {{ vlan.id }}"
  notify: Reload systemd for networkd

- name: Deploy VLAN .network files
  ansible.builtin.template:
    src: vlan.network.j2
    dest: "{{ mgmt_networkd_config_dir }}/30-{{ mgmt_fabric_nic }}.{{ vlan.id }}.network"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ mgmt_fabric_vlans }}"
  loop_control:
    loop_var: vlan
    label: "vlan {{ vlan.id }}"
  notify: Reload systemd for networkd
