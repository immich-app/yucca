---
# systemd-networkd L3 so the node forwards the NetBird-routed site subnets:
#   - OOB 1G NIC on the management LAN (mgmt_oob: 10.40.5.0/24 — switch vme)
#   - tagged VLAN sub-interfaces on the 25G fabric NIC (public/private/api)
#
# Gated on mgmt_networkd_enabled (default true). The OOB path is 1G/reliable;
# the 25G VLANs are written but stay carrier-down (RequiredForOnline=no) until
# that link is up — harmless until then. Only the OOB + fabric NICs are Matched,
# so the primary public NIC (Hetzner's default) is left untouched.

- name: Deploy networkd configs
  ansible.builtin.import_tasks: deploy.yml
  when: mgmt_networkd_enabled | bool
