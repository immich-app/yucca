---
# 25G fabric NIC (Intel E810, "ice" driver). Predictable name may differ on a
# fresh Debian 13 install — the prior name was enp33s0f0np0. Check `ip link`
# after reprovision and correct this if needed.
mgmt_fabric_nic: enp33s0f0np0

# VLAN sub-interface addresses on the 25G NIC.
# VLAN 20 = cluster public (10.40.20.0/23), VLAN 22 = cluster private
# (10.40.22.0/23). Gateways are .1 on the leaf IRB.
mgmt_fabric_vlans:
  - id: 20
    address: 10.40.20.2/23
  - id: 22
    address: 10.40.22.2/23

# This host is the Tailscale subnet router for the management LAN.
mgmt_tailscale_advertise_routes: "10.40.5.0/24"
