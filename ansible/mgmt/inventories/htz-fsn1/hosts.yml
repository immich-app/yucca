---
# Hetzner FSN1 management hosts (two AX41-NVMe, Debian 13 "trixie").
# Static inventory — committed (unlike ceph's TF-rendered .ini files).
#
# Ansible connects as root using the TF provisioning key. Render it from
# 1Password to a temp file and pass --private-key, or point
# ansible_ssh_private_key_file at it (see README). ansible_host is the public
# IP; the hosts live on Hetzner's DHCP default for the primary NIC.

mgmt:
  hosts:
    htz-fsn-mgmt-1:
      ansible_host: 178.63.124.40
    htz-fsn-mgmt-2:
      ansible_host: 178.63.124.41
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
