---
# Host/user/addressing data is TF-GENERATED at run time (hosts.yml,
# host_vars/*.yml, users.generated.yml) by tf/render/ansible-mgmt from the
# Terraform sources (mgmt-hosts.yaml, fabric-addressing, identity). Edit those,
# not the generated files. Only truly-static config lives here.

timezone: UTC
mgmt_domain: fsn.htz.futo.cloud

# NetBird "mgmt" setup key — NOT hardcoded; passed at run time by
# `mise run mgmt:ansible` from op://yucca_tf_prod/NETBIRD_YUCCA_PROD_<REGION>_MGMT_SETUP_KEY.
mgmt_netbird_setup_key: ""
