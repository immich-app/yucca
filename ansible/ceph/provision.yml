---
# Provision sietch-ceph nodes from the Debian 12 live image (no cloning):
#   1. Boot targets to the live image (user/live), reachable on bond_ip
#   2. CEPH_ENV=inventories/<cluster>/inventory-provision.ini \
#        scripts/ansible-play.sh provision.yml -e confirm_wipe=true
# Flags: confirm_wipe=true (required, DESTROYS SSD data);
#   provision_create_iac_keypair=true (opt-in keypair autogen);
#   provision_skip_reboot=true (skip reboot + verify, chroot canary inspection);
#   --limit <host> (one node at a time).
# Post-reboot verify runs via the production SSH alias as ansible-iac and
# checks the provisioning marker.

# --- Preflight: controller-side prerequisites -------------------------
# Verifies the ansible-iac deploy keypair before touching targets; generation is
# opt-in (-e provision_create_iac_keypair=true), else fail fast.

- name: Preflight — verify controller prerequisites
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Stat ansible-iac private key
      ansible.builtin.stat:
        path: "{{ provision_iac_ssh_key_path | expanduser }}"
      register: iac_privkey_stat

    - name: Stat ansible-iac public key
      ansible.builtin.stat:
        path: "{{ (provision_iac_ssh_key_path | expanduser) ~ '.pub' }}"
      register: iac_pubkey_stat

    - name: Generate ansible-iac keypair (only when opt-in flag is set)
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t ed25519 -N ''
          -C "ansible-iac@{{ cluster_name }}-{{ cluster_role }}.{{ cluster_domain }}"
          -f {{ provision_iac_ssh_key_path | expanduser }}
      args:
        creates: "{{ provision_iac_ssh_key_path | expanduser }}"
      when:
        - not iac_privkey_stat.stat.exists
        - provision_create_iac_keypair | default(false) | bool

    - name: Fail if ansible-iac keypair missing and create flag not set
      ansible.builtin.fail:
        msg: |
          ansible-iac deploy keypair is missing on the controller:
            {{ provision_iac_ssh_key_path | expanduser }}
            {{ provision_iac_ssh_key_path | expanduser }}.pub

          This keypair is required to provision the cluster — it is
          installed into ansible-iac's authorized_keys on every node
          and used by ansible_ssh_private_key_file in inventory.ini.

          To auto-generate it on this run, re-invoke with:
            -e provision_create_iac_keypair=true

          Or generate it yourself first:
            ssh-keygen -t ed25519 -N '' \
              -C "ansible-iac@{{ cluster_name }}-{{ cluster_role }}.{{ cluster_domain }}" \
              -f {{ provision_iac_ssh_key_path }}
      when:
        - not iac_privkey_stat.stat.exists
        - not (provision_create_iac_keypair | default(false) | bool)

    - name: Re-stat public key after potential creation
      ansible.builtin.stat:
        path: "{{ (provision_iac_ssh_key_path | expanduser) ~ '.pub' }}"
      register: iac_pubkey_final_stat

    - name: Assert ansible-iac public key exists after preflight
      ansible.builtin.assert:
        that:
          - iac_pubkey_final_stat.stat.exists
        fail_msg: >-
          ansible-iac public key still missing at
          {{ (provision_iac_ssh_key_path | expanduser) ~ '.pub' }}
          after preflight completed. Investigate ssh-keygen task above.

    - name: Report ansible-iac keypair ready
      ansible.builtin.debug:
        msg: >-
          ansible-iac keypair present at
          {{ provision_iac_ssh_key_path | expanduser }}(.pub) —
          preflight OK.

- name: Provision sietch-ceph nodes (live image → installed OS)
  hosts: provision_targets
  gather_facts: false
  serial: 1
  become: true
  max_fail_percentage: 0

  roles:
    - role: provision_host

- name: Verify provisioned nodes after reboot
  hosts: provision_targets
  gather_facts: false
  become: false
  tasks:
    # Runs on localhost via the production SSH alias, avoiding live-vs-installed
    # credential juggling in one play.

    - name: Skip verification play when reboot was intentionally skipped
      ansible.builtin.meta: end_play
      when: provision_skip_reboot | default(false) | bool

    # Head start: R730xd POST->systemd brings the bond up in ~60-90s.
    - name: Initial reboot wait
      delegate_to: localhost
      ansible.builtin.pause:
        seconds: "{{ provision_reboot_wait_delay | default(60) }}"

    # ssh (not wait_for/tcp) is the gate because it honors ~/.ssh/config
    # (ProxyJump etc.). Force -l/-i/IdentitiesOnly: the host alias defaults to
    # 'ops', which has NO authorized_keys on a fresh provision. known_hosts is
    # bypassed because provisioning mints new host keys and a stale entry would
    # abort with "REMOTE HOST IDENTIFICATION HAS CHANGED"; real identity check
    # is the marker assertion below.
    - name: Probe installed OS via production SSH alias (as ansible-iac)
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >-
          ssh -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o IdentitiesOnly=yes
          -o LogLevel=ERROR
          -l ansible-iac
          -i {{ provision_iac_ssh_key_path | expanduser }}
          {{ hostname_short }}
          "cat {{ provision_marker_path | default('/etc/ceph-provisioned.json') }}"
      register: marker_read
      changed_when: false
      retries: "{{ provision_verify_retries | default(30) }}"
      delay: "{{ provision_verify_delay | default(15) }}"
      until: marker_read.rc == 0

    - name: Parse provisioning marker
      ansible.builtin.set_fact:
        marker: "{{ marker_read.stdout | from_json }}"

    - name: Verify marker contents match inventory expectations
      ansible.builtin.assert:
        that:
          - marker.hostname == hostname_short
          - marker.bond_ip == bond_ip
          - marker.cluster_domain == cluster_domain
          - marker.admin_user == admin_user
        fail_msg: "Marker contents do not match inventory: {{ marker }}"
        success_msg: "{{ hostname_short }} provisioned OK at {{ marker.provisioned_at }}"

    - name: Gather installed OS hostname (as ansible-iac)
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >-
          ssh -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o IdentitiesOnly=yes
          -o LogLevel=ERROR
          -l ansible-iac
          -i {{ provision_iac_ssh_key_path | expanduser }}
          {{ hostname_short }} hostname -f
      register: installed_hostname
      changed_when: false

    - name: Display post-provision state
      ansible.builtin.debug:
        msg:
          - "hostname -f:        {{ installed_hostname.stdout | trim }}"
          - "marker.hostname:    {{ marker.hostname }}"
          - "marker.fqdn:        {{ marker.fqdn }}"
          - "marker.bond_ip:     {{ marker.bond_ip }}"
          - "marker.provisioned: {{ marker.provisioned_at }}"
