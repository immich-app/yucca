---
# Reusable Ceph-health checkpoint, imported pre+post on each serial converge
# play (baseline / tune-* / harden). Halts the roll on HEALTH_ERR, but ONLY when
# a live cluster answers -- during initial bootstrap `ceph health` cannot run, so
# the probe is failed_when:false and the assert is gated on it succeeding.
# With serial + max_fail_percentage:0, a batch that takes data offline halts at
# the next checkpoint instead of propagating fleet-wide. One check per batch
# (run_once, delegated to the bootstrap host).

- name: Probe Ceph health (no-op until the cluster is live)
  ansible.builtin.command: ceph health --format json
  register: _ceph_health_gate
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  when: (groups['ceph_bootstrap'] | default([]) | length) > 0

- name: Halt the converge if the cluster is unhealthy
  ansible.builtin.assert:
    that:
      - (_ceph_health_gate.stdout | from_json).status in ['HEALTH_OK', 'HEALTH_WARN']
    fail_msg: >-
      Ceph is {{ (_ceph_health_gate.stdout | from_json).status }} at this converge
      checkpoint - halting the roll before it reaches more nodes. A prior batch
      likely degraded the cluster; investigate `ceph health detail` before continuing.
    success_msg: "Ceph {{ (_ceph_health_gate.stdout | from_json).status }} at converge checkpoint."
  run_once: true
  when:
    - (groups['ceph_bootstrap'] | default([]) | length) > 0
    - (_ceph_health_gate.rc | default(1)) == 0
