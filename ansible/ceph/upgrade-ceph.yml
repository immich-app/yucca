---
# DELIBERATE, MANUALLY-INVOKED day-2 op -- intentionally NOT in site.yml; converge
# must never trigger an upgrade.
#
# REQUIRED target (no default): -e ceph_upgrade_target_image=quay.io/ceph/ceph:v20.2.2
#   (preferred) or -e ceph_upgrade_version=20.2.2. `--check` dry-runs the preflight.
#
# ROLLBACK: full runbook in docs/runbooks/upgrade-ceph.md. cephadm rolls one
# daemon type at a time and auto-pauses on failure; rollback = re-run this play
# targeting the printed PRIOR image (or `ceph orch upgrade stop` then re-target).
# NEVER cross a major release downward -- rollback is safe only within 20.2.x.

- name: Upgrade Ceph (cephadm-orchestrated, health-gated)
  hosts: ceph_nodes
  become: true
  gather_facts: false

  vars:
    ceph_upgrade_poll_retries: 120
    ceph_upgrade_poll_delay: 30
    # Preflight/postflight normally demand HEALTH_OK. Flip to true (on the CLI)
    # only after reviewing `ceph health detail` and judging the WARN benign.
    ceph_upgrade_allow_health_warn: false

  pre_tasks:
    # Same TF-rendered placement guard as deploy-ceph.yml: every cluster op is
    # delegated to groups['ceph_bootstrap'][0]; against a hand-written stopgap
    # inventory that lacks the group this would index an empty list.
    - name: Assert the bootstrap placement group is present  # noqa: run-once[task]
      ansible.builtin.assert:
        that:
          - (groups['ceph_bootstrap'] | default([])) | length == 1
        fail_msg: >-
          Inventory is missing the TF-rendered ceph_bootstrap group (need exactly
          one host). Render it first: scripts/render-inventories.sh <partition>
          <region>. Refusing to upgrade.
        success_msg: "Bootstrap node: {{ groups['ceph_bootstrap'][0] }}."
      run_once: true

    # Refuse to run without an explicit, operator-supplied target. No default
    # image/version is baked in -- an accidental converge cannot pick one up.
    - name: Assert an explicit upgrade target was provided  # noqa: run-once[task]
      ansible.builtin.assert:
        that:
          - (ceph_upgrade_target_image | default('') | string | length > 0)
            or (ceph_upgrade_version | default('') | string | length > 0)
        fail_msg: >-
          No upgrade target. Pass exactly one of:
          -e ceph_upgrade_target_image=quay.io/ceph/ceph:v20.2.X  (preferred)
          or -e ceph_upgrade_version=20.2.X. Refusing to run with no target.
        success_msg: >-
          Target:
          {{ ceph_upgrade_target_image
             | default('ceph-version ' ~ (ceph_upgrade_version | default('')), true) }}.
      run_once: true

  tasks:
    - name: Run the health-gated upgrade flow on the bootstrap node
      ansible.builtin.import_tasks: tasks/ceph_upgrade.yml
