[tools]
python = "3.12"

[env]
# Project-local virtualenv for all Python tooling
VIRTUAL_ENV = "{{config_root}}/.venv"
PATH = "{{config_root}}/.venv/bin:{{env.PATH}}"
# CEPH_ENV deliberately NOT declared here: mise [env] overrides shell exports,
# silently sending operators to the wrong cluster. Export it per shell session:
#   export CEPH_ENV=inventories/staging-austin/sietch/inventory.ini
# Inventories are TF-generated (`mise run tf:apply` from yucca root if missing).

[tasks.setup]
description = "Bootstrap development environment"
run = """
#!/usr/bin/env bash
set -euo pipefail

echo "=== Creating virtualenv ==="
python -m venv .venv
source .venv/bin/activate

echo "=== Installing Python dependencies ==="
pip install -q -r requirements.txt

echo "=== Installing Ansible collections ==="
ansible-galaxy collection install -r requirements.yml

echo "=== Verifying ==="
ansible --version | head -1
ansible-lint --version | head -1
yamllint --version

echo ""
echo "Environment ready. Run 'mise trust' if prompted."
echo "Next: run 'mise run tf:apply' (from the yucca root) to render inventories."
"""

[tasks.lint]
description = "Run all linters (yamllint + ansible-lint + shellcheck)"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo "=== yamllint ==="
yamllint roles/ *.yml
echo ""
echo "=== ansible-lint ==="
ansible-lint
echo ""
echo "=== shellcheck ==="
if command -v shellcheck &>/dev/null; then
  shellcheck scripts/*.sh && echo "All scripts pass"
else
  echo "shellcheck not installed — skipping (install: pacman -S shellcheck)"
fi
"""

[tasks.check]
description = "Syntax-check all playbooks (no 1P access required)"
run = """
#!/usr/bin/env bash
set -euo pipefail
# Syntax-check only parses YAML — any valid inventory works. Default to
# sietch when CEPH_ENV isn't inline-prefixed; the parse is identical.
CEPH_ENV="${CEPH_ENV:-inventories/staging-austin/sietch/inventory.ini}"
for pb in *.yml; do
  case "$pb" in
    requirements.yml|ansible-navigator.yml) continue ;;
    *)
      echo "Checking $pb..."
      ansible-playbook -i "$CEPH_ENV" --syntax-check "$pb" 2>&1 | tail -1
      ;;
  esac
done
"""

[tasks.test]
description = "Run Molecule tests for roles with test scenarios"
run = """
#!/usr/bin/env bash
set -euo pipefail
for role in roles/*/molecule; do
  ROLE_DIR=$(dirname "$role")
  ROLE_NAME=$(basename "$ROLE_DIR")
  echo "=== Testing $ROLE_NAME ==="
  (cd "$ROLE_DIR" && molecule verify)
done
"""

[tasks.preflight]
description = "Pre-flight checks (TF artifacts, 1P session, SSH, connectivity)"
run = "scripts/preflight.sh"

[tasks.status]
description = "Quick cluster health check (read-only)"
run = "scripts/ansible-play.sh status.yml"

[tasks.drift]
description = "Detect configuration drift from expected state"
run = "scripts/ansible-play.sh drift.yml"

[tasks.logs]
description = "Ship ceph node journald to o11y over the overlay (fluent-bit)"
run = "scripts/ansible-play.sh logging.yml"

[tasks.netbird]
description = "Enroll ceph nodes into NetBird (reads the setup key from 1Password)"
run = """
#!/usr/bin/env bash
set -euo pipefail
# op creds: CI provides a SA token in OP_SERVICE_ACCOUNT_TOKEN; locally we use
# the team-futo desktop session (same pattern as mgmt:ansible).
ACCT=(); [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ] && ACCT=(--account "${OP_ACCOUNT:-team-futo}")
# Only prod/htz-fsn1 mints a ceph setup key today (tf netbird stack). The key is
# needed for FRESH enrollment only; converge of enrolled nodes runs key-free via
# site.yml/deploy.
NB_SETUP_KEY=$(op read "${ACCT[@]}" "op://yucca_tf_prod/NETBIRD_YUCCA_PROD_HTZ_FSN1_CEPH_SETUP_KEY/password")
# NetBird API token (management PAT): sets ssh_enabled per peer, which the
# client --allow-server-ssh flag alone cannot do. Only needed to enable the
# SSH server; enrollment-only runs work without it.
NB_API_TOKEN=$(op read "${ACCT[@]}" "op://shared_tf/NETBIRD_TF_PAT/password")
scripts/ansible-play.sh netbird.yml \
  --extra-vars "ceph_netbird_setup_key=$NB_SETUP_KEY" \
  --extra-vars "ceph_netbird_api_token=$NB_API_TOKEN" "$@"
"""

[tasks.deploy]
description = "Full deploy: baseline → tune → deploy → tune ceph → harden"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ -f ansible.log ] && [ "$(wc -c < ansible.log)" -gt 1048576 ]; then
  mv ansible.log "ansible.$(date +%Y%m%dT%H%M%S).log"
  echo "Rotated ansible.log (>1MB)"
fi
echo "=== Baseline ==="       && scripts/ansible-play.sh baseline.yml
echo "=== OS tuning ==="      && scripts/ansible-play.sh tune-os.yml
echo "=== Hardware tuning ===" && scripts/ansible-play.sh tune-hardware.yml
echo "=== Deploy Ceph ==="     && scripts/ansible-play.sh deploy-ceph.yml
echo "=== Ceph tuning ==="     && scripts/ansible-play.sh tune-ceph.yml
echo "=== Harden ==="          && scripts/ansible-play.sh harden.yml
"""

[tasks.destroy]
description = "Destroy Ceph cluster (requires confirmation)"
run = """
#!/usr/bin/env bash
set -euo pipefail
CEPH_ENV_DIR=$(dirname "$CEPH_ENV")              # e.g., inventories/staging-austin/sietch
REGION_SLUG=$(basename "$(dirname "$CEPH_ENV_DIR")")  # e.g., staging-austin (<partition>-<region>)
DOMAIN="${REGION_SLUG/-/.}.int.futo.cloud"        # e.g., staging.austin.int.futo.cloud
DESTROY_INV="$CEPH_ENV_DIR/inventory-destroy.ini"
echo "Usage: scripts/ansible-play.sh destroy-ceph.yml \\"
echo "  -e yes_destroy_ceph=true -e destroy_target_domain=$DOMAIN"
echo "  (with CEPH_ENV=$DESTROY_INV if destroying as root)"
echo ""
read -rp "Run destroy now? [y/N] " confirm
if [[ "$confirm" =~ ^[Yy]$ ]]; then
  CEPH_ENV="$DESTROY_INV" scripts/ansible-play.sh destroy-ceph.yml \
    -e yes_destroy_ceph=true \
    -e destroy_target_domain="$DOMAIN"
fi
"""

[tasks.bench]
description = "S3 benchmark (parallel PUT/GET against local RGW)"
run = "scripts/ansible-play.sh bench.yml"

[tasks.bench-rados]
description = "RADOS bench (raw cluster I/O, bypasses RGW)"
run = "scripts/ansible-play.sh rados-bench.yml"

[tasks.backup]
description = "Export Ceph cluster config for disaster recovery"
run = "scripts/ansible-play.sh backup-config.yml"

[tasks.capture]
description = "Snapshot bootstrap secrets (RGW TLS, admin keyring) to 1P (DR belt)"
run = "scripts/ansible-play.sh post-deploy-capture.yml"

[tasks."backup-timer"]
description = "Install + enable the scheduled cluster-state backup timer on the bootstrap node"
run = "scripts/ansible-play.sh backup-ceph.yml"

[tasks."rotate-certs"]
description = "Rotate RGW TLS cert (regenerate self-signed, restart RGW daemons)"
run = "scripts/ansible-play.sh rotate-certs.yml"

[tasks."rotate-ssh-key"]
description = "Distribute current ansible-iac pubkey from 1P to nodes (forward-only)"
run = "scripts/ansible-play.sh rotate-ssh-key.yml"

[tasks."hardware-inventory"]
description = "Snapshot per-node hardware facts to JSON (informational only)"
run = "scripts/ansible-play.sh hardware-inventory.yml"

[tasks."migrate-networkd"]
description = "One-shot ifupdown→networkd migration (rolling, serial=1, noout-gated)"
run = "scripts/ansible-play.sh migrate-networkd.yml"

[tasks.reprovision]
description = "Hetzner installimage reprovision (rescue -> reset -> installimage -> verify). DESTRUCTIVE - canary first."
run = """
#!/usr/bin/env bash
set -euo pipefail
# HETZNER_ROBOT_* come from tf/.env.prod via op run; the same op session also
# satisfies ansible-play.sh's inner op inject of secrets.yml.tpl. Set CEPH_ENV first.
OP_ACCOUNT=team-futo op run --env-file=../../tf/.env.prod -- \\
  scripts/ansible-play.sh reprovision.yml "$@"
"""
