---
# Full site playbook: tune -> deploy -> tune ceph -> harden -> ship logs, in
# dependency order. Provisioning is separate: run provision.yml (live image,
# -e confirm_wipe=true) first, then `scripts/ansible-play.sh site.yml` or
# `mise run deploy` (wraps ansible-play.sh per sub-playbook).

- name: OS baseline (ops user, packages, /etc/hosts)
  import_playbook: baseline.yml

- name: NetBird overlay enrollment (endpoints only; gated by ceph_netbird_enabled)
  import_playbook: netbird.yml

- name: OS tuning (sysctl, TCP buffers)
  import_playbook: tune-os.yml

- name: Hardware tuning (I/O scheduler, readahead)
  import_playbook: tune-hardware.yml

- name: Deploy Ceph Tentacle cluster
  import_playbook: deploy-ceph.yml

- name: Post-deploy Ceph tuning
  import_playbook: tune-ceph.yml

- name: Security hardening (nftables, SSH)
  import_playbook: harden.yml

- name: Host log shipping (journald to o11y; gated by ceph_fluentbit_enabled)
  import_playbook: logging.yml
