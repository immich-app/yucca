---
# Vector: ship each node's journald to o11y's VictoriaLogs over the NetBird
# overlay. Endpoint-only, like the netbird role: no listeners, no aggregation
# tier, one agent per node writing straight to the mesh vmauth.
ceph_vector_enabled: false

# Pinned + dpkg-held, same rationale as netbird: the log path is operational
# infrastructure and its journald field mapping is version-coupled. Installed
# from the pinned .deb rather than an apt repo so there is no third-party repo
# to drift and the artifact is auditable.
ceph_vector_version: "0.57.0"
ceph_vector_deb_url: >-
  https://apt.vector.dev/pool/v/ve/vector_{{ ceph_vector_version }}-1_amd64.deb

# o11y ingest. VictoriaLogs' native journald endpoint (/insert/journald) is NOT
# routed by o11y's mesh vmauth, so we use the elasticsearch bulk path, which is.
# Host must resolve to the gateway VIP: o11y distributes its DNS zone only to
# the operator + o11y router groups, so ceph nodes get a hosts entry instead
# (the same thing father does in CoreDNS).
ceph_vector_o11y_host: vmauth.o11y.futo.network
ceph_vector_o11y_vip: "10.69.0.10"
ceph_vector_endpoint: "https://{{ ceph_vector_o11y_host }}/insert/elasticsearch/"

# Stamped on every line so logs join the metrics tags. `cluster` is per-cluster;
# site/env match the vmagent external_labels for spice.
ceph_vector_cluster_label: "{{ cluster_name }}"
ceph_vector_site_label: htz-fsn1
ceph_vector_env_label: prod

# Fields journald entries are streamed by. ceph writes to journald directly via
# libsystemd (_TRANSPORT=journal, not through podman), so SYSLOG_IDENTIFIER is
# the daemon type (ceph-mon / ceph-mgr / ceph-osd / radosgw).
ceph_vector_stream_fields: "host,SYSLOG_IDENTIFIER"

# Drop-at-source patterns. The fleet emits ~2.4M lines/hour and the OSDs are
# nearly silent (~200/hr for all 15); the volume is mon/mgr status chatter.
# These two account for most of it and carry no diagnostic value. Anything not
# matched here still ships, including the cluster health channel.
ceph_vector_drop_pattern: 'pgmap v\d+|_set_new_cache_sizes'

# Disk buffer so an o11y or overlay outage queues locally instead of dropping.
# Vector requires >= 256MB for disk buffers.
ceph_vector_buffer_bytes: 536870912

# Prometheus endpoint for the agent's own metrics. Exposed here so a dead log
# pipeline is visible rather than looking like a quiet cluster; the netops
# vmagent scrape job for it is a follow-up, not in this change.
ceph_vector_metrics_port: 9598
