---
# Install Vector (pinned) and ship journald to o11y over the NetBird overlay.
# Convergeable: install is pin+hold, config is templated, restart is handlerless
# (an explicit restart on change keeps the read checkpoint honest).

- name: Assert the node is on the overlay
  # No route to the gateway VIP without it. Fail here with the enrolment hint
  # rather than let vector spin on connection refused.
  ansible.builtin.command: netbird status
  register: ceph_vector_nb
  changed_when: false
  failed_when: "'Management: Connected' not in ceph_vector_nb.stdout"

- name: Query the installed vector version
  ansible.builtin.command: dpkg-query -W -f='${Version}' vector
  register: ceph_vector_installed
  changed_when: false
  failed_when: false

- name: Unhold vector only when the pinned version differs (keeps converge clean)
  ansible.builtin.dpkg_selections:
    name: vector
    selection: install
  when: (ceph_vector_installed.stdout | default('')) is not match(ceph_vector_version)

- name: Install Vector at the pinned version
  ansible.builtin.apt:
    deb: "{{ ceph_vector_deb_url }}"
  when: (ceph_vector_installed.stdout | default('')) is not match(ceph_vector_version)

- name: Hold vector at the pinned version
  ansible.builtin.dpkg_selections:
    name: vector
    selection: hold

# o11y publishes its mesh DNS zone only to the operator + o11y-router groups, so
# the ceph peers cannot resolve the gateway name. Envoy routes by Host/SNI, so
# pointing vector at the bare IP would 404 - hence a hosts entry, not an IP URL.
- name: Resolve the o11y gateway name locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ ceph_vector_o11y_host | regex_escape }}$'
    line: "{{ ceph_vector_o11y_vip }} {{ ceph_vector_o11y_host }}"
    owner: root
    group: root
    mode: '0644'

- name: Let vector read the journal
  ansible.builtin.user:
    name: vector
    groups: systemd-journal
    append: true

- name: Template the vector config
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: /etc/vector/vector.yaml
    owner: root
    group: vector
    mode: '0640'
    validate: "vector validate --no-environment-check %s"
  notify: Restart vector

- name: Enable and start vector
  ansible.builtin.systemd:
    name: vector
    enabled: true
    state: started
    daemon_reload: true

- name: Apply any pending restart before verifying
  # The health check below is only meaningful against the new config, so the
  # handler has to run here rather than at end-of-play.
  ansible.builtin.meta: flush_handlers

- name: Verify vector is shipping (health endpoint responds)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ceph_vector_metrics_port }}/metrics"
    return_content: false
  register: ceph_vector_health
  retries: 6
  delay: 5
  until: ceph_vector_health.status == 200
