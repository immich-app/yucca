---
# Security hardening for Ceph nodes.
# Firewall (nftables) + SSH hardening.
# Run AFTER ceph_deploy so cephadm orchestrator can freely deploy daemons.

# --- nftables firewall ---

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# --- Firewall drop logging (ulogd2) ---
# ulogd2 listens on the NFLOG group the drop rule logs to (role defaults have
# the why). It converges BEFORE the ruleset so the group never emits into the
# void, and the handler flush below applies a config-change restart now rather
# than at end of play, where old-config ulogd2 would listen the whole play.

- name: Install ulogd2 (NFLOG listener + JSON output)
  ansible.builtin.apt:
    name:
      - ulogd2
      - ulogd2-json
    state: present
  when: ceph_firewall_enabled | bool

- name: Deploy ulogd2 config
  ansible.builtin.template:
    src: ulogd.conf.j2
    dest: /etc/ulogd.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart ulogd2
  when: ceph_firewall_enabled | bool

- name: Rotate the drop log
  ansible.builtin.template:
    src: nft-drop.logrotate.j2
    dest: /etc/logrotate.d/nft-drop
    owner: root
    group: root
    mode: '0644'
  when: ceph_firewall_enabled | bool

- name: Enable and start ulogd2
  ansible.builtin.systemd:
    name: ulogd2
    enabled: true
    state: started
  when: ceph_firewall_enabled | bool

- name: Apply any pending ulogd2 restart before the ruleset goes live
  ansible.builtin.meta: flush_handlers

- name: Deploy nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    validate: "nft -c -f %s"
  when: ceph_firewall_enabled | bool

# Reload the firewall only when the LIVE filter table actually differs from the
# desired one -- not merely when the rendered file changed. On DIFF we `reload`
# (ExecReload = nft -f /etc/nftables.conf), which with the table-scoped config
# atomically replaces ONLY table inet filter and leaves the podman/docker tables
# alone -- unlike a `restart`, whose ExecStop flushes the whole ruleset (that
# momentary flush can stall OSD peering and drop podman's rules). The desired
# state is normalized by loading the config into a throwaway network namespace --
# fully isolated, it never touches the live firewall -- then its table inet filter
# is compared to the live one. Both sides go through nft's own output formatting,
# so the match is on effective rules, not file text. Counter VALUES are masked
# before comparing: the live rule has counted packets, the netns one never has,
# and that difference is not drift. Anything inconclusive falls
# back to reloading (DIFF), so the firewall is never left stale or drifted.
- name: Compare the live nftables ruleset against the desired one
  ansible.builtin.shell: |
    set -o pipefail
    norm() { grep -vE '^[[:space:]]*#' | sed -E 's/counter packets [0-9]+ bytes [0-9]+/counter/; s/[[:space:]]+/ /g; s/^ +//; s/ +$//' | grep -v '^$'; }
    live="$(nft list table inet filter 2>/dev/null | norm)"
    ns="nft-cmp-$$"
    ip netns add "$ns"
    if ip netns exec "$ns" nft -f /etc/nftables.conf 2>/dev/null; then
      desired="$(ip netns exec "$ns" nft list table inet filter 2>/dev/null | norm)"
      [ "$live" = "$desired" ] && echo SAME || echo DIFF
    else
      echo DIFF
    fi
    ip netns del "$ns" 2>/dev/null || true
  args:
    executable: /bin/bash
  register: nft_ruleset_cmp
  changed_when: false
  check_mode: false
  when: ceph_firewall_enabled | bool

- name: Enable nftables and reload only when the live ruleset differs
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: >-
      {{ 'reloaded'
         if (nft_ruleset_cmp.stdout | default('DIFF') | trim) == 'DIFF'
         else 'started' }}
  when: ceph_firewall_enabled | bool

# Connections established BEFORE the firewall (conntrack) loaded are picked up
# mid-stream with an unknown window scale; strict tracking marks their packets
# INVALID, so they miss the established,related accept and die at the drop
# policy (2026-07-20: wedged 9 OSDs + 7 RGWs on spice at first activation).
# Liberal window tracking lets those flows match established and survive.
- name: Keep pre-firewall TCP flows alive (liberal conntrack window tracking)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-ceph-conntrack.conf
    content: |
      # Managed by Ansible (security role). See role tasks for rationale.
      net.netfilter.nf_conntrack_tcp_be_liberal = 1
    owner: root
    group: root
    mode: '0644'
  when: ceph_firewall_enabled | bool

- name: Apply conntrack sysctl now (module loaded by the nftables ct rules)
  ansible.builtin.command: sysctl -q -p /etc/sysctl.d/99-ceph-conntrack.conf
  changed_when: false
  when: ceph_firewall_enabled | bool

- name: Show active nftables rules
  ansible.builtin.command: nft list ruleset
  register: nft_rules
  changed_when: false
  when: ceph_firewall_enabled | bool

- name: Display firewall summary
  ansible.builtin.debug:
    msg: "{{ nft_rules.stdout_lines | default(['Firewall disabled']) }}"

# --- SSH hardening ---

- name: Deploy SSH hardening config
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart sshd

- name: Verify full SSH config is valid after drop-in
  ansible.builtin.command: sshd -t
  changed_when: false

# --- Summary ---

- name: Report security state
  ansible.builtin.debug:
    msg:
      - "Firewall: {{ 'enabled' if ceph_firewall_enabled else 'disabled' }}"
      - "Trusted networks: {{ ceph_firewall_trusted_networks | join(', ') }}"
      - "SSH AllowUsers: {{ ceph_ssh_allowed_users }}"
      - "SSH PermitRootLogin: {{ ceph_ssh_permit_root_login }}"
