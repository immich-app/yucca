---
# Post-deploy Ceph cluster tuning.
# Requires a running cluster -- all tasks use ceph CLI commands.
# Runs from the bootstrap node only.
#
# Every config-set task checks the current value first and only
# applies changes when needed, so re-runs report accurate changed counts.

# --- Telemetry ---

- name: Check telemetry status
  ansible.builtin.command: ceph telemetry status --format json
  register: telemetry_status
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Enable telemetry phone-home (transparency; anonymous, all channels)
  ansible.builtin.command: ceph telemetry on --license sharing-1-0
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_telemetry_enabled | bool
    - not ((telemetry_status.stdout | from_json).enabled | default(false))
  changed_when: true

- name: Disable telemetry phone-home
  ansible.builtin.command: ceph telemetry off
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - not (ceph_telemetry_enabled | bool)
    - (telemetry_status.stdout | from_json).enabled | default(true)
  changed_when: true

# --- Ceph config model ---
#
# Merge the three layers, diff against the live mon database, apply only what
# differs. The diff is a script rather than a Jinja comparison because
# `ceph config dump` reports every value as a string (604800.000000 for an int
# option, "true" for a bool) while the model holds real YAML types, and the
# `float` filter returns 0.0 for anything non-numeric -- which would read
# "balanced" and "high_recovery_ops" as equal.

- name: Merge Ceph config layers
  ansible.builtin.set_fact:
    ceph_config_effective: >-
      {{ ceph_config_defaults
         | combine(ceph_config_cluster, ceph_config_host, recursive=True) }}
  when: inventory_hostname in groups['ceph_bootstrap']

- name: Diff declared Ceph config against the mon database
  ansible.builtin.script: ceph_config_diff.py
  environment:
    CEPH_CONFIG_MODEL: >-
      {{ {'desired': ceph_config_effective,
          'prune': ceph_config_prune,
          'gate_keys': ceph_config_gate_keys} | to_json }}
  register: ceph_config_plan
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Parse Ceph config plan
  ansible.builtin.set_fact:
    ceph_config_changes: "{{ ceph_config_plan.stdout | from_json }}"
  when: inventory_hostname in groups['ceph_bootstrap']

- name: Report pending Ceph config changes
  ansible.builtin.debug:
    msg: >-
      {{ ceph_config_changes.set | length }} option(s) to set,
      {{ ceph_config_changes.rm | length }} superseded entry(ies) to remove
  when: inventory_hostname in groups['ceph_bootstrap']

# Gate keys sort first (the script orders them), so
# osd_mclock_override_recovery_settings lands before the recovery limits it
# gates rather than depending on dict ordering in the model.
- name: Apply Ceph config values
  ansible.builtin.command:
    argv: ["ceph", "config", "set", "{{ item.who }}", "{{ item.key }}", "{{ item.value }}"]
  loop: "{{ ceph_config_changes.set | default([]) }}"
  when: inventory_hostname in groups['ceph_bootstrap']
  loop_control:
    label: "{{ item.who }}/{{ item.key }}: {{ item.current | default('unset') }} -> {{ item.value }}"
  changed_when: true

# Safety interlock for the prune below. The recovery limits are moving from
# `global` to `osd`, and under mclock an `osd`-section write can be reverted.
# If that happened and we removed the `global` copy anyway, the effective value
# would fall through to the mclock default of 1000 concurrent backfills. So
# confirm the running daemons actually report the declared values first; a
# mismatch fails the play with `global` still in place, which is the safe state.
- name: Verify gated options landed on a running OSD
  ansible.builtin.shell: |
    set -o pipefail
    OSD=$(ceph osd tree -f json | python3 -c "
    import sys, json
    up = [n['id'] for n in json.load(sys.stdin)['nodes']
          if n.get('type') == 'osd' and n.get('status') == 'up']
    print(up[0] if up else '')
    ")
    [ -n "$OSD" ] || { echo 'no OSD is up to verify against'; exit 1; }
    export CEPH_VERIFY_OSD="$OSD"
    ceph tell osd."$OSD" config show | python3 -c "
    import json, os, sys
    expected = json.loads(os.environ['CEPH_EXPECTED_GATED'])
    running = json.load(sys.stdin)
    osd = os.environ['CEPH_VERIFY_OSD']
    bad = []
    for key, want in expected.items():
        got = running.get(key)
        if got is None:
            bad.append(f'{key}: not reported by osd.{osd}')
            continue
        if str(got) == str(want):
            continue
        try:
            if float(got) == float(want):
                continue
        except (TypeError, ValueError):
            pass
        bad.append(f'{key}: osd.{osd} runs {got}, model declares {want}')
    if bad:
        print('\n'.join(bad))
        sys.exit(1)
    print(f'osd.{osd} runs the declared values for: ' + ', '.join(expected))
    "
  args:
    executable: /bin/bash
  environment:
    CEPH_EXPECTED_GATED: >-
      {{ (ceph_config_effective.osd | default({}))
         | dict2items
         | selectattr('key', 'in', ceph_config_gated_options)
         | items2dict | to_json }}
  register: ceph_config_verify
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_config_changes.rm | default([]) | length > 0
  changed_when: false

- name: Remove superseded Ceph config entries
  ansible.builtin.command:
    argv: ["ceph", "config", "rm", "{{ item.section }}", "{{ item.name }}"]
  loop: "{{ ceph_config_changes.rm | default([]) }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_config_verify is succeeded
  loop_control:
    label: "{{ item.section }}/{{ item.name }} (was {{ item.current }})"
  changed_when: true

# --- Crash daemon ---

- name: Verify ceph-crash daemon is deployed
  ansible.builtin.shell: |
    set -o pipefail
    ceph orch ls --service-type crash --format json | python3 -c "
    import sys, json
    svcs = json.load(sys.stdin)
    running = sum(s.get('status', {}).get('running', 0) for s in svcs)
    print(running)
    "
  args:
    executable: /bin/bash
  register: crash_daemon_count
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Deploy ceph-crash if not running
  ansible.builtin.command: ceph orch apply crash
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (crash_daemon_count.stdout | default('0') | int) == 0
  changed_when: true

# --- Log rotation ---

- name: Check log rotation config exists
  ansible.builtin.find:
    paths: /etc/logrotate.d
    patterns: "ceph-*"
  register: logrotate_check
  when: inventory_hostname in groups['ceph_bootstrap']

- name: Report log rotation status
  ansible.builtin.debug:
    msg: >-
      {{ 'Log rotation configured: ' ~ logrotate_check.files[0].path
         if logrotate_check.files | default([]) | length > 0
         else 'WARNING: No Ceph logrotate config found' }}
  when: inventory_hostname in groups['ceph_bootstrap']

# --- CRUSH tunables ---

- name: Ensure CRUSH tunables are optimal
  ansible.builtin.shell: |
    set -o pipefail
    OPTIMAL=$(ceph osd crush show-tunables --format json \
      | python3 -c "import sys, json; print(json.load(sys.stdin).get('optimal_tunables', 0))")
    [ "$OPTIMAL" = "1" ] || { ceph osd crush tunables optimal; echo CHANGED; }
  args:
    executable: /bin/bash
  register: crush_tunables
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: "'CHANGED' in (crush_tunables.stdout | default(''))"

# --- Prometheus alerting rules ---
# cephadm ships 89 built-in alert rules across 16 groups (OSD, MON, PG,
# pool, MDS, hardware, network, etc.). No custom rules needed -- verify
# they're loaded.

- name: Verify Prometheus alert rules are loaded
  ansible.builtin.shell: |
    set -o pipefail
    GROUPS=$(curl -sf http://{{ bond_ip }}:{{ ceph_prometheus_port }}/api/v1/rules \
      2>/dev/null \
      | python3 -c "
    import sys, json
    print(len(json.load(sys.stdin).get('data', {}).get('groups', [])))
    " 2>/dev/null || echo 0)
    echo "Prometheus: $GROUPS alert rule groups"
    if [ "$GROUPS" -lt 10 ]; then
      echo "WARNING: expected 16+ rule groups, got $GROUPS"
    fi
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Audit logging ---

- name: Check audit logging state
  ansible.builtin.command: >
    ceph config get mgr mgr/cephadm/log_to_cluster
  register: audit_state
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  failed_when: false

- name: Enable Ceph audit logging
  ansible.builtin.shell: |
    ceph config set mgr mgr/cephadm/log_to_cluster true
    ceph config set global log_to_cluster_level audit
  args:
    executable: /bin/bash
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_audit_enabled | bool
    - audit_state.stdout | default('') | trim != 'true'
  changed_when: true

# --- Summary ---

- name: Show applied Ceph tuning
  ansible.builtin.shell: |
    set -o pipefail
    echo "=== Recovery throttling ==="
    ceph config get osd osd_recovery_max_active
    ceph config get osd osd_max_backfills
    echo "=== Scrub window ==="
    ceph config get osd osd_scrub_begin_hour
    ceph config get osd osd_scrub_end_hour
    echo "=== PG autoscaler ==="
    ceph config get global mon_target_pg_per_osd
    echo "=== Crash daemons ==="
    ceph orch ls --service-type crash
    echo "=== Telemetry ==="
    ceph telemetry status 2>&1 | head -3
  args:
    executable: /bin/bash
  register: tuning_summary
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Display tuning summary
  ansible.builtin.debug:
    msg: "{{ tuning_summary.stdout_lines }}"
  when: inventory_hostname in groups['ceph_bootstrap']
