---
# Drift checks for os_tuning. Read-only.
# Included via include_role + tasks_from, NOT vars_files: vars_files loads role
# defaults at precedence 14 (outranking group_vars 4 / host_vars 9), so cluster
# overrides would read as drift; include_role loads them at 2 (normal layering).
# Appends to drift_results; set_fact (19) outranks role defaults, so a later
# role's defaults cannot reset the accumulator.

- name: Check sysctl values
  ansible.builtin.shell: |
    set -o pipefail
    sysctl -n {{ item.key }} 2>/dev/null | tr -d ' '
  args:
    executable: /bin/bash
  loop:
    - key: vm.swappiness
      expected: "{{ ceph_sysctl_vm_swappiness }}"
    - key: vm.min_free_kbytes
      expected: "{{ ceph_sysctl_vm_min_free_kbytes }}"
    - key: vm.zone_reclaim_mode
      expected: "{{ ceph_sysctl_vm_zone_reclaim_mode }}"
    - key: fs.aio-max-nr
      expected: "{{ ceph_sysctl_fs_aio_max_nr }}"
    - key: kernel.pid_max
      expected: "{{ ceph_sysctl_kernel_pid_max }}"
  register: sysctl_checks
  changed_when: false
  loop_control:
    label: "{{ item.key }}"

- name: Record sysctl drift
  ansible.builtin.set_fact:
    drift_results: >-
      {{ drift_results + [{
        'category': 'sysctl',
        'item': item.item.key,
        'expected': item.item.expected | string,
        'actual': item.stdout | trim,
        'match': (item.stdout | trim) == (item.item.expected | string)
      }] }}
  loop: "{{ sysctl_checks.results }}"
  loop_control:
    label: "{{ item.item.key }}"
