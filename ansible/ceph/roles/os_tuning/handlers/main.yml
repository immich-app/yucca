---
- name: Apply sysctl tuning
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-ceph-tuning.conf
  changed_when: true

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
