---
# Controller-side preflight, run ONCE from reprovision.yml Play 1 pre_tasks
# (include_role ... tasks_from: preflight, run_once: true). Loading it through the
# role makes the role defaults (robot url/creds, canary marker) available, and
# run_once means --limit cannot skip it (unlike a separate hosts: localhost play).
# Asserts creds/keys, enforces the fan-out gate, and registers the rescue keys +
# publishes their fingerprints onto localhost facts for the per-host robot.yml.

- name: Assert Robot creds present in env (from op run --env-file=tf/.env.prod)
  ansible.builtin.assert:
    that:
      - reprovision_robot_username | length > 0
      - reprovision_robot_password | length > 0
    fail_msg: >-
      HETZNER_ROBOT_{USERNAME,PASSWORD} not in env. Run via 'mise run reprovision'
      (which wraps op run --env-file=../../tf/.env.prod).

- name: Stat the spice ansible-iac keypair on the controller
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ reprovision_ssh_key_path | expanduser }}"
    - "{{ reprovision_ssh_key_path | expanduser }}.pub"
  register: reprovision_key_stat
  delegate_to: localhost

- name: Assert the keypair exists
  ansible.builtin.assert:
    that: reprovision_key_stat.results | map(attribute='stat.exists') | min
    fail_msg: "Missing {{ reprovision_ssh_key_path }} (.pub). Run scripts/install-ssh-keys.sh spice."

- name: Assert every target carries hetzner_server_number (host_vars loaded)
  ansible.builtin.assert:
    that: hostvars[item].hetzner_server_number is defined
    fail_msg: "{{ item }} has no hetzner_server_number. Run scripts/gen-spice-host-vars.py."
  loop: "{{ ansible_play_hosts_all }}"

- name: Stat the canary-verified marker
  ansible.builtin.stat:
    path: "{{ reprovision_canary_marker }}"
  register: reprovision_canary_stat
  delegate_to: localhost

- name: Fan-out guard - block multi-node wipes until the canary is verified
  ansible.builtin.assert:
    that:
      - (ansible_play_hosts_all | length) <= 1
        or reprovision_canary_stat.stat.exists
        or (allow_fanout | default(false) | bool)
    fail_msg: >-
      Refusing to reprovision {{ ansible_play_hosts_all | length }} nodes: the canary
      ({{ reprovision_canary_host }}) has not been verified. Run the canary first
      (--limit {{ reprovision_canary_host }}); fan-out unlocks once its wait/verify
      succeeds, or override with -e allow_fanout=true.

# --- Register rescue keys in the Robot and collect their fingerprints ---------
- name: Build desired rescue key set (operator keys + iac pubkey from disk)
  ansible.builtin.set_fact:
    reprovision_desired_keys: >-
      {{ reprovision_operator_pubkeys
         + [{'name': 'spice-ansible-iac',
             'key': lookup('ansible.builtin.file', (reprovision_ssh_key_path | expanduser) ~ '.pub') | trim}] }}
  delegate_to: localhost

- name: Fetch keys already registered in the Robot
  ansible.builtin.uri:
    url: "{{ reprovision_robot_base_url }}/key"
    method: GET
    force_basic_auth: true
    url_username: "{{ reprovision_robot_username }}"
    url_password: "{{ reprovision_robot_password }}"
    return_content: true
  register: reprovision_robot_keys_before
  delegate_to: localhost
  retries: "{{ reprovision_robot_retries }}"
  delay: "{{ reprovision_robot_delay }}"
  until: (reprovision_robot_keys_before.status | default(0)) == 200

- name: Register any desired key missing from the Robot (idempotent; 409 = exists)
  ansible.builtin.uri:
    url: "{{ reprovision_robot_base_url }}/key"
    method: POST
    force_basic_auth: true
    url_username: "{{ reprovision_robot_username }}"
    url_password: "{{ reprovision_robot_password }}"
    body_format: form-urlencoded
    body:
      name: "{{ item.name }}"
      data: "{{ item.key }}"
    status_code: [200, 201, 409]
  loop: "{{ reprovision_desired_keys }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (item.key.split()[1]) not in
    (reprovision_robot_keys_before.json | map(attribute='key') | map(attribute='data')
     | map('regex_replace', '^\S+\s+(\S+).*$', '\1') | list)
  delegate_to: localhost

- name: Re-fetch keys (now includes any just-registered)
  ansible.builtin.uri:
    url: "{{ reprovision_robot_base_url }}/key"
    method: GET
    force_basic_auth: true
    url_username: "{{ reprovision_robot_username }}"
    url_password: "{{ reprovision_robot_password }}"
    return_content: true
  register: reprovision_robot_keys_after
  delegate_to: localhost
  retries: "{{ reprovision_robot_retries }}"
  delay: "{{ reprovision_robot_delay }}"
  until: (reprovision_robot_keys_after.status | default(0)) == 200

# Match by the key BODY (2nd field) - robust to comment/whitespace; take the
# Robot's own fingerprint (no local ssh-keygen, which is fragile on /dev/stdin).
- name: Publish rescue key fingerprints onto localhost facts
  ansible.builtin.set_fact:
    reprovision_key_fingerprints: >-
      {%- set existing = reprovision_robot_keys_after.json | map(attribute='key') | list -%}
      {%- set out = [] -%}
      {%- for d in reprovision_desired_keys -%}
        {%- set blob = d.key.split()[1] -%}
        {%- for e in existing if e.data.split()[1] == blob -%}
          {%- if out.append(e.fingerprint) %}{% endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ out }}
  delegate_to: localhost
  delegate_facts: true

- name: Assert we resolved a fingerprint for every desired key
  ansible.builtin.assert:
    that: (hostvars['localhost'].reprovision_key_fingerprints | length) == (reprovision_desired_keys | length)
    fail_msg: >-
      Resolved {{ hostvars['localhost'].reprovision_key_fingerprints | length }} of
      {{ reprovision_desired_keys | length }} rescue key fingerprints from the Robot - aborting
      before any node is armed (an unresolved operator/iac key would lock rescue access).
