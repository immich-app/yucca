---
# Day-2 safety gate for a live-cluster reimage. On the NVMe-RAID shape a reimage
# zeroes vg0 = all 14 block.db LVs + the ssd-osd LV, so it DESTROYS every OSD on
# the node; a healthy cluster must confirm ok-to-stop first.
# Modes (reprovision_ceph_safety):
#   auto (default) - probe via a peer mon; enforce when a live cluster holds this
#                    node's OSDs, permit when nothing answers (initial bootstrap).
#   strict         - always enforce; unverifiable = REFUSE (deliberate day-2 reimage).
#   permissive     - skip all checks (bootstrap / known-dead-node escape hatch).
# Enforced: not HEALTH_ERR + `ceph osd ok-to-stop <ids>`. On pass, noout is set on
# this node's OSDs (no premature rebalance); clears when old OSDs purge on re-add.

- name: Ceph-safety - resolve mode and admin delegate
  ansible.builtin.set_fact:
    _cs_mode: "{{ reprovision_ceph_safety | default('auto') }}"
    # Delegate ceph queries to a cluster member that is NOT the target: the
    # bootstrap host normally, or a different mon when the target IS bootstrap.
    _cs_admin_host: >-
      {{ (groups['ceph_mon'] | default([]) | difference([inventory_hostname]) | first | default(''))
         if ((groups['ceph_bootstrap'] | default([]) | first | default('')) == inventory_hostname)
         else (groups['ceph_bootstrap'] | default([]) | first | default('')) }}

- name: Ceph-safety - strict mode requires a reachable admin peer
  ansible.builtin.fail:
    msg: >-
      reprovision_ceph_safety=strict but there is no peer admin/mon host to verify
      ok-to-stop for {{ inventory_hostname }}. Refusing to reimage without
      confirmation. Bring an admin/mon peer up, or use reprovision_ceph_safety=permissive
      only if you are certain the node is already dead and drained.
  when:
    - _cs_mode == 'strict'
    - _cs_admin_host | length == 0

- name: Ceph-safety - evaluate live-cluster reimage safety
  ansible.builtin.shell: |
    set -o pipefail
    if ! ceph fsid >/dev/null 2>&1; then
      if [ "$CS_MODE" = strict ]; then
        echo "VERDICT=REFUSE reason=cluster-unreachable-in-strict"; exit 0
      fi
      echo "VERDICT=PERMIT reason=no-cluster-bootstrap"; exit 0
    fi
    ids=$(ceph osd ls-tree "$CS_HOST" 2>/dev/null | awk 'NF' | tr '\n' ' ')
    ids=$(echo "$ids" | xargs || true)
    if [ -z "$ids" ]; then
      echo "VERDICT=PERMIT reason=no-osds-on-host host=$CS_HOST"; exit 0
    fi
    # HEALTH_ERR means PGs are already inactive/unavailable; losing more is unsafe.
    h=$(ceph health 2>/dev/null | cut -d' ' -f1)
    if [ "$h" = "HEALTH_ERR" ]; then
      echo "VERDICT=REFUSE reason=HEALTH_ERR host=$CS_HOST osds=[$ids]"; exit 0
    fi
    if ! ceph osd ok-to-stop $ids >/dev/null 2>&1; then
      echo "VERDICT=REFUSE reason=not-ok-to-stop host=$CS_HOST osds=[$ids] health=$h"; exit 0
    fi
    # noout protects the reimage window from a premature rebalance.
    for id in $ids; do ceph osd add-noout "osd.$id" >/dev/null 2>&1 || true; done
    echo "VERDICT=PERMIT reason=ok-to-stop host=$CS_HOST osds=[$ids] health=$h noout=set"
  args:
    executable: /bin/bash
  environment:
    CS_MODE: "{{ _cs_mode }}"
    CS_HOST: "{{ hostname_short }}"
  delegate_to: "{{ _cs_admin_host }}"
  register: _cs_eval
  changed_when: "'noout=set' in (_cs_eval.stdout | default(''))"
  failed_when: false
  when:
    - _cs_mode != 'permissive'
    - _cs_admin_host | length > 0

- name: Ceph-safety - enforce the verdict
  ansible.builtin.assert:
    that:
      # strict requires a POSITIVE permit (an unreachable delegate yields empty
      # stdout, which must fail closed); auto only requires the absence of a refuse.
      # Outer parens are load-bearing: assert wraps each entry in {% if ... %},
      # and Jinja cannot parse a bare conditional expression there.
      - >-
        (('VERDICT=PERMIT' in (_cs_eval.stdout | default('')))
         if _cs_mode == 'strict'
         else ('VERDICT=REFUSE' not in (_cs_eval.stdout | default(''))))
    success_msg: "ceph-safety: {{ _cs_eval.stdout | default('skipped (permissive or no peer)') | trim }}"
    fail_msg: >-
      reprovision_ceph_safety={{ _cs_mode }}: REFUSING to reimage {{ inventory_hostname }}.
      A reimage DESTROYS every OSD on this node (block.db + ssd-osd live on the wiped
      NVMe). Cluster verdict: {{ _cs_eval.stdout | default('(no response from admin peer)') | trim }}.
      Drain the node (ceph osd out, wait for HEALTH_OK) or fix cluster health, then
      retry; or pass reprovision_ceph_safety=permissive only if the node is already
      dead and you accept the OSD loss.
  when:
    - _cs_mode != 'permissive'
