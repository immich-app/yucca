---
- name: Require an image pin and a bootstrap host
  ansible.builtin.assert:
    that:
      - ceph_scrub_exporter_image | length > 0
      - groups['ceph_bootstrap'] | default([]) | length > 0
    fail_msg: >-
      scrub_exporter needs ceph_scrub_exporter_image pinned to an immutable
      ghcr.io/immich-app/yucca/monk tag and a non-empty ceph_bootstrap group.
  run_once: true

# Cluster-level reads run once on the bootstrap host (the only host holding
# admin creds) and register for every host in the play.
- name: Create the read-only auth identity
  ansible.builtin.command:
    argv:
      - ceph
      - auth
      - get-or-create
      - "{{ ceph_scrub_exporter_auth_entity }}"
  register: scrub_exporter_keyring
  changed_when: false
  no_log: true
  run_once: true
  delegate_to: "{{ groups['ceph_bootstrap'] | first }}"

# get-or-create with caps hard-fails (behind no_log) on any mismatch, so the
# bare form above only mints the key and this task alone owns the caps.
- name: Reconcile the identity caps
  ansible.builtin.command:
    argv:
      - ceph
      - auth
      - caps
      - "{{ ceph_scrub_exporter_auth_entity }}"
      - mon
      - allow r
      - mgr
      - allow r
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_bootstrap'] | first }}"

- name: Render the minimal cluster config
  ansible.builtin.command: ceph config generate-minimal-conf
  register: scrub_exporter_conf
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['ceph_bootstrap'] | first }}"

# The 9284 accept rule ships in roles/security; converging monk onto a fleet
# whose LIVE ruleset predates it leaves the exporter unreachable off-host. The
# kernel ruleset is checked, not /etc/nftables.conf: a written-but-unloaded
# file is exactly the divergence that bites.
- name: Read the live nftables ruleset
  ansible.builtin.command: nft list ruleset
  register: scrub_exporter_nft
  changed_when: false
  check_mode: false
  when: ceph_firewall_enabled | default(true) | bool

- name: Require the scrub-exporter firewall rule
  ansible.builtin.assert:
    that:
      - "('dport ' ~ ceph_scrub_exporter_port) in scrub_exporter_nft.stdout"
    fail_msg: >-
      the live nftables ruleset has no rule for port
      {{ ceph_scrub_exporter_port }}; converge site.yml, or run harden.yml
      first, so ceph_firewall_scrub_exporter_port is applied.
  when: ceph_firewall_enabled | default(true) | bool

- name: Create the config directory
  ansible.builtin.file:
    path: "{{ ceph_scrub_exporter_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The trailing newline is load-bearing: ceph's conf_read_file rejects a file
# without one, and ansible's .stdout strips it.
- name: Stage ceph.conf
  ansible.builtin.copy:
    content: "{{ scrub_exporter_conf.stdout }}\n"
    dest: "{{ ceph_scrub_exporter_config_dir }}/ceph.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monk

# uid 167 = the ceph user inside the image; monk runs as it, not root, and a
# root-owned 0600 keyring fails as "no keyring found".
- name: Stage the keyring
  ansible.builtin.copy:
    content: "{{ scrub_exporter_keyring.stdout }}\n"
    dest: "{{ ceph_scrub_exporter_config_dir }}/ceph.{{ ceph_scrub_exporter_auth_entity }}.keyring"
    owner: "167"
    group: "167"
    mode: "0400"
  no_log: true
  notify: Restart monk

# Image IDs are compared instead of parsing pull progress: podman prints
# "Copying blob" even for cached layers, which read every converge as changed
# and bounced the exporter fleet-wide for nothing.
- name: Read the present monk image id
  ansible.builtin.command: >-
    podman image inspect --format {% raw %}{{.Id}}{% endraw %}
    {{ ceph_scrub_exporter_image }}
  register: scrub_exporter_image_pre
  changed_when: false
  failed_when: false

- name: Pull the monk image
  ansible.builtin.command: podman pull -q {{ ceph_scrub_exporter_image }}
  register: scrub_exporter_pull
  changed_when: scrub_exporter_pull.stdout != scrub_exporter_image_pre.stdout
  notify: Restart monk

- name: Install the monk unit
  ansible.builtin.template:
    src: monk.service.j2
    dest: /etc/systemd/system/monk.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart monk

# Flushing here keeps an aborted later play from stranding a running monk on
# old unit arguments until some future converge.
- name: Apply any pending monk restart
  ansible.builtin.meta: flush_handlers

- name: Enable and start monk
  ansible.builtin.systemd:
    name: monk
    enabled: true
    state: started
    daemon_reload: true

# "started" on a Restart=always unit proves nothing; the scrape endpoint does.
- name: Wait for monk to serve metrics
  ansible.builtin.uri:
    url: "http://{{ ceph_service_ip }}:{{ ceph_scrub_exporter_port }}/metrics"
    return_content: false
  register: scrub_exporter_probe
  retries: 12
  delay: 5
  until: scrub_exporter_probe.status == 200
  changed_when: false
