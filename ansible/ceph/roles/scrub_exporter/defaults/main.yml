---
ceph_scrub_exporter_enabled: false

# Delivered by yucca CI (deploy.yml pushes ghcr.io/immich-app/yucca/monk on
# merge to main). No tag exists until the first release after the monk package
# lands, so there is no usable default: pin a v<version> tag per cluster and
# bump it deliberately, like the cluster ceph image.
ceph_scrub_exporter_image: ""

ceph_scrub_exporter_port: 9284
ceph_scrub_exporter_refresh: 2m

# Read-only identity; the keyring lands only on mon-role hosts. The container
# runs as the ceph image's uid 167, which must be able to read it.
ceph_scrub_exporter_auth_entity: client.scrub-exporter
ceph_scrub_exporter_config_dir: /etc/ceph/monk
