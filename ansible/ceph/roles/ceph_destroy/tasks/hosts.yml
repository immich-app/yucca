---
# Phase 3: Remove non-bootstrap hosts from cluster (from bootstrap node)

- name: Get cluster hosts
  ansible.builtin.shell: |
    set -o pipefail
    timeout 10 ceph orch host ls --format json 2>/dev/null | python3 -c "
    import sys, json
    hosts = json.load(sys.stdin)
    for h in hosts:
      print(h['hostname'])
    " 2>/dev/null || true
  args:
    executable: /bin/bash
  register: cluster_hosts
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Remove non-bootstrap hosts from cluster
  ansible.builtin.shell: |
    HOST="{{ item }}"
    BOOTSTRAP="{{ hostvars[groups['ceph_bootstrap'][0]]['hostname_short'] }}"
    if [ "$HOST" = "$BOOTSTRAP" ]; then
      echo "Skipping bootstrap host $HOST (removed during purge)"
    else
      echo "Removing host $HOST from cluster"
      ceph orch host drain "$HOST" --force 2>&1 || true
      # Wait briefly for daemons to be removed
      sleep 10
      ceph orch host rm "$HOST" --force 2>&1 || true
    fi
  loop: "{{ cluster_hosts.stdout_lines | default([]) }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - cluster_hosts.stdout_lines | default([]) | length > 0
  register: host_rm_results
  changed_when: "'Removing host' in (item.stdout | default(''))"

- name: Show host removal results
  ansible.builtin.debug:
    msg: "{{ item.stdout }}"
  loop: "{{ host_rm_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - item.stdout is defined
