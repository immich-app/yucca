---
# Post-reboot verification for systemd-networkd migration.
# All checks are read-only assertions.

- name: Check systemd-networkd is active
  ansible.builtin.systemd:
    name: systemd-networkd.service
  register: networkd_svc

- name: Assert systemd-networkd is running
  ansible.builtin.assert:
    that:
      - networkd_svc.status.ActiveState == 'active'
    fail_msg: >-
      systemd-networkd is not active ({{ networkd_svc.status.ActiveState }}).
      Check: journalctl -u systemd-networkd
    success_msg: "systemd-networkd is active"

- name: Check networking.service state
  ansible.builtin.systemd:
    name: networking.service
  register: ifupdown_svc

- name: Assert ifupdown is not actively running
  ansible.builtin.assert:
    that:
      - ifupdown_svc.status.SubState in ['exited', 'dead']
    fail_msg: >-
      networking.service is {{ ifupdown_svc.status.ActiveState }}/{{ ifupdown_svc.status.SubState }}.
      Expected exited (oneshot from boot) or dead (disabled).
    success_msg: >-
      ifupdown: {{ ifupdown_svc.status.ActiveState }}/{{ ifupdown_svc.status.SubState }}
      (no running daemon)

- name: Check bond0 IP address (flat clusters only)
  ansible.builtin.shell: |
    set -o pipefail
    ip -4 addr show {{ networkd_bond_name }} | grep -oP 'inet \K[0-9.]+'
  args:
    executable: /bin/bash
  register: bond0_ip_check
  changed_when: false
  when: networkd_bond_vlans | length == 0

- name: Assert bond0 has expected IP (flat clusters only)
  ansible.builtin.assert:
    that:
      - bond_ip in bond0_ip_check.stdout
    fail_msg: "bond0 IP mismatch: expected {{ bond_ip }}, got {{ bond0_ip_check.stdout | trim }}"
    success_msg: "bond0 IP: {{ bond_ip }}"
  when: networkd_bond_vlans | length == 0

- name: Assert each bond VLAN sub-interface carries its address (VLAN clusters)
  ansible.builtin.shell: |
    set -o pipefail
    ip -4 addr show {{ networkd_bond_name }}.{{ vlan.id }} | grep -oP 'inet \K[0-9.]+'
  args:
    executable: /bin/bash
  register: vlan_ip_check
  changed_when: false
  failed_when: vlan.address.split('/')[0] not in vlan_ip_check.stdout
  loop: "{{ networkd_bond_vlans }}"
  loop_control:
    loop_var: vlan
    label: "{{ networkd_bond_name }}.{{ vlan.id }} -> {{ vlan.address }}"
  when: networkd_bond_vlans | length > 0

# MTU checks are local (ip link), so they confirm the host APPLIED the configured
# MTU without depending on the switch/leaf side being raised yet. End-to-end jumbo
# (ping -M do -s 8972) is validated separately, after the QFX side is at >= 9000.
- name: Assert bond0 MTU matches the configured ceiling
  ansible.builtin.shell: |
    set -o pipefail
    ip -o link show {{ networkd_bond_name }} | grep -oP 'mtu \K[0-9]+'
  args:
    executable: /bin/bash
  register: bond_mtu_check
  changed_when: false
  failed_when: (bond_mtu_check.stdout | trim) != (networkd_bond_mtu | int | string)

- name: Assert each bond member MTU matches the bond ceiling (no silent cap)
  ansible.builtin.shell: |
    set -o pipefail
    ip -o link show {{ member_interface }} | grep -oP 'mtu \K[0-9]+'
  args:
    executable: /bin/bash
  register: member_mtu_check
  changed_when: false
  failed_when: (member_mtu_check.stdout | trim) != (networkd_bond_mtu | int | string)
  loop: "{{ bond_interfaces }}"
  loop_control:
    loop_var: member_interface
    label: "{{ member_interface }} mtu={{ networkd_bond_mtu | int }}"

- name: Assert each VLAN sub-interface MTU matches its config
  ansible.builtin.shell: |
    set -o pipefail
    ip -o link show {{ networkd_bond_name }}.{{ vlan.id }} | grep -oP 'mtu \K[0-9]+'
  args:
    executable: /bin/bash
  register: vlan_mtu_check
  changed_when: false
  failed_when: (vlan_mtu_check.stdout | trim) != (vlan.mtu | default(1500) | int | string)
  loop: "{{ networkd_bond_vlans }}"
  loop_control:
    loop_var: vlan
    label: "{{ networkd_bond_name }}.{{ vlan.id }} mtu={{ vlan.mtu | default(1500) }}"
  when: networkd_bond_vlans | length > 0

- name: Check bond member interfaces
  ansible.builtin.shell: |
    set -o pipefail
    cat /proc/net/bonding/{{ networkd_bond_name }} \
      | grep 'Slave Interface' \
      | awk '{print $NF}' \
      | sort
  args:
    executable: /bin/bash
  register: bond_members
  changed_when: false

- name: Assert bond members are present
  ansible.builtin.assert:
    that:
      - item in bond_members.stdout
    fail_msg: "Bond member {{ item }} missing from {{ networkd_bond_name }}"
    success_msg: "Bond member {{ item }} present"
  loop: "{{ bond_interfaces }}"

- name: Check gateway reachability (flat clusters only)
  ansible.builtin.command: "ping -c 2 -W 3 {{ gateway }}"
  changed_when: false
  failed_when: false
  register: gw_ping
  when: networkd_bond_vlans | length == 0

- name: Assert gateway is reachable (flat clusters only)
  ansible.builtin.assert:
    that:
      - gw_ping.rc == 0
    fail_msg: "Gateway {{ gateway }} unreachable"
    success_msg: "Gateway {{ gateway }} reachable"
  when: networkd_bond_vlans | length == 0

# Coexistence: the reachability-critical WAN must have survived networkd
# activation untouched (still owned by ifupdown). Assert its address and the
# default route are intact BEFORE commit locks the boot services in -- if networkd
# disturbed the WAN, we stop here and ifupdown still owns the next boot.
- name: Read WAN address + default route (coexistence)
  ansible.builtin.shell: |
    set -o pipefail
    echo "ADDR:$(ip -4 addr show {{ oob_nic }} | grep -oP 'inet \K[0-9.]+' | head -1)"
    echo "DEFROUTE:$(ip route show default)"
  args:
    executable: /bin/bash
  register: networkd_wan_state
  changed_when: false
  when:
    - not (networkd_replace_ifupdown | default(true) | bool)
    - oob_nic is defined

- name: Assert the WAN survived networkd activation (coexistence)
  ansible.builtin.assert:
    that:
      - bond_ip in networkd_wan_state.stdout
      - oob_nic in networkd_wan_state.stdout
    fail_msg: >-
      WAN {{ oob_nic }} lost its address ({{ bond_ip }}) or default route after
      networkd started -- NOT committing. Inspect: ip addr show {{ oob_nic }}; ip route.
    success_msg: "WAN {{ oob_nic }} intact: {{ bond_ip }} + default route present"
  when:
    - not (networkd_replace_ifupdown | default(true) | bool)
    - oob_nic is defined

- name: Show networkctl status
  ansible.builtin.command: "networkctl status {{ networkd_bond_name }}"
  register: networkctl_out
  changed_when: false

- name: Report bond status
  ansible.builtin.debug:
    msg: "{{ networkctl_out.stdout_lines }}"
