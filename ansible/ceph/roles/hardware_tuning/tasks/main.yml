---
# Hardware-level tuning for Ceph OSD nodes.
# Sets I/O scheduler, readahead, and queue depth per device class, plus the
# HDD volatile write cache.
# All changes apply live and persist via udev rules (no reboot).

# The RUN target must exist before the rules file that names it is deployed.
- name: Deploy the HDD write-cache helper
  ansible.builtin.copy:
    src: ceph-hdd-wcache
    dest: /usr/local/sbin/ceph-hdd-wcache
    owner: root
    group: root
    mode: '0755'
  when: ceph_hdd_write_cache_disabled | bool

- name: Deploy udev rules for disk tuning
  ansible.builtin.template:
    src: 99-ceph-disk-tuning.rules.j2
    dest: /etc/udev/rules.d/99-ceph-disk-tuning.rules
    owner: root
    group: root
    mode: '0644'
  notify: Reload udev rules

- name: Apply tuning to existing HDD devices
  ansible.builtin.shell: |
    set -euo pipefail
    NR="{{ ceph_hdd_nr_requests }}"
    SCHED="{{ ceph_hdd_scheduler }}"
    RA="{{ ceph_hdd_readahead_kb }}"
    CHANGED=0
    for dev in $(lsblk -dnpo NAME,ROTA,TYPE \
                 | awk '$2==1 && $3=="disk" {print $1}'); do
      BDEV=$(basename "$dev")
      Q=/sys/block/"$BDEV"/queue
      if ! grep -q "\[$SCHED\]" "$Q"/scheduler 2>/dev/null; then
        echo "$SCHED" > "$Q"/scheduler 2>/dev/null && CHANGED=1 || true
      fi
      if [ "$(cat "$Q"/read_ahead_kb 2>/dev/null || echo -1)" != "$RA" ]; then
        echo "$RA" > "$Q"/read_ahead_kb 2>/dev/null && CHANGED=1 || true
      fi
      if [ "$NR" -gt 0 ] 2>/dev/null \
         && [ "$(cat "$Q"/nr_requests 2>/dev/null || echo -1)" != "$NR" ]; then
        echo "$NR" > "$Q"/nr_requests 2>/dev/null && CHANGED=1 || true
      fi
      echo "HDD $BDEV: sched=$SCHED ra=${RA}KB"
    done
    [ "$CHANGED" -eq 0 ] || echo CHANGED
  args:
    executable: /bin/bash
  register: hdd_tuning
  changed_when: "'CHANGED' in (hdd_tuning.stdout | default(''))"

- name: Apply tuning to existing SSD devices
  ansible.builtin.shell: |
    set -euo pipefail
    NR="{{ ceph_ssd_nr_requests }}"
    SCHED="{{ ceph_ssd_scheduler }}"
    RA="{{ ceph_ssd_readahead_kb }}"
    CHANGED=0
    for dev in $(lsblk -dnpo NAME,ROTA,TYPE \
                 | awk '$2==0 && $3=="disk" {print $1}'); do
      BDEV=$(basename "$dev")
      Q=/sys/block/"$BDEV"/queue
      if ! grep -q "\[$SCHED\]" "$Q"/scheduler 2>/dev/null; then
        echo "$SCHED" > "$Q"/scheduler 2>/dev/null && CHANGED=1 || true
      fi
      if [ "$(cat "$Q"/read_ahead_kb 2>/dev/null || echo -1)" != "$RA" ]; then
        echo "$RA" > "$Q"/read_ahead_kb 2>/dev/null && CHANGED=1 || true
      fi
      if [ "$NR" -gt 0 ] 2>/dev/null \
         && [ "$(cat "$Q"/nr_requests 2>/dev/null || echo -1)" != "$NR" ]; then
        echo "$NR" > "$Q"/nr_requests 2>/dev/null && CHANGED=1 || true
      fi
      echo "SSD $BDEV: sched=$SCHED ra=${RA}KB"
    done
    [ "$CHANGED" -eq 0 ] || echo CHANGED
  args:
    executable: /bin/bash
  register: ssd_tuning
  changed_when: "'CHANGED' in (ssd_tuning.stdout | default(''))"

- name: Disable the HDD volatile write cache on existing disks
  ansible.builtin.command: /usr/local/sbin/ceph-hdd-wcache all
  register: _hdd_wcache
  changed_when: "'CHANGED' in (_hdd_wcache.stdout | default(''))"
  when: ceph_hdd_write_cache_disabled | bool

- name: Enable fstrim.timer for OS partitions
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started
  when: ceph_enable_fstrim_timer | bool

# ---------- SATA link power management ----------

# The udev rule above covers boot and hot-plug; this applies the policy to
# ports that are already up. Writing the attribute schedules a libata EH cycle
# on that port, which is why this role wants serial: 1 on a serving cluster.
- name: Set SATA link power management policy live
  ansible.builtin.shell: |
    set -uo pipefail
    POLICY="{{ ceph_sata_link_pm_policy }}"
    CHANGED=0
    for f in /sys/class/scsi_host/host*/link_power_management_policy; do
      [ -w "$f" ] || continue
      CUR=$(cat "$f" 2>/dev/null || echo "")
      if [ "$CUR" != "$POLICY" ]; then
        echo "$POLICY" > "$f" 2>/dev/null && CHANGED=1 || true
      fi
    done
    [ "$CHANGED" -eq 0 ] || echo CHANGED
  args:
    executable: /bin/bash
  register: _sata_lpm
  changed_when: "'CHANGED' in (_sata_lpm.stdout | default(''))"
  when: ceph_sata_link_pm_enabled | bool

# ---------- Transparent Huge Pages ----------

- name: Set Transparent Huge Pages live
  ansible.builtin.shell: |
    set -euo pipefail
    ch=0
    # sysfs prints the active value in [brackets]: "always [madvise] never".
    cur=$(grep -oP '\[\K[^\]]+' /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || echo "")
    if [ "$cur" != "{{ ceph_thp_mode }}" ]; then
      echo "{{ ceph_thp_mode }}" > /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || true
      ch=1
    fi
    curd=$(grep -oP '\[\K[^\]]+' /sys/kernel/mm/transparent_hugepage/defrag 2>/dev/null || echo "")
    if [ "$curd" != "{{ ceph_thp_defrag }}" ]; then
      echo "{{ ceph_thp_defrag }}" > /sys/kernel/mm/transparent_hugepage/defrag 2>/dev/null || true
      ch=1
    fi
    [ "$ch" = 1 ] && echo CHANGED || echo ok
  args:
    executable: /bin/bash
  register: _thp_live
  changed_when: "'CHANGED' in _thp_live.stdout"
  when: ceph_thp_enabled | bool

- name: Deploy systemd unit for THP persistence
  ansible.builtin.template:
    src: ceph-thp.service.j2
    dest: /etc/systemd/system/ceph-thp.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd
  when: ceph_thp_enabled | bool

- name: Enable ceph-thp service
  ansible.builtin.systemd:
    name: ceph-thp.service
    enabled: true
    daemon_reload: true
  when: ceph_thp_enabled | bool

# ---------- CPU governor tuning ----------

- name: Install cpupower package
  ansible.builtin.package:
    name: linux-cpupower
    state: present
  when: ceph_cpu_governor_enabled | bool

- name: Set CPU governor on all cores
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v cpupower &>/dev/null; then
      cpupower frequency-set -g {{ ceph_cpu_governor }}
    else
      for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
        echo "{{ ceph_cpu_governor }}" > "$cpu" 2>/dev/null || true
      done
    fi
  args:
    executable: /bin/bash
  changed_when: true
  when: ceph_cpu_governor_enabled | bool

- name: Deploy systemd unit for CPU governor persistence
  ansible.builtin.template:
    src: ceph-cpu-governor.service.j2
    dest: /etc/systemd/system/ceph-cpu-governor.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd
  when: ceph_cpu_governor_enabled | bool

- name: Enable ceph-cpu-governor service
  ansible.builtin.systemd:
    name: ceph-cpu-governor.service
    enabled: true
    daemon_reload: true
  when: ceph_cpu_governor_enabled | bool

# Use a /etc/default/grub.d drop-in that only appends the cstate token, rather
# than rewriting GRUB_CMDLINE_LINUX_DEFAULT (which would drop existing tokens
# and inject "quiet"). Debian grub-mkconfig sources grub.d/*.cfg after grub.
- name: Add processor.max_cstate via GRUB drop-in
  ansible.builtin.template:
    src: 99-ceph-cstate.cfg.j2
    dest: /etc/default/grub.d/99-ceph-cstate.cfg
    owner: root
    group: root
    mode: '0644'
  notify: Update GRUB
  when: ceph_cpu_governor_enabled | bool

# ---------- LVM device filter ----------

- name: Set LVM device filter in lvm.conf
  ansible.builtin.lineinfile:
    path: /etc/lvm/lvm.conf
    regexp: '^\s*filter\s*='
    line: '    filter = {{ ceph_lvm_filter }}'
    insertafter: '^\s*# filter\s*='
  when: ceph_lvm_filter_enabled | bool

# ---------- Verification ----------

- name: Verify I/O scheduler on sample devices
  ansible.builtin.shell: |
    set -euo pipefail
    echo "=== HDD schedulers ==="
    for dev in $(lsblk -dnpo NAME,ROTA,TYPE \
                 | awk '$2==1 && $3=="disk" {print $1}' | head -3); do
      BDEV=$(basename "$dev")
      SCHED=$(cat /sys/block/$BDEV/queue/scheduler)
      RA=$(cat /sys/block/$BDEV/queue/read_ahead_kb)
      echo "$BDEV: scheduler=$SCHED readahead=${RA}KB"
    done
    echo "=== SSD schedulers ==="
    for dev in $(lsblk -dnpo NAME,ROTA,TYPE \
                 | awk '$2==0 && $3=="disk" {print $1}' | head -3); do
      BDEV=$(basename "$dev")
      SCHED=$(cat /sys/block/$BDEV/queue/scheduler)
      RA=$(cat /sys/block/$BDEV/queue/read_ahead_kb)
      echo "$BDEV: scheduler=$SCHED readahead=${RA}KB"
    done
  args:
    executable: /bin/bash
  register: scheduler_verify
  changed_when: false

- name: Verify SATA link power management policy
  ansible.builtin.shell: |
    set -uo pipefail
    echo "=== SATA link power management ==="
    for f in /sys/class/scsi_host/host*/link_power_management_policy; do
      [ -e "$f" ] || continue
      cat "$f"
    done | sort | uniq -c | sed 's/^/  /'
  args:
    executable: /bin/bash
  register: sata_lpm_verify
  changed_when: false
  when: ceph_sata_link_pm_enabled | bool

- name: Display disk tuning state
  ansible.builtin.debug:
    msg: >-
      {{ scheduler_verify.stdout_lines
         + (sata_lpm_verify.stdout_lines | default([])) }}
