---
# From mgmt/roles/netbird minus the route-peer parts -- ceph nodes must never
# route or receive overlay routes.

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install the NetBird apt signing key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://pkgs.netbird.io/debian/public.key | gpg --dearmor -o /etc/apt/keyrings/netbird.gpg
  args:
    creates: /etc/apt/keyrings/netbird.gpg
    executable: /bin/bash

- name: Add the NetBird apt repository
  ansible.builtin.copy:
    content: "deb [signed-by=/etc/apt/keyrings/netbird.gpg] https://pkgs.netbird.io/debian stable main\n"
    dest: /etc/apt/sources.list.d/netbird.list
    mode: '0644'

- name: Update apt cache
  # Always refresh: a cache_valid_time skip after a repo add installs against a
  # stale index (same lesson as ceph_deploy/prerequisites).
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: Query the installed netbird version
  ansible.builtin.command: dpkg-query -W -f='${Version}' netbird
  register: ceph_netbird_installed
  changed_when: false
  failed_when: false

- name: Unhold netbird only when the pinned version differs (keeps converge clean)
  # rc != 0 = dpkg never saw the package (fresh node); dpkg_selections fails
  # hard on unknown packages and there is no hold to release yet, so skip.
  ansible.builtin.dpkg_selections:
    name: netbird
    selection: install
  when:
    - ceph_netbird_installed.rc == 0
    - ceph_netbird_installed.stdout != ceph_netbird_version

- name: Install NetBird at the pinned version
  ansible.builtin.apt:
    name: "netbird={{ ceph_netbird_version }}"
    state: present
    allow_downgrade: true

- name: Hold netbird at the pinned version
  ansible.builtin.dpkg_selections:
    name: netbird
    selection: hold

- name: Enable and start the netbird service
  ansible.builtin.systemd:
    name: netbird
    enabled: true
    state: started

- name: Check NetBird connection status
  ansible.builtin.command: netbird status
  register: ceph_netbird_status
  changed_when: false
  failed_when: false

- name: Assert the setup key is provided (fresh enrollment only)
  ansible.builtin.assert:
    that:
      - ceph_netbird_setup_key | length > 0
    fail_msg: >-
      {{ inventory_hostname }} is not connected to NetBird and
      ceph_netbird_setup_key is empty. Fresh enrollment needs the key: run
      `mise run netbird` (reads NETBIRD_YUCCA_PROD_HTZ_FSN1_CEPH_SETUP_KEY
      from 1Password), optionally with -- --limit {{ inventory_hostname }}.
      Already-enrolled nodes converge without it.
  when: "'Management: Connected' not in ceph_netbird_status.stdout"

- name: Join the overlay
  ansible.builtin.command:
    cmd: >-
      netbird up
      --setup-key {{ ceph_netbird_setup_key }}
      --management-url {{ ceph_netbird_management_url }}
      --hostname {{ inventory_hostname }}
  register: ceph_netbird_up
  changed_when: ceph_netbird_up.rc == 0
  no_log: true
  when: "'Management: Connected' not in ceph_netbird_status.stdout"

- name: Re-check status after join
  ansible.builtin.command: netbird status
  register: ceph_netbird_status_post
  changed_when: false
  retries: 6
  delay: 5
  until: "'Management: Connected' in ceph_netbird_status_post.stdout"
  # Same condition as the join: already-connected nodes never joined, so _post
  # stays undefined for the asserts' default() fallback.
  when: "'Management: Connected' not in ceph_netbird_status.stdout"

- name: Assert connected
  ansible.builtin.assert:
    that:
      - >-
        'Management: Connected'
        in (ceph_netbird_status_post.stdout | default(ceph_netbird_status.stdout))
    success_msg: "{{ inventory_hostname }}: NetBird connected"

- name: Assert no overlay routes were received (fabric stays authoritative)
  # `Networks: -` = zero received routes on 0.73.x (format is version-coupled;
  # revisit on version bump). Firing means the ceph group leaked into a network's
  # TF distribution groups -- an overlay route could shadow the fabric paths.
  ansible.builtin.assert:
    that:
      - >-
        'Networks: -'
        in (ceph_netbird_status_post.stdout | default(ceph_netbird_status.stdout))
    fail_msg: >-
      {{ inventory_hostname }} received overlay network routes - the ceph peer
      group must stay out of all NetBird network distribution groups. Fix the
      TF (tf/deployment/prod/htz-fsn1/netbird) before enrolling further nodes.

# Gated on the API token so a token-less converge is a no-op on already-enabled
# peers. The DNAT is wt0-scoped, so cephadm (fabric) and ansible (WAN) keep
# key-based sshd on :22 - verified on the philip canary 2026-07-22.

- name: Look up this peer in the NetBird API
  ansible.builtin.uri:
    url: "{{ ceph_netbird_api_url }}/api/peers"
    headers:
      Authorization: "Token {{ ceph_netbird_api_token }}"
  delegate_to: localhost
  register: ceph_netbird_peers
  no_log: true
  when:
    - ceph_netbird_ssh_server | bool
    - ceph_netbird_api_token | length > 0

- name: Record this peer's id and current ssh state
  ansible.builtin.set_fact:
    ceph_netbird_peer: >-
      {{ ceph_netbird_peers.json
         | selectattr('name', 'equalto', inventory_hostname)
         | list | first | default({}) }}
  when:
    - ceph_netbird_ssh_server | bool
    - ceph_netbird_api_token | length > 0

- name: Enable ssh_enabled on the peer (management side; preserves other fields)
  ansible.builtin.uri:
    url: "{{ ceph_netbird_api_url }}/api/peers/{{ ceph_netbird_peer.id }}"
    method: PUT
    headers:
      Authorization: "Token {{ ceph_netbird_api_token }}"
    body_format: json
    body:
      name: "{{ ceph_netbird_peer.name }}"
      ssh_enabled: true
      login_expiration_enabled: "{{ ceph_netbird_peer.login_expiration_enabled | default(false) }}"
      inactivity_expiration_enabled: "{{ ceph_netbird_peer.inactivity_expiration_enabled | default(false) }}"
    status_code: 200
  delegate_to: localhost
  no_log: true
  when:
    - ceph_netbird_ssh_server | bool
    - ceph_netbird_api_token | length > 0
    - ceph_netbird_peer.id is defined
    - not (ceph_netbird_peer.ssh_enabled | default(false))

- name: Check whether the netbird-ssh server is listening (:22022)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ss -tlnH | awk '{print $4}' | grep -cE ':22022$' || true
    executable: /bin/bash
  register: ceph_netbird_ssh_listen
  changed_when: false
  when:
    - ceph_netbird_ssh_server | bool
    - ceph_netbird_api_token | length > 0

- name: Apply the server-ssh client flags (down/up over WAN)
  # `netbird up` short-circuits when connected, so a down/up cycle (re)applies
  # client flags; safe -- ansible rides the WAN, only the overlay drops. Server
  # binds once client flag AND management ssh_enabled agree; skipped when :22022
  # already listens. No --enable-ssh-root: humans use ops + sudo.
  ansible.builtin.shell: |
    set -e
    netbird down
    sleep 2
    netbird up \
      --management-url {{ ceph_netbird_management_url }} \
      --hostname {{ inventory_hostname }} \
      --allow-server-ssh {{ '--enable-ssh-sftp' if ceph_netbird_ssh_sftp else '' }}
  changed_when: true
  when:
    - ceph_netbird_ssh_server | bool
    - ceph_netbird_api_token | length > 0
    - (ceph_netbird_ssh_listen.stdout | default('0') | trim) == '0'

- name: Assert the netbird-ssh server is listening on :22022
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ss -tlnH | awk '{print $4}' | grep -cE ':22022$' || true
    executable: /bin/bash
  register: ceph_netbird_ssh_final
  changed_when: false
  retries: 6
  delay: 5
  until: (ceph_netbird_ssh_final.stdout | trim) == '1'
  when:
    - ceph_netbird_ssh_server | bool
    - ceph_netbird_api_token | length > 0
