---
# Phase 5.75: RadosGW (S3 Object Gateway)
# Deploys RGW with EC data pool, realm/zonegroup/zone, and S3 service user

# --- Step 1: EC profile ---

- name: Check existing EC profiles
  ansible.builtin.command: ceph osd erasure-code-profile ls
  register: ec_profiles
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Create EC profile {{ ceph_rgw_ec_profile }}
  ansible.builtin.command: >
    ceph osd erasure-code-profile set {{ ceph_rgw_ec_profile }}
    k={{ ceph_rgw_ec_k }} m={{ ceph_rgw_ec_m }}
    crush-failure-domain={{ ceph_rgw_ec_failure_domain }}
    crush-device-class={{ ceph_rgw_ec_device_class }}
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "ceph_rgw_ec_profile not in ec_profiles.stdout"
  changed_when: true

# --- Step 2-3: EC data pool ---

- name: Check existing pools
  ansible.builtin.command: ceph osd pool ls
  register: pool_list
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Create EC data pool {{ ceph_rgw_data_pool }}
  ansible.builtin.command: >
    ceph osd pool create {{ ceph_rgw_data_pool }} erasure {{ ceph_rgw_ec_profile }}
  register: create_data_pool
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "ceph_rgw_data_pool not in pool_list.stdout"
  changed_when: true

- name: Enable EC overwrites on data pool
  ansible.builtin.command: >
    ceph osd pool set {{ ceph_rgw_data_pool }} allow_ec_overwrites true
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - create_data_pool is changed
  changed_when: true

- name: Mark the EC data pool as bulk (autoscaler sizing floor)
  # bulk=true sizes the autoscaler for full capacity, so it won't shrink the
  # pre-seeded ceph_pg_init_data back toward 1 during the first fill.
  ansible.builtin.shell: |
    set -o pipefail
    [ "$(ceph osd pool get {{ ceph_rgw_data_pool }} bulk | awk '{print $2}')" = "true" ] || { ceph osd pool set {{ ceph_rgw_data_pool }} bulk true; echo CHANGED; }
  args:
    executable: /bin/bash
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (create_data_pool is changed) or (ceph_rgw_data_pool in pool_list.stdout)
  register: bulk_flag_result
  changed_when: "'CHANGED' in (bulk_flag_result.stdout | default(''))"

- name: Pin EC data pool min_size to k+1 ({{ ceph_rgw_ec_min_size }})
  # Pin the implicit default explicitly so the floor can't drift. k+1 = writes
  # tolerate m-1 host losses, reads m. NEVER below k+1: writes at k shards risk
  # data loss if another shard dies during recovery.
  ansible.builtin.shell: |
    set -o pipefail
    cur=$(ceph osd pool get {{ ceph_rgw_data_pool }} min_size | awk '{print $2}')
    if [ "$cur" != "{{ ceph_rgw_ec_min_size }}" ]; then
      ceph osd pool set {{ ceph_rgw_data_pool }} min_size {{ ceph_rgw_ec_min_size }}
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (create_data_pool is changed) or (ceph_rgw_data_pool in pool_list.stdout)
  register: ec_min_size_result
  changed_when: "'CHANGED' in (ec_min_size_result.stdout | default(''))"

# --- Step 4: Replicated index pool ---

- name: Create replicated index pool {{ ceph_rgw_index_pool }}
  ansible.builtin.command: >
    ceph osd pool create {{ ceph_rgw_index_pool }} replicated
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "ceph_rgw_index_pool not in pool_list.stdout"
  changed_when: true

- name: Set index pool replication parameters
  ansible.builtin.shell: |
    set -e
    ceph osd pool set {{ ceph_rgw_index_pool }} size {{ ceph_rgw_replicated_size }}
    ceph osd pool set {{ ceph_rgw_index_pool }} min_size {{ ceph_rgw_replicated_min_size }}
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Step 5: Replicated non-EC pool (multipart uploads) ---

- name: Create replicated non-EC pool {{ ceph_rgw_extra_pool }}
  ansible.builtin.command: >
    ceph osd pool create {{ ceph_rgw_extra_pool }} replicated
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "ceph_rgw_extra_pool not in pool_list.stdout"
  changed_when: true

- name: Set non-EC pool replication parameters
  ansible.builtin.shell: |
    set -e
    ceph osd pool set {{ ceph_rgw_extra_pool }} size {{ ceph_rgw_replicated_size }}
    ceph osd pool set {{ ceph_rgw_extra_pool }} min_size {{ ceph_rgw_replicated_min_size }}
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Step 6: Pool application tags ---

- name: Check pool application tags
  ansible.builtin.command: "ceph osd pool application get {{ item }}"
  loop:
    - "{{ ceph_rgw_data_pool }}"
    - "{{ ceph_rgw_index_pool }}"
    - "{{ ceph_rgw_extra_pool }}"
  register: pool_apps
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  failed_when: false

- name: Enable rgw application on pools
  ansible.builtin.command: "ceph osd pool application enable {{ item.item }} rgw"
  loop: "{{ pool_apps.results }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - item is not skipped
    - "'rgw' not in (item.stdout | default(''))"
  changed_when: true
  loop_control:
    label: "{{ item.item | default('skipped') }}"

# --- Step 6.5: Initial PG counts ---
# Pools start at pg_num=1; autoscaler splits under load cause latency spikes, so
# pre-size before the first fill. Only ever increases pg_num.

# Re-query: the top-of-file pool_list predates the pools created above, so on run 1
# the gates below would skip and defer pre-sizing to a second converge. (Lazily
# created .rgw.* system pools are handled after the RGW daemon is up.)
- name: Re-query pools after explicit RGW pools are created
  ansible.builtin.command: ceph osd pool ls
  register: pool_list
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Set initial PG count on data pool
  ansible.builtin.command: >
    ceph osd pool set {{ ceph_rgw_data_pool }}
    pg_num {{ ceph_pg_init_data }}
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_data_pool in pool_list.stdout
  register: pg_data_result
  changed_when: "'set' in pg_data_result.stdout | default('')"
  failed_when:
    - pg_data_result.rc != 0
    - "'is not >= current' not in pg_data_result.stderr | default('')"

- name: Set initial PG count on index pool
  ansible.builtin.command: >
    ceph osd pool set {{ ceph_rgw_index_pool }}
    pg_num {{ ceph_pg_init_index }}
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_index_pool in pool_list.stdout
  register: pg_index_result
  changed_when: "'set' in pg_index_result.stdout | default('')"
  failed_when:
    - pg_index_result.rc != 0
    - "'is not >= current' not in pg_index_result.stderr | default('')"

- name: Set initial PG count on non-EC pool
  ansible.builtin.command: >
    ceph osd pool set {{ ceph_rgw_extra_pool }}
    pg_num {{ ceph_pg_init_non_ec }}
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_extra_pool in pool_list.stdout
  register: pg_extra_result
  changed_when: "'set' in pg_extra_result.stdout | default('')"
  failed_when:
    - pg_extra_result.rc != 0
    - "'is not >= current' not in pg_extra_result.stderr | default('')"

# .rgw.* system-pool pins live in Step 13.6 (post-RGW-readiness): those pools are
# created lazily and do not exist yet here.

- name: Wait for PG peering to complete
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 60); do
      STATE=$(ceph pg stat --format json 2>/dev/null | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    s = d.get('pg_summary', {}).get('num_pg_by_state', [])
    non_clean = sum(x['num'] for x in s if 'active+clean' not in x['name'])
    print(non_clean)
    " 2>/dev/null || echo 999)
      if [ "$STATE" = "0" ]; then
        echo "All PGs active+clean"
        exit 0
      fi
      echo "Waiting for PG peering... ($STATE PGs not clean)"
      sleep 5
    done
    echo "WARNING: PGs still peering after 5 minutes"
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  timeout: 330

# --- Step 7: Realm ---

- name: Check existing realms
  ansible.builtin.command: radosgw-admin realm list
  register: realm_list
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  failed_when: false

- name: Create realm {{ ceph_rgw_realm }}
  ansible.builtin.command: >
    radosgw-admin realm create --rgw-realm={{ ceph_rgw_realm }} --default
  register: realm_created
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "ceph_rgw_realm not in (realm_list.stdout | default(''))"
  changed_when: true

- name: Ensure realm is default
  ansible.builtin.command: >
    radosgw-admin realm default --rgw-realm={{ ceph_rgw_realm }}
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Step 8: Zonegroup ---

- name: Check existing zonegroups
  ansible.builtin.command: radosgw-admin zonegroup list
  register: zonegroup_list
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  failed_when: false

- name: Create zonegroup {{ ceph_rgw_zonegroup }}
  ansible.builtin.command: >
    radosgw-admin zonegroup create
    --rgw-realm={{ ceph_rgw_realm }}
    --rgw-zonegroup={{ ceph_rgw_zonegroup }}
    --endpoints={{ ceph_rgw_scheme }}://{{ ceph_rgw_dns_name }}:{{ ceph_rgw_port }}
    --master --default
  register: zonegroup_created
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "ceph_rgw_zonegroup not in (zonegroup_list.stdout | default(''))"
  changed_when: true

- name: Set zonegroup api_name to {{ ceph_rgw_zonegroup_api_name }}
  ansible.builtin.shell: |
    set -e
    python3 -c "
    import json, subprocess, sys
    zg = json.loads(subprocess.check_output(
        ['radosgw-admin', 'zonegroup', 'get',
         '--rgw-zonegroup', '{{ ceph_rgw_zonegroup }}']))
    if zg.get('api_name') == '{{ ceph_rgw_zonegroup_api_name }}':
        sys.exit(0)
    zg['api_name'] = '{{ ceph_rgw_zonegroup_api_name }}'
    subprocess.run(
        ['radosgw-admin', 'zonegroup', 'set',
         '--rgw-zonegroup', '{{ ceph_rgw_zonegroup }}'],
        input=json.dumps(zg).encode(), check=True)
    print('CHANGED')
    "
  args:
    executable: /bin/bash
  register: set_api_name
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: "'CHANGED' in (set_api_name.stdout | default(''))"

# --- Step 9: Zone ---

- name: Check existing zones
  ansible.builtin.command: radosgw-admin zone list
  register: zone_list
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  failed_when: false

- name: Create zone {{ ceph_rgw_zone }}
  ansible.builtin.command: >
    radosgw-admin zone create
    --rgw-realm={{ ceph_rgw_realm }}
    --rgw-zonegroup={{ ceph_rgw_zonegroup }}
    --rgw-zone={{ ceph_rgw_zone }}
    --endpoints={{ ceph_rgw_scheme }}://{{ ceph_rgw_dns_name }}:{{ ceph_rgw_port }}
    --master --default
  register: zone_created
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "ceph_rgw_zone not in (zone_list.stdout | default(''))"
  changed_when: true

# --- Step 10: Zone placement targets ---

- name: Configure zone placement targets for EC pools
  ansible.builtin.shell: |
    set -e
    python3 -c "
    import json, subprocess, sys
    zone = json.loads(subprocess.check_output(
        ['radosgw-admin', 'zone', 'get', '--rgw-zone', '{{ ceph_rgw_zone }}']))
    changed = False
    # Zone pools live under 'placement_pools' as {key, val} entries -- NOT
    # 'placement_targets', which is a zonegroup key and carries no pools. Inside
    # val, index_pool and data_extra_pool sit at the top level while data_pool is
    # nested one deeper, per storage class.
    for pp in zone.get('placement_pools', []):
        if pp.get('key') != 'default-placement':
            continue
        val = pp.setdefault('val', {})
        sc = val.setdefault('storage_classes', {}).setdefault('STANDARD', {})
        if (sc.get('data_pool') != '{{ ceph_rgw_data_pool }}' or
            val.get('index_pool') != '{{ ceph_rgw_index_pool }}' or
            val.get('data_extra_pool') != '{{ ceph_rgw_extra_pool }}'):
            sc['data_pool'] = '{{ ceph_rgw_data_pool }}'
            val['index_pool'] = '{{ ceph_rgw_index_pool }}'
            val['data_extra_pool'] = '{{ ceph_rgw_extra_pool }}'
            changed = True
    if not changed:
        sys.exit(0)
    subprocess.run(
        ['radosgw-admin', 'zone', 'set', '--rgw-zone', '{{ ceph_rgw_zone }}'],
        input=json.dumps(zone).encode(), check=True)
    print('CHANGED')
    "
  args:
    executable: /bin/bash
  register: zone_placement
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: "'CHANGED' in (zone_placement.stdout | default(''))"

# --- Step 10.5: Zonegroup hostnames ---
# RGW validates the Host header during S3 signature verification: any hostname/IP
# not in the zonegroup hostnames list fails with SignatureDoesNotMatch (403), so
# add every node hostname + IP (dashboard and direct clients both work).

- name: Add cluster hostnames and IPs to zonegroup
  ansible.builtin.shell: |
    set -o pipefail
    python3 -c "
    import json, subprocess
    zg = json.loads(subprocess.check_output(
        ['radosgw-admin', 'zonegroup', 'get',
         '--rgw-zonegroup', '{{ ceph_rgw_zonegroup }}']))
    hostnames = set(zg.get('hostnames', []))
    needed = set([
    {% for h in groups['ceph_nodes'] %}
        '{{ hostvars[h]['hostname_short'] }}',
        '{{ hostvars[h]['bond_ip'] }}',
        '{{ hostvars[h]['ceph_service_ip'] }}',
    {% endfor %}
        '{{ ceph_rgw_dns_name }}',
    ])
    if needed.issubset(hostnames):
        print('OK')
    else:
        hostnames.update(needed)
        zg['hostnames'] = sorted(hostnames)
        subprocess.run(
            ['radosgw-admin', 'zonegroup', 'set',
             '--rgw-zonegroup', '{{ ceph_rgw_zonegroup }}'],
            input=json.dumps(zg).encode(), check=True,
            capture_output=True)
        print('CHANGED: ' + ','.join(sorted(needed)))
    "
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  register: zonegroup_hostnames
  changed_when: "'CHANGED' in zonegroup_hostnames.stdout"

# --- Step 11: Commit period ---
# A commit notifies every RGW on realms.<realm-id>.control; each pauses beast and
# cancels in-flight requests (500s/409s), and under load the teardown can trip a
# use-after-free -- five RGWs segfaulted on spice 2026-07-27. `period update
# --commit` is also NOT idempotent (bumps the epoch even when content is unchanged,
# seen 2026-07-27). So commit only when a task above changed realm/zonegroup/zone
# or the committed period drifted. The drift probe covers the zonegroup only (all
# the period map carries); zone params like placement pools are not self-healing here.

- name: Check whether the committed period matches the live zonegroup
  ansible.builtin.shell: |
    set -e
    python3 -c "
    import json, subprocess, sys
    try:
        zg = json.loads(subprocess.check_output(
            ['radosgw-admin', 'zonegroup', 'get',
             '--rgw-zonegroup', '{{ ceph_rgw_zonegroup }}']))
        period = json.loads(subprocess.check_output(
            ['radosgw-admin', 'period', 'get', '--rgw-realm', '{{ ceph_rgw_realm }}']))
        committed = next(
            (g for g in period.get('period_map', {}).get('zonegroups', [])
             if g.get('id') == zg.get('id')), None)
        print('MATCH' if committed == zg else 'DRIFT')
    except Exception as exc:
        # Fail open on purpose: an unreadable period is not evidence that it is
        # in sync, and a spurious commit is safer than silent config drift.
        print('DRIFT')
        sys.stderr.write('period drift check failed: %s\n' % exc)
    "
  args:
    executable: /bin/bash
  register: period_drift
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  failed_when: false
  # Read-only probe; runs under --check too so the commit gate stays accurate.
  check_mode: false

- name: Commit the period
  ansible.builtin.command: >
    radosgw-admin period update --commit --rgw-realm={{ ceph_rgw_realm }}
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - >-
      (realm_created.changed | default(false)) or
      (zonegroup_created.changed | default(false)) or
      (set_api_name.changed | default(false)) or
      (zone_created.changed | default(false)) or
      (zone_placement.changed | default(false)) or
      (zonegroup_hostnames.changed | default(false)) or
      ('MATCH' not in (period_drift.stdout | default('')))
  changed_when: true

# --- Step 11.5: rgw_dns_name for virtual-hosted bucket addressing ---
# Makes bucket.<dns_name> parse as the bucket, enabling virtual-hosted style
# alongside path-style.

- name: Get current rgw_dns_name
  ansible.builtin.command: ceph config get client.rgw rgw_dns_name
  register: current_rgw_dns_name
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  failed_when: false

- name: Set rgw_dns_name for virtual-hosted bucket support
  ansible.builtin.command: >
    ceph config set client.rgw rgw_dns_name {{ ceph_rgw_dns_name }}
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "(current_rgw_dns_name.stdout | default('')) | trim != ceph_rgw_dns_name"
  changed_when: true

# --- Step 11.6: Self-signed TLS cert for RGW frontend ---
# Generated on the bootstrap node; cephadm distributes the combined PEM via the
# service spec. Rotate: delete /etc/ceph/rgw-ssl.{crt,key} on the bootstrap node
# and re-run. SANs: canonical DNS name + wildcard (virtual-hosted buckets),
# per-node FQDNs + bond IPs + fabric IPs, and the ingress VIP when enabled
# (haproxy terminates with this cert).

# Precompute -subj/SAN: inline backslash-newlines inside quoted openssl args fold
# the next line's indentation into the value (C="DE    ") and openssl aborts.
# The {%- %} whitespace control keeps the SAN free of embedded spaces.
- name: Build RGW self-signed cert subject and SAN
  ansible.builtin.set_fact:
    _rgw_cert_subj: >-
      /C={{ ceph_rgw_ssl_cert_subject_c }}/ST={{ ceph_rgw_ssl_cert_subject_st }}/L={{ ceph_rgw_ssl_cert_subject_l }}/O={{ ceph_rgw_ssl_cert_subject_o }}/CN={{ ceph_rgw_dns_name }}/emailAddress={{ ceph_rgw_ssl_cert_email }}
    _rgw_cert_san: >-
      subjectAltName=DNS:{{ ceph_rgw_dns_name }},DNS:*.{{ ceph_rgw_dns_name }}
      {%- for h in groups['ceph_nodes'] %},DNS:{{ hostvars[h]['hostname_short'] }}.{{ cluster_domain }}{% endfor %}
      {%- for h in groups['ceph_nodes'] %},IP:{{ hostvars[h]['bond_ip'] }}{% endfor %}
      {%- for h in groups['ceph_nodes'] %},IP:{{ hostvars[h]['ceph_service_ip'] }}{% endfor %}
      {%- if ceph_rgw_ingress_enabled | default(false) | bool and (ceph_rgw_ingress_vip | default('')) | length > 0 %},IP:{{ ceph_rgw_ingress_vip }}{% endif %}
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_ssl | default(false) | bool

- name: Generate RGW self-signed cert and key (10 year validity)
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    openssl req -x509 -newkey rsa:4096 -nodes \
      -keyout /etc/ceph/rgw-ssl.key \
      -out /etc/ceph/rgw-ssl.crt \
      -days {{ ceph_rgw_ssl_cert_days }} \
      -subj {{ _rgw_cert_subj | quote }} \
      -addext {{ _rgw_cert_san | quote }}
  args:
    executable: /bin/bash
    creates: /etc/ceph/rgw-ssl.crt
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_ssl | default(false) | bool
  changed_when: true

- name: Read combined cert + key for service spec
  ansible.builtin.shell: cat /etc/ceph/rgw-ssl.crt /etc/ceph/rgw-ssl.key
  args:
    executable: /bin/bash
  register: rgw_ssl_combined
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_ssl | default(false) | bool
  changed_when: false
  no_log: true

- name: Set combined PEM fact
  ansible.builtin.set_fact:
    rgw_ssl_cert_combined_pem: "{{ rgw_ssl_combined.stdout }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_ssl | default(false) | bool
  no_log: true

# --- Step 12: Deploy RGW daemons via cephadm service spec ---
# YAML spec (not `ceph orch apply rgw ...` CLI) because only the spec accepts
# inline rgw_frontend_ssl_certificate. Placement pinned to groups['ceph_nodes'],
# not the play batch: cephadm is declarative, so a --limit re-run with a smaller
# placement would REMOVE daemons on omitted hosts.

- name: Render RGW service spec
  ansible.builtin.template:
    src: rgw-spec.yaml.j2
    dest: /etc/ceph/rgw-spec.yaml
    owner: root
    group: root
    mode: '0600'
  when: inventory_hostname in groups['ceph_bootstrap']
  no_log: true

- name: Apply RGW service spec
  ansible.builtin.command: ceph orch apply -i /etc/ceph/rgw-spec.yaml
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Step 12.5: Dashboard RGW SSL verify ---
# Self-signed cert makes the dashboard's RGW client 500 on the Object Gateway
# page unless verification is off.

- name: Disable dashboard RGW API SSL verification (self-signed cert)
  ansible.builtin.command: ceph dashboard set-rgw-api-ssl-verify false
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_ssl | default(false) | bool
  changed_when: false

- name: Sync dashboard RGW credentials
  ansible.builtin.command: ceph dashboard set-rgw-credentials
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Step 13: Wait for RGW daemons ---

- name: Wait for RGW daemons to start
  ansible.builtin.shell: |
    set -eo pipefail
    ceph orch ls --service-type rgw --format json | python3 -c "
    import sys, json
    svcs = json.load(sys.stdin)
    running = sum(s.get('status', {}).get('running', 0) for s in svcs)
    print(running)
    "
  args:
    executable: /bin/bash
  register: rgw_running_count
  # Readiness gate is play-scoped (respects --limit) so a subset deploy doesn't
  # block forever; the rgw-spec placement itself stays pinned to all ceph_nodes.
  until: "(rgw_running_count.stdout | int) >= (groups['ceph_nodes'] | intersect(ansible_play_hosts) | length)"
  retries: 30
  delay: 10
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Step 13.7: RGW ingress (haproxy + keepalived) -- health-checked S3 VIP ---
# TLS TERMINATION mode: haproxy terminates on the VIP with the reused RGW cert
# (combined PEM from Step 11.6), re-encrypts to beast; health checks drop a dead
# node instead of blackholing ~1/N of S3 connections. Must run AFTER the RGW
# readiness wait (backend_service must exist). Terminate, not L4 passthrough:
# passthrough needs IngressSpec.use_tcp_mode_over_rgw, absent on pinned 20.2.2
# (unknown spec key => `ceph orch apply` TypeError); Host header is forwarded so
# virtual-hosted buckets keep working. No 443 collision ONLY while beast binds a
# specific IP (ceph_bind_networks non-empty; asserted below), else 0.0.0.0 collides
# with the co-located VIP. ORDERING: the TF DNS cutover of s3.<domain> to the VIP
# MUST NOT precede this ingress being live.

- name: Assert RGW ingress preconditions (VIP + restricted beast bind + RGW ssl)
  ansible.builtin.assert:
    that:
      - (ceph_rgw_ingress_vip | default('')) | length > 0
      - ceph_bind_networks | default([]) | length > 0
      - ceph_rgw_ssl | default(false) | bool
    fail_msg: >-
      ceph_rgw_ingress_enabled is true but a precondition is unmet.
      Require: ceph_rgw_ingress_vip set (e.g. 10.40.20.250); ceph_bind_networks
      non-empty so beast binds a specific per-node IP (else beast binds
      0.0.0.0:{{ ceph_rgw_port }} and the haproxy VIP bind on the same port fails
      with EADDRINUSE); and ceph_rgw_ssl true so the self-signed cert exists for
      haproxy to terminate with (rgw_ssl_cert_combined_pem).
    quiet: true
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_ingress_enabled | default(false) | bool

- name: Render RGW ingress service spec
  ansible.builtin.template:
    src: rgw-ingress-spec.yaml.j2
    dest: /etc/ceph/rgw-ingress-spec.yaml
    owner: root
    group: root
    mode: '0600'
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_ingress_enabled | default(false) | bool
    - (ceph_rgw_ingress_vip | default('')) | length > 0
  no_log: true   # spec embeds the RGW private key (combined PEM)

- name: Apply RGW ingress service spec
  ansible.builtin.command: ceph orch apply -i /etc/ceph/rgw-ingress-spec.yaml
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_ingress_enabled | default(false) | bool
    - (ceph_rgw_ingress_vip | default('')) | length > 0
  changed_when: false

# --- Step 13.6: Pin pools to device-class CRUSH rules ---
# crush-rules.yml creates replicated_ssd/hdd but binds no pool; unpinned, the
# omap-heavy index falls to the class-agnostic default rule on HDD while the NVMe
# tier idles. Runs after RGW readiness because the .rgw.* pools are created lazily.
# Opt-in per cluster via ceph_rgw_ssd_pools/hdd_pools -- empty default leaves a
# live cluster alone (re-homing forces a rebalance).

- name: Re-query pools after RGW is up (system pools are created lazily)
  ansible.builtin.command: ceph osd pool ls
  when: inventory_hostname in groups['ceph_bootstrap']
  register: pool_list_post
  changed_when: false

- name: Set initial PG count on RGW metadata pools
  ansible.builtin.command: >
    ceph osd pool set {{ item }} pg_num {{ ceph_pg_init_meta }}
  loop:
    - .rgw.root
    - "{{ ceph_rgw_zone }}.rgw.log"
    - "{{ ceph_rgw_zone }}.rgw.control"
    - "{{ ceph_rgw_zone }}.rgw.meta"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - item in (pool_list_post.stdout | default(''))
  register: pg_meta_result
  changed_when: "'set' in pg_meta_result.stdout | default('')"
  failed_when:
    - pg_meta_result.rc is defined
    - pg_meta_result.rc != 0
    - "'is not >= current' not in pg_meta_result.stderr | default('')"

- name: Pin replica size on the RGW metadata + mgr pools (durability)
  # These otherwise inherit osd_pool_default_size/min_size (min_size 1 = single-
  # replica writes; 2 OSD losses could take out the RGW/mgr control plane). Pin to
  # ceph_rgw_replicated_size (spice 3/2, sietch 2/1). After RGW readiness because
  # these pools are lazily created; the pre-daemon snapshot missed them on run 1.
  ansible.builtin.shell: |
    set -o pipefail
    ch=0
    [ "$(ceph osd pool get {{ item }} size | awk '{print $2}')" = "{{ ceph_rgw_replicated_size }}" ] || { ceph osd pool set {{ item }} size {{ ceph_rgw_replicated_size }}; ch=1; }
    [ "$(ceph osd pool get {{ item }} min_size | awk '{print $2}')" = "{{ ceph_rgw_replicated_min_size }}" ] || { ceph osd pool set {{ item }} min_size {{ ceph_rgw_replicated_min_size }}; ch=1; }
    [ "$ch" = 1 ] && echo CHANGED || echo ok
  args:
    executable: /bin/bash
  loop:
    - .rgw.root
    - "{{ ceph_rgw_zone }}.rgw.log"
    - "{{ ceph_rgw_zone }}.rgw.control"
    - "{{ ceph_rgw_zone }}.rgw.meta"
    - .mgr
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - item in (pool_list_post.stdout | default(''))
  register: size_meta_result
  changed_when: "'CHANGED' in (size_meta_result.stdout | default(''))"

- name: Pin pools to the SSD device-class CRUSH rule
  ansible.builtin.shell: |
    set -o pipefail
    cur=$(ceph osd pool get {{ item | quote }} crush_rule | awk '{print $2}')
    if [ "$cur" != {{ ceph_rgw_ssd_crush_rule | quote }} ]; then
      ceph osd pool set {{ item | quote }} crush_rule {{ ceph_rgw_ssd_crush_rule | quote }}
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  loop: "{{ ceph_rgw_ssd_pools }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_ssd_pools | length > 0
    - item in (pool_list_post.stdout | default(''))
  register: ssd_pin_result
  changed_when: "'CHANGED' in (ssd_pin_result.stdout | default(''))"

- name: Pin pools to the HDD device-class CRUSH rule
  ansible.builtin.shell: |
    set -o pipefail
    cur=$(ceph osd pool get {{ item | quote }} crush_rule | awk '{print $2}')
    if [ "$cur" != {{ ceph_rgw_hdd_crush_rule | quote }} ]; then
      ceph osd pool set {{ item | quote }} crush_rule {{ ceph_rgw_hdd_crush_rule | quote }}
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  loop: "{{ ceph_rgw_hdd_pools }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - ceph_rgw_hdd_pools | length > 0
    - item in (pool_list_post.stdout | default(''))
  register: hdd_pin_result
  changed_when: "'CHANGED' in (hdd_pin_result.stdout | default(''))"

# --- Step 13.5: Ensure dashboard RGW user has admin caps ---
# cephadm auto-creates the "dashboard" user with system=true but zero caps;
# without admin caps the Object Gateway page 403s (SignatureDoesNotMatch).

- name: Ensure dashboard RGW user has admin caps
  ansible.builtin.shell: |
    set -o pipefail
    CAPS=$(radosgw-admin user info --uid=dashboard --format json 2>/dev/null \
      | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('caps',[])))")
    if [ "$CAPS" = "0" ]; then
      radosgw-admin caps add --uid=dashboard \
        --caps='buckets=*;users=*;usage=*;metadata=*;zone=*' >/dev/null 2>&1
      echo "CHANGED"
    else
      echo "OK"
    fi
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  register: dashboard_caps
  changed_when: "'CHANGED' in dashboard_caps.stdout"

# --- Step 14: Create S3 user ---

- name: Check if S3 user exists
  ansible.builtin.command: "radosgw-admin user info --uid={{ ceph_rgw_s3_user_uid }}"
  register: s3_user_check
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  failed_when: false

- name: Create S3 service user with predetermined keys for {{ ceph_rgw_s3_user_uid }}
  ansible.builtin.command: >
    radosgw-admin user create
    --uid={{ ceph_rgw_s3_user_uid }}
    --display-name='{{ ceph_rgw_s3_user_display_name }}'
    --access-key='{{ ceph_rgw_s3_user_access_key }}'
    --secret-key='{{ ceph_rgw_s3_user_secret_key }}'
    --max-buckets=100
  register: s3_user_create
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - s3_user_check.rc != 0
  changed_when: true
  no_log: true

# --- Step 14.5: Metrics-worker RGW admin user (read-only) ---
# Admin-ops user for the metrics worker; keys TF-minted in 1P
# (<CLUSTER>_METRICS_WORKER_{ACCESS,SECRET}_KEY). Read-only caps only.

- name: Check if metrics-worker RGW user exists
  ansible.builtin.command: "radosgw-admin user info --uid={{ ceph_rgw_metrics_user_uid }}"
  register: metrics_user_check
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  failed_when: false

- name: Create metrics-worker RGW user with predetermined keys for {{ ceph_rgw_metrics_user_uid }}
  ansible.builtin.command: >
    radosgw-admin user create
    --uid={{ ceph_rgw_metrics_user_uid }}
    --display-name='{{ ceph_rgw_metrics_user_display_name }}'
    --access-key='{{ ceph_rgw_metrics_user_access_key }}'
    --secret-key='{{ ceph_rgw_metrics_user_secret_key }}'
    --max-buckets=0
  register: metrics_user_create
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - metrics_user_check.rc != 0
  changed_when: true
  no_log: true

- name: Ensure metrics-worker RGW user has read-only admin caps
  ansible.builtin.shell: |
    set -o pipefail
    CAPS=$(radosgw-admin user info --uid={{ ceph_rgw_metrics_user_uid }} --format json 2>/dev/null \
      | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('caps',[])))")
    if [ "$CAPS" -lt 4 ]; then
      radosgw-admin caps add --uid={{ ceph_rgw_metrics_user_uid }} \
        --caps='{{ ceph_rgw_metrics_user_caps }}' >/dev/null 2>&1
      echo "CHANGED"
    else
      echo "OK"
    fi
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  register: metrics_caps
  changed_when: "'CHANGED' in metrics_caps.stdout"

# --- Step 15: Converge S3 user keys to the 1P canonical key (gated rotation) ---
# Pre-pattern clusters carry a cephadm-generated random key. Gated behind
# rotate_s3_keys (rotating a live key is disruptive). Canonical key is added
# before strays are retired, so the user is never keyless. A stray sharing the
# access key with a different secret is not auto-corrected (manual key create).

- name: Get current S3 user info
  ansible.builtin.command: "radosgw-admin user info --uid={{ ceph_rgw_s3_user_uid }}"
  register: s3_user_info
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  no_log: true
  tags: [s3_keys]

- name: Compute S3 access keys present on the user
  ansible.builtin.set_fact:
    s3_access_keys: "{{ (s3_user_info.stdout | from_json)['keys'] | map(attribute='access_key') | list }}"
  when: inventory_hostname in groups['ceph_bootstrap']
  no_log: true
  tags: [s3_keys]

- name: Derive S3 key convergence state vs 1P canonical
  ansible.builtin.set_fact:
    s3_canonical_missing: "{{ ceph_rgw_s3_user_access_key not in s3_access_keys }}"
    s3_stray_keys: "{{ s3_access_keys | difference([ceph_rgw_s3_user_access_key]) }}"
  when: inventory_hostname in groups['ceph_bootstrap']
  no_log: true
  tags: [s3_keys]

- name: Report S3 key convergence state
  ansible.builtin.debug:
    msg: >-
      {{ ceph_rgw_s3_user_uid }} keys:
      canonical_present={{ not s3_canonical_missing }}
      stray_count={{ s3_stray_keys | length }}
      rotate_s3_keys={{ rotate_s3_keys | default(false) | bool }}
  when: inventory_hostname in groups['ceph_bootstrap']
  tags: [s3_keys]

- name: Add canonical S3 key from 1P (rotate_s3_keys=true, key missing)
  ansible.builtin.command: >
    radosgw-admin key create
    --uid={{ ceph_rgw_s3_user_uid }}
    --access-key='{{ ceph_rgw_s3_user_access_key }}'
    --secret-key='{{ ceph_rgw_s3_user_secret_key }}'
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - rotate_s3_keys | default(false) | bool
    - s3_canonical_missing | default(false)
  changed_when: true
  no_log: true
  tags: [s3_keys]

- name: Retire non-canonical S3 keys (rotate_s3_keys=true)
  ansible.builtin.command: >
    radosgw-admin key rm
    --uid={{ ceph_rgw_s3_user_uid }}
    --access-key='{{ item }}'
    --key-type=s3
  loop: "{{ s3_stray_keys | default([]) }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - rotate_s3_keys | default(false) | bool
  changed_when: true
  no_log: true
  tags: [s3_keys]

- name: Display S3 endpoint (credentials live in 1P, not log output)
  ansible.builtin.debug:
    msg:
      - "=== S3 endpoint for {{ ceph_rgw_s3_user_uid }} ==="
      - "Access Key:        op://{{ cluster_secrets_vault }}/{{ cluster_name | upper }}_CEPH_S3_SVC_YUCCA_RESTIC_ACCESS_KEY/password"
      - "Secret Key:        op://{{ cluster_secrets_vault }}/{{ cluster_name | upper }}_CEPH_S3_SVC_YUCCA_RESTIC_SECRET_KEY/password"
      - "Endpoint (DNS):    {{ ceph_rgw_scheme }}://{{ ceph_rgw_dns_name }}:{{ ceph_rgw_port }}"
      - "Endpoint (direct): {{ ceph_rgw_scheme }}://{{ ceph_service_ip }}:{{ ceph_rgw_port }}"
      - "Region:            {{ ceph_rgw_zonegroup_api_name }}"
      - "Virtual-hosted:    {{ ceph_rgw_scheme }}://<bucket>.{{ ceph_rgw_dns_name }}:{{ ceph_rgw_port }}"
      - "Path-style:        {{ ceph_rgw_scheme }}://{{ ceph_rgw_dns_name }}:{{ ceph_rgw_port }}/<bucket>"
  when: inventory_hostname in groups['ceph_bootstrap']
  no_log: false

# --- Step 16: Show RGW status ---

- name: Show RGW status
  ansible.builtin.shell: |
    echo "=== RGW Services ==="
    ceph orch ls --service-type rgw
    echo ""
    echo "=== Realm ==="
    radosgw-admin realm list
    echo ""
    echo "=== Zonegroup ==="
    radosgw-admin zonegroup get --rgw-zonegroup={{ ceph_rgw_zonegroup }}
  args:
    executable: /bin/bash
  register: rgw_final_status
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Display RGW status
  ansible.builtin.debug:
    msg: "{{ rgw_final_status.stdout_lines }}"
  when: inventory_hostname in groups['ceph_bootstrap']
