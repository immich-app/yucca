---
# Phase 1: Prerequisites (all nodes)

    # /etc/hosts is managed by the baseline role.

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Ceph release GPG key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL {{ ceph_repo_key_url }} | gpg --dearmor -o /etc/apt/keyrings/ceph.gpg
  args:
    creates: /etc/apt/keyrings/ceph.gpg
    executable: /bin/bash

- name: Add Ceph Tentacle repository
  ansible.builtin.copy:
    content: "deb [signed-by=/etc/apt/keyrings/ceph.gpg] {{ ceph_repo_url }} bookworm main\n"
    dest: /etc/apt/sources.list.d/ceph.list
    mode: '0644'

- name: Update apt cache
  # Always refresh — no cache_valid_time. Hetzner installimage runs apt
  # during install, leaving the cache "fresh" (~minutes old) but without the
  # Ceph repo's Packages file. cache_valid_time=3600 here would skip refresh
  # and apt install would only see Debian's older cephadm (16.x) → version
  # pin fails. Always-refresh is the safe default for any new repo addition.
  ansible.builtin.apt:
    update_cache: true

    # Podman ecosystem, diagnostic tools, and service enablement are
    # handled by the baseline role. This task installs only Ceph-specific
    # packages that baseline doesn't cover.

- name: Install cephadm and Ceph-specific dependencies
  ansible.builtin.apt:
    name:
      - "cephadm={{ ceph_release_version }}"
      - "ceph-common={{ ceph_release_version }}"
      - python3-asyncssh
    state: present

    # dbus, chrony, and podman.socket are enabled by the baseline role.

- name: Disable sntrup761 post-quantum kex (hangs with asyncssh/cephadm)
  ansible.builtin.copy:
    # yamllint disable-line rule:line-length
    content: >-
      KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256
    dest: /etc/ssh/sshd_config.d/no-sntrup.conf
    mode: '0644'
  notify: Restart sshd
