---
# Phase 6: Verify cluster health

- name: Show cluster status
  ansible.builtin.shell: |
    set -o pipefail
    echo "=== Cluster Status ==="
    ceph status
    echo ""
    echo "=== OSD Tree ==="
    ceph osd tree
    echo ""
    echo "=== Cluster Capacity ==="
    ceph df
    echo ""
    echo "=== RGW Services ==="
    ceph orch ls --service-type rgw 2>/dev/null || echo "No RGW services deployed"
    echo ""
    echo "=== RGW Endpoints ==="
    radosgw-admin zonegroup get --rgw-zonegroup={{ ceph_rgw_zonegroup }} 2>/dev/null | python3 -c "
    import sys, json
    try:
        zg = json.load(sys.stdin)
        print(f\"Region (api_name): {zg.get('api_name', 'N/A')}\")
        print(f\"Endpoints: {zg.get('endpoints', [])}\")
    except: print('RGW not configured')
    " || echo "RGW not configured"
    echo ""
    echo "=== Monitoring Services ==="
    ceph orch ls --service-type prometheus 2>/dev/null || echo "No monitoring deployed"
    ceph orch ls --service-type grafana 2>/dev/null || true
    ceph orch ls --service-type alertmanager 2>/dev/null || true
    ceph orch ls --service-type node-exporter 2>/dev/null || true
    ceph orch ls --service-type ceph-exporter 2>/dev/null || true
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  register: cluster_status
  changed_when: false

- name: Display final cluster state
  ansible.builtin.debug:
    msg: "{{ cluster_status.stdout_lines }}"
  when: inventory_hostname in groups['ceph_bootstrap']

# --- Drift guard: assert the live dashboard credential matches the vault ---
# Functional check (dependency-free: no bcrypt needed). We discover the
# dashboard URL from `ceph mgr services` and attempt an API login with the
# vaulted credential; HTTP 201 means the cluster password matches IaC. If the
# bootstrap reconcile task is ever removed or fails, this fails the play loudly
# instead of letting the credential silently drift.
- name: Probe dashboard login with the vaulted credential
  ansible.builtin.shell: |
    set -o pipefail
    url=$(ceph mgr services 2>/dev/null \
      | python3 -c 'import sys,json; print(json.load(sys.stdin).get("dashboard","").rstrip("/"))')
    if [ -z "$url" ]; then echo "no-dashboard-url"; exit 0; fi
    # Password travels via env + stdin only — never on the process argv.
    code=$(python3 -c 'import json,os; print(json.dumps({"username": os.environ["DASH_U"], "password": os.environ["DASH_P"]}))' \
      | curl -sk -m 15 -o /dev/null -w '%{http_code}' \
          -H 'Accept: application/vnd.ceph.api.v1.0+json' \
          -H 'Content-Type: application/json' \
          -X POST "$url/api/auth" --data-binary @-)
    echo "$code"
  args:
    executable: /bin/bash
  environment:
    DASH_U: "{{ ceph_dashboard_user }}"
    DASH_P: "{{ ceph_dashboard_password }}"
  when: inventory_hostname in groups['ceph_bootstrap']
  register: dashboard_cred_probe
  changed_when: false
  failed_when: false
  no_log: true

- name: Assert dashboard admin credential matches the vault
  ansible.builtin.assert:
    that:
      - (dashboard_cred_probe.stdout_lines | default(['']) | last) == '201'
    success_msg: "Dashboard admin login matches the vaulted password."
    fail_msg: >-
      Dashboard admin credential has DRIFTED from IaC (got HTTP
      '{{ dashboard_cred_probe.stdout_lines | default(['']) | last }}', expected 201).
      The running cluster's password does not match ceph_dashboard_password.
      Re-run the ceph_deploy role to reconcile, or investigate an out-of-band change.
  when: inventory_hostname in groups['ceph_bootstrap']

# --- Validation: device-class CRUSH pool placement ---
# Guards the "rule created but no pool bound" failure mode surfaced by the deep
# review: assert every pool we intended on a tier actually carries that rule, and
# that the SSD rule bound to live OSDs (a rule whose device class has zero OSDs
# selects nothing and leaves the pinned pool's PGs inactive). Only runs when the
# cluster opts in to pinning (ceph_rgw_ssd_pools / _hdd_pools); skips absent pools.
- name: Validate device-class pool placement
  ansible.builtin.shell: |
    set -o pipefail
    rc=0
    check() {  # $1 pool, $2 want_rule
      ceph osd pool ls | grep -qxF "$1" || { echo "skip (absent): $1"; return; }
      got=$(ceph osd pool get "$1" crush_rule | awk '{print $2}')
      if [ "$got" = "$2" ]; then echo "ok: $1 -> $2"
      else echo "FAIL: $1 -> $got (want $2)"; rc=1; fi
    }
    {% for p in ceph_rgw_ssd_pools %}
    check {{ p | quote }} {{ ceph_rgw_ssd_crush_rule | quote }}
    {% endfor %}
    {% for p in ceph_rgw_hdd_pools %}
    check {{ p | quote }} {{ ceph_rgw_hdd_crush_rule | quote }}
    {% endfor %}
    n=$(ceph osd crush class ls-osd ssd 2>/dev/null | grep -c '^[0-9]' || true)
    if [ "$n" -gt 0 ]; then echo "ok: ssd class has $n OSDs"
    else echo "FAIL: ssd class has 0 OSDs (replicated_ssd would select nothing)"; rc=1; fi
    [ "$rc" = 0 ] && echo VALIDATION_OK || echo VALIDATION_FAIL
  args:
    executable: /bin/bash
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_rgw_ssd_pools | length + ceph_rgw_hdd_pools | length) > 0
  register: crush_placement_check
  changed_when: false
  failed_when: "'VALIDATION_FAIL' in (crush_placement_check.stdout | default(''))"

- name: Show device-class pool placement validation
  ansible.builtin.debug:
    msg: "{{ crush_placement_check.stdout_lines }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - crush_placement_check.stdout_lines is defined

# --- Validation: RGW replicated-pool durability ---
# Guards the run-1 durability regression surfaced by the deep review: the
# .rgw.* system pools are created lazily by the RGW daemon, so a size/min_size
# pin taken before the daemon is up skips them and they sit at the inherited
# 2/1. Assert every RGW replicated pool that exists carries the cluster's target
# size/min_size, so a miss fails the play instead of shipping single-replica.
- name: Validate RGW replicated-pool durability
  ansible.builtin.shell: |
    set -o pipefail
    rc=0
    check() {  # $1 pool
      ceph osd pool ls | grep -qxF "$1" || { echo "skip (absent): $1"; return; }
      sz=$(ceph osd pool get "$1" size | awk '{print $2}')
      mn=$(ceph osd pool get "$1" min_size | awk '{print $2}')
      if [ "$sz" = {{ ceph_rgw_replicated_size | quote }} ] && [ "$mn" = {{ ceph_rgw_replicated_min_size | quote }} ]; then
        echo "ok: $1 size=$sz min_size=$mn"
      else
        echo "FAIL: $1 size=$sz min_size=$mn (want {{ ceph_rgw_replicated_size }}/{{ ceph_rgw_replicated_min_size }})"; rc=1
      fi
    }
    {% for p in [ceph_rgw_index_pool, ceph_rgw_extra_pool, '.rgw.root', ceph_rgw_zone ~ '.rgw.log', ceph_rgw_zone ~ '.rgw.control', ceph_rgw_zone ~ '.rgw.meta', '.mgr'] %}
    check {{ p | quote }}
    {% endfor %}
    [ "$rc" = 0 ] && echo VALIDATION_OK || echo VALIDATION_FAIL
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  register: pool_durability_check
  changed_when: false
  failed_when: "'VALIDATION_FAIL' in (pool_durability_check.stdout | default(''))"

- name: Show RGW replicated-pool durability validation
  ansible.builtin.debug:
    msg: "{{ pool_durability_check.stdout_lines }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - pool_durability_check.stdout_lines is defined
