---
# Phase 5: Create OSDs via cephadm orch service spec (osd-spec.yml.j2, one doc
# per host type; cephadm handles LUKS/LVM/deploy/CRUSH). Template conditionals
# cover both sietch (SAS expander, sas_path_prefix REQUIRED) and NVMe-RAID
# (sas_path_prefix omitted) shapes. Required host_vars: ceph_hdd_osds
# ({path_phy, db}), ceph_ssd_osds ({path_phy+partition} SAS / {lv} NVMe-RAID).
#
# ceph_osd_spec_unmanaged: false (sietch) = managed, cephadm auto-adopts new
# disks; true (spice) = registered but inert -- reconciling a managed spec costs
# a ceph-volume lvm+raw list per host per serve-loop pass, which dominated the
# loop at 48 hosts. Inert specs provision only via the window below.

- name: Render OSD service spec on bootstrap node
  ansible.builtin.template:
    src: osd-spec.yml.j2
    dest: /etc/ceph/osd-spec.yml
    mode: '0644'
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  run_once: true
  register: osd_spec_render

- name: Show rendered OSD spec (for verification)
  ansible.builtin.command: cat /etc/ceph/osd-spec.yml
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  run_once: true
  changed_when: false
  register: osd_spec_content

- name: Display rendered OSD spec
  ansible.builtin.debug:
    msg: "{{ osd_spec_content.stdout_lines }}"
  run_once: true

- name: Apply OSD service spec via cephadm orch
  ansible.builtin.command: ceph orch apply osd -i /etc/ceph/osd-spec.yml
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  run_once: true
  register: orch_apply
  changed_when: >-
    'Scheduled' in (orch_apply.stdout | default(''))
    or 'created' in (orch_apply.stdout | default('') | lower)

# Provisioning window for unmanaged specs: set-managed, wait, set-unmanaged.
# Opt in with `-e ceph_osd_allow_spec_provisioning=true`. INITIAL PROVISIONING
# ONLY -- never open it to rebuild a replaced disk: cephadm may recreate the OSD
# without its block.db (Ceph tracker #68436), silently colocating it on the 22TB
# HDD on the NVMe-RAID shape; docs/runbooks/replace-disk.md drives ceph-volume
# directly instead. `always` closes the window even on timeout, so a failed run
# cannot leave specs managed and the serve loop crawling.
- name: Provision OSDs from the service spec
  vars:
    spec_window: >-
      {{ (ceph_osd_spec_unmanaged | default(false))
         and (ceph_osd_allow_spec_provisioning | default(false)) }}
    spec_inert: >-
      {{ (ceph_osd_spec_unmanaged | default(false))
         and not (ceph_osd_allow_spec_provisioning | default(false)) }}
  block:
    - name: Open the managed provisioning window
      ansible.builtin.shell: |
        set -o pipefail
        ceph orch ls --service-type osd --format json \
          | python3 -c 'import sys, json; [print(s["service_name"]) for s in json.load(sys.stdin)]' \
          | xargs -rn1 ceph orch set-managed
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
      run_once: true
      changed_when: true
      when: spec_window | bool

    - name: Wait for cephadm to provision all expected OSDs
      ansible.builtin.shell: |
        set -o pipefail
        EXPECTED={{
          (groups['ceph_nodes'] | intersect(ansible_play_hosts))
            | map('extract', hostvars)
            | map(attribute='ceph_hdd_osds', default=[])
            | map('length') | sum
          +
          (groups['ceph_nodes'] | intersect(ansible_play_hosts))
            | map('extract', hostvars)
            | map(attribute='ceph_ssd_osds', default=[])
            | map('length') | sum
        }}
        echo "Expecting $EXPECTED OSDs across the nodes in this run"
        for i in $(seq 1 180); do
          ACTUAL=$(ceph osd stat --format json 2>/dev/null \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('num_osds', 0))" \
            2>/dev/null || echo 0)
          echo "  attempt $i: $ACTUAL/$EXPECTED OSDs created"
          if [ "$ACTUAL" -ge "$EXPECTED" ]; then
            echo "All expected OSDs provisioned"
            exit 0
          fi
          sleep 10
        done
        echo "WARNING: only $ACTUAL of $EXPECTED OSDs provisioned after 30 minutes"
        exit 1
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
      run_once: true
      changed_when: false
      timeout: 1920
      when: not (spec_inert | bool)

    - name: Wait for OSDs to come up
      ansible.builtin.shell: |
        set -o pipefail
        for i in $(seq 1 180); do
          up=$(ceph osd stat --format json 2>/dev/null |
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('num_up_osds',0))" \
            2>/dev/null || echo 0)
          total=$(ceph osd stat --format json 2>/dev/null |
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('num_osds',0))" \
            2>/dev/null || echo 0)
          echo "OSDs: $up/$total up"
          if [ "$up" -eq "$total" ] && [ "$total" -gt 0 ]; then
            echo "All OSDs up"; exit 0
          fi
          sleep 10
        done
        echo "WARNING: Not all OSDs up after 30 minutes"
        exit 1
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
      run_once: true
      changed_when: false
      timeout: 1920
      when: not (spec_inert | bool)

  always:
    - name: Close the managed provisioning window
      ansible.builtin.shell: |
        set -o pipefail
        ceph orch ls --service-type osd --format json \
          | python3 -c 'import sys, json; [print(s["service_name"]) for s in json.load(sys.stdin)]' \
          | xargs -rn1 ceph orch set-unmanaged
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
      run_once: true
      changed_when: true
      when: spec_window | bool

# Safety net: an OSD up at reweight 0 (noin set pre-run) takes no data. But
# "up with reweight 0" is also the signature of a drain (orch osd rm / manual
# `ceph osd out` per replace-disk.md), and the osdmap can't tell them apart --
# reweighting a draining OSD back to 1.0 silently refills the disk being
# removed, while a stuck OSD is at least visible in `ceph osd tree`. So only
# correct when the cause is known:
#   in cephadm removal queue -> skip (draining); noin set -> reweight 1.0;
#   neither -> warn and leave (someone outed it).
# noin is read before the clear-noin task below; `destroyed` OSDs are not `up`
# so the filter skips them.

- name: Fix any OSDs stuck at reweight 0
  ansible.builtin.shell: |
    set -o pipefail
    # OSD ids cephadm is currently draining. Tolerates an empty queue, a
    # non-JSON message, and either the bare-list or {"osds": [...]} shape.
    DRAINING=$(ceph orch osd rm status --format json 2>/dev/null | python3 -c "
    import sys, json
    try:
        data = json.loads(sys.stdin.read() or '[]')
    except ValueError:
        data = []
    if isinstance(data, dict):
        data = data.get('osds', [])
    print(' '.join(str(o['osd_id']) for o in data
                   if isinstance(o, dict) and o.get('osd_id') is not None))
    " 2>/dev/null || true)
    echo "cephadm removal queue: ${DRAINING:-<empty>}"

    # Is noin set? Prefer the flags_set list; fall back to the comma string for
    # older releases that do not emit it. Anything unparseable reads as "not
    # set", which routes to the warn-only path rather than to reweighting.
    NOIN=$(ceph osd dump --format json 2>/dev/null | python3 -c "
    import sys, json
    try:
        d = json.load(sys.stdin)
    except ValueError:
        print('no'); sys.exit(0)
    flags = d.get('flags_set') or [f for f in (d.get('flags') or '').split(',') if f]
    print('yes' if 'noin' in flags else 'no')
    " 2>/dev/null || echo no)
    echo "noin flag set: ${NOIN:-no}"

    FIXED=0
    SKIPPED=0
    LEFT=0
    for osd_id in $(ceph osd tree --format json 2>/dev/null | python3 -c "
    import sys, json
    tree = json.load(sys.stdin)
    for node in tree.get('nodes', []):
        if node.get('type') == 'osd' and node.get('status') == 'up' \
           and node.get('reweight', 1) == 0:
            print(node['id'])
    "); do
      case " $DRAINING " in
        *" $osd_id "*)
          echo "Skipping osd.$osd_id - draining via ceph orch osd rm"
          SKIPPED=$((SKIPPED + 1))
          continue
          ;;
      esac
      if [ "$NOIN" != "yes" ]; then
        echo "WARNING: osd.$osd_id is up at reweight 0 but noin is not set." \
             "Leaving it alone - this is what a manual 'ceph osd out $osd_id'" \
             "looks like. If it is genuinely stuck, run 'ceph osd in $osd_id'."
        LEFT=$((LEFT + 1))
        continue
      fi
      echo "Reweighting osd.$osd_id from 0 to 1.0 (noin was set)"
      ceph osd reweight "$osd_id" 1.0
      FIXED=$((FIXED + 1))
    done
    if [ "$SKIPPED" -ne 0 ]; then
      echo "Left $SKIPPED draining OSDs alone"
    fi
    if [ "$LEFT" -ne 0 ]; then
      echo "Left $LEFT out-looking OSDs alone (see warnings above)"
    fi
    if [ "$FIXED" -eq 0 ]; then
      echo "Reweighted nothing"
    else
      echo "Fixed $FIXED OSDs with reweight=0"
    fi
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  run_once: true
  register: reweight_fix
  changed_when: "'Fixed' in reweight_fix.stdout"

# Surface the warnings: an OSD left at reweight 0 holds no data, worth showing
# the operator even though it is deliberately not an error.
- name: Surface OSDs left at reweight 0
  ansible.builtin.debug:
    msg: "{{ reweight_fix.stdout_lines | select('search', '^WARNING:') | list }}"
  run_once: true
  when: reweight_fix.stdout is defined and 'WARNING:' in reweight_fix.stdout

- name: Show OSD tree
  ansible.builtin.command: ceph osd tree
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  run_once: true
  changed_when: false
  register: osd_tree

- name: Display OSD tree
  ansible.builtin.debug:
    msg: "{{ osd_tree.stdout_lines }}"
  run_once: true

- name: Verify dmcrypt keys stored in MONs
  ansible.builtin.shell: |
    set -o pipefail
    ceph config-key dump 2>/dev/null | grep -c dm-crypt
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  run_once: true
  changed_when: false
  register: dmcrypt_keys

- name: Show dmcrypt key count
  ansible.builtin.debug:
    msg: >-
      {{ dmcrypt_keys.stdout }} dm-crypt keys stored
      in MON config-key database
  run_once: true

# Defensive: the spec-apply flow doesn't set noin, but a failed run of the old
# imperative flow may have left it set. Unset is a no-op when off.

- name: Defensive - clear noin flag if set
  ansible.builtin.command: ceph osd unset noin
  delegate_to: "{{ groups['ceph_bootstrap'][0] }}"
  run_once: true
  register: noin_unset
  changed_when: "'noin is unset' in (noin_unset.stdout | default(''))"
  failed_when: false
