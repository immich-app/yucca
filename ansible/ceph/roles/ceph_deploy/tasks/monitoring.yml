---
# Phase 5.8: Monitoring stack - dashboard integration
#
# cephadm auto-deploys the full monitoring stack (node-exporter,
# ceph-exporter, prometheus, alertmanager, grafana) during bootstrap.
# This task file only:
#   1. Ensures the prometheus mgr module is enabled
#   2. Waits for all monitoring daemons to come up
#   3. Configures dashboard integration URLs and credentials

# --- Step 1: Enable prometheus mgr module ---

- name: Check prometheus mgr module status
  ansible.builtin.shell: |
    set -o pipefail
    ceph mgr module ls --format json 2>/dev/null | python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    enabled = data.get('enabled_modules', [])
    print('enabled' if 'prometheus' in enabled else 'disabled')
    "
  args:
    executable: /bin/bash
  register: prometheus_module
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Enable prometheus mgr module
  ansible.builtin.command: ceph mgr module enable prometheus
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "'disabled' in prometheus_module.stdout"
  changed_when: true

# --- Step 2: Wait for cephadm to deploy monitoring ---

- name: Wait for monitoring daemons to start
  ansible.builtin.shell: |
    python3 -c "
    import json, subprocess
    services = ['node-exporter', 'ceph-exporter', 'prometheus',
                'alertmanager', 'grafana']
    for svc in services:
        out = subprocess.check_output(
            ['ceph', 'orch', 'ls', '--service-type', svc,
             '--format', 'json'],
            stderr=subprocess.DEVNULL)
        data = json.loads(out)
        running = sum(
            s.get('status', {}).get('running', 0) for s in data)
        if running == 0:
            print(f'waiting:{svc}')
            exit(1)
    print('all_running')
    " 2>/dev/null
  args:
    executable: /bin/bash
  register: monitoring_wait
  until: "'all_running' in monitoring_wait.stdout"
  retries: 30
  delay: 10
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  # Read-only, so run it under --check too. Left to default it skips, `until`
  # can never be satisfied, and every --check of this tag fails here after
  # burning the full 30 retries.
  check_mode: false

# --- Step 2.5: Re-spec the monitoring stack (fabric bind + alert delivery) ---
# cephadm auto-deployed the stack binding all interfaces and with NO alertmanager
# receiver. Re-apply the spec to (a) restrict the bind to ceph_bind_networks
# (fabric-only on spice, so ceph never listens on the WAN) and (b) route alerts to
# ceph_alertmanager_webhook_urls. Placement matches cephadm's defaults, so no
# daemon relocates. Each piece is independently gated in the template, and the
# whole re-spec is SKIPPED when BOTH are empty (flat clusters with no alerting, like
# sietch) - the auto-deployed stack is then left exactly as cephadm shipped it.
- name: Render monitoring service spec (fabric bind + alert receiver)
  ansible.builtin.template:
    src: monitoring-spec.yaml.j2
    dest: /etc/ceph/monitoring-spec.yaml
    owner: root
    group: root
    # 0600: the spec now carries the grafana initial_admin_password.
    mode: '0600'
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_bind_networks | default([]) | length) > 0
      or (ceph_alertmanager_webhook_urls | default([]) | length) > 0
  register: monitoring_spec_render

# `ceph orch apply -i` exits 0 even when the mgr rejects the spec, so rc alone
# proves nothing. cephadm parses every document in the file before it applies
# any of them, so one rejected document discards the whole apply. The result is
# a silent no-op that reads as a successful converge. Seen 2026-07-31: a
# `networks:` key on the ceph-exporter document failed the apply while the play
# reported ok, so an updated alertmanager webhook URL never reached the cluster.
- name: Apply monitoring service spec
  ansible.builtin.command: ceph orch apply -i /etc/ceph/monitoring-spec.yaml
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_bind_networks | default([]) | length) > 0
      or (ceph_alertmanager_webhook_urls | default([]) | length) > 0
  register: monitoring_spec_apply
  changed_when: false
  failed_when:
    - monitoring_spec_apply.rc != 0
      or 'Error' in (monitoring_spec_apply.stderr | default(''))
      or 'Invalid argument' in (monitoring_spec_apply.stderr | default(''))
      or 'Error' in (monitoring_spec_apply.stdout | default(''))

# --- Step 2.6: Pin the mgr dashboard + prometheus module bind to the fabric ---
#
# The dashboard (8443) and the prometheus mgr module (9283) run INSIDE the active
# ceph-mgr, not as standalone cephadm daemons, so the monitoring re-spec above
# does not reach them -- they bind :: (every interface, WAN included) and are
# closed only by nftables. Pin each mgr instance's own server_addr to that
# instance's fabric IP (ceph_service_ip) so whichever mgr is active listens on
# the fabric, never the WAN.
#
# PER-INSTANCE, not global: the active mgr fails over across the mgr hosts and
# each host has a DIFFERENT fabric IP (ceph_service_ip = 10.40.20.<index>). A
# single global mgr/dashboard/server_addr would bind a foreign IP after failover
# and the dashboard could not start. Ceph resolves the localized key
# mgr/<module>/<mgr_id>/server_addr ahead of the global one (the module reads it
# via get_localized_module_option), and each mgr reads ITS OWN value when its
# module starts serving (on mgr start / failover), so per-instance binding is
# inherently failover-safe. The mgr_id is the cephadm daemon name (<host>.<rand>,
# e.g. spice-ceph-adelia.abcdef), NOT hostname_short -- it is discovered at
# runtime from `ceph orch ps`, and the daemon's host is mapped back to that
# host's ceph_service_ip.
#
# TIMING: the new bind takes effect the next time each mgr (re)starts its module
# (mgr restart, failover, or upgrade); nftables keeps the WAN closed until then.
# We deliberately do NOT force a live module reload (disable/enable) -- that would
# drop the dashboard mid-converge for no durability gain, and the per-instance
# config can never leave the dashboard unbindable the way a global one could.
#
# Opt-in: only when ceph_bind_networks is non-empty. sietch (empty) is a no-op
# and keeps cephadm's bind-all default.
- name: Pin mgr dashboard + prometheus module bind to the fabric (per mgr instance)
  ansible.builtin.shell: |
    set -o pipefail
    python3 - <<'PYEOF'
    import json, subprocess, sys

    fabric_ip = {
    {% for h in groups['ceph_nodes'] %}
        "{{ hostvars[h]['hostname_short'] }}": "{{ hostvars[h]['ceph_service_ip'] }}",
    {% endfor %}
    }

    mgrs = json.loads(subprocess.check_output(
        ["ceph", "orch", "ps", "--daemon-type", "mgr", "--format", "json"]))
    cfg = json.loads(subprocess.check_output(
        ["ceph", "config", "dump", "--format", "json"]))
    current = {(c["section"], c["name"]): c["value"] for c in cfg}

    changed = False
    for d in mgrs:
        mgr_id = d["daemon_id"]
        host = d["hostname"]
        ip = fabric_ip.get(host)
        if not ip:
            sys.stderr.write(
                "WARNING: no fabric IP for mgr host %s, skipping\n" % host)
            continue
        for mod in ("dashboard", "prometheus"):
            key = "mgr/%s/%s/server_addr" % (mod, mgr_id)
            if current.get(("mgr", key)) != ip:
                subprocess.check_call(["ceph", "config", "set", "mgr", key, ip])
                print("CHANGED %s -> %s" % (key, ip))
                changed = True
    print("CHANGED" if changed else "ok")
    PYEOF
  args:
    executable: /bin/bash
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_bind_networks | default([]) | length) > 0
  register: mgr_module_bind
  changed_when: "'CHANGED' in (mgr_module_bind.stdout | default(''))"

# --- Step 2.7: Monitoring config overrides (derived from the shipped template) ---
#
# cephadm renders every monitoring config from a Jinja template.
# TemplateMgr.render() reads the mon config-key store at
# mgr/cephadm/services/<path> before the packaged template (cephadm/template.py:
# `store_name = name.rstrip('.j2')`). cephadm renders a stored value as Jinja
# with the same context, so an override keeps the dynamic parts intact: service
# discovery URLs, TLS branches, fsid.
#
# These overrides are derived, not pinned. The task reads the template that the
# running mgr ships and rewrites named anchors, each asserted to occur exactly
# once. It does not commit a copy of the upstream file. A committed copy goes
# stale on every Ceph upgrade and someone has to re-diff it by hand. Deriving
# picks up an upgraded template on the next converge. The cost is a dependency
# on an anchor string, so each edit asserts its anchor and fails the play rather
# than storing a config built on a guess.
#
# Two overrides, independently gated. Each flag's default carries the why:
# ceph_alertmanager_fix_route_tree, ceph_prometheus_drop_description_label.
- name: Derive and store the cephadm monitoring config overrides
  ansible.builtin.shell: |
    set -o pipefail
    python3 - <<'PYEOF'
    import json, os, subprocess, sys, tempfile

    TEMPLATE_DIR = "/usr/share/ceph/mgr/cephadm/templates/services"

    # `config-key get` may not round-trip a trailing newline. Compare on a
    # normalized form, or every converge reports a spurious change.
    def norm(s):
        return s.rstrip("\n")

    # Each override: the cephadm template path, an ordered list of edits, and a
    # sanity predicate over the upstream source. Every edit names the exact
    # upstream text it rewrites; it must occur exactly once or the play fails
    # rather than store a config built on a guess. The predicate guards against
    # a future Ceph release having already made the change, which would
    # otherwise double up.
    OVERRIDES = []

    if {{ ceph_alertmanager_fix_route_tree | bool | ternary('True', 'False') }}:
        # group_by carries pool_id as well as alertname. Six rules are
        # pool-scoped and CephPGsUnclean is per pool on a zero threshold, so
        # one PG going clean in a 16-PG pool flips that pool's alert; grouped
        # by alertname alone that flip re-notifies the whole group, including
        # a large pool's unchanged alert. Rules without pool_id share the empty
        # value and group exactly as before.
        OVERRIDES.append({
            "service": "alertmanager",
            "template": "alertmanager/alertmanager.yml.j2",
            "key": "mgr/cephadm/services/alertmanager/alertmanager.yml",
            "edits": [
                {
                    "find": "    - group_by: ['alertname']\n"
                            "      group_wait: 10s\n",
                    "replace": "    - group_by: ['alertname', 'pool_id']\n"
                               "      group_wait: 10s\n",
                },
                {
                    "find": "      receiver: 'ceph-dashboard'\n",
                    "replace": "      receiver: 'ceph-dashboard'\n"
                               "      continue: true\n"
                               "    - group_by: ['alertname', 'pool_id']\n"
                               "      group_wait: 10s\n"
                               "      group_interval: 10s\n"
                               "      repeat_interval: 1h\n"
                               "      receiver: 'default'\n",
                },
            ],
            # Upstream routes to 'default' exactly once (the parent receiver).
            # A second occurrence means upstream already added the sibling.
            "expect": lambda src: src.count("receiver: 'default'") == 1,
            "expect_msg": ("upstream already routes to 'default' more than once; "
                           "the route-tree bug may be fixed upstream"),
        })

    if {{ ceph_prometheus_drop_description_label | bool | ternary('True', 'False') }}:
        OVERRIDES.append({
            "service": "prometheus",
            "template": "prometheus/prometheus.yml.j2",
            "key": "mgr/cephadm/services/prometheus/prometheus.yml",
            "edits": [
                {
                    "find": "\nalerting:\n",
                    "replace": "\nalerting:\n"
                               "  alert_relabel_configs:\n"
                               "    # yucca: ceph_pool_metadata carries a `description` label (the\n"
                               "    # EC profile) that shadows the same-named annotation in any\n"
                               "    # receiver that resolves by field name.\n"
                               "    - regex: 'description'\n"
                               "      action: labeldrop\n",
                },
            ],
            "expect": lambda src: "alert_relabel_configs" not in src,
            "expect_msg": "upstream already defines alert_relabel_configs; merge by hand",
        })

    if not OVERRIDES:
        print("ok (no overrides enabled)")
        raise SystemExit(0)

    fsid = subprocess.check_output(["ceph", "fsid"]).decode().strip()
    mgrs = json.loads(subprocess.check_output(
        ["ceph", "orch", "ps", "--daemon-type", "mgr", "--format", "json"]))
    active = [d for d in mgrs if d.get("is_active")] or mgrs
    container = "ceph-%s-mgr-%s" % (fsid, active[0]["daemon_id"].replace(".", "-"))

    changed = []
    for o in OVERRIDES:
        upstream = subprocess.check_output([
            "podman", "exec", container, "cat",
            "%s/%s" % (TEMPLATE_DIR, o["template"]),
        ]).decode()

        if not o["expect"](upstream):
            sys.stderr.write("ERROR: %s: %s\n" % (o["service"], o["expect_msg"]))
            raise SystemExit(1)

        desired = upstream
        for e in o["edits"]:
            n = desired.count(e["find"])
            if n != 1:
                sys.stderr.write(
                    "ERROR: %s: expected exactly 1 occurrence of %r in the shipped "
                    "template, found %d. Upstream layout changed; review before "
                    "re-running.\n" % (o["service"], e["find"].splitlines()[0], n))
                raise SystemExit(1)
            desired = desired.replace(e["find"], e["replace"], 1)
        current = subprocess.run(
            ["ceph", "config-key", "get", o["key"]],
            capture_output=True).stdout.decode()

        if norm(current) == norm(desired):
            continue

        # `ceph config-key set <key>` does not read stdin. Given no value
        # argument it stores an empty value and exits 0. That silently deletes
        # the override and drops cephadm back to the packaged template. Pass the
        # value with `-i <file>`.
        with tempfile.NamedTemporaryFile("w", suffix=".j2", delete=False) as fh:
            fh.write(desired)
            tmp = fh.name
        try:
            subprocess.run(["ceph", "config-key", "set", o["key"], "-i", tmp],
                           check=True)
        finally:
            os.unlink(tmp)

        # Read back. An override that silently failed to store is worse than no
        # override: cephadm falls back to upstream and the repair disappears
        # with the play still reporting success.
        back = subprocess.run(
            ["ceph", "config-key", "get", o["key"]],
            capture_output=True).stdout.decode()
        if norm(back) != norm(desired):
            sys.stderr.write(
                "ERROR: %s: stored %d bytes but read back %d. The override did "
                "not persist; cephadm will use the packaged template.\n"
                % (o["service"], len(desired), len(back)))
            raise SystemExit(1)

        changed.append(o["service"])

    print("CHANGED " + " ".join(changed) if changed else "ok")
    PYEOF
  args:
    executable: /bin/bash
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_alertmanager_fix_route_tree | bool)
      or (ceph_prometheus_drop_description_label | bool)
  register: monitoring_overrides
  changed_when: "'CHANGED' in (monitoring_overrides.stdout | default(''))"
  tags: [alert_rendering]

# cephadm only re-renders a monitoring config when it redeploys the daemon, so
# the config-key writes above are inert until each daemon is redeployed. Gated on
# that specific service having changed, so a steady-state converge bounces
# nothing and a prometheus-only change does not interrupt alert delivery.
#
# alertmanager also redeploys when the service spec itself changed. cephadm saves
# a new spec but does NOT redeploy on a `user_data` change -- the webhook URL is
# not part of the daemon's dependency hash, so the running alertmanager keeps
# serving the old config indefinitely. Observed 2026-07-31: spec saved at
# 19:04:12, daemon still 15m old and still rendering the previous URL six minutes
# later. Without this, changing the receiver URL is a no-op until something else
# happens to bounce the daemon.
- name: Redeploy monitoring daemons whose override or spec changed
  ansible.builtin.command: "ceph orch redeploy {{ item }}"
  loop: "{{ ['alertmanager', 'prometheus'] }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - item in (monitoring_overrides.stdout | default(''))
      or (item == 'alertmanager'
          and (monitoring_spec_render.changed | default(false)))
  changed_when: true
  tags: [alert_rendering]

# --- Step 3: Configure dashboard integrations ---
# The dashboard runs on the active mgr and reaches these services on the fabric;
# advertise ceph_service_ip (fabric on spice), not bond_ip (the 1G WAN), so the
# URLs stay inside ceph_firewall_trusted_networks after harden.

- name: Configure dashboard Prometheus URL
  ansible.builtin.command: >
    ceph dashboard set-prometheus-api-host
    http://{{ hostvars[groups['ceph_bootstrap'][0]]['ceph_service_ip'] }}:{{ ceph_prometheus_port }}
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Configure dashboard Alertmanager URL
  ansible.builtin.command: >
    ceph dashboard set-alertmanager-api-host
    http://{{ hostvars[groups['ceph_bootstrap'][0]]['ceph_service_ip'] }}:{{ ceph_alertmanager_port }}
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Configure dashboard Grafana URL
  ansible.builtin.command: >
    ceph dashboard set-grafana-api-url
    https://{{ hostvars[groups['ceph_bootstrap'][0]]['ceph_service_ip'] }}:{{ ceph_grafana_port }}
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Disable Grafana SSL cert verification in dashboard
  ansible.builtin.command: >
    ceph dashboard set-grafana-api-ssl-verify false
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Step 4: Set Grafana admin credentials ---

# The Grafana admin LOGIN password is seeded by cephadm only at first deploy,
# and nothing reconciled it, so it drifted from the vault. That broke both
# direct login at :3000 and the dashboard Grafana API calls below (which
# authenticate as this same admin user). Enforce it from the vault on every
# converge. reset-admin-password writes Grafana's sqlite DB on the host volume,
# so the change persists across container restarts and redeploys.
- name: Find Grafana container
  ansible.builtin.shell: >
    set -o pipefail;
    podman ps --filter name=-grafana- {% raw %}--format '{{ .Names }}'{% endraw %} | head -1
  args:
    executable: /bin/bash
  register: grafana_container
  changed_when: false
  when: inventory_hostname in groups['ceph_bootstrap']
  tags: [grafana_admin_password]

- name: Enforce Grafana admin login password
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s' "$GF_ADMIN_PW" \
      | podman exec -i "$GF_CONTAINER" \
          grafana cli --homepath /usr/share/grafana --config /etc/grafana/grafana.ini \
          admin reset-admin-password --password-from-stdin
  args:
    executable: /bin/bash
  environment:
    GF_ADMIN_PW: "{{ ceph_grafana_admin_password }}"
    GF_CONTAINER: "{{ grafana_container.stdout }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - grafana_container.stdout | default('') | length > 0
  register: grafana_pw_reset
  changed_when: false
  # grafana-cli exits 0 when there is NO admin user to reset (it prints
  # "specify a user-id" over an empty user list), so rc alone green-lights a
  # no-op and the vault password never lands (spice, 2026-07-21: fresh
  # tentacle grafana ships disable_initial_admin_creation, user table empty,
  # this task "ok" on every converge). The admin is seeded by
  # initial_admin_password in the monitoring spec; if it is still absent,
  # fail loudly instead.
  failed_when: >-
    (grafana_pw_reset.rc | default(1)) != 0
    or 'specify a user-id'
       in ((grafana_pw_reset.stdout | default('')) + (grafana_pw_reset.stderr | default('')))
  no_log: true
  tags: [grafana_admin_password]

- name: Set Grafana admin user
  ansible.builtin.command: >
    ceph dashboard set-grafana-api-username {{ ceph_grafana_admin_user }}
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Set dashboard Grafana API password
  ansible.builtin.shell: |
    set -o pipefail
    echo '{{ ceph_grafana_admin_password }}' \
      | ceph dashboard set-grafana-api-password -i -
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  no_log: true

# --- Step 4.5: Provision custom Grafana dashboards ---

# Dashboards committed under files/grafana-dashboards/ are uploaded via the
# Grafana API as the (now seeded) admin, so they live in the repo instead of
# hand-uploads that a fresh cluster silently lacks (spice shipped without the
# RGW capacity dashboard until 2026-07-21). overwrite keeps them converged;
# the cephadm file-provisioned stock dashboards are untouched.
- name: Upload custom Grafana dashboards
  ansible.builtin.uri:
    url: "https://{{ hostvars[groups['ceph_bootstrap'][0]]['ceph_service_ip'] }}:{{ ceph_grafana_port }}/api/dashboards/db"
    method: POST
    url_username: "{{ ceph_grafana_admin_user }}"
    url_password: "{{ ceph_grafana_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      dashboard: "{{ lookup('ansible.builtin.file', item) | from_json }}"
      overwrite: true
      message: provisioned by ansible (ceph_deploy)
    status_code: 200
  loop: "{{ query('ansible.builtin.fileglob', role_path ~ '/files/grafana-dashboards/*.json') }}"
  loop_control:
    label: "{{ item | basename }}"
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  no_log: true
  tags: [grafana_dashboards]

# --- Step 5: Display monitoring endpoints ---

- name: Show monitoring status
  ansible.builtin.shell: |
    set -o pipefail
    echo "=== Monitoring Services ==="
    ceph orch ls --service-type prometheus
    ceph orch ls --service-type grafana
    ceph orch ls --service-type alertmanager
    ceph orch ls --service-type node-exporter
    ceph orch ls --service-type ceph-exporter
    echo ""
    echo "=== Endpoints ==="
    echo "Prometheus:   http://{{ ceph_service_ip }}:{{ ceph_prometheus_port }}"
    echo "Grafana:      https://{{ ceph_service_ip }}:{{ ceph_grafana_port }}"
    echo "Alertmanager: http://{{ ceph_service_ip }}:{{ ceph_alertmanager_port }}"
  args:
    executable: /bin/bash
  register: monitoring_status
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Display monitoring status
  ansible.builtin.debug:
    msg: "{{ monitoring_status.stdout_lines }}"
  when: inventory_hostname in groups['ceph_bootstrap']
