---
# Phase 5.8: Monitoring stack - dashboard integration
# cephadm auto-deploys the stack (node-/ceph-exporter, prometheus, alertmanager,
# grafana) at bootstrap; here we only enable the prometheus mgr module, wait for
# daemons, and wire dashboard URLs/credentials.

# --- Step 1: Enable prometheus mgr module ---

- name: Check prometheus mgr module status
  ansible.builtin.shell: |
    set -o pipefail
    ceph mgr module ls --format json 2>/dev/null | python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    enabled = data.get('enabled_modules', [])
    print('enabled' if 'prometheus' in enabled else 'disabled')
    "
  args:
    executable: /bin/bash
  register: prometheus_module
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Enable prometheus mgr module
  ansible.builtin.command: ceph mgr module enable prometheus
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - "'disabled' in prometheus_module.stdout"
  changed_when: true

# --- Step 2: Wait for cephadm to deploy monitoring ---

- name: Wait for monitoring daemons to start
  ansible.builtin.shell: |
    python3 -c "
    import json, subprocess
    services = ['node-exporter', 'ceph-exporter', 'prometheus',
                'alertmanager', 'grafana']
    for svc in services:
        out = subprocess.check_output(
            ['ceph', 'orch', 'ls', '--service-type', svc,
             '--format', 'json'],
            stderr=subprocess.DEVNULL)
        data = json.loads(out)
        running = sum(
            s.get('status', {}).get('running', 0) for s in data)
        if running == 0:
            print(f'waiting:{svc}')
            exit(1)
    print('all_running')
    " 2>/dev/null
  args:
    executable: /bin/bash
  register: monitoring_wait
  until: "'all_running' in monitoring_wait.stdout"
  retries: 30
  delay: 10
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Step 2.5: Re-spec the monitoring stack (fabric bind + alert delivery) ---
# Auto-deployed stack binds all interfaces with NO alertmanager receiver; re-spec
# restricts binds to ceph_bind_networks and routes alerts to
# ceph_alertmanager_webhook_urls. Placement matches cephadm defaults (no daemon
# relocates); skipped entirely when BOTH are empty (sietch keeps the stock stack).
- name: Render monitoring service spec (fabric bind + alert receiver)
  ansible.builtin.template:
    src: monitoring-spec.yaml.j2
    dest: /etc/ceph/monitoring-spec.yaml
    owner: root
    group: root
    # 0600: the spec now carries the grafana initial_admin_password.
    mode: '0600'
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_bind_networks | default([]) | length) > 0
      or (ceph_alertmanager_webhook_urls | default([]) | length) > 0
  register: monitoring_spec_render

# `ceph orch apply -i` exits 0 even when the mgr rejects the spec, and one bad
# document discards the whole multi-doc apply -- a silent no-op that reads as a
# successful converge (2026-07-31: `networks:` on the ceph-exporter doc dropped
# an updated webhook URL). Hence the stderr/stdout failed_when.
- name: Apply monitoring service spec
  ansible.builtin.command: ceph orch apply -i /etc/ceph/monitoring-spec.yaml
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_bind_networks | default([]) | length) > 0
      or (ceph_alertmanager_webhook_urls | default([]) | length) > 0
  register: monitoring_spec_apply
  changed_when: false
  failed_when:
    - monitoring_spec_apply.rc != 0
      or 'Error' in (monitoring_spec_apply.stderr | default(''))
      or 'Invalid argument' in (monitoring_spec_apply.stderr | default(''))
      or 'Error' in (monitoring_spec_apply.stdout | default(''))

# --- Step 2.55: Correct the alertmanager route tree ---
# Stock cephadm alertmanager.yml.j2 gives the 'ceph-dashboard' child route no
# matchers and `continue: true` only with an SNMP gateway, so every alert
# terminates there and 'default' (where the webhook lands) never fires --
# silently. Fix = store a corrected copy in the mon config-key store
# (mgr/cephadm/<name minus .j2>), cephadm's supported override; diff vs upstream
# in the header of files/alertmanager.yml.j2. Gated on a webhook being configured.
- name: Stage corrected alertmanager config template
  ansible.builtin.copy:
    src: alertmanager.yml.j2
    dest: /etc/ceph/alertmanager.yml.j2
    owner: root
    group: root
    mode: '0644'
  register: alertmanager_template_file
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_alertmanager_webhook_urls | default([]) | length) > 0

# check-then-set: config-key set always "succeeds", so compare first or every
# run reports changed and a real drift is invisible.
- name: Read the stored alertmanager config template
  ansible.builtin.command: >
    ceph config-key get mgr/cephadm/services/alertmanager/alertmanager.yml
  register: alertmanager_template_stored
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_alertmanager_webhook_urls | default([]) | length) > 0

- name: Store the corrected alertmanager config template
  ansible.builtin.command: >
    ceph config-key set mgr/cephadm/services/alertmanager/alertmanager.yml
    -i /etc/ceph/alertmanager.yml.j2
  register: alertmanager_template_set
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_alertmanager_webhook_urls | default([]) | length) > 0
    - (alertmanager_template_stored.stdout | default('')) !=
      (lookup('ansible.builtin.file', role_path ~ '/files/alertmanager.yml.j2'))
  changed_when: true

# Only on a real change: cephadm re-renders the config at redeploy, so without
# this the corrected template sits unused until some other event triggers one.
- name: Redeploy alertmanager to pick up the corrected template
  ansible.builtin.command: ceph orch redeploy alertmanager
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - alertmanager_template_set is changed
  changed_when: true

# --- Step 2.6: Pin the mgr dashboard + prometheus module bind to the fabric ---
# Dashboard (8443) + prometheus module (9283) run INSIDE the mgr, so the re-spec
# above misses them; unpinned they bind :: (WAN included), closed only by nftables.
# PER-INSTANCE keys (mgr/<module>/<mgr_id>/server_addr), not global: mgr fails
# over across hosts with different fabric IPs, and a global key would bind a
# foreign IP post-failover, leaving the dashboard unable to start. The localized
# key wins and each mgr reads its own on module start -> failover-safe. mgr_id is
# the cephadm daemon name (<host>.<rand>), NOT hostname_short; discovered from
# `ceph orch ps`. Takes effect on next module (re)start; deliberately no forced
# disable/enable (would drop the dashboard mid-converge for no gain). Opt-in via
# ceph_bind_networks; sietch (empty) keeps bind-all.
- name: Pin mgr dashboard + prometheus module bind to the fabric (per mgr instance)
  ansible.builtin.shell: |
    set -o pipefail
    python3 - <<'PYEOF'
    import json, subprocess, sys

    fabric_ip = {
    {% for h in groups['ceph_nodes'] %}
        "{{ hostvars[h]['hostname_short'] }}": "{{ hostvars[h]['ceph_service_ip'] }}",
    {% endfor %}
    }

    mgrs = json.loads(subprocess.check_output(
        ["ceph", "orch", "ps", "--daemon-type", "mgr", "--format", "json"]))
    cfg = json.loads(subprocess.check_output(
        ["ceph", "config", "dump", "--format", "json"]))
    current = {(c["section"], c["name"]): c["value"] for c in cfg}

    changed = False
    for d in mgrs:
        mgr_id = d["daemon_id"]
        host = d["hostname"]
        ip = fabric_ip.get(host)
        if not ip:
            sys.stderr.write(
                "WARNING: no fabric IP for mgr host %s, skipping\n" % host)
            continue
        for mod in ("dashboard", "prometheus"):
            key = "mgr/%s/%s/server_addr" % (mod, mgr_id)
            if current.get(("mgr", key)) != ip:
                subprocess.check_call(["ceph", "config", "set", "mgr", key, ip])
                print("CHANGED %s -> %s" % (key, ip))
                changed = True
    print("CHANGED" if changed else "ok")
    PYEOF
  args:
    executable: /bin/bash
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_bind_networks | default([]) | length) > 0
  register: mgr_module_bind
  changed_when: "'CHANGED' in (mgr_module_bind.stdout | default(''))"

# --- Step 2.7: Monitoring config overrides (derived from the shipped template) ---
# TemplateMgr.render() reads mgr/cephadm/services/<path> from the config-key
# store before the packaged template (template.py: name.rstrip('.j2')) and still
# renders it as Jinja, so dynamic parts (discovery URLs, TLS, fsid) survive.
# Overrides are DERIVED, not pinned: read the running mgr's template, inject at
# an asserted anchor -- a committed upstream copy would go stale on every Ceph
# upgrade. Anchor mismatch fails the play rather than storing a guess. Two
# overrides, independently gated; the why lives on each flag's default
# (ceph_alertmanager_fix_route_tree, ceph_prometheus_drop_description_label).
- name: Derive and store the cephadm monitoring config overrides
  ansible.builtin.shell: |
    set -o pipefail
    python3 - <<'PYEOF'
    import json, os, subprocess, sys, tempfile

    TEMPLATE_DIR = "/usr/share/ceph/mgr/cephadm/templates/services"

    # `config-key get` may not round-trip a trailing newline. Compare on a
    # normalized form, or every converge reports a spurious change.
    def norm(s):
        return s.rstrip("\n")

    # Each override: the cephadm template path, the anchor we inject after, the
    # text to inject, and a sanity predicate over the upstream source. The
    # predicate guards against a future Ceph release having already made the
    # change, which would otherwise double up.
    OVERRIDES = []

    if {{ ceph_alertmanager_fix_route_tree | bool | ternary('True', 'False') }}:
        OVERRIDES.append({
            "service": "alertmanager",
            "template": "alertmanager/alertmanager.yml.j2",
            "key": "mgr/cephadm/services/alertmanager/alertmanager.yml",
            "anchor": "      receiver: 'ceph-dashboard'\n",
            "inject": (
                "      continue: true\n"
                "    - group_by: ['alertname']\n"
                "      group_wait: 10s\n"
                "      group_interval: 10s\n"
                "      repeat_interval: 1h\n"
                "      receiver: 'default'\n"
            ),
            # Upstream routes to 'default' exactly once (the parent receiver).
            # A second occurrence means upstream already added the sibling.
            "expect": lambda src: src.count("receiver: 'default'") == 1,
            "expect_msg": ("upstream already routes to 'default' more than once; "
                           "the route-tree bug may be fixed upstream"),
        })

    if {{ ceph_prometheus_drop_description_label | bool | ternary('True', 'False') }}:
        OVERRIDES.append({
            "service": "prometheus",
            "template": "prometheus/prometheus.yml.j2",
            "key": "mgr/cephadm/services/prometheus/prometheus.yml",
            "anchor": "\nalerting:\n",
            "inject": (
                "  alert_relabel_configs:\n"
                "    # yucca: ceph_pool_metadata carries a `description` label (the\n"
                "    # EC profile) that shadows the same-named annotation in any\n"
                "    # receiver that resolves by field name.\n"
                "    - regex: 'description'\n"
                "      action: labeldrop\n"
            ),
            "expect": lambda src: "alert_relabel_configs" not in src,
            "expect_msg": "upstream already defines alert_relabel_configs; merge by hand",
        })

    if not OVERRIDES:
        print("ok (no overrides enabled)")
        raise SystemExit(0)

    fsid = subprocess.check_output(["ceph", "fsid"]).decode().strip()
    mgrs = json.loads(subprocess.check_output(
        ["ceph", "orch", "ps", "--daemon-type", "mgr", "--format", "json"]))
    active = [d for d in mgrs if d.get("is_active")] or mgrs
    container = "ceph-%s-mgr-%s" % (fsid, active[0]["daemon_id"].replace(".", "-"))

    changed = []
    for o in OVERRIDES:
        upstream = subprocess.check_output([
            "podman", "exec", container, "cat",
            "%s/%s" % (TEMPLATE_DIR, o["template"]),
        ]).decode()

        n = upstream.count(o["anchor"])
        if n != 1:
            sys.stderr.write(
                "ERROR: %s: expected exactly 1 anchor in the shipped template, "
                "found %d. Upstream layout changed; review before re-running.\n"
                % (o["service"], n))
            raise SystemExit(1)
        if not o["expect"](upstream):
            sys.stderr.write("ERROR: %s: %s\n" % (o["service"], o["expect_msg"]))
            raise SystemExit(1)

        desired = upstream.replace(o["anchor"], o["anchor"] + o["inject"], 1)
        current = subprocess.run(
            ["ceph", "config-key", "get", o["key"]],
            capture_output=True).stdout.decode()

        if norm(current) == norm(desired):
            continue

        # `ceph config-key set <key>` does not read stdin. Given no value
        # argument it stores an empty value and exits 0. That silently deletes
        # the override and drops cephadm back to the packaged template. Pass the
        # value with `-i <file>`.
        with tempfile.NamedTemporaryFile("w", suffix=".j2", delete=False) as fh:
            fh.write(desired)
            tmp = fh.name
        try:
            subprocess.run(["ceph", "config-key", "set", o["key"], "-i", tmp],
                           check=True)
        finally:
            os.unlink(tmp)

        # Read back. An override that silently failed to store is worse than no
        # override: cephadm falls back to upstream and the repair disappears
        # with the play still reporting success.
        back = subprocess.run(
            ["ceph", "config-key", "get", o["key"]],
            capture_output=True).stdout.decode()
        if norm(back) != norm(desired):
            sys.stderr.write(
                "ERROR: %s: stored %d bytes but read back %d. The override did "
                "not persist; cephadm will use the packaged template.\n"
                % (o["service"], len(desired), len(back)))
            raise SystemExit(1)

        changed.append(o["service"])

    print("CHANGED " + " ".join(changed) if changed else "ok")
    PYEOF
  args:
    executable: /bin/bash
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - (ceph_alertmanager_fix_route_tree | bool)
      or (ceph_prometheus_drop_description_label | bool)
  register: monitoring_overrides
  changed_when: "'CHANGED' in (monitoring_overrides.stdout | default(''))"
  tags: [alert_rendering]

# cephadm re-renders monitoring configs only on redeploy, so the config-key
# writes above are inert until then; gated per service so steady-state bounces
# nothing. alertmanager also redeploys on spec change: cephadm saves a new spec
# but does NOT redeploy on a `user_data` change (webhook URL is outside the
# dependency hash), so a receiver-URL change is otherwise a no-op indefinitely
# (observed 2026-07-31).
- name: Redeploy monitoring daemons whose override or spec changed
  ansible.builtin.command: "ceph orch redeploy {{ item }}"
  loop: "{{ ['alertmanager', 'prometheus'] }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - item in (monitoring_overrides.stdout | default(''))
      or (item == 'alertmanager'
          and (monitoring_spec_render.changed | default(false)))
  changed_when: true
  tags: [alert_rendering]

# --- Step 3: Configure dashboard integrations ---
# The dashboard runs on the active mgr and reaches these services on the fabric;
# advertise ceph_service_ip (fabric on spice), not bond_ip (the 1G WAN), so the
# URLs stay inside ceph_firewall_trusted_networks after harden.

- name: Configure dashboard Prometheus URL
  ansible.builtin.command: >
    ceph dashboard set-prometheus-api-host
    http://{{ hostvars[groups['ceph_bootstrap'][0]]['ceph_service_ip'] }}:{{ ceph_prometheus_port }}
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Configure dashboard Alertmanager URL
  ansible.builtin.command: >
    ceph dashboard set-alertmanager-api-host
    http://{{ hostvars[groups['ceph_bootstrap'][0]]['ceph_service_ip'] }}:{{ ceph_alertmanager_port }}
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Configure dashboard Grafana URL
  ansible.builtin.command: >
    ceph dashboard set-grafana-api-url
    https://{{ hostvars[groups['ceph_bootstrap'][0]]['ceph_service_ip'] }}:{{ ceph_grafana_port }}
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Disable Grafana SSL cert verification in dashboard
  ansible.builtin.command: >
    ceph dashboard set-grafana-api-ssl-verify false
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

# --- Step 4: Set Grafana admin credentials ---

# The Grafana admin password is seeded only at first deploy and drifted from the
# vault, breaking :3000 login and the dashboard API calls below. Enforce from the
# vault every converge; reset-admin-password writes the sqlite DB on the host
# volume, so it survives restarts/redeploys.
- name: Find Grafana container
  ansible.builtin.shell: >
    set -o pipefail;
    podman ps --filter name=-grafana- {% raw %}--format '{{ .Names }}'{% endraw %} | head -1
  args:
    executable: /bin/bash
  register: grafana_container
  changed_when: false
  when: inventory_hostname in groups['ceph_bootstrap']
  tags: [grafana_admin_password]

- name: Enforce Grafana admin login password
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s' "$GF_ADMIN_PW" \
      | podman exec -i "$GF_CONTAINER" \
          grafana cli --homepath /usr/share/grafana --config /etc/grafana/grafana.ini \
          admin reset-admin-password --password-from-stdin
  args:
    executable: /bin/bash
  environment:
    GF_ADMIN_PW: "{{ ceph_grafana_admin_password }}"
    GF_CONTAINER: "{{ grafana_container.stdout }}"
  when:
    - inventory_hostname in groups['ceph_bootstrap']
    - grafana_container.stdout | default('') | length > 0
  register: grafana_pw_reset
  changed_when: false
  # grafana-cli exits 0 with NO admin user to reset ("specify a user-id"), so rc
  # alone green-lights a no-op (spice 2026-07-21: tentacle grafana ships
  # disable_initial_admin_creation, empty user table, task "ok" forever). Admin
  # is seeded by initial_admin_password in the monitoring spec; fail loudly if absent.
  failed_when: >-
    (grafana_pw_reset.rc | default(1)) != 0
    or 'specify a user-id'
       in ((grafana_pw_reset.stdout | default('')) + (grafana_pw_reset.stderr | default('')))
  no_log: true
  tags: [grafana_admin_password]

- name: Set Grafana admin user
  ansible.builtin.command: >
    ceph dashboard set-grafana-api-username {{ ceph_grafana_admin_user }}
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Set dashboard Grafana API password
  ansible.builtin.shell: |
    set -o pipefail
    echo '{{ ceph_grafana_admin_password }}' \
      | ceph dashboard set-grafana-api-password -i -
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  no_log: true

# --- Step 4.5: Provision custom Grafana dashboards ---

# files/grafana-dashboards/ uploaded via the API so a fresh cluster doesn't
# silently lack hand-uploads (spice missed the RGW capacity dashboard until
# 2026-07-21). overwrite keeps them converged; stock dashboards untouched.
- name: Upload custom Grafana dashboards
  ansible.builtin.uri:
    url: "https://{{ hostvars[groups['ceph_bootstrap'][0]]['ceph_service_ip'] }}:{{ ceph_grafana_port }}/api/dashboards/db"
    method: POST
    url_username: "{{ ceph_grafana_admin_user }}"
    url_password: "{{ ceph_grafana_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      dashboard: "{{ lookup('ansible.builtin.file', item) | from_json }}"
      overwrite: true
      message: provisioned by ansible (ceph_deploy)
    status_code: 200
  loop: "{{ query('ansible.builtin.fileglob', role_path ~ '/files/grafana-dashboards/*.json') }}"
  loop_control:
    label: "{{ item | basename }}"
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false
  no_log: true
  tags: [grafana_dashboards]

# --- Step 5: Display monitoring endpoints ---

- name: Show monitoring status
  ansible.builtin.shell: |
    set -o pipefail
    echo "=== Monitoring Services ==="
    ceph orch ls --service-type prometheus
    ceph orch ls --service-type grafana
    ceph orch ls --service-type alertmanager
    ceph orch ls --service-type node-exporter
    ceph orch ls --service-type ceph-exporter
    echo ""
    echo "=== Endpoints ==="
    echo "Prometheus:   http://{{ ceph_service_ip }}:{{ ceph_prometheus_port }}"
    echo "Grafana:      https://{{ ceph_service_ip }}:{{ ceph_grafana_port }}"
    echo "Alertmanager: http://{{ ceph_service_ip }}:{{ ceph_alertmanager_port }}"
  args:
    executable: /bin/bash
  register: monitoring_status
  when: inventory_hostname in groups['ceph_bootstrap']
  changed_when: false

- name: Display monitoring status
  ansible.builtin.debug:
    msg: "{{ monitoring_status.stdout_lines }}"
  when: inventory_hostname in groups['ceph_bootstrap']
