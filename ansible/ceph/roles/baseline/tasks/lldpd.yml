---
# Configure lldpd (installed via baseline_extra_packages on fabric clusters).
# Advertises the node over LLDP so the leaf switches and NetBox can discover it
# on the 25G fabric. Imported from main.yml only when 'lldpd' is in the package
# list, so clusters without lldpd are unaffected.

- name: Deploy lldpd configuration
  ansible.builtin.template:
    src: lldpd.conf.j2
    dest: /etc/lldpd.d/10-ceph.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart lldpd

- name: Enable and start lldpd
  ansible.builtin.systemd:
    name: lldpd
    enabled: true
    state: started
