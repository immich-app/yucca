---
# Early SSH lockdown, right after iac-access -- NOT deferred to harden, so an
# installimaged node (PermitRootLogin yes + root password) is never left
# root-password-open on the WAN mid-campaign. Security-critical subset only
# (root key-only, no password auth, locked root password) with the SAME values
# as the security role's 50-hardening.conf so the drop-ins never disagree.
# Lockout-safe: ansible connects by key and iac-access already authorized it on
# root. Handler chain reloads (never restarts) only after sshd -t passes.

- name: Deploy the baseline SSH lockdown drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-baseline-ssh.conf
    content: |
      # Managed by ansible (roles/baseline/tasks/ssh-hardening.yml). Early
      # root/password lockdown; roles/security 50-hardening.conf adds the rest.
      PermitRootLogin prohibit-password
      PasswordAuthentication no
    owner: root
    group: root
    mode: '0644'
  notify: Validate sshd config
  tags: [ssh, hardening, security]

- name: Lock the root password (root is key-only; ansible/cephadm use keys)
  ansible.builtin.user:
    name: root
    password_lock: true
  tags: [ssh, hardening, security]

# Supersede the one-off interim drop-in from the pre-baseline BLOCKER remediation.
- name: Remove the interim root-password drop-in if present
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/00-disable-root-password.conf
    state: absent
  notify: Validate sshd config
  tags: [ssh, hardening, security]
