---
# Reverse order. Called by finalize.yml on success and by main.yml's rescue block
# on failure, so every unmount is best-effort.

- name: Unmount chroot bind mounts (reverse order)
  ansible.posix.mount:
    path: "{{ provision_mnt }}{{ item }}"
    state: unmounted
  loop:
    - /sys/firmware/efi/efivars
    - /sys
    - /proc
    - /dev/pts
    - /dev
  failed_when: false

- name: Unmount /mnt/boot/efi
  ansible.posix.mount:
    path: "{{ provision_mnt }}/boot/efi"
    state: unmounted
  failed_when: false

- name: Unmount /mnt/boot
  ansible.posix.mount:
    path: "{{ provision_mnt }}/boot"
    state: unmounted
  failed_when: false

- name: Unmount /mnt
  ansible.posix.mount:
    path: "{{ provision_mnt }}"
    state: unmounted
  failed_when: false
