---
# Idempotent via /mnt/etc/debian_version: a failed debootstrap leaves /mnt
# partially populated but without that file, so re-runs re-bootstrap.

- name: Check for existing debootstrap result
  ansible.builtin.stat:
    path: "{{ provision_mnt }}/etc/debian_version"
  register: debian_version_stat

- name: Debootstrap into target root
  ansible.builtin.command: >-
    debootstrap --arch amd64 {{ provision_debian_release }}
    {{ provision_mnt }} {{ provision_debian_mirror }}
  when: not debian_version_stat.stat.exists
  changed_when: true
  async: 1800
  poll: 15

- name: Announce skip
  ansible.builtin.debug:
    msg: "{{ provision_mnt }}/etc/debian_version already exists — skipping debootstrap."
  when: debian_version_stat.stat.exists
