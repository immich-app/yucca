---
# Phase 9: Finalize. Write the provisioning marker + mirror the ESP to SSD2
# (both skipped on resume via provisioning_done -- the marker IS the marker; an
# existing one must not get a bumped timestamp). Then: provision_skip_reboot
# stops here with /mnt + chroot binds mounted for canary inspection; otherwise
# unmount.yml tears down in reverse order (shared with main.yml's rescue) and a
# systemd-run reboot fires-and-forgets (the live image disappears, so ansible
# cannot wait on SSH). Post-reboot verification is a separate localhost play.

# --- Write marker + mirror ESP (skipped on resume via marker gate) -----

- name: Write marker and mirror ESP
  when: not provisioning_done
  block:
    - name: Render provisioning marker file
      ansible.builtin.template:
        src: ceph-provisioned.json.j2
        dest: "{{ provision_mnt }}{{ provision_marker_path }}"
        owner: root
        group: root
        mode: '0644'

    - name: Create temporary mount point for backup ESP
      ansible.builtin.file:
        path: /tmp/provision-backup-esp
        state: directory
        mode: '0755'

    - name: Mount backup ESP
      ansible.posix.mount:
        path: /tmp/provision-backup-esp
        src: "{{ ssd2_dev }}1"
        fstype: vfat
        opts: umask=0077
        state: ephemeral

    - name: Rsync primary ESP to backup ESP  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "rsync -a --delete {{ provision_mnt }}/boot/efi/ /tmp/provision-backup-esp/"
      changed_when: true

    - name: Unmount backup ESP
      ansible.posix.mount:
        path: /tmp/provision-backup-esp
        state: unmounted

    - name: Remove backup ESP mount point
      ansible.builtin.file:
        path: /tmp/provision-backup-esp
        state: absent

# --- Skip-reboot inspection mode ---------------------------------------
#
# When provision_skip_reboot is set, finalize stops here. Marker is
# written, ESP is mirrored, but /mnt stays mounted (with the chroot
# bind mounts still active). Operator can then `chroot /mnt` to verify,
# unmount manually, and reboot when ready.

- name: Report inspection-mode finalize (reboot skipped)
  ansible.builtin.debug:
    msg:
      - "{{ inventory_hostname }}: provision_skip_reboot=true — stopping before unmount/reboot."
      - "Marker written to {{ provision_mnt }}{{ provision_marker_path }}"
      - "ESP mirrored from {{ ssd1_dev }}1 to {{ ssd2_dev }}1"
      - "/mnt is still mounted with chroot bind mounts active."
      - "Inspect with: chroot {{ provision_mnt }} <cmd>"
      - "When done, unmount + reboot manually, or re-run without provision_skip_reboot."
  when: provision_skip_reboot | bool

- name: End play here when skip-reboot mode is active
  ansible.builtin.meta: end_host
  when: provision_skip_reboot | bool

# --- Unmount chroot bind mounts and /mnt hierarchy ---------------------

- name: Include unmount tasks (reverse order, best-effort)
  ansible.builtin.include_tasks: unmount.yml

- name: Sync filesystems
  ansible.builtin.command: sync
  changed_when: false

# --- Reboot ------------------------------------------------------------

- name: Schedule async reboot via systemd-run
  ansible.builtin.shell: |
    systemd-run --no-block --on-active=3s /sbin/reboot
  args:
    executable: /bin/bash
  changed_when: true

- name: Report reboot scheduled
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} rebooting into installed OS. Post-reboot
      verification will run from the controller as {{ admin_user }}@{{ bond_ip }}.
