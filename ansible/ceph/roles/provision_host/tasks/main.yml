---
# provision-host — idempotent fresh-install provisioning for sietch-ceph nodes.
# Flow: detect (live+UEFI asserts, SSD pre-flight) -> prerequisites_live (apt
# sources off live medium + toolchain) -> disks (remount/marker probe, else
# wipe/partition/mdraid/LVM/mount) -> install (debootstrap) -> configure ->
# chroot_packages -> admin_user (ansible-iac only; ops is post-boot via
# baseline, keeping fragile chroot work minimal) -> bootloader -> finalize
# (marker + ESP mirror, unmount + reboot or skip-reboot canary) -> unmount
# (shared with the rescue path).
#
# Each phase guards its own idempotency; a crash unmounts /mnt via rescue so
# the next run starts clean. A matching marker short-circuits phases 4-8 +
# marker/ESP via `provisioning_done` straight to unmount + reboot -- what makes
# committing after a skip-reboot canary safe. Re-provision an installed host by
# rebooting into the live image and re-running; a missing/invalid marker wipes.

- name: Detect provisioning state
  ansible.builtin.import_tasks: detect.yml

- name: Refuse to run without confirm_wipe=true
  ansible.builtin.fail:
    msg: >-
      REFUSING TO RUN. This role will destroy all data on the SSDs.
      Pass -e confirm_wipe=true to proceed.
  when: not (confirm_wipe | default(false) | bool)

- name: Provisioning phases
  block:
    - name: Install live-image prerequisites
      ansible.builtin.import_tasks: prerequisites_live.yml

    - name: Prepare disks (partition, mdraid, LVM, mount)
      ansible.builtin.import_tasks: disks.yml

    # Opt-in (-e provision_wipe_osd_disks=true, with confirm_wipe=true): on a
    # clean rebuild destroy-ceph.yml never ran, and cephadm skips still-signed HDDs.
    - name: Wipe OSD data HDDs (opt-in)
      ansible.builtin.import_tasks: wipe-osds.yml
      when: provision_wipe_osd_disks | default(false) | bool

    # ----- Marker-driven resume gate -------------------------------------
    # Marker present in /mnt = all chroot phases already wrote their final
    # state; only unmount + reboot remain. Skipping avoids re-binding mounts,
    # re-rotating SSH host keys (breaks known_hosts), re-salting the ops
    # password, pointless grub-install, and a stale provisioned_at rewrite.

    - name: Check if provisioning marker is present in chroot
      ansible.builtin.stat:
        path: "{{ provision_mnt }}{{ provision_marker_path }}"
      register: marker_stat

    - name: Set provisioning_done fact
      ansible.builtin.set_fact:
        provisioning_done: "{{ marker_stat.stat.exists | bool }}"

    - name: Announce marker-driven resume shortcut
      ansible.builtin.debug:
        msg: >-
          Marker present at {{ provision_mnt }}{{ provision_marker_path }} —
          all chroot phases will be skipped. Going straight to unmount + reboot.
      when: provisioning_done

    - name: Install base OS via debootstrap
      ansible.builtin.import_tasks: install.yml
      when: not provisioning_done

    - name: Configure target system (templates + static files)
      ansible.builtin.import_tasks: configure.yml
      when: not provisioning_done

    - name: Install packages inside chroot
      ansible.builtin.import_tasks: chroot_packages.yml
      when: not provisioning_done

    - name: Create ansible-iac user inside chroot (ops created post-boot by baseline)
      ansible.builtin.import_tasks: admin_user.yml
      when: not provisioning_done

    - name: Install bootloader
      ansible.builtin.import_tasks: bootloader.yml
      when: not provisioning_done

    - name: Finalize (marker, ESP mirror, unmount, reboot)
      ansible.builtin.import_tasks: finalize.yml
  rescue:
    - name: Unmount /mnt hierarchy on failure (best-effort cleanup)
      ansible.builtin.include_tasks: unmount.yml
    - name: Re-raise failure
      ansible.builtin.fail:
        msg: >-
          Provisioning phase failed for {{ inventory_hostname }}.
          /mnt has been unmounted where possible — safe to re-run.
