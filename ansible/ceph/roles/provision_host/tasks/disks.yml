---
# Phase 3: Disk preparation (DESTRUCTIVE). Consumes ssd1_dev/ssd2_dev from
# detect.yml; partitions both SSDs (ESP/boot/root/swap/ceph-db/ceph-osd), RAID1
# for boot/root/swap, filesystems, block.db LVM, mounts under /mnt.
#
# Resume semantics:
#   1. Fast path: /mnt already mounted on /dev/md/root -> skip the whole block
#      (recovers a post-disks crash, e.g. mid-debootstrap, by re-running).
#   2. Opportunistic remount: /dev/md/root exists, nothing mounted (skip_reboot
#      inspection or rescue) -> remount, read marker; hostname match = resume,
#      missing/foreign marker = unmount and full wipe.
#
# Destructive path defends against udev re-assembling old mdraid: stop arrays,
# then dd-zero first 4 MB (metadata 1.2) AND last 4 MB (metadata 1.0) of every
# RAID member so `mdadm --incremental` has no superblock to latch onto in the
# partprobe -> mdadm --create race window.

# --- State check --------------------------------------------------------

- name: Check if /dev/md/root exists
  ansible.builtin.stat:
    path: /dev/md/root
  register: md_root_stat

- name: Check if /mnt is already a mountpoint
  ansible.builtin.command: mountpoint -q "{{ provision_mnt }}"
  register: mnt_mounted
  changed_when: false
  failed_when: false

# --- Opportunistic remount + marker validation --------------------------
# Marker must match inventory_hostname or we treat it as a foreign install and
# wipe. Keystone of the resume path: without it every commit run after a
# skip_reboot inspection would re-wipe a provisioned system.

- name: Opportunistic remount + marker validation
  when:
    - md_root_stat.stat.exists
    - mnt_mounted.rc != 0
  block:
    - name: Mount /dev/md/root at /mnt for marker probe
      ansible.posix.mount:
        path: "{{ provision_mnt }}"
        src: /dev/md/root
        fstype: ext4
        state: ephemeral
      register: resume_mount_root
      failed_when: false

    - name: Check for marker file in remounted root
      ansible.builtin.stat:
        path: "{{ provision_mnt }}{{ provision_marker_path }}"
      register: resume_marker_stat

    - name: Read marker file content
      ansible.builtin.slurp:
        src: "{{ provision_mnt }}{{ provision_marker_path }}"
      register: resume_marker_slurp
      when: resume_marker_stat.stat.exists

    - name: Parse marker JSON
      ansible.builtin.set_fact:
        resume_marker: "{{ resume_marker_slurp.content | b64decode | from_json }}"
      when: resume_marker_stat.stat.exists

    - name: Determine whether marker matches this host
      ansible.builtin.set_fact:
        marker_matches_host: >-
          {{ resume_marker_stat.stat.exists
             and (resume_marker.hostname | default('')) == inventory_hostname }}

    - name: Announce marker validation result
      ansible.builtin.debug:
        msg: >-
          {{ ('Marker validated for ' + inventory_hostname +
              ' (provisioned ' + (resume_marker.provisioned_at | default('?')) + ') —' +
              ' will resume without wiping.')
             if marker_matches_host
             else ('No matching marker on existing /dev/md/root —' +
                   ' will unmount and wipe. Marker hostname: ' +
                   (resume_marker.hostname | default('<missing>'))) }}

    - name: Mount /dev/md/boot at /mnt/boot when marker matches
      ansible.posix.mount:
        path: "{{ provision_mnt }}/boot"
        src: /dev/md/boot
        fstype: ext4
        state: ephemeral
      when: marker_matches_host

    - name: Mount primary ESP at /mnt/boot/efi when marker matches
      ansible.posix.mount:
        path: "{{ provision_mnt }}/boot/efi"
        src: "{{ ssd1_dev }}1"
        fstype: vfat
        opts: umask=0077
        state: ephemeral
      when: marker_matches_host

    - name: Unmount /mnt when marker missing or wrong host (will re-wipe)
      ansible.posix.mount:
        path: "{{ provision_mnt }}"
        state: unmounted
      when: not marker_matches_host

- name: Recheck /mnt mountpoint after potential remount
  ansible.builtin.command: mountpoint -q "{{ provision_mnt }}"
  register: mnt_mounted_final
  changed_when: false
  failed_when: false

- name: Decide whether disks phase can be skipped
  ansible.builtin.set_fact:
    disks_prepared: "{{ md_root_stat.stat.exists and mnt_mounted_final.rc == 0 }}"

- name: Announce resume
  ansible.builtin.debug:
    msg: "Disks already prepared and {{ provision_mnt }} is mounted — skipping disk phase."
  when: disks_prepared

# --- Disk preparation block --------------------------------------------

- name: Prepare disks
  when: not disks_prepared
  block:
    # ----- Stop any lingering mdraid arrays and clear PVs -----
    # A previous install may have arrays under any name (foreign homehost,
    # md0..md127) auto-assembled by the live image's udev; --stop --scan plus a
    # /proc/mdstat walk catches them all.

    - name: Stop all assembled mdraid arrays
      ansible.builtin.shell: |
        # First pass: stop everything mdadm knows about
        mdadm --stop --scan 2>/dev/null || true
        # Second pass: catch any stragglers still listed in /proc/mdstat
        for md in $(awk '/^md/ {print "/dev/"$1}' /proc/mdstat 2>/dev/null); do
          mdadm --stop "$md" 2>/dev/null || true
        done
      args:
        executable: /bin/bash
      changed_when: false

    # ----- Deactivate and remove any lingering LVM state -----
    # lvmetad/udev auto-activates a leftover VG on partition 5, holding the
    # device so wipefs/sgdisk could not clear the PV signature.

    - name: Deactivate any auto-activated VGs
      ansible.builtin.shell: |
        set -o pipefail
        for vg in $(vgs --noheadings -o vg_name 2>/dev/null | awk '{print $1}'); do
          vgchange -an "$vg" 2>/dev/null || true
          vgremove -ff "$vg" 2>/dev/null || true
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Remove any lingering PV signatures on partition 5 of both SSDs
      ansible.builtin.shell: |
        pvremove -ff -y {{ ssd1_dev }}5 2>/dev/null || true
        pvremove -ff -y {{ ssd2_dev }}5 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ----- Full wipe of both SSDs -----

    - name: Wipe whole-disk signatures on SSDs
      ansible.builtin.command: "wipefs -af {{ item }}"
      loop:
        - "{{ ssd1_dev }}"
        - "{{ ssd2_dev }}"
      changed_when: true

    - name: Zap GPT on SSDs
      ansible.builtin.command: "sgdisk -Z {{ item }}"
      loop:
        - "{{ ssd1_dev }}"
        - "{{ ssd2_dev }}"
      changed_when: true

    # ----- Partition SSD1 -----

    - name: Partition SSD1 with six-partition layout
      ansible.builtin.command: >-
        sgdisk
        -n 1:0:+{{ os_partitions.esp_size }}    -t 1:ef00 -c 1:ESP
        -n 2:0:+{{ os_partitions.boot_size }}   -t 2:fd00 -c 2:boot
        -n 3:0:+{{ os_partitions.root_size }}   -t 3:fd00 -c 3:root
        -n 4:0:+{{ os_partitions.swap_size }}   -t 4:fd00 -c 4:swap
        -n 5:0:+{{ os_partitions.ceph_db_size }} -t 5:8e00 -c 5:ceph-db
        -n 6:0:0                                 -t 6:8300 -c 6:ceph-osd-ssd
        {{ ssd1_dev }}
      changed_when: true

    - name: Clone partition table to SSD2
      ansible.builtin.command: "sgdisk -R {{ ssd2_dev }} {{ ssd1_dev }}"
      changed_when: true

    - name: Randomize GUIDs on SSD2
      ansible.builtin.command: "sgdisk -G {{ ssd2_dev }}"
      changed_when: true

    - name: Reload partition tables
      ansible.builtin.command: "partprobe {{ item }}"
      loop:
        - "{{ ssd1_dev }}"
        - "{{ ssd2_dev }}"
      changed_when: false

    # Partition-name concatenation assumes SAS-style names (sda1); R730xd rear
    # SSDs are SAS HBA. For NVMe, add a part_sep fact ("" SAS / "p" NVMe).
    - name: Wait for partition device nodes to appear
      ansible.builtin.wait_for:
        path: "{{ item }}"
        state: present
        timeout: 10
      loop:
        - "{{ ssd1_dev }}1"
        - "{{ ssd1_dev }}2"
        - "{{ ssd1_dev }}3"
        - "{{ ssd1_dev }}4"
        - "{{ ssd1_dev }}5"
        - "{{ ssd1_dev }}6"
        - "{{ ssd2_dev }}1"
        - "{{ ssd2_dev }}2"
        - "{{ ssd2_dev }}3"
        - "{{ ssd2_dev }}4"
        - "{{ ssd2_dev }}5"
        - "{{ ssd2_dev }}6"

    # ----- Post-partprobe mdraid cleanup -----
    # Identical re-provision layouts leave old superblocks at the same offsets,
    # so post-partprobe udev `mdadm --incremental` re-assembles them; without
    # stopping AND destroying superblocks, mdadm --create fails
    # ("device busy" / "not suitable for this array").

    - name: Stop any mdraid arrays auto-assembled by udev after partprobe
      ansible.builtin.shell: |
        mdadm --stop --scan 2>/dev/null || true
        for md in $(awk '/^md/ {print "/dev/"$1}' /proc/mdstat 2>/dev/null); do
          mdadm --stop "$md" 2>/dev/null || true
        done
      args:
        executable: /bin/bash
      changed_when: false

    # udev can re-assemble in the stop->wipefs race; zero first 4 MB (metadata
    # 1.2 at 4 KB) AND last 4 MB (metadata 1.0 in the last 8 KB) of every RAID
    # member so re-assembly is impossible.
    - name: Zero mdraid superblock regions on RAID member partitions
      ansible.builtin.shell: |
        set -e
        for part in {{ ssd1_dev }}2 {{ ssd1_dev }}3 {{ ssd1_dev }}4 \
                    {{ ssd2_dev }}2 {{ ssd2_dev }}3 {{ ssd2_dev }}4; do
          dd if=/dev/zero of="$part" bs=1M count=4 conv=fsync 2>/dev/null
          size_bytes=$(blockdev --getsize64 "$part")
          seek_mb=$(( size_bytes / 1024 / 1024 - 4 ))
          dd if=/dev/zero of="$part" bs=1M count=4 seek="$seek_mb" conv=fsync 2>/dev/null
        done
      args:
        executable: /bin/bash
      changed_when: true

    # ----- Clear partition-level stale signatures -----
    # wipefs catch-all for non-mdraid signatures (LVM PV on part 5, vfat on part 1).

    - name: Wipe partition signatures on SSD1
      ansible.builtin.command: "wipefs -af {{ ssd1_dev }}{{ item }}"
      loop: [1, 2, 3, 4, 5, 6]
      changed_when: true

    - name: Wipe partition signatures on SSD2
      ansible.builtin.command: "wipefs -af {{ ssd2_dev }}{{ item }}"
      loop: [1, 2, 3, 4, 5, 6]
      changed_when: true

    # ----- Final mdraid cleanup before array creation -----
    # udev may have re-assembled from pre-wipe signatures: stop arrays, settle
    # udev, remove the mdadm assemble cache (/run/mdadm/map), else mdadm --create
    # fails "Device or resource busy".

    - name: Final mdraid stop + udev settle before array creation
      ansible.builtin.shell: |
        set -e
        mdadm --stop --scan 2>/dev/null || true
        udevadm settle --timeout=10
        rm -f /run/mdadm/map /run/mdadm/autorebuild.pid
        # Double-check nothing re-appeared
        for md in $(awk '/^md/ {print "/dev/"$1}' /proc/mdstat 2>/dev/null); do
          mdadm --stop "$md" 2>/dev/null || true
        done
        udevadm settle --timeout=5
      args:
        executable: /bin/bash
      changed_when: false

    # ----- Create mdraid arrays -----

    - name: Create md/boot (RAID1, metadata 1.0 for GRUB compatibility)
      ansible.builtin.command: >-
        mdadm --create /dev/md/boot --level=1 --raid-devices=2
        --metadata=1.0 --run --force
        {{ ssd1_dev }}2 {{ ssd2_dev }}2
      changed_when: true

    - name: Create md/root (RAID1, metadata 1.2)
      ansible.builtin.command: >-
        mdadm --create /dev/md/root --level=1 --raid-devices=2
        --run --force
        {{ ssd1_dev }}3 {{ ssd2_dev }}3
      changed_when: true

    - name: Create md/swap (RAID1, metadata 1.2)
      ansible.builtin.command: >-
        mdadm --create /dev/md/swap --level=1 --raid-devices=2
        --run --force
        {{ ssd1_dev }}4 {{ ssd2_dev }}4
      changed_when: true

    # ----- Filesystems -----

    - name: Create FAT32 ESP on SSD1 partition 1
      community.general.filesystem:
        fstype: vfat
        dev: "{{ ssd1_dev }}1"
        opts: -F32
        force: true

    - name: Create FAT32 backup ESP on SSD2 partition 1
      community.general.filesystem:
        fstype: vfat
        dev: "{{ ssd2_dev }}1"
        opts: -F32
        force: true

    - name: Create ext4 on /dev/md/boot
      community.general.filesystem:
        fstype: ext4
        dev: /dev/md/boot
        opts: -L boot
        force: true

    - name: Create ext4 on /dev/md/root
      community.general.filesystem:
        fstype: ext4
        dev: /dev/md/root
        opts: -L root
        force: true

    - name: Create swap on /dev/md/swap
      ansible.builtin.command: "mkswap -L swap /dev/md/swap"
      changed_when: true

    # ----- LVM for Ceph block.db -----

    - name: Create VG1 on SSD1 partition 5
      community.general.lvg:
        vg: "{{ ceph_db_vg1 }}"
        pvs: "{{ ssd1_dev }}5"
        state: present

    - name: Create VG2 on SSD2 partition 5
      community.general.lvg:
        vg: "{{ ceph_db_vg2 }}"
        pvs: "{{ ssd2_dev }}5"
        state: present

    - name: Create fixed-size block.db LVs on VG1 (slots 0-4)
      community.general.lvol:
        vg: "{{ ceph_db_vg1 }}"
        lv: "db-slot{{ item }}"
        size: "{{ provision_ceph_db_lv_size }}"
        state: present
      loop: [0, 1, 2, 3, 4]

    - name: Create remainder LV on VG1 (slot 5)
      community.general.lvol:
        vg: "{{ ceph_db_vg1 }}"
        lv: "db-slot5"
        size: 100%FREE
        state: present

    - name: Create fixed-size block.db LVs on VG2 (slots 6-10)
      community.general.lvol:
        vg: "{{ ceph_db_vg2 }}"
        lv: "db-slot{{ item }}"
        size: "{{ provision_ceph_db_lv_size }}"
        state: present
      loop: [6, 7, 8, 9, 10]

    - name: Create remainder LV on VG2 (slot 11)
      community.general.lvol:
        vg: "{{ ceph_db_vg2 }}"
        lv: "db-slot11"
        size: 100%FREE
        state: present

    # ----- Mount new filesystems at /mnt (ephemeral, not in fstab) -----

    - name: Mount /dev/md/root at /mnt
      ansible.posix.mount:
        path: "{{ provision_mnt }}"
        src: /dev/md/root
        fstype: ext4
        state: ephemeral

    - name: Create /mnt/boot on the mounted root
      ansible.builtin.file:
        path: "{{ provision_mnt }}/boot"
        state: directory
        mode: '0755'

    - name: Mount /dev/md/boot at /mnt/boot
      ansible.posix.mount:
        path: "{{ provision_mnt }}/boot"
        src: /dev/md/boot
        fstype: ext4
        state: ephemeral

    - name: Create /mnt/boot/efi on the mounted boot
      ansible.builtin.file:
        path: "{{ provision_mnt }}/boot/efi"
        state: directory
        mode: '0755'

    - name: Mount primary ESP at /mnt/boot/efi
      ansible.posix.mount:
        path: "{{ provision_mnt }}/boot/efi"
        src: "{{ ssd1_dev }}1"
        fstype: vfat
        opts: umask=0077
        state: ephemeral

# Resume-path SSD rediscovery removed: detect.yml sets the ssd*_dev/_serial
# facts unconditionally, so the resume path inherits them.
