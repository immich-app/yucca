[defaults]
# No default inventory — use -i or CEPH_ENV. Run plays via scripts/ansible-play.sh
# which injects secrets (from secrets.yml.tpl via op inject) as --extra-vars.
log_path = ansible.log

forks = 20
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout = 3600

stdout_callback = default
result_format = yaml
callbacks_enabled = ansible.posix.timer, ansible.posix.profile_tasks
force_color = True
diff_always = True
deprecation_warnings = False
retry_files_enabled = False
display_skipped_hosts = False

host_key_checking = False
timeout = 30

[ssh_connection]
# No ProxyJump here — set per-inventory via ansible_ssh_common_args
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
