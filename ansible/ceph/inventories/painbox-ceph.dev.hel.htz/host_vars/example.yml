---
# Hetzner SX295 OSD node template — painbox cluster
#
# Copy to host_vars/<hostname>.yml (full inventory_hostname).
# Filename MUST match inventory_hostname for Ansible auto-load.
# Values are node-specific — SATA controller addresses differ per server.
#
# Hardware: EPYC 7502P / 2x 7.68TB NVMe (RAID-1) / 14x 22TB SATA
# NVMe pair is installimage RAID-1, partitioned as:
#   md0 = /boot, md1 = vg0 (root, var, swap, block.db LVs, SSD OSD)
# SATA drives are left raw for Ceph HDD OSDs.
hostname_short: painbox-ceph-EXAMPLE
bond_ip: 157.180.105.X

# Block.db VG — on NVMe RAID-1 vg0 (created by installimage post-install)
ceph_db_vg: vg0

# HDD OSD mappings: SATA by-path -> block.db LV
# Find SATA controllers with: ls /dev/disk/by-path/ | grep ata
# Each SATA port maps to one db-slot LV, assigned positionally.
#
# Typical SX295 SATA topology (3 controllers, 14 ports total):
#   0000:45:00.0 (8 ports): ata-1..8
#   0000:46:00.0 (2 ports): ata-1..2
#   0000:87:00.0 (4 ports): ata-1..4
ceph_hdd_osds:
  - path_phy: pci-0000:45:00.0-ata-1
    db: vg0/db-slot0
  - path_phy: pci-0000:45:00.0-ata-2
    db: vg0/db-slot1
  # ... one entry per HDD (14 total for full SX295)

# SSD OSD — remaining NVMe space after block.db LVs + reserve
ceph_ssd_osds:
  - lv: vg0/ssd-osd
