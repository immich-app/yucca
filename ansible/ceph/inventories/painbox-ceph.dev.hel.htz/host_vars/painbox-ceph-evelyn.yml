---
# Painbox host_vars — the single Hetzner SX295 node.
# Reprovisioned under this identity 2026-04-26 (was painbox-osd-5c3cac).
# Reprovision procedure: docs/runbooks/painbox-reprovision.md.

hostname_short: painbox-ceph-evelyn
bond_ip: 157.180.105.198

# Block.db VG — single NVMe RAID-1 VG created by installimage post-install
ceph_db_vg: vg0

# HDD OSD mappings: SATA path -> block.db LV
# by-path is slot-stable: replacing a drive in the same bay keeps the same path.
# All 14 SATA ports populated with Seagate Exos X22 22TB (ST22000NM001E).
#
# SATA controller topology:
#   0000:45:00.0 (8 ports): ata-1..8
#   0000:46:00.0 (2 ports): ata-1..2
#   0000:87:00.0 (4 ports): ata-1..4
#   Total: 14 ports -> 14 HDDs -> 14 db-slots (db-slot0..13)
ceph_hdd_osds:
  - path_phy: pci-0000:45:00.0-ata-1    # ZX299K3G
    db: vg0/db-slot0
  - path_phy: pci-0000:45:00.0-ata-2    # ZX297VJE
    db: vg0/db-slot1
  - path_phy: pci-0000:45:00.0-ata-3    # ZX2992CN
    db: vg0/db-slot2
  - path_phy: pci-0000:45:00.0-ata-4    # ZX295NSB
    db: vg0/db-slot3
  - path_phy: pci-0000:45:00.0-ata-5    # ZX29DE1R
    db: vg0/db-slot4
  - path_phy: pci-0000:45:00.0-ata-6    # ZX299AGR
    db: vg0/db-slot5
  - path_phy: pci-0000:45:00.0-ata-7    # ZX298TEQ
    db: vg0/db-slot6
  - path_phy: pci-0000:45:00.0-ata-8    # ZX29DE34
    db: vg0/db-slot7
  - path_phy: pci-0000:46:00.0-ata-1    # ZX294A8Z
    db: vg0/db-slot8
  - path_phy: pci-0000:46:00.0-ata-2    # ZX299EHE
    db: vg0/db-slot9
  - path_phy: pci-0000:87:00.0-ata-1    # ZX29DE21
    db: vg0/db-slot10
  - path_phy: pci-0000:87:00.0-ata-2    # ZX294PJ3
    db: vg0/db-slot11
  - path_phy: pci-0000:87:00.0-ata-3    # ZX29DDD1
    db: vg0/db-slot12
  - path_phy: pci-0000:87:00.0-ata-4    # ZX297AZ8
    db: vg0/db-slot13

# SSD OSD — remaining NVMe RAID-1 space after block.db LVs + reserve
ceph_ssd_osds:
  - lv: vg0/ssd-osd
